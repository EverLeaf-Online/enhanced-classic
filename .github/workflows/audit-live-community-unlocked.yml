name: Audit live Community unlocked content

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/audit-live-community-unlocked.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh audit-output
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H 132.145.141.79 > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<'EOF'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 10
            ConnectTimeout 20
          EOF

      - name: Bundle server behavior sources
        run: |
          set -euo pipefail
          tar -czf /tmp/everleaf-audit-src.tgz src scripts sql tools 2>/dev/null || tar -czf /tmp/everleaf-audit-src.tgz src scripts tools
          scp /tmp/everleaf-audit-src.tgz everleaf-oracle:/tmp/everleaf-audit-src.tgz

      - name: Inventory full live Community delta and server behavior coverage
        run: |
          set -euo pipefail
          cat > /tmp/audit-community.py <<'PY'
          from pathlib import Path
          import json, re, subprocess, xml.etree.ElementTree as ET

          current = Path(subprocess.check_output(['readlink','-f','/opt/everleaf/current'], text=True).strip())
          live = current / 'wz'
          backup = Path(Path('/opt/everleaf/backups/community-wholesale-test/LATEST').read_text().strip())
          base = backup / 'server-wz-xml'
          src = Path('/tmp/everleaf-community-audit-src')
          all_families = ['Base.wz','Character.wz','Effect.wz','Etc.wz','Item.wz','Map.wz','Mob.wz','Morph.wz','Npc.wz','Quest.wz','Reactor.wz','Skill.wz','Sound.wz','String.wz','TamingMob.wz','UI.wz']
          behavior_families = ['Map.wz','Mob.wz','Npc.wz','Item.wz','Character.wz','Skill.wz','Quest.wz','Reactor.wz']

          def xml_count(root: Path, family: str):
              d=root/family
              return sum(1 for _ in d.rglob('*.xml')) if d.exists() else 0

          def numeric_ids(root: Path, family: str):
              out=set()
              d=root/family
              if not d.exists(): return out
              for p in d.rglob('*.xml'):
                  m=re.match(r'^(\d{4,10})(?:\.img)?\.xml$', p.name)
                  if m: out.add(int(m.group(1)))
                  try:
                      r=ET.parse(p).getroot()
                      for child in list(r):
                          n=child.attrib.get('name','')
                          if n.isdigit() and 4 <= len(n) <= 10:
                              out.add(int(n))
                  except Exception:
                      pass
              return out

          source_files=[]
          for ext in ('*.java','*.js','*.sql','*.py'):
              source_files.extend(src.rglob(ext))
          chunks=[]
          for p in source_files:
              try: chunks.append(p.read_text(errors='ignore'))
              except Exception: pass
          source='\n'.join(chunks)

          result={
              'current':str(current),
              'backup':str(backup),
              'live_total_xml':sum(1 for _ in live.rglob('*.xml')),
              'baseline_total_xml':sum(1 for _ in base.rglob('*.xml')),
              'family_xml_counts':{},
              'behavior_families':{}
          }
          for fam in all_families:
              lc=xml_count(live,fam); bc=xml_count(base,fam)
              result['family_xml_counts'][fam]={'live_xml':lc,'baseline_xml':bc,'delta_xml':lc-bc}

          for fam in behavior_families:
              live_ids=numeric_ids(live,fam)
              old_ids=numeric_ids(base,fam)
              added=sorted(live_ids-old_ids)
              removed=sorted(old_ids-live_ids)
              refs=[i for i in added if str(i) in source]
              refset=set(refs)
              entry={
                  'live_ids':len(live_ids),
                  'baseline_ids':len(old_ids),
                  'added_ids':len(added),
                  'removed_ids':len(removed),
                  'explicit_server_refs':len(refs),
                  'no_explicit_server_ref':len(added)-len(refs),
                  'sample_added':added[:100],
                  'sample_removed':removed[:100],
                  'sample_no_explicit_ref':[i for i in added if i not in refset][:100],
              }
              if fam=='Npc.wz':
                  scripts=src/'scripts'/'npc'
                  scripted=[i for i in added if (scripts/f'{i}.js').exists()]
                  entry['added_with_npc_script']=len(scripted)
                  entry['added_without_npc_script']=len(added)-len(scripted)
                  entry['sample_added_without_npc_script']=[i for i in added if not (scripts/f'{i}.js').exists()][:100]
              result['behavior_families'][fam]=entry

          print(json.dumps(result, indent=2))
          PY
          scp /tmp/audit-community.py everleaf-oracle:/tmp/audit-community.py
          ssh everleaf-oracle 'set -euo pipefail; rm -rf /tmp/everleaf-community-audit-src; mkdir -p /tmp/everleaf-community-audit-src; tar -xzf /tmp/everleaf-audit-src.tgz -C /tmp/everleaf-community-audit-src; python3 /tmp/audit-community.py' | tee audit-output/community-unlocked-audit.json

      - name: Validate live drop shop and reward database integrity
        run: |
          set -euo pipefail
          ssh everleaf-oracle 'bash -s' <<'EOF' | tee audit-output/economy-db-validation.txt
          set -euo pipefail
          echo LIVE_ECONOMY_DB_VALIDATION_BEGIN
          echo '[tables]'
          sudo mysql -NBe "SELECT table_schema, table_name FROM information_schema.tables WHERE table_schema='cosmic' AND (LOWER(table_name) LIKE '%drop%' OR LOWER(table_name) LIKE '%shop%' OR LOWER(table_name) LIKE '%gach%' OR LOWER(table_name) LIKE '%reward%' OR LOWER(table_name) LIKE '%item%') ORDER BY table_name;"
          echo '[row-counts]'
          sudo mysql -NBe "SELECT 'drop_data',COUNT(*) FROM cosmic.drop_data UNION ALL SELECT 'drop_data_global',COUNT(*) FROM cosmic.drop_data_global UNION ALL SELECT 'reactordrops',COUNT(*) FROM cosmic.reactordrops UNION ALL SELECT 'shops',COUNT(*) FROM cosmic.shops UNION ALL SELECT 'shopitems',COUNT(*) FROM cosmic.shopitems UNION ALL SELECT 'encounter_weekly_reward',COUNT(*) FROM cosmic.everleaf_encounter_weekly_reward UNION ALL SELECT 'nx_rewards',COUNT(*) FROM cosmic.everleaf_nx_rewards UNION ALL SELECT 'vote_reward_ledger',COUNT(*) FROM cosmic.everleaf_vote_reward_ledger UNION ALL SELECT 'vote_rewards',COUNT(*) FROM cosmic.everleaf_vote_rewards;"
          echo '[drop-invalid-values]'
          sudo mysql -NBe "SELECT 'normal_nonpositive_chance',COUNT(*) FROM cosmic.drop_data WHERE chance<=0 UNION ALL SELECT 'normal_bad_quantity',COUNT(*) FROM cosmic.drop_data WHERE minimum_quantity<0 OR maximum_quantity<minimum_quantity UNION ALL SELECT 'global_nonpositive_chance',COUNT(*) FROM cosmic.drop_data_global WHERE chance<=0 UNION ALL SELECT 'global_bad_quantity',COUNT(*) FROM cosmic.drop_data_global WHERE minimum_quantity<0 OR maximum_quantity<minimum_quantity UNION ALL SELECT 'reactor_nonpositive_chance',COUNT(*) FROM cosmic.reactordrops WHERE chance<=0;"
          echo '[drop-duplicates]'
          sudo mysql -NBe "SELECT 'normal_duplicate_groups',COUNT(*) FROM (SELECT dropperid,itemid,questid,COUNT(*) c FROM cosmic.drop_data GROUP BY dropperid,itemid,questid HAVING c>1) x UNION ALL SELECT 'global_duplicate_groups',COUNT(*) FROM (SELECT continent,itemid,questid,COUNT(*) c FROM cosmic.drop_data_global GROUP BY continent,itemid,questid HAVING c>1) y UNION ALL SELECT 'reactor_duplicate_groups',COUNT(*) FROM (SELECT reactorid,itemid,questid,COUNT(*) c FROM cosmic.reactordrops GROUP BY reactorid,itemid,questid HAVING c>1) z;"
          echo '[shop-invalid-values]'
          sudo mysql -NBe "SELECT 'shop_negative_price',COUNT(*) FROM cosmic.shopitems WHERE price<0 UNION ALL SELECT 'shop_orphan_shop',COUNT(*) FROM cosmic.shopitems si LEFT JOIN cosmic.shops s ON s.shopid=si.shopid WHERE s.shopid IS NULL UNION ALL SELECT 'shop_duplicate_item_groups',COUNT(*) FROM (SELECT shopid,itemid,COUNT(*) c FROM cosmic.shopitems GROUP BY shopid,itemid HAVING c>1) q;"
          echo '[rare-scroll-global-sources]'
          sudo mysql -NBe "SELECT itemid,COUNT(*),MIN(chance),MAX(chance) FROM cosmic.drop_data_global WHERE itemid IN (2049100,2340000) GROUP BY itemid;"
          echo '[nx-global-sources]'
          sudo mysql -NBe "SELECT itemid,COUNT(*),MIN(chance),MAX(chance) FROM cosmic.drop_data_global WHERE itemid IN (4031865,4031866) GROUP BY itemid;"
          echo '[reward-uniqueness-indexes]'
          sudo mysql -NBe "SELECT table_name,index_name,non_unique,GROUP_CONCAT(column_name ORDER BY seq_in_index) cols FROM information_schema.statistics WHERE table_schema='cosmic' AND table_name IN ('everleaf_encounter_weekly_reward','everleaf_vote_reward_ledger','everleaf_vote_rewards') GROUP BY table_name,index_name,non_unique ORDER BY table_name,index_name;"
          echo LIVE_ECONOMY_DB_VALIDATION_END
          EOF

      - name: Re-run existing economy drop reward item and world audits
        run: |
          set -uo pipefail
          : > audit-output/release-audits.txt
          overall=0
          for audit in \
            tools/audit_economy_balance.py \
            tools/audit_reward_sources.py \
            tools/audit_items_equipment.py \
            tools/audit_world_integrity.py
          do
            echo "===== $audit =====" | tee -a audit-output/release-audits.txt
            set +e
            python3 "$audit" 2>&1 | tee -a audit-output/release-audits.txt
            rc=${PIPESTATUS[0]}
            set -e
            echo "AUDIT_EXIT $audit $rc" | tee -a audit-output/release-audits.txt
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          echo "AUDIT_SUITE_HAS_FINDINGS=$overall" | tee -a audit-output/release-audits.txt
          exit 0

      - name: Save audit metadata
        if: always()
        run: |
          set -euo pipefail
          cat > audit-output/README.txt <<EOF
          EverLeaf live Community audit
          Commit: $GITHUB_SHA
          Run: $GITHUB_RUN_ID
          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Files:
          - community-unlocked-audit.json: full family XML delta plus live-vs-pre-wholesale ID inventory and server-reference coverage
          - economy-db-validation.txt: live MySQL drop/shop/reward integrity checks and economy surfaces
          - release-audits.txt: existing economy/reward/item/world audit results with individual exit codes
          EOF

      - name: Upload durable Community audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-community-live-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 90
