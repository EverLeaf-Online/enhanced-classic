name: Audit Yuna UI using donor ZLZ
on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths: ['.github/workflows/audit-yuna-ui-zlz.yml']
permissions:
  contents: read
env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
jobs:
  audit:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {ref: release-dev}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $d=Join-Path $HOME '.ssh';New-Item -ItemType Directory -Force -Path $d|Out-Null;$k=Join-Path $d 'id_everleaf';[IO.File]::WriteAllText($k,($env:SSH_PRIVATE_KEY -replace "`r","")+"`n");$known=Join-Path $d 'known_hosts';if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}else{& 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known}
      - name: Fetch UI and ZLZ together
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$dir=Join-Path $env:RUNNER_TEMP 'yuna';New-Item -ItemType Directory -Force -Path $dir|Out-Null;$scp='C:\Program Files\Git\usr\bin\scp.exe';$key=Join-Path $HOME '.ssh/id_everleaf';foreach($f in @('UI.wz','ZLZ.dll')){& $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/home/ubuntu/everleaf-staging/yuna-client-current/extracted/YunaMS/$f" (Join-Path $dir $f);if($LASTEXITCODE){throw "fetch failed $f"}}
      - name: Parse exact donor UI structure
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $tool=Join-Path $env:RUNNER_TEMP 'MapleLib/YunaZlzInspector';New-Item -ItemType Directory -Force -Path $tool|Out-Null
          @'
          using MapleLib.WzLib;
          using MapleLib.WzLib.WzProperties;
          using System.Text.Json;
          var file=args[0];
          using var wz=new WzFile(file,83,WzMapleVersion.GETFROMZLZ);
          var status=wz.ParseWzFile();
          Console.WriteLine($"parse={status} version={wz.Version} maple={wz.MapleVersion} images={wz.WzDirectory.WzImages.Count}");
          foreach(var i in wz.WzDirectory.WzImages) Console.WriteLine("ROOT "+i.Name);
          if(status!=WzFileParseStatus.Success) return;
          var img=wz.WzDirectory.WzImages.FirstOrDefault(x=>x.Name.Equals("Login.img",StringComparison.OrdinalIgnoreCase));
          if(img==null){Console.WriteLine("LOGIN_IMG_NOT_FOUND");return;}
          img.ParseImage();
          Console.WriteLine("LOGIN_IMG_FOUND props="+img.WzProperties.Count);
          void Walk(WzImageProperty p,string path,int depth){
            if(depth>7)return;
            bool interesting=path.Contains("Common/frame",StringComparison.OrdinalIgnoreCase)||path.Contains("WorldSelect",StringComparison.OrdinalIgnoreCase)||path.Contains("ViewAllChar",StringComparison.OrdinalIgnoreCase)||path.Contains("CharSelect",StringComparison.OrdinalIgnoreCase)||path.Contains("login",StringComparison.OrdinalIgnoreCase)||path.Contains("logo",StringComparison.OrdinalIgnoreCase);
            if(interesting){
              if(p is WzCanvasProperty c) Console.WriteLine($"PATH {path} canvas={c.PngProperty.Width}x{c.PngProperty.Height}");
              else if(p is WzStringProperty s) Console.WriteLine($"PATH {path} str={s.Value}");
              else Console.WriteLine($"PATH {path} type={p.GetType().Name}");
            }
            if(p is WzSubProperty sp) foreach(var c in sp.WzProperties) Walk(c,path+"/"+c.Name,depth+1);
            if(p is WzCanvasProperty cp) foreach(var c in cp.WzProperties) Walk(c,path+"/"+c.Name,depth+1);
          }
          foreach(var p in img.WzProperties) Walk(p,p.Name,0);
          '@ | Set-Content -Encoding utf8 (Join-Path $tool 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableWindowsTargeting>true</EnableWindowsTargeting></PropertyGroup><ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup></Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $tool 'YunaZlzInspector.csproj')
          dotnet run --project (Join-Path $tool 'YunaZlzInspector.csproj') -c Release -- (Join-Path $env:RUNNER_TEMP 'yuna/UI.wz')
