name: Cleanup shop branch once

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/cleanup-shop-branch-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api -X DELETE repos/${GH_REPO}/git/refs/heads/automation/shop-hardening-once
