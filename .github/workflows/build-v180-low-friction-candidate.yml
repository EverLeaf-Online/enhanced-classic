name: Stage GMS v180 low-friction WZ candidate

on:
  push:
    branches: [donor/v180-low-friction-stage-20260911]
    paths:
      - '.github/workflows/build-v180-low-friction-candidate.yml'
      - 'tools/wz-donor/v180-static-client-patcher/Program.cs'
  workflow_dispatch:

concurrency:
  group: everleaf-v180-low-friction-stage
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  TARGET_ROOT: /opt/everleaf/patches/files
  DONOR_ROOT: /opt/everleaf/donors/GMS-v180/GMS-v180/MapleStory
  MANIFEST_ROOT: /opt/everleaf/donors/v180-backport
  STAGE_ROOT: /opt/everleaf/donors/v180-backport/client-candidate

jobs:
  stage:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'; New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'),($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}
          else { & 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known }
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 30
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')

      - name: Validate donor and prepare isolated Oracle stage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $checks = @(
            "$env:DONOR_ROOT/ZLZ.dll",
            "$env:DONOR_ROOT/Character.wz", "$env:TARGET_ROOT/Character.wz",
            "$env:DONOR_ROOT/Map.wz", "$env:TARGET_ROOT/Map.wz",
            "$env:DONOR_ROOT/Mob.wz", "$env:TARGET_ROOT/Mob.wz",
            "$env:DONOR_ROOT/Npc.wz", "$env:TARGET_ROOT/Npc.wz",
            "$env:DONOR_ROOT/Reactor.wz", "$env:TARGET_ROOT/Reactor.wz",
            "$env:DONOR_ROOT/UI.wz", "$env:TARGET_ROOT/UI.wz",
            "$env:DONOR_ROOT/Effect.wz", "$env:TARGET_ROOT/Effect.wz",
            "$env:DONOR_ROOT/Sound.wz", "$env:TARGET_ROOT/Sound.wz",
            "$env:DONOR_ROOT/Morph.wz", "$env:TARGET_ROOT/Morph.wz",
            "$env:DONOR_ROOT/TamingMob.wz", "$env:TARGET_ROOT/TamingMob.wz",
            "$env:DONOR_ROOT/String.wz", "$env:TARGET_ROOT/String.wz",
            "$env:MANIFEST_ROOT/LOW_FRICTION_MANIFEST.json"
          )
          foreach($p in $checks){ ssh everleaf-oracle "test -s '$p'"; if($LASTEXITCODE){throw "Missing Oracle input: $p"} }
          ssh everleaf-oracle "sudo rm -rf '$env:STAGE_ROOT' && sudo mkdir -p '$env:STAGE_ROOT' && sudo chown -R ubuntu:ubuntu '$env:STAGE_ROOT'"
          if($LASTEXITCODE){throw 'Oracle staging preparation failed'}

      - name: Build MapleLib static patcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $tool=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafV180StaticPatcher'; New-Item -ItemType Directory -Force -Path $tool | Out-Null
          Copy-Item tools/wz-donor/v180-static-client-patcher/Program.cs (Join-Path $tool 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $tool 'EverLeafV180StaticPatcher.csproj')
          dotnet build (Join-Path $tool 'EverLeafV180StaticPatcher.csproj') -c Release

      - name: Fetch complete low-friction path manifests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m=Join-Path $env:RUNNER_TEMP 'manifests'; New-Item -ItemType Directory -Force -Path $m | Out-Null
          $names=@('character_all_low_friction','maps_all','mobs_all','npcs_all','reactors_all','ui_all','effects_all','sounds_all','morphs_all','taming_mobs_all','string_images_all')
          foreach($name in $names){scp "everleaf-oracle`:$env:MANIFEST_ROOT/$name.txt" (Join-Path $m "$name.txt"); if($LASTEXITCODE){throw "Manifest fetch failed: $name"}}

      - name: Build and upload verified WZ candidates one family at a time
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafV180StaticPatcher/EverLeafV180StaticPatcher.csproj'
          $manifestDir=Join-Path $env:RUNNER_TEMP 'manifests'
          $families=@(
            @{File='Character.wz'; Lists=@('character_all_low_friction')},
            @{File='Map.wz'; Lists=@('maps_all')},
            @{File='Mob.wz'; Lists=@('mobs_all')},
            @{File='Npc.wz'; Lists=@('npcs_all')},
            @{File='Reactor.wz'; Lists=@('reactors_all')},
            @{File='UI.wz'; Lists=@('ui_all')},
            @{File='Effect.wz'; Lists=@('effects_all')},
            @{File='Sound.wz'; Lists=@('sounds_all')},
            @{File='Morph.wz'; Lists=@('morphs_all')},
            @{File='TamingMob.wz'; Lists=@('taming_mobs_all')},
            @{File='String.wz'; Lists=@('string_images_all')}
          )
          foreach($spec in $families){
            $family=$spec.File
            Write-Host "===== $family ====="
            $work=Join-Path $env:RUNNER_TEMP ('v180-' + ($family -replace '\.','-'))
            if(Test-Path $work){Remove-Item -Recurse -Force $work}
            $target=Join-Path $work 'target'; $donor=Join-Path $work 'donor'; $out=Join-Path $work 'out'
            New-Item -ItemType Directory -Force -Path $target,$donor,$out | Out-Null
            scp "everleaf-oracle`:$env:TARGET_ROOT/$family" (Join-Path $target $family); if($LASTEXITCODE){throw "Target fetch failed: $family"}
            scp "everleaf-oracle`:$env:DONOR_ROOT/$family" (Join-Path $donor $family); if($LASTEXITCODE){throw "Donor fetch failed: $family"}
            scp "everleaf-oracle`:$env:DONOR_ROOT/ZLZ.dll" (Join-Path $donor 'ZLZ.dll'); if($LASTEXITCODE){throw "ZLZ fetch failed: $family"}
            $pathList=Join-Path $work 'paths.txt'
            $lines=@(); foreach($name in $spec.Lists){$lines += Get-Content (Join-Path $manifestDir "$name.txt")}
            $lines | Where-Object {$_.Trim()} | Sort-Object -Unique | Set-Content -Encoding ascii $pathList
            $outputWz=Join-Path $out $family
            $outputManifest=Join-Path $out (($family -replace '\.wz$','') + '.manifest.json')
            dotnet run --project $project -c Release --no-build -- (Join-Path $target $family) (Join-Path $donor $family) $pathList $outputWz $outputManifest
            if($LASTEXITCODE){throw "Static candidate build failed: $family"}
            scp $outputWz "everleaf-oracle`:$env:STAGE_ROOT/$family"; if($LASTEXITCODE){throw "Candidate upload failed: $family"}
            scp $outputManifest "everleaf-oracle`:$env:STAGE_ROOT/$([IO.Path]::GetFileName($outputManifest))"; if($LASTEXITCODE){throw "Manifest upload failed: $family"}
            Remove-Item -Recurse -Force $work
          }

      - name: Final isolated-stage verification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          set -euo pipefail
          ROOT="__ROOT__"
          for f in Character Map Mob Npc Reactor UI Effect Sound Morph TamingMob String; do test -s "$ROOT/$f.wz"; test -s "$ROOT/$f.manifest.json"; done
          for m in "$ROOT"/*.manifest.json; do grep -q '"productionApplyAllowed": false' "$m"; grep -q '"donorImageDigestsMatch": true' "$m"; done
          sha256sum "$ROOT"/*.wz > "$ROOT/SHA256SUMS"
          printf 'GMS v180 broad low-friction client candidate. STAGING ONLY. Includes donor-only Character/equipment/appearance, maps, mobs, NPCs, reactors, UI, effects, sound, morphs, taming mobs and String image groups. Item-property merge is staged separately. No production apply.\n' > "$ROOT/README.txt"
          echo 'V180_LOW_FRICTION_STAGE_OK'
          du -sh "$ROOT"
          cat "$ROOT/SHA256SUMS"
          '@
          $script=$script.Replace('__ROOT__',$env:STAGE_ROOT)
          $tmp=Join-Path $env:RUNNER_TEMP 'verify-v180-stage.sh'; [IO.File]::WriteAllText($tmp,($script -replace "`r",''))
          scp $tmp 'everleaf-oracle:/tmp/verify-v180-stage.sh'; if($LASTEXITCODE){throw 'Verification upload failed'}
          ssh everleaf-oracle 'bash /tmp/verify-v180-stage.sh'; if($LASTEXITCODE){throw 'Final staging verification failed'}
