name: Test Evan WZ patcher

on:
  pull_request:
    paths:
      - "client/tools/evan-wz-patcher/**"
      - "client/tools/evan-xml-donor-builder/**"
      - "client/scripts/build-evan-donor-from-zip.sh"
      - "client/evan-wz/**"
      - ".github/workflows/publish-evan-wz-assets.yml"
      - ".github/workflows/test-evan-wz-patcher.yml"
  push:
    branches: [client-dev]
    paths:
      - "client/tools/evan-wz-patcher/**"
      - "client/tools/evan-xml-donor-builder/**"
      - "client/scripts/build-evan-donor-from-zip.sh"
      - "client/evan-wz/**"
      - ".github/workflows/publish-evan-wz-assets.yml"
      - ".github/workflows/test-evan-wz-patcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned libwz
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/toyobayashi/libwz.git "$RUNNER_TEMP/libwz"
          git -C "$RUNNER_TEMP/libwz" checkout 41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f
          git -C "$RUNNER_TEMP/libwz" submodule update --init --recursive
          test "$(git -C "$RUNNER_TEMP/libwz" rev-parse HEAD)" = "41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f"

      - name: Configure Evan v83 importer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S client/tools/evan-wz-patcher -B "$RUNNER_TEMP/evan-wz-build" \
            -DLIBWZ_SOURCE="$RUNNER_TEMP/libwz" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Evan v83 importer
        shell: bash
        run: cmake --build "$RUNNER_TEMP/evan-wz-build" --config Release --parallel 2

      - name: Verify Evan copy manifests and exact archive publisher wiring
        shell: python
        run: |
          from pathlib import Path

          def entries(name):
              return [line.strip() for line in Path(f'client/evan-wz/{name}.copy.txt').read_text().splitlines()
                      if line.strip() and not line.lstrip().startswith('#')]

          stages = ['2001','2200','2210','2211','2212','2213','2214','2215','2216','2217','2218']
          string_stages = ['2200','2210','2211','2212','2213','2214','2215','2216','2217','2218']

          skill_expected = [f'image:{x}.img' for x in stages] + ['directory:Dragon']
          assert entries('Skill') == skill_expected, entries('Skill')
          assert entries('Character') == ['image:00002000.img', 'directory:Dragon'], entries('Character')

          ui_expected = [
              'property:Basic.img/Tab8',
              'property:UIWindow.img/SkillEx',
              'property:UIWindow.img/SkillMacroEx',
          ]
          assert entries('UI') == ui_expected, entries('UI')
          string_expected = [f'property:Skill.img/{x}' for x in string_stages]
          assert entries('String') == string_expected, entries('String')
          assert 'property:Skill.img/2001' not in entries('String')

          source_sha = '961e0cbf826aca48efa619afec51fd12c2472a82e654e6e73542b5bf65a0e5ce'
          source_size = '61860666'
          source_builder = Path('client/scripts/build-evan-donor-from-zip.sh').read_text()
          for marker in (
              source_sha,
              "assert len(expected) == 45",
              "assert canvas_count == 8400",
              "supported_tags = {'imgdir', 'canvas', 'int', 'short', 'string', 'vector', 'uol'}",
              'sha256sum --check --strict',
          ):
              assert marker in source_builder, f'Missing strict Evan source-builder invariant: {marker}'

          publisher = Path('.github/workflows/publish-evan-wz-assets.yml').read_text()
          required = [
              'EVERLEAF_EVAN_ARCHIVE: /opt/everleaf/private/evan/Evan.zip',
              f'VERLEAF_EVAN_ARCHIVE_SIZE: "{source_size}"'.replace('VERLEAF', 'EVERLEAF'),
              f'EVERLEAF_EVAN_ARCHIVE_SHA256: {source_sha}',
              'Verify exact authorized Evan archive and production baseline',
              'stat -c \'%s\' "$ARCHIVE"',
              'sha256sum "$ARCHIVE"',
              'unzip -tq "$ARCHIVE"',
              'Retrieve and re-verify Evan archive and current managed WZ files',
              'printf \'%s  evan-source.zip\\n\' "$EVERLEAF_EVAN_ARCHIVE_SHA256" | sha256sum --check --strict',
              'Reconstruct strictly validated donor WZs from Evan archive',
              'client/scripts/build-evan-donor-from-zip.sh evan-source.zip donor',
              'Build pinned Evan WZ patcher',
              'client/evan-wz/Skill.copy.txt',
              'client/evan-wz/Character.copy.txt',
              'client/evan-wz/UI.copy.txt',
              'client/evan-wz/String.copy.txt',
              'Publish patched WZ files atomically',
              "assert len(manifest['files']) == len(baseline['managedFiles']) == 36",
              'curl -fsS http://127.0.0.1:3000/v1/launcher/manifest',
          ]
          for marker in required:
              assert marker in publisher, f'Missing Evan publisher invariant: {marker}'

          forbidden = [
              'EVERLEAF_EVAN_DONOR_DIR',
              'unzip -q evan-source.zip -d evan-source',
              'builder="$RUNNER_TEMP/evan-xml-build/everleaf-evan-xml-donor-builder"',
          ]
          for marker in forbidden:
              assert marker not in publisher, f'Evan publisher regressed to weaker/duplicate source path: {marker}'

          assert 'if: inputs.publish' in publisher
          print('Evan WZ copy manifests + exact archive publisher contract: PASS')
