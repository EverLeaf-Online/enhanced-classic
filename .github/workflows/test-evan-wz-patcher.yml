name: Test Evan WZ patcher

on:
  pull_request:
    paths:
      - "client/tools/evan-wz-patcher/**"
      - "client/tools/evan-xml-donor-builder/**"
      - "client/evan-wz/**"
      - ".github/workflows/publish-evan-wz-assets.yml"
      - ".github/workflows/test-evan-wz-patcher.yml"
  push:
    branches: [client-dev]
    paths:
      - "client/tools/evan-wz-patcher/**"
      - "client/tools/evan-xml-donor-builder/**"
      - "client/evan-wz/**"
      - ".github/workflows/publish-evan-wz-assets.yml"
      - ".github/workflows/test-evan-wz-patcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned libwz
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/toyobayashi/libwz.git "$RUNNER_TEMP/libwz"
          git -C "$RUNNER_TEMP/libwz" checkout 41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f
          git -C "$RUNNER_TEMP/libwz" submodule update --init --recursive
          test "$(git -C "$RUNNER_TEMP/libwz" rev-parse HEAD)" = "41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f"

      - name: Configure Evan v83 importer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S client/tools/evan-wz-patcher -B "$RUNNER_TEMP/evan-wz-build" \
            -DLIBWZ_SOURCE="$RUNNER_TEMP/libwz" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Evan v83 importer
        shell: bash
        run: cmake --build "$RUNNER_TEMP/evan-wz-build" --config Release --parallel 2

      - name: Verify Evan copy manifests and publisher wiring
        shell: python
        run: |
          from pathlib import Path

          def entries(name):
              return [line.strip() for line in Path(f'client/evan-wz/{name}.copy.txt').read_text().splitlines()
                      if line.strip() and not line.lstrip().startswith('#')]

          stages = ['2001','2200','2210','2211','2212','2213','2214','2215','2216','2217','2218']

          skill_expected = [f'image:{x}.img' for x in stages] + ['directory:Dragon']
          assert entries('Skill') == skill_expected, entries('Skill')
          assert entries('Character') == ['image:00002000.img', 'directory:Dragon'], entries('Character')

          ui_expected = [
              'property:Basic.img/Tab8',
              'property:UIWindow.img/SkillEx',
              'property:UIWindow.img/SkillMacroEx',
          ]
          assert entries('UI') == ui_expected, entries('UI')
          string_expected = [f'property:Skill.img/{x}' for x in stages]
          assert entries('String') == string_expected, entries('String')

          publisher = Path('.github/workflows/publish-evan-wz-assets.yml').read_text()
          required = [
              'EVERLEAF_EVAN_DONOR_DIR: /opt/everleaf/private-assets/evan-wz-donor',
              'Verify authorized donor and production baseline',
              'client/evan-wz/Skill.copy.txt',
              'client/evan-wz/Character.copy.txt',
              'client/evan-wz/UI.copy.txt',
              'client/evan-wz/String.copy.txt',
              'Publish patched WZ files atomically',
              "assert len(manifest['files']) == len(baseline['managedFiles']) == 36",
              'curl -fsS http://127.0.0.1:3000/v1/launcher/manifest',
          ]
          for marker in required:
              assert marker in publisher, f'Missing Evan publisher invariant: {marker}'
          assert 'if: inputs.publish' in publisher
          print('Evan WZ copy manifests + publisher wiring: PASS')

      - name: Configure Evan XML donor builder
        shell: bash
        run: |
          set -euo pipefail
          cmake -S client/tools/evan-xml-donor-builder -B "$RUNNER_TEMP/evan-xml-build" \
            -DLIBWZ_SOURCE="$RUNNER_TEMP/libwz" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Evan XML donor builder
        shell: bash
        run: cmake --build "$RUNNER_TEMP/evan-xml-build" --config Release --parallel 2

      - name: Round-trip synthetic Evan XML into donor WZs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/evan-fixture/Evan"
          mkdir -p "$root/Skill/Dragon" "$root/Character/Dragon" "$root/UI" "$root/String"
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAANSURBVBhXY2BgYBAEAAAWABJnFC3KAAAAAElFTkSuQmCC'
          make_xml() {
            local path="$1" image="$2"
            cat >"$path" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <imgdir name="$image">
            <imgdir name="info"><int name="sample" value="1"/></imgdir>
            <canvas name="icon" width="1" height="1" basedata="$png"><vector name="origin" x="0" y="1"/></canvas>
            <string name="label" value="EverLeaf &amp; Evan"/>
            <short name="small" value="2"/>
            <uol name="link" value="../icon"/>
          </imgdir>
          EOF
          }
          make_xml "$root/Skill/2001.img.xml" '2001.img'
          make_xml "$root/Skill/Dragon/2200.img.xml" '2200.img'
          make_xml "$root/Character/00002000.img.xml" '00002000.img'
          make_xml "$root/Character/Dragon/01942000.img.xml" '01942000.img'
          make_xml "$root/UI/Basic.img.xml" 'Basic.img'
          make_xml "$root/UI/UIWindow.img.xml" 'UIWindow.img'
          make_xml "$root/String/Skill.img.xml" 'Skill.img'

          builder="$RUNNER_TEMP/evan-xml-build/everleaf-evan-xml-donor-builder"
          test -x "$builder"
          "$builder" "$root" "$RUNNER_TEMP/evan-donor"
          "$builder" --verify "$RUNNER_TEMP/evan-donor"
          for wz in Skill Character UI String; do
            test -s "$RUNNER_TEMP/evan-donor/$wz.wz"
            sha256sum "$RUNNER_TEMP/evan-donor/$wz.wz"
          done
