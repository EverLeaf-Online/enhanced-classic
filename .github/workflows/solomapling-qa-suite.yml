name: SoloMapling disposable full QA suite

on:
  push:
    branches:
      - feature/solomapling-disposable-suite-20260904
      - release-dev
    paths:
      - 'src/main/java/soloMapling/**'
      - 'tools/apply_solomapling_*.py'
      - '.github/workflows/solomapling-qa-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: everleaf-solomapling-disposable-suite
  cancel-in-progress: false

env:
  EVERLEAF_QA_HOST: 132.145.141.79
  EVERLEAF_QA_USER: ubuntu

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure verified SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_QA_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify disposable QA boundary
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_QA_USER@$EVERLEAF_QA_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base=/opt/everleaf/qa-agent-hub
          git -C "$base" rev-parse --is-inside-work-tree >/dev/null
          test -f "$base/deploy/qa/docker-compose.qa.yml"
          test -f "$base/deploy/qa/.env.qa"
          grep -q 'dedicated Docker Compose project' "$base/deploy/qa/README.md"
          grep -q 'everleaf-qa-db' "$base/deploy/qa/docker-compose.qa.yml"
          grep -q '127.0.0.1:' "$base/deploy/qa/docker-compose.qa.yml"
          ! grep -q '/opt/everleaf/server' "$base/deploy/qa/docker-compose.qa.yml"
          REMOTE

      - name: Prepare exact branch worktree
        env:
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_QA_USER@$EVERLEAF_QA_HOST" \
            "TARGET_SHA='$TARGET_SHA' TARGET_BRANCH='$TARGET_BRANCH' bash -s" <<'REMOTE'
          set -euo pipefail
          base=/opt/everleaf/qa-agent-hub
          work=/opt/everleaf/qa-solomapling-suite
          case "$TARGET_BRANCH" in
            release-dev|feature/solomapling-disposable-suite-20260904) ;;
            *) echo 'Refusing unexpected QA target branch.' >&2; exit 2;;
          esac
          git -C "$base" fetch --no-tags origin "$TARGET_BRANCH"
          git -C "$base" cat-file -e "$TARGET_SHA^{commit}"
          if [ -e "$work" ]; then
            git -C "$base" worktree remove --force "$work" 2>/dev/null || true
            sudo rm -rf "$work"
          fi
          git -C "$base" worktree prune
          git -C "$base" worktree add --detach "$work" "$TARGET_SHA"
          cp "$base/deploy/qa/.env.qa" "$work/deploy/qa/.env.qa"
          chmod 600 "$work/deploy/qa/.env.qa"
          cd "$work"
          python3 tools/apply_everleaf_config.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('config.yaml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    HOST: 132.145.141.79', '    HOST: 127.0.0.1', 1)
          if '    HOST: 127.0.0.1' not in text:
              raise SystemExit('Could not force disposable QA HOST to loopback')
          path.write_text(text, encoding='utf-8')
          PY
          grep -q '    HOST: 127.0.0.1' config.yaml
          grep -q '    SPAWN_BOTS_ON_STARTUP: false' config.yaml
          cat > deploy/qa/solomapling-suite.override.yml <<'YAML'
          services:
            qa-game:
              environment:
                EVERLEAF_SOLOMAPLING_SUITE: I_UNDERSTAND_DISPOSABLE_QA_SUITE_ONLY
          YAML
          REMOTE

      - name: Start isolated QA database
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_QA_USER@$EVERLEAF_QA_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/everleaf/qa-solomapling-suite
          compose=(docker compose --env-file deploy/qa/.env.qa -f deploy/qa/docker-compose.qa.yml -p everleaf-qa)
          "${compose[@]}" up -d qa-db
          for _ in $(seq 1 45); do
            if "${compose[@]}" exec -T qa-db sh -lc 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          "${compose[@]}" exec -T qa-db sh -lc \
            'count=$(mysql -N -uroot -p"$MYSQL_ROOT_PASSWORD" cosmic -e "SELECT COUNT(*) FROM characters c JOIN accounts a ON a.id=c.accountid WHERE a.name REGEXP '\''^qa_'\'';"); echo "qa_character_templates=$count"; test "$count" -gt 0'
          REMOTE

      - name: Build and run armed full SoloMapling suite
        continue-on-error: true
        run: |
          set +e
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_QA_USER@$EVERLEAF_QA_HOST" 'bash -s' > /tmp/solomapling-suite.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          cd /opt/everleaf/qa-solomapling-suite
          compose=(docker compose --env-file deploy/qa/.env.qa -f deploy/qa/docker-compose.qa.yml -f deploy/qa/solomapling-suite.override.yml -p everleaf-qa)
          "${compose[@]}" up -d --build --force-recreate qa-game
          result=''
          detail=''
          for _ in $(seq 1 600); do
            logs=$("${compose[@]}" logs --no-color qa-game 2>&1 || true)
            detail=$(grep 'SOLOMAPLING_QA_SUITE_RESULT' <<<"$logs" | tail -1 || true)
            if grep -q 'SOLOMAPLING_QA_SUITE_RESULT PASS' <<<"$logs"; then result=PASS; break; fi
            if grep -q 'SOLOMAPLING_QA_SUITE_RESULT FAIL' <<<"$logs"; then result=FAIL; break; fi
            if ! "${compose[@]}" ps --status running qa-game | grep -q qa-game; then result=CONTAINER_EXITED; break; fi
            sleep 2
          done
          [ -n "$result" ] || result=TIMEOUT
          echo "RESULT=$result"
          echo "DETAIL=$detail"
          test "$result" = PASS
          REMOTE
          rc=$?
          cat /tmp/solomapling-suite.txt
          exit 0

      - name: Disarm suite and restore disposable QA stack
        if: always()
        run: |
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_QA_USER@$EVERLEAF_QA_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          work=/opt/everleaf/qa-solomapling-suite
          if [ ! -d "$work" ] || [ ! -f "$work/deploy/qa/.env.qa" ]; then exit 0; fi
          cd "$work"
          rm -f deploy/qa/solomapling-suite.override.yml
          compose=(docker compose --env-file deploy/qa/.env.qa -f deploy/qa/docker-compose.qa.yml -p everleaf-qa)
          "${compose[@]}" up -d --force-recreate qa-game || true
          REMOTE

      - name: Publish sanitized suite status
        if: always()
        run: |
          set -euo pipefail
          result="$(grep '^RESULT=' /tmp/solomapling-suite.txt 2>/dev/null | tail -1 | cut -d= -f2- || true)"
          detail="$(grep '^DETAIL=' /tmp/solomapling-suite.txt 2>/dev/null | tail -1 | cut -d= -f2- || true)"
          mkdir -p docs
          cat > docs/SOLOMAPLING_LATEST_SUITE.md <<EOF
          # SoloMapling Latest Disposable QA Suite

          Verified UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          - Source commit: \`${GITHUB_SHA}\`
          - Branch: \`${GITHUB_REF_NAME}\`
          - Disposable QA DB/stack isolation: enforced
          - Ambient production bot spawning: disabled
          - Full suite result: **${result:-UNKNOWN}**
          - Terminal suite line: \`${detail:-not-produced}\`
          EOF
          git config user.name everleaf-release-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add docs/SOLOMAPLING_LATEST_SUITE.md
          git commit -m 'qa: record disposable SoloMapling full-suite status' || exit 0
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Require full suite pass
        if: always()
        run: grep -q '^RESULT=PASS$' /tmp/solomapling-suite.txt
