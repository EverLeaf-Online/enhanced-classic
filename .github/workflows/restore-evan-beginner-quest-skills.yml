name: Restore Evan beginner quest skills

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/restore-evan-beginner-quest-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
          fetch-depth: 0
      - name: Restore v83-compatible Evan common skill data
        run: |
          python3 - <<'PY'
          import copy
          import xml.etree.ElementTree as ET
          from pathlib import Path

          source = Path('wz/Skill.wz/2000.img.xml')
          target = Path('wz/Skill.wz/2001.img.xml')
          root = ET.parse(source).getroot()
          skills = next(c for c in root if c.tag == 'imgdir' and c.attrib.get('name') == 'skill')
          wanted = {'20001003': '20011003', '20001007': '20011007'}
          found = {}
          for node in skills:
              old = node.attrib.get('name')
              if old in wanted:
                  clone = copy.deepcopy(node)
                  clone.set('name', wanted[old])
                  found[old] = clone
          missing = sorted(set(wanted) - set(found))
          if missing:
              raise SystemExit(f'missing v83 source skill nodes: {missing}')

          out = ET.Element('imgdir', {'name': '2001.img'})
          info = next((c for c in root if c.tag == 'imgdir' and c.attrib.get('name') == 'info'), None)
          if info is not None:
              out.append(copy.deepcopy(info))
          out_skills = ET.SubElement(out, 'imgdir', {'name': 'skill'})
          for old in wanted:
              out_skills.append(found[old])
          ET.indent(out, space='  ')
          target.write_text('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + ET.tostring(out, encoding='unicode') + '\n', encoding='utf-8')
          print('restored:', ', '.join(wanted.values()))
          PY
          grep -q 'name="20011003"' wz/Skill.wz/2001.img.xml
          grep -q 'name="20011007"' wz/Skill.wz/2001.img.xml
      - name: Commit restored skill data
        run: |
          if git diff --quiet -- wz/Skill.wz/2001.img.xml && git ls-files --error-unmatch wz/Skill.wz/2001.img.xml >/dev/null 2>&1; then
            echo 'Evan beginner quest skill data already current.'
            exit 0
          fi
          git config user.name 'EverLeaf QA'
          git config user.email 'actions@users.noreply.github.com'
          git add wz/Skill.wz/2001.img.xml
          git commit -m 'fix(quests): restore Evan common quest skill data'
          git push origin HEAD:release-dev
