name: Fetch Evan v84 map donor

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/fetch-evan-v84-map-donor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Fetch v84 Evan maps from MapleStory.io in parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donor
          ids=(100030100 100030101 100030102 100030103 100030200 100030300 100030310 100030400)
          printf '%s\n' "${ids[@]}" | xargs -P 8 -I{} bash -c '
            set -euo pipefail
            id="$1"
            info="https://maplestory.io/api/GMS/84/map/$id"
            raw="https://maplestory.io/api/wz/export/GMS/84/Map/Map/Map1/$id.img?rawImage=true"
            curl -fsSL --retry 1 --connect-timeout 10 --max-time 45 "$info" -o "donor/$id.json"
            curl -fsSL --retry 1 --connect-timeout 10 --max-time 45 "$raw" -o "donor/$id.img"
            test -s "donor/$id.json"
            test -s "donor/$id.img"
            printf "%s json=%s img=%s\n" "$id" "$(stat -c %s donor/$id.json)" "$(stat -c %s donor/$id.img)"
          ' _ {}

      - name: Validate donor responses
        shell: python
        run: |
          import json, pathlib
          ids=['100030100','100030101','100030102','100030103','100030200','100030300','100030310','100030400']
          for mid in ids:
              jp=pathlib.Path('donor')/(mid+'.json')
              ip=pathlib.Path('donor')/(mid+'.img')
              d=json.loads(jp.read_text(encoding='utf-8'))
              print(mid, d.get('streetName'), '-', d.get('name'), 'img_bytes=',ip.stat().st_size)
              assert ip.stat().st_size > 64, f'{mid} IMG unexpectedly small'

      - uses: actions/upload-artifact@v4
        with:
          name: evan-v84-map-donor
          path: donor/
          if-no-files-found: error
