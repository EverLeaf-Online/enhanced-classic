name: Audit EverLeaf Discord status monitor

on:
  push:
    branches:
      - fix-discord-monitor-spam
    paths:
      - .github/workflows/audit-discord-status-monitor.yml

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Locate the legacy alert monitor without reading credentials
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            echo 'candidate_units:'
            systemctl list-unit-files --type=service --no-legend 2>/dev/null \
              | awk '{print $1}' \
              | grep -Ei 'everleaf|discord|status|monitor' || true
            unit_path="$(systemctl show everleaf-discord.service -p FragmentPath --value)"
            echo "unit_path=$unit_path"
            sudo awk -F= '
              /^WorkingDirectory=/ { print "working_directory=" $2 }
              /^EnvironmentFile=/ { print "environment_file=" $2 }
              /^ExecStart=/ {
                split($2, fields, /[[:space:]]+/)
                print "exec_start_program=" fields[1]
              }
            ' "$unit_path"
            work_dir="$(sudo awk -F= '/^WorkingDirectory=/ { print $2; exit }' "$unit_path")"
            test -n "$work_dir"
            echo 'alert_source_paths:'
            sudo find "$work_dir" -maxdepth 4 -type f \
              \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' -o -name '*.py' -o -name '*.sh' \) \
              -print0 \
              | sudo xargs -0 -r grep -Il \
                  -e 'EverLeaf Status Alert' \
                  -e 'Login Server recovered' || true
          REMOTE
