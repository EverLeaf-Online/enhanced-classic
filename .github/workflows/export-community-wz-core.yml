name: Export community WZ core donor

on:
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/export-community-wz-core.yml'
      - 'tools/wz-donor/exporter/Program.cs'
      - 'tools/wz-donor/wz_diff.py'
      - 'tools/wz-donor/build_import_manifest.py'
      - 'tools/wz-donor/render_review_report.py'
      - 'tools/wz-donor/evaluate_package.py'
      - 'tools/wz-donor/batches/community-empress-future-henesys-001.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  COMMUNITY_WZ_ROOT: /home/ubuntu/everleaf-staging/community-wz/extracted/Community Repack WZs

jobs:
  prepare-ssh:
    runs-on: ubuntu-24.04
    outputs:
      known_hosts_b64: ${{ steps.hostkeys.outputs.known_hosts_b64 }}
    steps:
      - name: Capture Oracle SSH host keys on Linux
        id: hostkeys
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          echo "known_hosts_b64=$(base64 -w0 "$RUNNER_TEMP/known_hosts")" >> "$GITHUB_OUTPUT"

  export-and-analyze:
    needs: prepare-ssh
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ needs.prepare-ssh.outputs.known_hosts_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:KNOWN_HOSTS_B64) { throw 'Linux host-key capture returned no data' }
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($keyPath, ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          $knownHosts = Join-Path $sshDir 'known_hosts'
          [IO.File]::WriteAllBytes($knownHosts, [Convert]::FromBase64String($env:KNOWN_HOSTS_B64))
          if (-not (Test-Path $knownHosts) -or (Get-Item $knownHosts).Length -eq 0) { throw 'known_hosts is empty' }
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 15
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')

      - name: Fetch first-wave community donor families independently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remoteRoot = $env:COMMUNITY_WZ_ROOT
          $families = @('Map.wz','Mob.wz','Npc.wz','Reactor.wz','String.wz')
          $outputDir = Join-Path $env:RUNNER_TEMP 'community-core'
          $chunksRoot = Join-Path $env:RUNNER_TEMP 'community-core-chunks'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          New-Item -ItemType Directory -Force -Path $chunksRoot | Out-Null

          foreach ($family in $families) {
            Write-Host "=== Preparing $family ==="
            $safe = $family.Replace('.','_')
            $remoteBase = "/tmp/everleaf-community-$safe"
            $remoteFile = "$remoteRoot/$family"
            $prep = "set -euo pipefail; test -s '$remoteFile'; rm -f '$remoteBase'.part.* '$remoteBase'.parts.sha256 '$remoteBase'.file.sha256; sha256sum '$remoteFile' > '$remoteBase.file.sha256'; split -b 32M -d -a 4 '$remoteFile' '$remoteBase.part.'; sha256sum '$remoteBase'.part.* > '$remoteBase.parts.sha256'; wc -c '$remoteFile'; cat '$remoteBase.file.sha256'; wc -l '$remoteBase.parts.sha256'"

            $prepared = $false
            for ($attempt = 1; $attempt -le 4 -and -not $prepared; $attempt++) {
              Write-Host "Remote prepare $family attempt $attempt/4"
              ssh everleaf-oracle $prep
              if ($LASTEXITCODE -eq 0) { $prepared = $true } else { Start-Sleep -Seconds (3 * $attempt) }
            }
            if (-not $prepared) { throw "Failed to prepare $family on Oracle" }

            $familyChunks = Join-Path $chunksRoot $safe
            New-Item -ItemType Directory -Force -Path $familyChunks | Out-Null
            $partManifest = Join-Path $familyChunks 'parts.sha256'
            $fileManifest = Join-Path $familyChunks 'file.sha256'

            scp "everleaf-oracle`:$remoteBase.parts.sha256" $partManifest
            if ($LASTEXITCODE -ne 0) { throw "$family part manifest transfer failed" }
            scp "everleaf-oracle`:$remoteBase.file.sha256" $fileManifest
            if ($LASTEXITCODE -ne 0) { throw "$family file manifest transfer failed" }

            $rows = Get-Content $partManifest | Where-Object { $_.Trim() }
            foreach ($row in $rows) {
              if ($row -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Malformed $family chunk manifest row: $row" }
              $expected = $matches[1]
              $remotePath = $matches[2]
              $name = Split-Path $remotePath -Leaf
              $local = Join-Path $familyChunks $name
              $ok = $false
              for ($attempt = 1; $attempt -le 6 -and -not $ok; $attempt++) {
                Write-Host "Fetching $family / $name attempt $attempt/6"
                Remove-Item -Force -ErrorAction SilentlyContinue $local
                scp "everleaf-oracle`:$remotePath" $local
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path $local)) { Start-Sleep -Seconds (2 * $attempt); continue }
                $actual = (Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($actual -eq $expected) { $ok = $true } else { Write-Warning "$family / $name hash mismatch"; Start-Sleep -Seconds (2 * $attempt) }
              }
              if (-not $ok) { throw "Failed to transfer verified chunk: $family / $name" }
            }

            $destination = Join-Path $outputDir $family
            $out = [IO.File]::Open($destination, [IO.FileMode]::Create, [IO.FileAccess]::Write)
            try {
              Get-ChildItem $familyChunks -Filter "everleaf-community-$safe.part.*" -File | Sort-Object Name | ForEach-Object {
                $input = [IO.File]::OpenRead($_.FullName)
                try { $input.CopyTo($out) } finally { $input.Dispose() }
              }
            } finally { $out.Dispose() }

            $fileRow = Get-Content $fileManifest | Select-Object -First 1
            if ($fileRow -notmatch '^([0-9a-f]{64})\s+') { throw "Malformed $family file manifest" }
            $expectedFile = $matches[1]
            $actualFile = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualFile -ne $expectedFile) { throw "$family reassembled hash mismatch: $actualFile != $expectedFile" }

            Write-Host "$family verified: $actualFile"
            ssh everleaf-oracle "rm -f '$remoteBase'.part.* '$remoteBase'.parts.sha256 '$remoteBase'.file.sha256" | Out-Null
          }

          Get-ChildItem $outputDir -File | Select-Object Name,Length

      - name: Build MapleLib exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item 'tools/wz-donor/exporter/Program.cs' (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\MapleLib\MapleLib.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafWzExporter.csproj') -c Release

      - name: Export donor WZ to XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'community-core'
          $outputDir = Join-Path $env:RUNNER_TEMP 'community-core-xml'
          $project = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & dotnet run --project $project -c Release --no-build -- $inputDir $outputDir --patch-version=83 --probe-patch-range=1:250 Map.wz Mob.wz Npc.wz Reactor.wz String.wz
          if ($LASTEXITCODE -ne 0) { throw "Community WZ export failed with exit code $LASTEXITCODE" }
          $count = (Get-ChildItem $outputDir -Filter '*.xml' -File -Recurse | Measure-Object).Count
          if ($count -lt 1000) { throw "Unexpectedly small XML export: $count files" }
          Write-Host "Exported XML files: $count"

      - name: Compare community XML against EverLeaf v83 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/wz-donor/wz_diff.py --baseline wz --donor "$env:RUNNER_TEMP/community-core-xml" --donor-id community-repack-core --output "$env:RUNNER_TEMP/community-core-diff.json"
          python tools/wz-donor/build_import_manifest.py "$env:RUNNER_TEMP/community-core-diff.json" --output "$env:RUNNER_TEMP/community-core-import-manifest.json"
          python tools/wz-donor/render_review_report.py "$env:RUNNER_TEMP/community-core-diff.json" "$env:RUNNER_TEMP/community-core-import-manifest.json" --output "$env:RUNNER_TEMP/community-core-review.md"
          Get-Content "$env:RUNNER_TEMP/community-core-review.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Evaluate Future Henesys and Empress package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/wz-donor/evaluate_package.py tools/wz-donor/batches/community-empress-future-henesys-001.json "$env:RUNNER_TEMP/community-core-diff.json" --output "$env:RUNNER_TEMP/community-empress-package-evaluation.json"
          $report = Get-Content "$env:RUNNER_TEMP/community-empress-package-evaluation.json" -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY '## Future Henesys / Empress package'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Selected IDs: **$($report.selectedCount)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Donor-new: **$($report.counts.'donor-new')**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Changed collisions: **$($report.counts.'collision-changed')**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Identical collisions: **$($report.counts.'collision-identical')**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Missing from donor: **$($report.counts.'missing-from-donor')**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Missing selected dependencies: **$($report.missingSelectedDependencyCount)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Ready for import review: **$($report.readyForImportReview)**"

      - name: Preserve exported donor privately on Oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xmlRoot = Join-Path $env:RUNNER_TEMP 'community-core-xml'
          $zip = Join-Path $env:RUNNER_TEMP 'community-repack-core.zip'
          Compress-Archive -Path (Join-Path $xmlRoot '*') -DestinationPath $zip -CompressionLevel Optimal
          $localHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Local XML archive SHA256: $localHash"
          $remotePart = '/opt/everleaf/private/wz-donors/community-repack-core.zip.part'
          $uploaded = $false
          for ($attempt = 1; $attempt -le 5 -and -not $uploaded; $attempt++) {
            Write-Host "Uploading private XML archive attempt $attempt/5"
            scp $zip "everleaf-oracle`:$remotePart"
            if ($LASTEXITCODE -eq 0) { $uploaded = $true } else { Start-Sleep -Seconds (3 * $attempt) }
          }
          if (-not $uploaded) { throw 'Private XML upload failed' }
          $remoteCommand = "set -euo pipefail; cd /opt/everleaf/private/wz-donors; unzip -t community-repack-core.zip.part >/dev/null; echo '$localHash  community-repack-core.zip.part' | sha256sum -c -; mv community-repack-core.zip.part community-repack-core.zip; sha256sum community-repack-core.zip"
          ssh everleaf-oracle $remoteCommand
          if ($LASTEXITCODE -ne 0) { throw 'Private XML verification failed' }

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-repack-core-analysis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/community-core-diff.json
            ${{ runner.temp }}/community-core-import-manifest.json
            ${{ runner.temp }}/community-core-review.md
            ${{ runner.temp }}/community-empress-package-evaluation.json
          retention-days: 14
          if-no-files-found: error
