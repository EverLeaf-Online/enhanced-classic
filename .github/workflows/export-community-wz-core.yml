name: Export community WZ core donor

on:
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/export-community-wz-core.yml'
      - 'tools/wz-donor/exporter/Program.cs'
      - 'tools/wz-donor/wz_diff.py'
      - 'tools/wz-donor/build_import_manifest.py'
      - 'tools/wz-donor/render_review_report.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  COMMUNITY_WZ_ROOT: /home/ubuntu/everleaf-staging/community-wz/extracted/Community Repack WZs

jobs:
  prepare-ssh:
    runs-on: ubuntu-24.04
    outputs:
      known_hosts_b64: ${{ steps.hostkeys.outputs.known_hosts_b64 }}
    steps:
      - name: Capture Oracle SSH host keys on Linux
        id: hostkeys
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          echo "known_hosts_b64=$(base64 -w0 "$RUNNER_TEMP/known_hosts")" >> "$GITHUB_OUTPUT"

  export-and-analyze:
    needs: prepare-ssh
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ needs.prepare-ssh.outputs.known_hosts_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:KNOWN_HOSTS_B64) { throw 'Linux host-key capture returned no data' }
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($keyPath, ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          $knownHosts = Join-Path $sshDir 'known_hosts'
          [IO.File]::WriteAllBytes($knownHosts, [Convert]::FromBase64String($env:KNOWN_HOSTS_B64))
          if (-not (Test-Path $knownHosts) -or (Get-Item $knownHosts).Length -eq 0) { throw 'known_hosts is empty' }

      - name: Fetch only first-wave community donor families
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          $remoteTar = '/tmp/everleaf-community-core-wz.tgz'
          $remoteRoot = $env:COMMUNITY_WZ_ROOT
          $remoteCommand = "set -euo pipefail; cd '$remoteRoot'; test -s Map.wz; test -s Mob.wz; test -s Npc.wz; test -s Reactor.wz; test -s String.wz; tar -czf '$remoteTar' Map.wz Mob.wz Npc.wz Reactor.wz String.wz; sha256sum '$remoteTar'"
          ssh -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" $remoteCommand
          if ($LASTEXITCODE -ne 0) { throw 'Remote donor packaging failed' }
          scp -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteTar" "$env:RUNNER_TEMP/community-core-wz.tgz"
          if ($LASTEXITCODE -ne 0) { throw 'Donor transfer failed' }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/community-core" | Out-Null
          tar -xzf "$env:RUNNER_TEMP/community-core-wz.tgz" -C "$env:RUNNER_TEMP/community-core"
          if ($LASTEXITCODE -ne 0) { throw 'Donor extraction failed' }
          Get-ChildItem "$env:RUNNER_TEMP/community-core" -File | Select-Object Name,Length

      - name: Build MapleLib exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item 'tools/wz-donor/exporter/Program.cs' (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\MapleLib\MapleLib.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafWzExporter.csproj') -c Release

      - name: Export donor WZ to XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'community-core'
          $outputDir = Join-Path $env:RUNNER_TEMP 'community-core-xml'
          $project = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & dotnet run --project $project -c Release --no-build -- $inputDir $outputDir --patch-version=83 --probe-patch-range=1:250 Map.wz Mob.wz Npc.wz Reactor.wz String.wz
          if ($LASTEXITCODE -ne 0) { throw "Community WZ export failed with exit code $LASTEXITCODE" }
          $count = (Get-ChildItem $outputDir -Filter '*.xml' -File -Recurse | Measure-Object).Count
          if ($count -lt 1000) { throw "Unexpectedly small XML export: $count files" }
          Write-Host "Exported XML files: $count"

      - name: Compare community XML against EverLeaf v83 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/wz-donor/wz_diff.py --baseline wz --donor "$env:RUNNER_TEMP/community-core-xml" --donor-id community-repack-core --output "$env:RUNNER_TEMP/community-core-diff.json"
          python tools/wz-donor/build_import_manifest.py "$env:RUNNER_TEMP/community-core-diff.json" --output "$env:RUNNER_TEMP/community-core-import-manifest.json"
          python tools/wz-donor/render_review_report.py "$env:RUNNER_TEMP/community-core-diff.json" "$env:RUNNER_TEMP/community-core-import-manifest.json" --output "$env:RUNNER_TEMP/community-core-review.md"
          Get-Content "$env:RUNNER_TEMP/community-core-review.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Preserve exported donor privately on Oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $xmlRoot = Join-Path $env:RUNNER_TEMP 'community-core-xml'
          $zip = Join-Path $env:RUNNER_TEMP 'community-repack-core.zip'
          Compress-Archive -Path (Join-Path $xmlRoot '*') -DestinationPath $zip -CompressionLevel Optimal
          $localHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Local XML archive SHA256: $localHash"
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          scp -i $keyPath $zip "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/private/wz-donors/community-repack-core.zip.part"
          if ($LASTEXITCODE -ne 0) { throw 'Private XML upload failed' }
          $remoteCommand = "set -euo pipefail; cd /opt/everleaf/private/wz-donors; unzip -t community-repack-core.zip.part >/dev/null; mv community-repack-core.zip.part community-repack-core.zip; sha256sum community-repack-core.zip; rm -f /tmp/everleaf-community-core-wz.tgz"
          ssh -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" $remoteCommand
          if ($LASTEXITCODE -ne 0) { throw 'Private XML verification failed' }

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: community-repack-core-analysis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/community-core-diff.json
            ${{ runner.temp }}/community-core-import-manifest.json
            ${{ runner.temp }}/community-core-review.md
          retention-days: 14
          if-no-files-found: error
