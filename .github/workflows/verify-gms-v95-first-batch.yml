name: Verify GMS v95 first consume batch

on:
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/verify-gms-v95-first-batch.yml'
      - 'tools/wz-donor/batches/gms-v95-consume-batch-001.json'
      - 'tools/wz-donor/verify_batch_manifest.py'
      - 'tools/wz-donor/profile_item_candidates.py'
      - 'tools/wz-donor/wz_diff.py'
      - 'tools/wz-donor/build_import_manifest.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Fetch pinned private donor archives
        run: |
          set -euo pipefail
          remote=/opt/everleaf/private/wz-donors
          for archive in gms-v95-core7.zip gms-v95-string.zip; do
            remote_hash="$(ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
              "set -e; cd '$remote'; test -f '$archive'; unzip -t '$archive' >/dev/null; sha256sum '$archive'" | awk '{print $1}')"
            scp -i ~/.ssh/id_everleaf \
              "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/$archive" \
              "$RUNNER_TEMP/$archive"
            test "$(sha256sum "$RUNNER_TEMP/$archive" | awk '{print $1}')" = "$remote_hash"
          done
          test "$(sha256sum "$RUNNER_TEMP/gms-v95-core7.zip" | awk '{print $1}')" = \
            '62e106f8437ce04443c797c0514e14d430fcc0a10ae4131f16567f540a8d5d3c'
          test "$(sha256sum "$RUNNER_TEMP/gms-v95-string.zip" | awk '{print $1}')" = \
            'f00b94fcfad3f95d438b4474b74d550ea68d8aee0a8c3e4c2d9fae548a6fe7ed'
          mkdir -p "$RUNNER_TEMP/core7" "$RUNNER_TEMP/string"
          unzip -q "$RUNNER_TEMP/gms-v95-core7.zip" -d "$RUNNER_TEMP/core7"
          unzip -q "$RUNNER_TEMP/gms-v95-string.zip" -d "$RUNNER_TEMP/string"
          test "$(find "$RUNNER_TEMP/core7" -type f -name '*.xml' | wc -l)" -eq 14527
          test "$(find "$RUNNER_TEMP/string" -type f -name '*.xml' | wc -l)" -eq 20

      - name: Recompute current donor evidence
        run: |
          set -euo pipefail
          python tools/wz-donor/wz_diff.py \
            --baseline wz \
            --donor "$RUNNER_TEMP/core7" \
            --donor-id gms-v95-core7 \
            --output "$RUNNER_TEMP/diff.json"
          python tools/wz-donor/build_import_manifest.py \
            "$RUNNER_TEMP/diff.json" \
            --output "$RUNNER_TEMP/import-manifest.json"
          python tools/wz-donor/profile_item_candidates.py \
            "$RUNNER_TEMP/import-manifest.json" \
            --donor "$RUNNER_TEMP/core7" \
            --strings "$RUNNER_TEMP/string" \
            --baseline wz \
            --output "$RUNNER_TEMP/item-profiles.json"

      - name: Verify frozen batch against recomputed evidence
        run: |
          set -euo pipefail
          python tools/wz-donor/verify_batch_manifest.py \
            tools/wz-donor/batches/gms-v95-consume-batch-001.json \
            "$RUNNER_TEMP/item-profiles.json" \
            "$RUNNER_TEMP/import-manifest.json"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-first-consume-batch-${{ github.sha }}
          path: |
            ${{ runner.temp }}/diff.json
            ${{ runner.temp }}/import-manifest.json
            ${{ runner.temp }}/item-profiles.json
            tools/wz-donor/batches/gms-v95-consume-batch-001.json
          retention-days: 14
          if-no-files-found: error
