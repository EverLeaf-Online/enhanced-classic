name: Audit Yuna client donor

on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/audit-yuna-client-donor.yml'

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Download and audit donor on Oracle staging
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          root=/home/ubuntu/everleaf-staging/yuna-client-current
          mkdir -p "$root"
          archive="$root/yuna-client-latest"
          echo "Downloading official Yuna client donor..."
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 20 --max-time 5400 \
            https://download.yuna.ms/latest -o "$archive"
          echo "YUNA_DONOR_SHA256=$(sha256sum "$archive" | awk '{print $1}')"
          echo "YUNA_DONOR_SIZE=$(stat -c%s "$archive")"
          file "$archive" || true
          rm -rf "$root/extracted"
          mkdir -p "$root/extracted"
          if command -v 7z >/dev/null 2>&1; then
            7z x -y -o"$root/extracted" "$archive" >/tmp/yuna-7z.log
          elif unzip -t "$archive" >/dev/null 2>&1; then
            unzip -q "$archive" -d "$root/extracted"
          else
            echo "No supported archive extractor / unknown format" >&2
            exit 2
          fi
          echo '=== TOP LEVEL ==='
          find "$root/extracted" -maxdepth 2 -mindepth 1 -printf '%y %p %s bytes\n' | sort | head -250
          echo '=== IMPORTANT FILES ==='
          find "$root/extracted" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.wz' -o -iname '*.ini' -o -iname '*.json' -o -iname '*.cfg' -o -iname '*.txt' \) -printf '%p\t%s\n' | sort | head -500
          echo '=== HASHES: EXE DLL CONFIG ==='
          while IFS= read -r -d '' f; do sha256sum "$f"; done < <(find "$root/extracted" -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.ini' -o -iname '*.cfg' -o -iname '*.json' \) -print0) | sort
          echo '=== SETTINGS / TEXT CONFIG ==='
          while IFS= read -r -d '' f; do
            echo "--- $f"
            sed -n '1,220p' "$f" 2>/dev/null || true
          done < <(find "$root/extracted" -type f \( -iname 'settings.ini' -o -iname 'config.ini' -o -iname '*.cfg' \) -print0)
          echo '=== NETWORK / BRAND STRINGS FROM SMALL BINARIES ==='
          while IFS= read -r -d '' f; do
            sz=$(stat -c%s "$f")
            [ "$sz" -le 100000000 ] || continue
            echo "--- $f"
            strings -a "$f" 2>/dev/null | grep -Eai 'yuna|yuna\.ms|127\.0\.0\.1|localhost|[0-9]{1,3}(\.[0-9]{1,3}){3}|8484|7575|resolution|width|height|window|fullscreen|discord|http' | head -160 || true
          done < <(find "$root/extracted" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          echo '=== LIVE EVERLEAF REFERENCE ==='
          for f in /opt/everleaf/patches/files/EverLeaf.exe /opt/everleaf/patches/files/dinput8.dll /opt/everleaf/patches/files/config.ini /opt/everleaf/patches/files/Map.wz /opt/everleaf/patches/files/UI.wz; do
            [ -f "$f" ] && sha256sum "$f" || true
          done
          echo 'YUNA_CLIENT_DONOR_AUDIT_OK'
          REMOTE
