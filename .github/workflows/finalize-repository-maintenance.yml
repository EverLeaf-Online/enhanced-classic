name: Finalize EverLeaf repository maintenance

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/finalize-repository-maintenance.yml'
      - '.github/workflows/client-v2-integration-guard.yml'
      - '.github/workflows/client-v2-diagnostics-guard.yml'
      - '.github/workflows/client-v2-frame-limiter-guard.yml'
      - '.github/workflows/client-v2-wasd-guard.yml'
      - 'docs/EVERLEAF_MASTER_CHECKLIST.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/finalize-repository-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate final workflow policy and checklist
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/client-v2-integration-guard.yml \
            .github/workflows/client-v2-diagnostics-guard.yml \
            .github/workflows/client-v2-frame-limiter-guard.yml \
            .github/workflows/client-v2-wasd-guard.yml; do
            grep -q '^  workflow_dispatch:$' "$workflow"
            if grep -q '^  pull_request:$' "$workflow"; then
              echo "$workflow still auto-runs on pull requests" >&2
              exit 1
            fi
          done
          grep -q 'PR #366 was closed as superseded' docs/EVERLEAF_MASTER_CHECKLIST.md
          grep -q 'Live client overlay was rebuilt, verified, and published' docs/EVERLEAF_MASTER_CHECKLIST.md
          echo 'FINAL_WORKFLOW_POLICY_OK'

  finalize:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Configure production SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronize production source checkout to canonical master
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "EXPECTED_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/everleaf/server
          test -z "$(git status --porcelain)" || { echo 'Production source checkout is dirty; refusing destructive sync.' >&2; git status --short; exit 1; }
          git fetch origin master --prune
          git switch master
          git reset --hard origin/master
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          systemctl is-active --quiet everleaf.service
          echo "PRODUCTION_SOURCE_SYNC_OK sha=$ACTUAL_SHA runtime=$(readlink -f /opt/everleaf/current)"
          REMOTE

      - name: Remove superseded remote branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'client/everleaf-native-package-20260905'
            'maintenance/finalize-master-20260910'
            'maintenance/final-workflow-cleanup-20260910'
          )
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            status="$(curl -sS -o /tmp/delete-branch.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded")"
            case "$status" in
              204) echo "Deleted $branch" ;;
              404) echo "$branch already absent" ;;
              *) cat /tmp/delete-branch.json >&2; echo "Failed deleting $branch (HTTP $status)" >&2; exit 1 ;;
            esac
          done

      - name: Verify master is the only remaining branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/branches?per_page=100",
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              branches = [entry['name'] for entry in json.load(response)]
          print('remaining_branches=', branches)
          assert branches == ['master'], branches
          PY
