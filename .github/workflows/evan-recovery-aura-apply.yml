name: Apply Evan Recovery Aura Fix

on:
  pull_request:
    branches: [release-dev]
    paths:
      - 'tools/apply_evan_recovery_aura_fixes.py'
      - 'tools/audit_evan_recovery_aura.py'
      - '.github/workflows/evan-recovery-aura-apply.yml'
  push:
    branches: [release-dev]
    paths:
      - 'tools/apply_evan_recovery_aura_fixes.py'
      - 'tools/audit_evan_recovery_aura.py'
      - '.github/workflows/evan-recovery-aura-apply.yml'

permissions:
  contents: write

concurrency:
  group: evan-recovery-aura-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Apply Recovery Aura fix
        run: python3 tools/apply_evan_recovery_aura_fixes.py

      - name: Verify transform idempotency
        shell: bash
        run: |
          set -euo pipefail
          target='src/main/java/server/maps/MapleMap.java'
          before="$(sha256sum "$target" | awk '{print $1}')"
          python3 tools/apply_evan_recovery_aura_fixes.py
          after="$(sha256sum "$target" | awk '{print $1}')"
          test "$before" = "$after" || {
            echo 'Recovery Aura transform is not idempotent.' >&2
            exit 1
          }

      - name: Audit Recovery Aura semantics
        run: python3 tools/audit_evan_recovery_aura.py

      - name: Compile and test transformed server
        run: |
          chmod +x mvnw
          ./mvnw -B package --file pom.xml

      - name: Commit verified source on release-dev
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          target='src/main/java/server/maps/MapleMap.java'
          if git diff --quiet -- "$target"; then
            echo 'Recovery Aura source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'fix(evan): materialize Recovery Aura restoration'
          git push origin HEAD:release-dev
