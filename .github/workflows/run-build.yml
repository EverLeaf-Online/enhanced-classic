# Build and test Everleaf Enhanced Classic on development pushes and pull requests.

name: Run build

on:
  push:
    branches:
      - enhanced-dev
      - progression-dev
      - content-dev
  pull_request:
    branches:
      - master
      - enhanced-dev
      - progression-dev
      - content-dev

jobs:
  migration-smoke-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: everleaf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=everleaf_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - name: Apply and verify Everleaf migrations
        env:
          EVERLEAF_TEST_MYSQL_PASSWORD: everleaf_test
        run: bash tools/test_everleaf_migrations.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Apply Everleaf configuration
        run: python3 tools/apply_everleaf_config.py
      - name: Apply Everleaf source transforms
        run: python3 tools/apply_level_cap_250.py
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build with Maven (compile -> test -> package)
        run: ./mvnw -B package --file pom.xml
      - name: Generate Everleaf build manifest
        if: success()
        run: python3 tools/generate_build_manifest.py
      - name: Upload Everleaf server artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-server-${{ github.sha }}
          path: |
            target/*.jar
            target/everleaf-build.json
          if-no-files-found: error
          retention-days: 14

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/content-dev'
    needs:
      - migration-smoke-test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure pinned SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
        run: |
          test -n "${SSH_PRIVATE_KEY}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/everleaf_staging
          chmod 600 ~/.ssh/everleaf_staging
          ssh-keyscan -T 10 -t ed25519 132.145.141.79 > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = \
            "SHA256:0bqGKikVD6I01xdtL/06xK1XL/NBs1B0se72Siwt9AE"

      - name: Deploy immutable release
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/everleaf_staging ubuntu@132.145.141.79 \
            "set -euo pipefail; tmp_script=\$(mktemp); curl -fsSL https://raw.githubusercontent.com/iampolicy/enhanced-classic/${DEPLOY_SHA}/tools/deploy_staging.sh -o \"\${tmp_script}\"; chmod +x \"\${tmp_script}\"; \"\${tmp_script}\" '${DEPLOY_SHA}'; rm -f \"\${tmp_script}\""
