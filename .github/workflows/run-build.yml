# Build and test Everleaf Enhanced Classic on development pushes and pull requests.

name: Run build

on:
  push:
    branches:
      - master
      - enhanced-dev
      - progression-dev
      - release-dev
  pull_request:
    branches:
      - master
      - enhanced-dev
      - progression-dev
      - release-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Apply Everleaf configuration
        run: python3 tools/apply_everleaf_config.py
      - name: Apply Everleaf source transforms
        run: |
          python3 tools/apply_level_cap_250.py
          python3 tools/apply_pq_points.py
          python3 tools/apply_evan_skill_data.py
          python3 tools/apply_evan_behavior_fixes.py
          python3 tools/apply_evan_progression_fixes.py
          python3 tools/apply_equipment_requirement_fixes.py
          python3 tools/apply_item_stack_integrity_fixes.py
          python3 tools/apply_item_transfer_integrity_fixes.py
          python3 tools/apply_duey_ownership_fixes.py
          python3 tools/apply_duey_settlement_fixes.py
          python3 tools/apply_merchant_recovery_fixes.py
          python3 tools/apply_merchant_persistence_transaction.py
      - name: Verify Duey transform idempotency
        shell: bash
        run: |
          set -euo pipefail
          target='src/main/java/client/processor/npc/DueyProcessor.java'
          before="$(sha256sum "$target" | awk '{print $1}')"
          python3 tools/apply_duey_ownership_fixes.py
          python3 tools/apply_duey_settlement_fixes.py
          after="$(sha256sum "$target" | awk '{print $1}')"
          test "$before" = "$after" || {
            echo 'Duey transforms are not idempotent; a production second pass would mutate source again.' >&2
            exit 1
          }
          python3 tools/audit_duey_integrity.py
          python3 tools/audit_duey_settlement.py
          echo 'Duey ownership/settlement transforms are repeat-safe.'
      - name: Verify merchant transform idempotency
        shell: bash
        run: |
          set -euo pipefail
          merchant='src/main/java/server/maps/HiredMerchant.java'
          fredrick='src/main/java/client/processor/npc/FredrickProcessor.java'
          before="$(sha256sum "$merchant" "$fredrick" | sha256sum | awk '{print $1}')"
          python3 tools/apply_merchant_recovery_fixes.py
          python3 tools/apply_merchant_persistence_transaction.py
          after="$(sha256sum "$merchant" "$fredrick" | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || {
            echo 'Merchant transforms are not idempotent; a production second pass would mutate source again.' >&2
            exit 1
          }
          python3 tools/audit_merchant_recovery_integrity.py
          python3 tools/audit_merchant_persistence_transaction.py
          echo 'Merchant recovery/persistence transforms are repeat-safe.'
      - name: Audit economy and NX drops
        run: python3 tools/audit_economy_balance.py
      - name: Audit Gachapon and reward sources
        run: python3 tools/audit_reward_sources.py
      - name: Audit Vote Point exchange
        run: python3 tools/audit_vote_shop.py
      - name: Audit verified Vote Point rewards
        run: python3 tools/audit_vote_rewards.py
      - name: Audit PQ Points
        run: python3 tools/audit_pq_points.py
      - name: Audit Pet Vac safety
        run: python3 tools/audit_pet_vac.py
      - name: Audit Maple Leaf exchange
        run: python3 tools/audit_leaf_shop.py
      - name: Audit Rooted content
        run: python3 tools/audit_rooted_content.py
      - name: Audit class and skill integrity
        run: python3 tools/audit_class_skills.py
      - name: Audit Evan release support
        run: python3 tools/audit_evan_release.py
      - name: Audit items and equipment integrity
        run: python3 tools/audit_items_equipment.py
      - name: Audit item transfer and stack integrity
        run: python3 tools/audit_item_transfer_integrity.py
      - name: Audit Duey package ownership integrity
        run: python3 tools/audit_duey_integrity.py
      - name: Audit Duey settlement integrity
        run: python3 tools/audit_duey_settlement.py
      - name: Audit merchant recovery integrity
        run: python3 tools/audit_merchant_recovery_integrity.py
      - name: Audit merchant persistence transaction
        run: python3 tools/audit_merchant_persistence_transaction.py
      - name: Audit boss and PQ event-manager links
        run: python3 tools/audit_event_manager_links.py
      - name: Audit world data integrity
        run: python3 tools/audit_world_integrity.py
      - name: Audit release-facing NPC and portal integrity
        run: python3 tools/audit_world_release.py
      - name: Review active NPC script coverage
        run: python3 tools/audit_active_npc_scripts.py
      - name: Audit portal script filename case
        run: python3 tools/audit_portal_script_case.py
      - name: Audit script map references
        run: python3 tools/audit_script_map_references.py --strict
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build with Maven (compile -> test -> package)
        run: ./mvnw -B package --file pom.xml
      - name: Generate Everleaf build manifest
        if: success()
        run: python3 tools/generate_build_manifest.py
      - name: Upload Everleaf server artifact (best effort)
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-server-${{ github.sha }}
          path: |
            target/*.jar
            target/everleaf-build.json
          if-no-files-found: error
          retention-days: 14
