# Build and test Everleaf Enhanced Classic on development pushes and pull requests.

name: Run build

on:
  push:
    branches:
      - master
      - enhanced-dev
      - progression-dev
      - release-dev
  pull_request:
    branches:
      - master
      - enhanced-dev
      - progression-dev
      - release-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Apply Everleaf configuration
        run: python3 tools/apply_everleaf_config.py
      - name: Apply Everleaf source transforms
        run: |
          python3 tools/apply_level_cap_250.py
          python3 tools/apply_pq_points.py
      - name: Audit economy and NX drops
        run: python3 tools/audit_economy_balance.py
      - name: Audit Gachapon and reward sources
        run: python3 tools/audit_reward_sources.py
      - name: Audit Vote Point exchange
        run: python3 tools/audit_vote_shop.py
      - name: Audit verified Vote Point rewards
        run: python3 tools/audit_vote_rewards.py
      - name: Audit PQ Points
        run: python3 tools/audit_pq_points.py
      - name: Audit Pet Vac safety
        run: python3 tools/audit_pet_vac.py
      - name: Audit Maple Leaf exchange
        run: python3 tools/audit_leaf_shop.py
      - name: Audit Rooted content
        run: python3 tools/audit_rooted_content.py
      - name: Audit world data integrity
        run: python3 tools/audit_world_integrity.py
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Build with Maven (compile -> test -> package)
        run: ./mvnw -B package --file pom.xml
      - name: Generate Everleaf build manifest
        if: success()
        run: python3 tools/generate_build_manifest.py
      - name: Upload Everleaf server artifact (best effort)
        if: success()
        # A full account-level Actions artifact quota must not turn a verified
        # compile/test/package run red. The jar is still available in the job
        # workspace and production deployment has its own rollback copy.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-server-${{ github.sha }}
          path: |
            target/*.jar
            target/everleaf-build.json
          if-no-files-found: error
          retention-days: 14
