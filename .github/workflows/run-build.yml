name: Run build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Apply canonical EverLeaf configuration
        run: python3 tools/apply_everleaf_config.py

      - name: Audit production contract
        run: python3 tools/audit_production_contract.py

      - name: Run high-value static audits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_class_skills.py
          python3 tools/audit_world_integrity.py
          python3 tools/audit_world_release.py
          python3 tools/audit_quest_integrity.py
          python3 tools/audit_quest_gameplay_completeness.py
          python3 tools/audit_item_transfer_integrity.py
          python3 tools/audit_playershop_transaction_integrity.py
          python3 tools/audit_merchant_snapshot_consistency.py

      - name: Build and test server
        run: mvn -B clean test package --file pom.xml

      - name: Generate build manifest
        run: python3 tools/generate_build_manifest.py

      - name: Upload server artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-server-${{ github.sha }}
          path: |
            target/*.jar
            target/everleaf-build.json
          if-no-files-found: error
          retention-days: 7
