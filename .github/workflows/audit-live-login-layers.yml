name: Audit live login layers
# Manual refresh: 2026-09-05 panorama/login alignment audit

on:
  push:
    branches: [release-dev]
    paths:
      - ".github/workflows/audit-live-login-layers.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  LIBWZ_COMMIT: 41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          mkdir -p "$SSH_DIR" && chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_everleaf"
          chmod 600 "$SSH_DIR/id_everleaf"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$SSH_DIR/known_hosts"
          fi
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Fetch live Map.wz and UI.wz
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf")
          scp "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/Map.wz" "$RUNNER_TEMP/Map.wz"
          scp "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/UI.wz" "$RUNNER_TEMP/UI.wz"
          ssh "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'echo LIVE_MANIFEST; cat /opt/everleaf/patches/manifest.json; echo LIVE_HASHES; sha256sum /opt/everleaf/patches/files/Map.wz /opt/everleaf/patches/files/UI.wz'

      - name: Build login layer inspector
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/toyobayashi/libwz.git "$RUNNER_TEMP/libwz"
          git -C "$RUNNER_TEMP/libwz" checkout "$LIBWZ_COMMIT"
          git -C "$RUNNER_TEMP/libwz" submodule update --init --recursive
          mkdir -p "$RUNNER_TEMP/inspect"
          cat > "$RUNNER_TEMP/inspect/main.cpp" <<'CPP'
          #include <iostream>
          #include <string>
          #include "wz/Properties/WzCanvasProperty.h"
          #include "wz/Properties/WzSubProperty.h"
          #include "wz/WzDirectory.h"
          #include "wz/WzFile.h"
          #include "wz/WzImage.h"
          #include "wz/WzImageProperty.h"

          static void DumpProp(wz::WzImageProperty* p, int depth=0) {
            if (!p || depth > 32) return;
            if (p->PropertyType() == wz::WzPropertyType::Canvas) {
              auto* c=static_cast<wz::WzCanvasProperty*>(p);
              auto* png=c->PngProperty();
              std::cout << "CANVAS path=" << p->FullPath();
              if (png) std::cout << " size=" << png->Width() << "x" << png->Height();
              std::cout << "\n";
              for (auto* child:*c->WzProperties()) DumpProp(child, depth+1);
            } else if (p->PropertyType() == wz::WzPropertyType::SubProperty) {
              auto* s=static_cast<wz::WzSubProperty*>(p);
              for (auto* child:*s->WzProperties()) DumpProp(child, depth+1);
            }
          }

          static void DumpImage(const char* label, wz::WzImage* image) {
            std::cout << "### " << label << "\n";
            if (!image) { std::cout << "MISSING\n"; return; }
            auto r=image->ParseImage();
            if (!r || !r.value()) { std::cout << "UNPARSEABLE\n"; return; }
            for (auto* p:*image->WzProperties()) DumpProp(p);
          }

          int main(int argc,char** argv) {
            if (argc != 3) return 2;
            wz::WzFile map(argv[1],83,wz::WzMapleVersion::GMS);
            wz::WzFile ui(argv[2],83,wz::WzMapleVersion::GMS);
            if (map.ParseWzFile()!=wz::WzFileParseStatus::Success || ui.ParseWzFile()!=wz::WzFileParseStatus::Success) return 3;
            auto* mr=map.GetWzDirectory();
            auto* back=mr->GetDirectoryByName("back"); if(!back) back=mr->GetDirectoryByName("Back");
            auto* obj=mr->GetDirectoryByName("obj"); if(!obj) obj=mr->GetDirectoryByName("Obj");
            auto* bi=back ? back->GetImageByName("login.img") : nullptr; if(!bi && back) bi=back->GetImageByName("Login.img");
            auto* oi=obj ? obj->GetImageByName("login.img") : nullptr; if(!oi && obj) oi=obj->GetImageByName("Login.img");
            auto* ur=ui.GetWzDirectory();
            auto* li=ur->GetImageByName("login.img"); if(!li) li=ur->GetImageByName("Login.img");
            DumpImage("Map/back/login.img",bi);
            DumpImage("Map/obj/login.img",oi);
            DumpImage("UI/login.img",li);
            return 0;
          }
          CPP
          cat > "$RUNNER_TEMP/inspect/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(login_layer_inspector LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          add_subdirectory("$ENV{RUNNER_TEMP}/libwz" "$ENV{RUNNER_TEMP}/inspect-build/libwz" EXCLUDE_FROM_ALL)
          add_executable(login-layer-inspector main.cpp)
          target_link_libraries(login-layer-inspector PRIVATE wz)
          CMAKE
          cmake -S "$RUNNER_TEMP/inspect" -B "$RUNNER_TEMP/inspect-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/inspect-build" -j2

      - name: Inventory login canvases
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inspect-build/login-layer-inspector" "$RUNNER_TEMP/Map.wz" "$RUNNER_TEMP/UI.wz" | tee "$RUNNER_TEMP/login-layers.txt"
          echo "LOGIN_LAYER_AUDIT_OK"
