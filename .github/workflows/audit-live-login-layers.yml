name: Audit live login layers
# Live source-of-truth audit for panorama/login alignment.

on:
  push:
    branches: [release-dev]
    paths:
      - ".github/workflows/audit-live-login-layers.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  LIBWZ_COMMIT: 41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          mkdir -p "$SSH_DIR" && chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_everleaf"
          chmod 600 "$SSH_DIR/id_everleaf"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$SSH_DIR/known_hosts"; fi
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Fetch current live Map.wz and UI.wz
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf")
          scp "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/Map.wz" "$RUNNER_TEMP/Map.wz"
          scp "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/UI.wz" "$RUNNER_TEMP/UI.wz"
          ssh "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'echo LIVE_CONFIG; cat /opt/everleaf/patches/files/config.ini; echo LIVE_HASHES; sha256sum /opt/everleaf/patches/files/Map.wz /opt/everleaf/patches/files/UI.wz /opt/everleaf/patches/files/config.ini'

      - name: Build property inspector
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/toyobayashi/libwz.git "$RUNNER_TEMP/libwz"
          git -C "$RUNNER_TEMP/libwz" checkout "$LIBWZ_COMMIT"
          git -C "$RUNNER_TEMP/libwz" submodule update --init --recursive
          mkdir -p "$RUNNER_TEMP/inspect"
          cat > "$RUNNER_TEMP/inspect/main.cpp" <<'CPP'
          #include <iostream>
          #include <string>
          #include "wz/Properties/WzCanvasProperty.h"
          #include "wz/Properties/WzIntProperty.h"
          #include "wz/Properties/WzVectorProperty.h"
          #include "wz/Properties/WzSubProperty.h"
          #include "wz/WzDirectory.h"
          #include "wz/WzFile.h"
          #include "wz/WzImage.h"
          #include "wz/WzImageProperty.h"

          static bool Relevant(const std::string& p) {
            const char* needles[] = {
              "back\\11", "back/11", "signboard", "Title\\logo", "Title/logo", "Common\\frame", "Common/frame",
              "BtLogin", "BtLoginIDSave", "BtLoginIDLost", "BtPasswdLost", "BtNew", "BtHomePage", "BtQuit"
            };
            for (auto* n: needles) if (p.find(n) != std::string::npos) return true;
            return false;
          }

          static void Dump(wz::WzImageProperty* p, bool parentRelevant=false, int depth=0) {
            if (!p || depth>40) return;
            const std::string path=p->FullPath();
            const bool rel=parentRelevant || Relevant(path);
            const auto t=p->PropertyType();
            if (rel) {
              if (t==wz::WzPropertyType::Int) {
                auto* v=static_cast<wz::WzIntProperty*>(p);
                std::cout << "INT path=" << path << " value=" << v->Value() << "\n";
              } else if (t==wz::WzPropertyType::Vector) {
                auto* v=static_cast<wz::WzVectorProperty*>(p);
                std::cout << "VECTOR path=" << path << " x=" << (v->X ? v->X->Value() : 0) << " y=" << (v->Y ? v->Y->Value() : 0) << "\n";
              } else if (t==wz::WzPropertyType::Canvas) {
                auto* c=static_cast<wz::WzCanvasProperty*>(p); auto* png=c->PngProperty();
                std::cout << "CANVAS path=" << path;
                if(png) std::cout << " size=" << png->Width() << "x" << png->Height();
                std::cout << "\n";
              } else if (t==wz::WzPropertyType::SubProperty) {
                std::cout << "SUB path=" << path << "\n";
              }
            }
            if (auto* kids=p->WzProperties()) for (auto* c:*kids) Dump(c, rel, depth+1);
          }

          static void DumpImage(const char* label, wz::WzImage* image) {
            std::cout << "### " << label << "\n";
            if(!image){ std::cout << "MISSING\n"; return; }
            auto r=image->ParseImage(); if(!r || !r.value()){ std::cout << "UNPARSEABLE\n"; return; }
            for(auto* p:*image->WzProperties()) Dump(p);
          }

          int main(int argc,char** argv){
            if(argc!=3) return 2;
            wz::WzFile map(argv[1],83,wz::WzMapleVersion::GMS), ui(argv[2],83,wz::WzMapleVersion::GMS);
            if(map.ParseWzFile()!=wz::WzFileParseStatus::Success || ui.ParseWzFile()!=wz::WzFileParseStatus::Success) return 3;
            auto* mr=map.GetWzDirectory(); auto* back=mr->GetDirectoryByName("back"); if(!back) back=mr->GetDirectoryByName("Back"); auto* obj=mr->GetDirectoryByName("obj"); if(!obj) obj=mr->GetDirectoryByName("Obj");
            auto* bi=back?back->GetImageByName("login.img"):nullptr; if(!bi&&back)bi=back->GetImageByName("Login.img");
            auto* oi=obj?obj->GetImageByName("login.img"):nullptr; if(!oi&&obj)oi=obj->GetImageByName("Login.img");
            auto* ur=ui.GetWzDirectory(); auto* li=ur->GetImageByName("login.img"); if(!li)li=ur->GetImageByName("Login.img");
            DumpImage("Map/back/login.img",bi); DumpImage("Map/obj/login.img",oi); DumpImage("UI/login.img",li); return 0;
          }
          CPP
          cat > "$RUNNER_TEMP/inspect/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(login_property_inspector LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 23)
          add_subdirectory("$ENV{RUNNER_TEMP}/libwz" "$ENV{RUNNER_TEMP}/inspect-build/libwz" EXCLUDE_FROM_ALL)
          add_executable(login-property-inspector main.cpp)
          target_link_libraries(login-property-inspector PRIVATE wz)
          CMAKE
          cmake -S "$RUNNER_TEMP/inspect" -B "$RUNNER_TEMP/inspect-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/inspect-build" -j2

      - name: Dump live login properties
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inspect-build/login-property-inspector" "$RUNNER_TEMP/Map.wz" "$RUNNER_TEMP/UI.wz"
          echo LOGIN_PROPERTY_AUDIT_OK
