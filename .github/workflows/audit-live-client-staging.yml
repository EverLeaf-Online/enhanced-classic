name: Audit live client staging

on:
  push:
    branches: [release-dev]
    paths:
      - ".github/workflows/audit-live-client-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          mkdir -p "$SSH_DIR" && chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_everleaf"
          chmod 600 "$SSH_DIR/id_everleaf"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$SSH_DIR/known_hosts"
          fi
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Inspect current live login hooks and redirect sources
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf")
          ssh "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          SRC=/home/ubuntu/everleaf-staging/native-client-source/client/ezorsia/ezorsia

          echo '=== LIVE MANIFEST ==='
          python3 - <<'PY'
          import json
          m=json.load(open('/opt/everleaf/patches/manifest.json'))
          print('version',m.get('version'))
          for name in ('Map.wz','UI.wz','dinput8.dll','EverLeaf.exe','config.ini'):
              f=next((x for x in m.get('files',[]) if x.get('path')==name),None)
              print(name, f and f.get('sha256'), f and f.get('size'))
          PY

          for f in EverLeafLoginLayout.cpp EverLeafLoginLayout.h EverLeafWebLinks.cpp EverLeafWebLinks.h dllmain.cpp MainMain.cpp Client.cpp Client.h config.ini; do
            if [ -f "$SRC/$f" ]; then
              echo "=== FILE $f ==="
              case "$f" in
                Client.cpp|Client.h|dllmain.cpp|MainMain.cpp)
                  grep -nE -C 8 'UpdateLogin|EverLeafLogin|WebLinks|Install|dwLogin|PositionLogin|ModernLogin|CustomLoginFrame|bigLoginFrame|m_nGameWidth|m_nGameHeight' "$SRC/$f" 2>/dev/null | sed -n '1,420p' || true
                  ;;
                *) sed -n '1,420p' "$SRC/$f" ;;
              esac
            fi
          done

          echo '=== EXACT LOGIN SYMBOL REFERENCES ==='
          grep -RInE 'dwLogin(CreateDlg|Username|Password|LoginBtn|FindPasswordBtn|QuitBtn|FindIDBtn|WebHomeBtn|WebRegisterBtn)|PositionLogin(Dlg|Username|Password)|UpdateLogin\(|EverLeafLoginLayout|EverLeafWebLinks|ShellExecute|BaseURL|/register|/help|FindPassword|FindID' "$SRC" 2>/dev/null | sed -n '1,500p' || true

          echo '=== LIVE DLL URL / ROUTE STRINGS ==='
          strings -a /opt/everleaf/patches/files/dinput8.dll 2>/dev/null | grep -Ei 'https?://|everleafms|passport\.nexon|nexon\.com|register|forgot|help|homepage' | sed -n '1,240p' || true

          echo '=== LIVE EXE URL / ROUTE STRINGS ==='
          strings -a /opt/everleaf/patches/files/EverLeaf.exe 2>/dev/null | grep -Ei 'https?://|passport\.nexon|nexon\.com/maplestory|registration|forgot' | sed -n '1,240p' || true

          echo '=== STAGING WZ CANDIDATE HASHES ==='
          for f in /home/ubuntu/everleaf-staging/Map.wz.polished-v2 /home/ubuntu/everleaf-staging/Map.wz.polished-v2-base /home/ubuntu/everleaf-staging/UI.wz.polished-v2 /home/ubuntu/everleaf-staging/Map.wz.polished /home/ubuntu/everleaf-staging/UI.wz.polished; do
            [ -f "$f" ] && sha256sum "$f"
          done
          REMOTE
