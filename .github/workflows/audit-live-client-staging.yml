name: Audit live client staging

on:
  push:
    branches: [release-dev]
    paths:
      - ".github/workflows/audit-live-client-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          mkdir -p "$SSH_DIR" && chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_everleaf"
          chmod 600 "$SSH_DIR/id_everleaf"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$SSH_DIR/known_hosts"; fi
          chmod 600 "$SSH_DIR/known_hosts"

      - name: Inspect active login instructions and patch history
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf")
          ssh "${OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -eu
          STAGE=/home/ubuntu/everleaf-staging
          SRC="$STAGE/native-client-source/client/ezorsia/ezorsia"

          echo '=== NATIVE LOGIN CODE DIRECTORY ==='
          find "$STAGE/native-login-code" -maxdepth 2 -type f -printf '%s %p\n' 2>/dev/null | sort || true

          echo '=== ACTIVE 0x620xxx DISASSEMBLY ==='
          BIN="$STAGE/native-login-code/login-dialog-code.bin"
          if [ ! -f "$BIN" ]; then BIN="$STAGE/native-login-code/login-dialog.bin"; fi
          if [ -f "$BIN" ]; then
            echo "using $BIN size=$(stat -c %s "$BIN")"
            objdump -D -b binary -mi386 --adjust-vma=0x620000 "$BIN" > /tmp/login-dialog.dis || true
            for a in 0x006203E8 0x00620644 0x006206BE 0x00620735 0x006207AF 0x00620829 0x006208A0 0x00620917 0x006209A6 0x00620A0D; do
              echo "--- around $a ---"
              python3 - "$BIN" "$a" <<'PY'
          import sys
          p=sys.argv[1]; a=int(sys.argv[2],0); base=0x620000
          b=open(p,'rb').read(); off=a-base; lo=max(0,off-32); hi=min(len(b),off+96)
          print('offset',hex(off),'bytes',b[lo:hi].hex(' '))
          PY
              target=$(printf '%x' $((a)))
              awk -v target="$target" '
                BEGIN { t=strtonum("0x" target); lo=t-48; hi=t+112 }
                /^[[:space:]]*[0-9a-f]+:/ { x=$1; gsub(":","",x); n=strtonum("0x" x); if(n>=lo && n<=hi) print }
              ' /tmp/login-dialog.dis || true
            done
          else
            echo 'NO login-dialog-code binary in staging'
          fi

          echo '=== ACTIVE LOGIN SOURCE ==='
          sed -n '225,260p' "$SRC/AddyLocations.h"
          sed -n '50,90p' "$SRC/codecaves.h"
          sed -n '638,675p' "$SRC/Client.cpp"

          echo '=== ORIGIN / 616 / 640 REFERENCES ==='
          grep -RInE 'origin|616|640|background-master-1280x3240|background-master-1280x2160|3240|2160' "$STAGE" \
            --include='*.cpp' --include='*.h' --include='*.py' --include='*.sh' --include='*.ps1' --include='*.md' --include='*.txt' 2>/dev/null | sed -n '1,400p' || true

          echo '=== RECENT MAP BACKUP SIZES/HASHES ==='
          for d in /opt/everleaf/backups/remove-popup-20260905T200324Z /opt/everleaf/backups/client-links-20260905T193850Z /opt/everleaf/backups/client-class-selector-20260905T181730Z /opt/everleaf/backups/client-login-polish-20260905T170000Z /opt/everleaf/backups/client-connected-panorama-20260905T161500Z; do
            [ -f "$d/Map.wz" ] && { echo "$d"; sha256sum "$d/Map.wz"; stat -c '%s %y' "$d/Map.wz"; }
          done
          REMOTE
