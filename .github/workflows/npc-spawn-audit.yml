name: NPC Spawn Audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'wz/Map.wz/**'
      - 'wz/Npc.wz/**'
      - 'scripts/audit_npc_spawns.py'
      - '.github/workflows/npc-spawn-audit.yml'
  pull_request:
    paths:
      - 'wz/Map.wz/**'
      - 'wz/Npc.wz/**'
      - 'scripts/audit_npc_spawns.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit all NPC spawns
        run: |
          set +e
          python3 scripts/audit_npc_spawns.py
          audit_status=$?
          python3 scripts/audit_npc_spawns.py --json > npc-spawn-audit.json
          json_status=$?
          set -e
          if [ "$audit_status" -ne 0 ] || [ "$json_status" -ne 0 ]; then
            exit 1
          fi
      - name: Summarize audit report
        if: always()
        run: |
          test -s npc-spawn-audit.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('npc-spawn-audit.json'))
          print('### NPC spawn audit')
          for key in ('mapsScanned', 'mapsWithNpcs', 'npcSpawns', 'errors', 'warnings', 'reviewedExceptions'):
              print(f'- {key}: {report.get(key)}')
          PY
