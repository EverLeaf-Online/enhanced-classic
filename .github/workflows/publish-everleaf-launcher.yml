name: Publish EverLeaf Launcher

on:
  workflow_dispatch:
  push:
    branches: [client-dev]
    paths:
      - 'launcher/**'
      - 'client/managed-client-baseline.json'
      - 'web/scripts/build-patch-manifest.js'
      - '.github/workflows/publish-everleaf-launcher.yml'

concurrency:
  group: everleaf-launcher-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_PUBLIC_BASE: https://everleafms.duckdns.org

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish launcher
        shell: pwsh
        run: |
          dotnet restore launcher/EverLeaf.Launcher/EverLeaf.Launcher.csproj
          dotnet publish launcher/EverLeaf.Launcher/EverLeaf.Launcher.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            --output launcher-publish
          if (-not (Test-Path 'launcher-publish/EverLeafLauncher.exe')) { throw 'Launcher executable missing' }

      - name: Verify launcher manifest and repair tests
        shell: pwsh
        run: dotnet test launcher/EverLeaf.Launcher.Tests/EverLeaf.Launcher.Tests.csproj --configuration Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'launcher\installer\EverLeafLauncher.iss'
          if (-not (Test-Path 'launcher-installer\EverLeafLauncherSetup.exe')) { throw 'Installer executable missing' }
          Get-FileHash 'launcher-installer\EverLeafLauncherSetup.exe' -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: EverLeafLauncherProduction
          path: launcher-installer/EverLeafLauncherSetup.exe
          retention-days: 30
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: EverLeafLauncherProduction
          path: release

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH access
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'echo EverLeaf SSH OK'

      - name: Provision manifest signing key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" <<'REMOTE' > server-public-key-output.txt
            set -euo pipefail
            sudo install -d -o root -g ubuntu -m 750 /etc/everleaf
            if ! sudo test -s /etc/everleaf/launcher-manifest-private.pem; then
              sudo openssl genpkey -algorithm RSA \
                -pkeyopt rsa_keygen_bits:3072 \
                -out /etc/everleaf/launcher-manifest-private.pem
            fi
            sudo chmod 640 /etc/everleaf/launcher-manifest-private.pem
            sudo chown root:ubuntu /etc/everleaf/launcher-manifest-private.pem
            sudo openssl pkey \
              -in /etc/everleaf/launcher-manifest-private.pem \
              -pubout
          REMOTE
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('server-public-key-output.txt').read_text()
          match = re.search(r'-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----', text, re.S)
          if not match:
              raise SystemExit('Production launcher public key was not returned by Oracle')
          pem = '\n'.join(line.strip() for line in match.group(0).splitlines()) + '\n'
          Path('server-public-key.pem').write_text(pem)
          print('Production launcher signing public key:')
          print(pem, end='')
          PY

      - name: Verify launcher trusts production signing key
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def extract_pem(text):
              match = re.search(r'-----BEGIN PUBLIC KEY-----.*?-----END PUBLIC KEY-----', text, re.S)
              if not match:
                  raise SystemExit('Public key PEM block not found')
              return '\n'.join(line.strip() for line in match.group(0).splitlines())

          embedded = extract_pem(Path('launcher/EverLeaf.Launcher/LauncherServices.cs').read_text())
          server = extract_pem(Path('server-public-key.pem').read_text())
          if embedded != server:
              print('Production signing key does not match the launcher yet.')
              raise SystemExit(2)
          print('Launcher signing key matches production.')
          PY

      - name: Publish installer
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" <<'REMOTE'
            set -euo pipefail
            sudo install -d -o ubuntu -g ubuntu -m 755 /opt/everleaf/patches
            sudo install -d -o ubuntu -g ubuntu -m 755 /opt/everleaf/patches/downloads /opt/everleaf/patches/files
            sudo chown ubuntu:ubuntu /opt/everleaf/patches
            sudo chown -R ubuntu:ubuntu /opt/everleaf/patches/downloads /opt/everleaf/patches/files
            sudo rm -f /opt/everleaf/patches/manifest.json.new
            if sudo test -f /opt/everleaf/patches/manifest.json; then
              sudo chown ubuntu:ubuntu /opt/everleaf/patches/manifest.json
              sudo chmod 644 /opt/everleaf/patches/manifest.json
            fi
          REMOTE
          scp -i ~/.ssh/id_everleaf release/EverLeafLauncherSetup.exe \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/downloads/EverLeafLauncherSetup.exe.new"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" <<'REMOTE'
            set -euo pipefail
            mv /opt/everleaf/patches/downloads/EverLeafLauncherSetup.exe.new \
               /opt/everleaf/patches/downloads/EverLeafLauncherSetup.exe
            chmod 644 /opt/everleaf/patches/downloads/EverLeafLauncherSetup.exe
            cd /opt/everleaf/web
            npm run build-patch-manifest
            python3 - <<'PY'
            import json
            manifest=json.load(open('/opt/everleaf/patches/manifest.json'))
            baseline=json.load(open('/opt/everleaf/patches/managed-client-baseline.json'))
            files=manifest.get('files')
            assert isinstance(files,list) and files, 'Patch manifest is empty'
            expected={f['path'].lower() for f in baseline['managedFiles']}
            actual={f['path'].lower() for f in files}
            assert actual == expected, f'Manifest/baseline mismatch: {actual} != {expected}'
            print(f"PATCH_AUDIT version={manifest['version']} managed={len(files)}")
            for critical in baseline.get('criticalCompatibility',[]):
                hosted=critical['path'].lower() in actual
                assert not hosted or critical.get('redistributable') is True, f"Unauthorized critical file published: {critical['path']}"
                print(f"COMPATIBILITY_GATE {critical['path']} size={critical['size']} sha256={critical['sha256']} hosted={hosted}")
            PY
            sudo systemctl restart everleaf-web
            sleep 2
            curl -fsS http://127.0.0.1:3000/v1/launcher/status >/dev/null
            curl -fsS http://127.0.0.1:3000/v1/launcher/manifest >/dev/null
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/launcher/download)" = '200'
            echo 'EverLeaf launcher published successfully.'
          REMOTE

      - name: Verify public HTTPS launcher endpoints and payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$EVERLEAF_PUBLIC_BASE/v1/launcher/status" >/tmp/status.json
          curl --fail --silent --show-error --location --max-time 20 "$EVERLEAF_PUBLIC_BASE/v1/launcher/manifest" >/tmp/manifest.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$EVERLEAF_PUBLIC_BASE/launcher/download")" = '200'
          python3 - <<'PY'
          import base64, json, pathlib
          status=json.load(open('/tmp/status.json'))
          envelope=json.load(open('/tmp/manifest.json'))
          assert isinstance(status.get('online'), bool)
          assert status.get('version')
          assert envelope.get('payload') and envelope.get('signature')
          payload=json.loads(base64.b64decode(envelope['payload']).decode('utf-8'))
          pathlib.Path('/tmp/manifest-payload.json').write_bytes(base64.b64decode(envelope['payload']))
          pathlib.Path('/tmp/manifest-signature.bin').write_bytes(base64.b64decode(envelope['signature']))
          files=payload.get('files')
          assert isinstance(files, list) and files
          baseline=json.load(open('client/managed-client-baseline.json'))
          expected={f['path'].lower() for f in baseline['managedFiles']}
          paths={str(f.get('path','')).lower() for f in files}
          assert paths == expected, f'Public manifest does not exactly match managed baseline: {paths} != {expected}'
          print(f"Public signed patch manifest verified with {len(files)} files.")
          PY
          openssl dgst -sha256 -verify server-public-key.pem \
            -signature /tmp/manifest-signature.bin \
            -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:-1 \
            /tmp/manifest-payload.json
          python3 - <<'PY' > /tmp/managed-urls.txt
          import base64,json
          e=json.load(open('/tmp/manifest.json'))
          for f in json.loads(base64.b64decode(e['payload']))['files']:
              print(f['url'])
          PY
          while IFS= read -r patch_url; do
            case "$patch_url" in /patches/*) ;; *) echo "Unsafe public patch URL: $patch_url" >&2; exit 1;; esac
            curl --fail --silent --show-error --location --max-time 30 --range 0-0 \
              "$EVERLEAF_PUBLIC_BASE$patch_url" >/dev/null
          done < /tmp/managed-urls.txt
          echo 'Public HTTPS launcher endpoints and patch payload verified.'
