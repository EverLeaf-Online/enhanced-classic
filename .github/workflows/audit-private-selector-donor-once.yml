name: Locate preserved selector donor once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths: ['.github/workflows/audit-private-selector-donor-once.yml']

permissions:
  contents: write

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
      - name: Inspect exact v95 selector sources
        run: |
          set -euo pipefail
          mkdir -p docs
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' > docs/CLIENT_SELECTOR_DONOR_INVENTORY.md <<'REMOTE'
          set -u
          ROOT=/opt/everleaf/private/wz-donors
          echo '# Selector donor inventory'
          echo
          echo '## Preserved raw v95 files'
          find "$ROOT/gms-v95-raw" -maxdepth 3 -type f -printf '%p | %s bytes\n' 2>/dev/null | sort | head -n 250 || true
          echo
          echo '## Selector/UI entries inside preserved archives'
          for z in "$ROOT"/gms-v95-core7.zip "$ROOT"/gms-v95-extracted.zip "$ROOT"/gms-v95-string.zip "$ROOT"/community-repack-core.zip; do
            [ -s "$z" ] || continue
            echo "### $z"
            unzip -Z1 "$z" 2>/dev/null | grep -Ei '(^|/)(UI\.wz|Login\.img)(/|\.|$)|RaceSelect|NewCharEvan|NewCharDual|NewCharResistance' | head -n 160 || true
          done
          echo
          echo '## Raw WZ family presence'
          for n in UI.wz Etc.wz String.wz Skill.wz Character.wz; do
            p="$ROOT/gms-v95-raw/$n"
            if [ -f "$p" ]; then stat -c '%n | %s bytes' "$p"; else echo "MISSING $p"; fi
          done
          REMOTE
          cat docs/CLIENT_SELECTOR_DONOR_INVENTORY.md
      - name: Commit inventory
        run: |
          set -euo pipefail
          git config user.name everleaf-client-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add docs/CLIENT_SELECTOR_DONOR_INVENTORY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: inspect exact v95 selector donor sources'
          git push origin HEAD:feature/client-job-selector-modernization-20260904
