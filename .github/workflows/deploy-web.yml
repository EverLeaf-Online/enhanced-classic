name: Deploy EverLeaf Web

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: everleaf-web-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts || true

      - name: Verify SSH access
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'echo EverLeaf SSH OK'

      - name: Backup production state
        run: |
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'if [ -x /opt/everleaf/web/scripts/backup-production.sh ]; then sudo /opt/everleaf/web/scripts/backup-production.sh; fi'

      - name: Sync web source
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='node_modules/' \
            -e 'ssh -i ~/.ssh/id_everleaf' \
            web/ "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/web/"

      - name: Install and restart
        run: |
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/everleaf/web
            if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
            npm run init-db
            sudo systemctl restart everleaf-web
            sleep 2
            systemctl is-active --quiet everleaf-web
            curl -fsS http://127.0.0.1:3000/ >/dev/null
            echo 'EverLeaf web deployment healthy.'
          REMOTE
