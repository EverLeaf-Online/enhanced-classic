name: Deploy EverLeaf Web

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: everleaf-web-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_TLS_HOST: everleafms.online
  EVERLEAF_WWW_HOST: www.everleafms.online
  EVERLEAF_LEGACY_TLS_HOST: everleafms.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            rm -f ~/.ssh/known_hosts ~/.ssh/known_hosts.tmp
            for attempt in 1 2 3 4 5 6; do
              echo "Discovering SSH host key (attempt $attempt/6)..."
              if ssh-keyscan -T 15 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts.tmp 2>/dev/null && [ -s ~/.ssh/known_hosts.tmp ]; then
                mv ~/.ssh/known_hosts.tmp ~/.ssh/known_hosts
                break
              fi
              rm -f ~/.ssh/known_hosts.tmp
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
            done
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "Unable to discover SSH host key for $EVERLEAF_DEPLOY_HOST after 6 attempts." >&2
              exit 1
            fi
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host $EVERLEAF_DEPLOY_HOST
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config
          ssh-keygen -lf ~/.ssh/known_hosts || true

      - name: Verify SSH access
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'echo EverLeaf SSH OK'

      - name: Backup production state
        run: |
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'if [ -f /opt/everleaf/web/scripts/backup-production.sh ]; then sudo bash /opt/everleaf/web/scripts/backup-production.sh; fi'

      - name: Sync web source
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='data/' \
            --exclude='node_modules/' \
            -e 'ssh -i ~/.ssh/id_everleaf' \
            web/ "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/web/"

      - name: Install, migrate domain, configure HTTPS, and restart
        run: |
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "EVERLEAF_TLS_HOST='$EVERLEAF_TLS_HOST' EVERLEAF_WWW_HOST='$EVERLEAF_WWW_HOST' EVERLEAF_LEGACY_TLS_HOST='$EVERLEAF_LEGACY_TLS_HOST' bash -s" <<'REMOTE'
            set -euo pipefail
            cd /opt/everleaf/web

            set_env_var() {
              local key="$1"
              local value="$2"
              touch .env
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            set_env_var BASE_URL "https://$EVERLEAF_TLS_HOST"
            set_env_var PUBLIC_BASE_URL "https://$EVERLEAF_TLS_HOST"
            set_env_var DISCORD_URL "https://discord.gg/w9ED8vtxa7"
            set_env_var DISCORD_REDIRECT_URI "https://$EVERLEAF_TLS_HOST/account/discord/callback"
            set_env_var TRUST_PROXY "1"
            set_env_var COOKIE_SECURE "true"
            set_env_var CHANNEL_PORTS "7575,7576,7577,7578,7579,7580,7581,7582,7583,7584,7585,7586,7587,7588,7589,7590,7591,7592,7593,7594"
            set_env_var CHARACTER_WZ_RENDERER_URL "http://127.0.0.1:3011"
            set_env_var MAPLESTORY_IO_BASE_URL ""
            set_env_var MAPLESTORY_IO_VERSION "83"

            if [ -f package-lock.json ]; then npm ci --omit=dev; else npm install --omit=dev; fi
            npm run init-db

            WEB_DB_ACCOUNT_COUNT=0
            while IFS=$'\t' read -r db_user db_host; do
              [ -n "$db_user" ] || continue
              escaped_user="${db_user//\'/\'\'}"
              escaped_host="${db_host//\'/\'\'}"
              sudo mysql -e "GRANT SELECT ON \`cosmic\`.\`inventoryitems\` TO '${escaped_user}'@'${escaped_host}';"
              WEB_DB_ACCOUNT_COUNT=$((WEB_DB_ACCOUNT_COUNT + 1))
            done < <(sudo mysql -NBe "SELECT User,Host FROM mysql.user WHERE User='everleaf_web' ORDER BY Host;")
            if [ "$WEB_DB_ACCOUNT_COUNT" -lt 1 ]; then
              echo 'No existing everleaf_web MySQL account was found; refusing to deploy rankings without equipment access.' >&2
              exit 1
            fi
            sudo mysql -e 'FLUSH PRIVILEGES;'

            sudo apt-get update -y
            sudo apt-get install -y nginx certbot python3-certbot-nginx python3-venv git
            bash /opt/everleaf/web/scripts/install-wz-avatar-renderer.sh

            sudo install -m 644 /opt/everleaf/web/ops/nginx-everleaf.conf /etc/nginx/conf.d/everleaf.conf
            sudo install -m 644 /opt/everleaf/web/ops/everleaf-backup.service /etc/systemd/system/everleaf-backup.service
            sudo install -m 644 /opt/everleaf/web/ops/everleaf-backup.timer /etc/systemd/system/everleaf-backup.timer
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl daemon-reload
            sudo systemctl enable --now everleaf-backup.timer
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 80/tcp >/dev/null || true
              sudo ufw allow 443/tcp >/dev/null || true
            fi

            sudo certbot --nginx \
              -d "$EVERLEAF_TLS_HOST" \
              -d "$EVERLEAF_WWW_HOST" \
              -d "$EVERLEAF_LEGACY_TLS_HOST" \
              --expand \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect \
              --keep-until-expiring

            sudo systemctl restart everleaf-web
            sudo nginx -t
            sudo systemctl reload nginx
            sleep 2
            systemctl is-active --quiet everleaf-web
            systemctl is-active --quiet everleaf-wz-avatar
            systemctl is-active --quiet nginx
            curl -fsS http://127.0.0.1:3000/ >/dev/null
            curl -fsS --resolve "$EVERLEAF_TLS_HOST:443:127.0.0.1" "https://$EVERLEAF_TLS_HOST/v1/launcher/status" >/dev/null
            curl -fsS --resolve "$EVERLEAF_WWW_HOST:443:127.0.0.1" "https://$EVERLEAF_WWW_HOST/v1/launcher/status" >/dev/null
            curl -fsS --resolve "$EVERLEAF_LEGACY_TLS_HOST:443:127.0.0.1" "https://$EVERLEAF_LEGACY_TLS_HOST/v1/launcher/status" >/dev/null
            STATUS_JSON="$(curl -fsS http://127.0.0.1:3000/api/status)"
            node -e 'const s=JSON.parse(process.argv[1]); if(s.totalChannels!==20) process.exit(1);' "$STATUS_JSON"

            RANKINGS_HTML="$(curl -fsS http://127.0.0.1:3000/rankings)"
            AVATAR_PATH="$(grep -oE 'data-live-avatar="/character-avatar/[0-9]+\.png\?job=[0-9]+"' <<<"$RANKINGS_HTML" | head -n1 | cut -d'"' -f2)"
            test -n "$AVATAR_PATH"
            AVATAR_HEADERS="$(mktemp)"
            AVATAR_IMAGE="$(mktemp)"
            curl -fsS --max-time 30 -D "$AVATAR_HEADERS" -o "$AVATAR_IMAGE" "http://127.0.0.1:3000$AVATAR_PATH"
            grep -Eqi '^content-type:[[:space:]]*image/' "$AVATAR_HEADERS"
            grep -Eqi '^x-everleaf-avatar-source:[[:space:]]*local-wz(-cache)?[[:space:]]*$' "$AVATAR_HEADERS"
            grep -Eqi '^x-everleaf-avatar-mode:[[:space:]]*full[[:space:]]*$' "$AVATAR_HEADERS"
            grep -Eqi '^x-everleaf-avatar-equipment-count:[[:space:]]*[1-9][0-9]*[[:space:]]*$' "$AVATAR_HEADERS"
            python3 -c 'import pathlib,sys; d=pathlib.Path(sys.argv[1]).read_bytes(); raise SystemExit(0 if len(d)>=100 and d[:8]==b"\x89PNG\r\n\x1a\n" else 1)' "$AVATAR_IMAGE"
            rm -f "$AVATAR_HEADERS" "$AVATAR_IMAGE"

            sudo test -s /etc/everleaf/discord-bot.env
            sudo node scripts/sync-discord-status.js /etc/everleaf/discord-bot.env http://127.0.0.1:3000/api/status
            sudo bash /opt/everleaf/web/scripts/backup-production.sh
            sudo systemctl is-enabled --quiet everleaf-backup.timer
            sudo systemctl is-active --quiet everleaf-backup.timer
            echo 'EverLeaf web deployment, equipped local WZ avatars, and domain health checks passed.'
          REMOTE

      - name: Verify public HTTPS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "https://$EVERLEAF_TLS_HOST/" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "https://$EVERLEAF_TLS_HOST/v1/launcher/status" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "https://$EVERLEAF_WWW_HOST/" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "https://$EVERLEAF_LEGACY_TLS_HOST/" >/dev/null
          STATUS_JSON="$(curl --fail --silent --show-error --max-time 20 "https://$EVERLEAF_TLS_HOST/api/status")"
          node -e 'const s=JSON.parse(process.argv[1]); if(s.totalChannels!==20) process.exit(1);' "$STATUS_JSON"
          test "$(curl --silent --output /dev/null --write-out '%{redirect_url}' --max-time 20 http://132.145.141.79/)" = "https://$EVERLEAF_TLS_HOST/"
          echo 'EverLeaf public HTTPS is reachable and reports 20 channels; legacy hostname remains compatible.'
