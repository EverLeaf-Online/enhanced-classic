name: Analyze v83 attack-move client paths

on:
  push:
    paths:
      - ".github/workflows/analyze-attack-move.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified legacy client
        uses: actions/checkout@v5
        with:
          ref: 335d4fbb74e713a01f63163c39c941865401d24a
          sparse-checkout: Localhosts.zip
          sparse-checkout-cone-mode: false

      - name: Verify source archive
        shell: bash
        run: |
          echo "096e21e155ca1a06a3132a6ad6f7feda5cd986928f415bab15a3b67fee412527  Localhosts.zip" | sha256sum --check

      - name: Disassemble attack routines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source analysis
          unzip -q Localhosts.zip -d source
          exe="source/Localhost.exe"
          sha256sum "$exe" > analysis/source-sha256.txt
          objdump -x "$exe" > analysis/pe-headers.txt
          objdump -D -Mintel --start-address=0x950800 --stop-address=0x953780 "$exe" > analysis/melee-region.txt || true
          objdump -D -Mintel --start-address=0x953700 --stop-address=0x955720 "$exe" > analysis/ranged-region.txt || true
          objdump -D -Mintel --start-address=0x955700 --stop-address=0x957200 "$exe" > analysis/magic-and-following-region.txt || true
          objdump -D -Mintel --start-address=0x950000 --stop-address=0x960000 "$exe" > analysis/local-user-attacks.txt || true

      - name: Print high-value movement candidates
        shell: bash
        run: |
          set -euo pipefail
          exe="source/Localhost.exe"
          echo '===== CALL-SITE CONTEXT: PRE/POST ATTACK FINALIZATION ====='
          for spec in \
            'melee_tail 0x951340 0x9513c0' \
            'ranged_tail 0x9541b0 0x954250' \
            'magic_tail 0x955a60 0x955b10' \
            'common_95369a 0x953650 0x953730'; do
            set -- $spec
            echo "===== $1 ====="
            objdump -D -Mintel --start-address="$2" --stop-address="$3" "$exe" || true
          done

          echo '===== CALL-SITE CONTEXT: SHARED ATTACK STATE HELPERS ====='
          for spec in \
            'melee_mid 0x9510c0 0x951210' \
            'ranged_mid 0x9540c0 0x9541b0' \
            'magic_mid 0x955980 0x955a80' \
            'helper_760f23 0x760ee0 0x760f90' \
            'helper_766157 0x766100 0x7661d0' \
            'helper_4144d4 0x414480 0x414530' \
            'helper_460aa0 0x460a40 0x460b20' \
            'helper_987257 0x987200 0x9872d0'; do
            set -- $spec
            echo "===== $1 ====="
            objdump -D -Mintel --start-address="$2" --stop-address="$3" "$exe" || true
          done

      - name: Find likely LocalUser field writes near attacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=Path('analysis/local-user-attacks.txt').read_text(errors='replace').splitlines()
          ranges=[('melee',0x950921,0x9513b0),('ranged',0x9537d5,0x954237),('magic',0x95571f,0x955af0)]
          # Heuristic: writes through esi/edi/ebx plus immediate offsets are the best
          # candidates for changing local user/action/controller state.
          rx_addr=re.compile(r'^\s*([0-9a-fA-F]+):')
          rx_write=re.compile(r'\bmov\s+(?:BYTE PTR |WORD PTR |DWORD PTR )?\[(?:esi|edi|ebx|ecx)(?:\+0x[0-9a-f]+)?\],')
          for name,lo,hi in ranges:
              print(f'===== {name} object-field writes =====')
              for i,line in enumerate(lines):
                  m=rx_addr.match(line)
                  if not m: continue
                  a=int(m.group(1),16)
                  if lo <= a < hi and rx_write.search(line):
                      print(line.strip())
          PY

      - name: Upload attack-move analysis
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-v83-attack-move-analysis
          path: analysis/
          retention-days: 7
          if-no-files-found: error
