name: Analyze v83 attack-move client paths

on:
  push:
    paths:
      - ".github/workflows/analyze-attack-move.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified legacy client
        uses: actions/checkout@v5
        with:
          ref: 335d4fbb74e713a01f63163c39c941865401d24a
          sparse-checkout: Localhosts.zip
          sparse-checkout-cone-mode: false

      - name: Verify source archive
        shell: bash
        run: |
          echo "096e21e155ca1a06a3132a6ad6f7feda5cd986928f415bab15a3b67fee412527  Localhosts.zip" | sha256sum --check

      - name: Disassemble attack routines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source analysis
          unzip -q Localhosts.zip -d source
          exe="source/Localhost.exe"
          sha256sum "$exe" > analysis/source-sha256.txt
          objdump -x "$exe" > analysis/pe-headers.txt

          # Confirmed v83 attack entry points and the surrounding local-user code.
          objdump -D -Mintel --start-address=0x950800 --stop-address=0x953780 "$exe" > analysis/melee-region.txt || true
          objdump -D -Mintel --start-address=0x953700 --stop-address=0x955720 "$exe" > analysis/ranged-region.txt || true
          objdump -D -Mintel --start-address=0x955700 --stop-address=0x957200 "$exe" > analysis/magic-and-following-region.txt || true
          objdump -D -Mintel --start-address=0x950000 --stop-address=0x960000 "$exe" > analysis/local-user-attacks.txt || true

          # Shared CUserLocal helpers invoked by the attack paths. These are the
          # highest-value candidates for action/movement state transitions.
          objdump -D -Mintel --start-address=0x92e000 --stop-address=0x937000 "$exe" > analysis/user-helpers-92e-937.txt || true
          objdump -D -Mintel --start-address=0x95f000 --stop-address=0x961400 "$exe" > analysis/user-helpers-95f-961.txt || true
          objdump -D -Mintel --start-address=0x450f00 --stop-address=0x452200 "$exe" > analysis/helper-45xx.txt || true
          objdump -D -Mintel --start-address=0x472f00 --stop-address=0x474500 "$exe" > analysis/helper-47xx.txt || true

          grep -nEi "call|jmp|mov|push|test|cmp" analysis/melee-region.txt > analysis/melee-control-flow.txt || true
          grep -nEi "call|jmp|mov|push|test|cmp" analysis/ranged-region.txt > analysis/ranged-control-flow.txt || true
          grep -nEi "call|jmp|mov|push|test|cmp" analysis/magic-and-following-region.txt > analysis/magic-control-flow.txt || true
          grep -nEi "933990|92fb41|936528|960027|953595|451b6a|451cda|movement|vec|ctrl" analysis/local-user-attacks.txt > analysis/shared-candidates.txt || true
          wc -l analysis/*.txt

      - name: Upload attack-move analysis
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-v83-attack-move-analysis
          path: analysis/
          retention-days: 7
          if-no-files-found: error
