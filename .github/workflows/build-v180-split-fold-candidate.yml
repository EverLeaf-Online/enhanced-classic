name: Fold GMS v180 split Map2/Mob2 into v83 candidates

on:
  push:
    branches: [donor/v180-low-friction-stage-20260911]
    paths:
      - '.github/workflows/build-v180-split-fold-candidate.yml'
      - 'tools/wz-donor/v180-static-client-patcher/Program.cs'
  workflow_dispatch:

concurrency:
  group: everleaf-v180-split-fold-stage
  cancel-in-progress: true

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  TARGET_ROOT: /opt/everleaf/patches/files
  DONOR_ROOT: /opt/everleaf/donors/GMS-v180/GMS-v180/MapleStory
  MANIFEST_ROOT: /opt/everleaf/donors/v180-backport
  STAGE_ROOT: /opt/everleaf/donors/v180-backport/split-fold-candidate

jobs:
  fold:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'; New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'),($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}
          else { & 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known }
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 30
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')

      - name: Prepare isolated stage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          set -euo pipefail
          for f in Map.wz Map2.wz Mob.wz Mob2.wz ZLZ.dll; do test -s "__DONOR__/$f"; done
          for f in Map.wz Mob.wz; do test -s "__TARGET__/$f"; done
          for f in maps_all.txt map2_into_map.txt mobs_all.txt mob2_into_mob.txt; do test -s "__MANIFEST__/$f"; done
          sudo rm -rf "__STAGE__"
          sudo mkdir -p "__STAGE__"
          sudo chown -R ubuntu:ubuntu "__STAGE__"
          '@
          $script=$script.Replace('__DONOR__',$env:DONOR_ROOT).Replace('__TARGET__',$env:TARGET_ROOT).Replace('__MANIFEST__',$env:MANIFEST_ROOT).Replace('__STAGE__',$env:STAGE_ROOT)
          $tmp=Join-Path $env:RUNNER_TEMP 'prepare-v180-split.sh'; [IO.File]::WriteAllText($tmp,($script -replace "`r",''))
          scp $tmp 'everleaf-oracle:/tmp/prepare-v180-split.sh'; if($LASTEXITCODE){throw 'prepare upload failed'}
          ssh everleaf-oracle 'bash /tmp/prepare-v180-split.sh'; if($LASTEXITCODE){throw 'prepare failed'}

      - name: Build static patcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $tool=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafV180StaticPatcher'; New-Item -ItemType Directory -Force -Path $tool | Out-Null
          Copy-Item tools/wz-donor/v180-static-client-patcher/Program.cs (Join-Path $tool 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableWindowsTargeting>true</EnableWindowsTargeting></PropertyGroup>
            <ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $tool 'EverLeafV180StaticPatcher.csproj')
          dotnet build (Join-Path $tool 'EverLeafV180StaticPatcher.csproj') -c Release

      - name: Fetch WZ inputs and deduplicate manifests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'split-fold'; $target=Join-Path $root 'target'; $donor=Join-Path $root 'donor'; $m=Join-Path $root 'manifests'
          New-Item -ItemType Directory -Force -Path $target,$donor,$m | Out-Null
          foreach($f in @('Map.wz','Mob.wz')){scp "everleaf-oracle`:$env:TARGET_ROOT/$f" (Join-Path $target $f); if($LASTEXITCODE){throw "target fetch failed: $f"}}
          foreach($f in @('Map.wz','Map2.wz','Mob.wz','Mob2.wz','ZLZ.dll')){scp "everleaf-oracle`:$env:DONOR_ROOT/$f" (Join-Path $donor $f); if($LASTEXITCODE){throw "donor fetch failed: $f"}}
          foreach($f in @('maps_all.txt','map2_into_map.txt','mobs_all.txt','mob2_into_mob.txt')){scp "everleaf-oracle`:$env:MANIFEST_ROOT/$f" (Join-Path $m $f); if($LASTEXITCODE){throw "manifest fetch failed: $f"}}

          # Map2/Mob2 can repeat images already supplied by the main v180 WZ.
          # A sequential fold must add only split-file paths not already added in stage 1.
          $mapMain=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          Get-Content (Join-Path $m 'maps_all.txt') | ForEach-Object { if($_.Trim()){[void]$mapMain.Add($_.Trim())} }
          $map2=@(Get-Content (Join-Path $m 'map2_into_map.txt') | ForEach-Object {$_.Trim()} | Where-Object {$_ -and -not $mapMain.Contains($_)} | Sort-Object -Unique)
          if($map2.Count -eq 0){throw 'Map2 filtered manifest is empty'}
          $map2 | Set-Content -Encoding ascii (Join-Path $m 'map2_into_map.filtered.txt')

          $mobMain=[Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          Get-Content (Join-Path $m 'mobs_all.txt') | ForEach-Object { if($_.Trim()){[void]$mobMain.Add($_.Trim())} }
          $mob2=@(Get-Content (Join-Path $m 'mob2_into_mob.txt') | ForEach-Object {$_.Trim()} | Where-Object {$_ -and -not $mobMain.Contains($_)} | Sort-Object -Unique)
          if($mob2.Count -eq 0){throw 'Mob2 filtered manifest is empty'}
          $mob2 | Set-Content -Encoding ascii (Join-Path $m 'mob2_into_mob.filtered.txt')

          Write-Host "Map2 original=$((Get-Content (Join-Path $m 'map2_into_map.txt')).Count) filtered=$($map2.Count)"
          Write-Host "Mob2 original=$((Get-Content (Join-Path $m 'mob2_into_mob.txt')).Count) filtered=$($mob2.Count)"

      - name: Build standalone Mob2 candidate
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $root=Join-Path $env:RUNNER_TEMP "split-fold"; $p=Join-Path $env:RUNNER_TEMP "MapleLib/EverLeafV180StaticPatcher/EverLeafV180StaticPatcher.csproj"
          $out=Join-Path $root "mob2-final"; New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet run --project $p -c Release --no-build -- (Join-Path $root "target/Mob.wz") (Join-Path $root "donor/Mob2.wz") (Join-Path $root "manifests/mob2_into_mob.filtered.txt") (Join-Path $out "Mob2.wz") (Join-Path $out "Mob2-v180.manifest.json") --empty-target-root
          if($LASTEXITCODE){throw "Mob2.wz standalone conversion failed"}
          $bytes=(Get-Item (Join-Path $out "Mob2.wz")).Length; if($bytes -ge 4294967296){throw "Mob2.wz exceeds the 4 GiB legacy WZ limit"}
          Write-Host "V180_MOB2_STANDALONE_OK bytes=$bytes"

      - name: Fold Map and Map2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'split-fold'; $p=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafV180StaticPatcher/EverLeafV180StaticPatcher.csproj'
          $s1=Join-Path $root 'map-stage1'; $s2=Join-Path $root 'map-final'; New-Item -ItemType Directory -Force -Path $s1,$s2 | Out-Null
          dotnet run --project $p -c Release --no-build -- (Join-Path $root 'target/Map.wz') (Join-Path $root 'donor/Map.wz') (Join-Path $root 'manifests/maps_all.txt') (Join-Path $s1 'Map.wz') (Join-Path $s1 'Map-v180-main.manifest.json')
          if($LASTEXITCODE){throw 'Map.wz main donor fold failed'}
          dotnet run --project $p -c Release --no-build -- (Join-Path $s1 'Map.wz') (Join-Path $root 'donor/Map2.wz') (Join-Path $root 'manifests/map2_into_map.filtered.txt') (Join-Path $s2 'Map.wz') (Join-Path $s2 'Map-v180-split.manifest.json')
          if($LASTEXITCODE){throw 'Map2.wz fold failed'}

      - name: Upload verified final folded candidates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'split-fold'
          $files=@(
            @{Local=(Join-Path $root 'map-final/Map.wz'); Remote='Map.wz'},
            @{Local=(Join-Path $root 'map-stage1/Map-v180-main.manifest.json'); Remote='Map-v180-main.manifest.json'},
            @{Local=(Join-Path $root 'map-final/Map-v180-split.manifest.json'); Remote='Map-v180-split.manifest.json'},
            @{Local=(Join-Path $root 'mob2-final/Mob2.wz'); Remote='Mob2.wz'},
            @{Local=(Join-Path $root 'mob2-final/Mob2-v180.manifest.json'); Remote='Mob2-v180.manifest.json'}
          )
          foreach($x in $files){scp $x.Local "everleaf-oracle`:$env:STAGE_ROOT/$($x.Remote)"; if($LASTEXITCODE){throw "upload failed: $($x.Remote)"}}
          $verify=@'
          set -euo pipefail
          ROOT="__ROOT__"
          test -s "$ROOT/Map.wz"; test -s "$ROOT/Mob2.wz"
          for m in "$ROOT"/*.manifest.json; do grep -q '"productionApplyAllowed": false' "$m"; grep -q '"donorImageDigestsMatch": true' "$m"; done
          sha256sum "$ROOT/Map.wz" "$ROOT/Mob2.wz" > "$ROOT/SHA256SUMS"
          printf 'GMS v180 Map+Map2 folded into a v83-format Map.wz plus standalone v83-format Mob2.wz to stay below the legacy 4 GiB WZ limit. Mob2 requires the staged EverLeaf client fallback loader. No production apply.\n' > "$ROOT/README.txt"
          echo V180_SPLIT_STAGE_OK
          du -sh "$ROOT"
          '@
          $verify=$verify.Replace('__ROOT__',$env:STAGE_ROOT)
          $tmp=Join-Path $env:RUNNER_TEMP 'verify-split-fold.sh'; [IO.File]::WriteAllText($tmp,($verify -replace "`r",''))
          scp $tmp 'everleaf-oracle:/tmp/verify-split-fold.sh'; if($LASTEXITCODE){throw 'verify upload failed'}
          ssh everleaf-oracle 'bash /tmp/verify-split-fold.sh'; if($LASTEXITCODE){throw 'split-fold verification failed'}
