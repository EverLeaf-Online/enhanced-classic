name: Verify GMS v95 Ninja Castle staging contract

on:
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/verify-gms-v95-ninja-staging-contract.yml'
      - 'tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json'
      - 'tools/wz-donor/clusters/gms-v95-ninja-castle-review.json'
      - 'tools/wz-donor/profile_region_cluster.py'
      - 'tools/wz-donor/extract_region_quest_evidence.py'
      - 'tools/wz-donor/verify_region_staging_contract.py'
      - 'scripts/portal/ninja_Boss.js'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Fetch pinned private donor archives
        run: |
          set -euo pipefail
          remote=/opt/everleaf/private/wz-donors
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/gms-v95-core7.zip" "$RUNNER_TEMP/gms-v95-core7.zip"
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/gms-v95-string.zip" "$RUNNER_TEMP/gms-v95-string.zip"
          test "$(sha256sum "$RUNNER_TEMP/gms-v95-core7.zip" | awk '{print $1}')" = '62e106f8437ce04443c797c0514e14d430fcc0a10ae4131f16567f540a8d5d3c'
          test "$(sha256sum "$RUNNER_TEMP/gms-v95-string.zip" | awk '{print $1}')" = 'f00b94fcfad3f95d438b4474b74d550ea68d8aee0a8c3e4c2d9fae548a6fe7ed'
          unzip -t "$RUNNER_TEMP/gms-v95-core7.zip" >/dev/null
          unzip -t "$RUNNER_TEMP/gms-v95-string.zip" >/dev/null
          mkdir -p "$RUNNER_TEMP/core7" "$RUNNER_TEMP/string"
          unzip -q "$RUNNER_TEMP/gms-v95-core7.zip" -d "$RUNNER_TEMP/core7"
          unzip -q "$RUNNER_TEMP/gms-v95-string.zip" -d "$RUNNER_TEMP/string"
          test "$(find "$RUNNER_TEMP/core7" -type f -name '*.xml' | wc -l)" -eq 14527
          test "$(find "$RUNNER_TEMP/string" -type f -name '*.xml' | wc -l)" -eq 20

      - name: Recompute Ninja Castle regional profile
        run: |
          set -euo pipefail
          python tools/wz-donor/profile_region_cluster.py \
            tools/wz-donor/clusters/gms-v95-ninja-castle-review.json \
            --donor "$RUNNER_TEMP/core7" \
            --baseline . \
            --output "$RUNNER_TEMP/ninja-region-profile.json"

      - name: Recompute expanded quest and NPC closure
        run: |
          set -euo pipefail
          python tools/wz-donor/extract_region_quest_evidence.py \
            --quest-root "$RUNNER_TEMP/core7/Quest.wz" \
            --string-root "$RUNNER_TEMP/string/String.wz" \
            --quest-ids 8165 8166 8167 8168 8169 8170 8171 \
            --npc-ids 9110103 9110106 9110108 9110112 9110113 9110114 \
            --output "$RUNNER_TEMP/ninja-quest-evidence.json"

      - name: Verify frozen regional staging contract
        run: |
          set -euo pipefail
          python tools/wz-donor/verify_region_staging_contract.py \
            tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json \
            --profile "$RUNNER_TEMP/ninja-region-profile.json" \
            --quest-evidence "$RUNNER_TEMP/ninja-quest-evidence.json" \
            --core7-archive "$RUNNER_TEMP/gms-v95-core7.zip" \
            --string-archive "$RUNNER_TEMP/gms-v95-string.zip" \
            --repo-root . \
            --output "$RUNNER_TEMP/ninja-staging-contract-verification.json" \
            | tee "$RUNNER_TEMP/ninja-staging-contract-verification.txt"
          python - "$RUNNER_TEMP/ninja-staging-contract-verification.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          print('## GMS v95 Ninja Castle staging contract')
          print()
          print(f"- **passed:** {str(r['passed']).lower()}")
          for key,value in r['counts'].items(): print(f'- **{key}:** {value}')
          print()
          print('**approved=false / importAllowed=false / productionApplyAllowed=false**')
          PY

      - name: Upload staging contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-ninja-staging-contract-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ninja-region-profile.json
            ${{ runner.temp }}/ninja-quest-evidence.json
            ${{ runner.temp }}/ninja-staging-contract-verification.json
            ${{ runner.temp }}/ninja-staging-contract-verification.txt
          retention-days: 14
          if-no-files-found: error
