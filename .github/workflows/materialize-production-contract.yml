# Retry marker: materialize non-workflow production contract files only
name: Materialize EverLeaf production contract

on:
  push:
    branches: [fix/production-contract-v2-20260904]
    paths: ['.github/workflows/materialize-production-contract.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/production-contract-v2-20260904
      - name: Materialize authoritative runtime defaults
        run: python3 tools/apply_everleaf_config.py
      - name: Normalize Docker, docs, and contract audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          docker=Path('docker-compose.yml')
          text=docker.read_text()
          text=text.replace('# EverLeaf primary world channels 1-8.', '# EverLeaf primary world channels 1-20.')
          text=text.replace('"7575-7582:7575-7582"', '"7575-7594:7575-7594"')
          docker.write_text(text)

          p=Path('docs/DEPLOYMENT_CHECKLIST.md')
          text=p.read_text()
          text=text.replace('EverLeaf currently targets **8 channels**.', 'EverLeaf production targets **20 channels** on ports **7575-7594**.')
          text=text.replace('`configuredChannels: 8`', '`configuredChannels: 20`')
          text=text.replace('`liveChannels: 8`', '`liveChannels: 20`')
          text=text.replace('healthy eight-channel deployment', 'healthy twenty-channel deployment')
          p.write_text(text)

          p=Path('docs/EVERLEAF_MASTER_CHECKLIST.md')
          text=p.read_text()
          text=text.replace('current project direction is approximately **8 channels** rather than assuming the website\'s previous value of 3.', 'the authoritative production target is **20 channels** on ports **7575-7594**.')
          text=text.replace('target configuration around 8 channels and make website reflect the live server rather than a stale/hardcoded count.', 'keep the authoritative 20-channel production contract consistent across server, website, launcher status, and deployment checks.')
          p.write_text(text)

          Path('docs/PRODUCTION_CONTRACT.md').write_text('''# EverLeaf Production Contract\n\nThis is the authoritative non-Empress production baseline. A checked-in release must already satisfy it; deployment transforms are validators/legacy normalizers, not a second source of truth.\n\n## Runtime\n- MapleStory protocol/client: **v83**\n- Primary world: **20 channels**\n- Login: **8484**\n- Channels: **7575-7594**\n- Public channel handoff host: **132.145.141.79**\n- Level cap: **250**\n\n## Rates\n- EXP: **5x**\n- Meso: **3x**\n- Drop: **2x**\n- Boss drop: **2x**\n- Quest: **1x**\n- Fishing: **2x**\n- Travel: **2x**\n\n## Account / economy guardrails\n- Automatic in-game registration: **disabled**\n- Supply rate coupons: **disabled**\n- Website registration is authoritative\n- Non-P2W policy remains authoritative\n\n## Scope\nEmpress/Future Henesys and `Community-files` remain excluded. Protected WZ modernization branches remain separate.\n''')

          Path('tools/audit_production_contract.py').write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport re\nconfig=Path("config.yaml").read_text(encoding="utf-8-sig")\nworlds=config.split("worlds:",1)[1].split("\\nserver:",1)[0]\nfirst=worlds.split("\\n  - flag:",2)[1]\nrequired={"channels":"20","exp_rate":"5","meso_rate":"3","drop_rate":"2","boss_drop_rate":"2","quest_rate":"1","fishing_rate":"2","travel_rate":"2"}\nfor key,value in required.items():\n    if not re.search(rf"(?m)^\\s*{key}:\\s*{re.escape(value)}\\s*(?:#.*)?$", first):\n        raise SystemExit(f"production contract mismatch: {key} != {value}")\nfor pattern,label in ((r"(?m)^\\s*HOST:\\s*132\\.145\\.141\\.79\\s*(?:#.*)?$","HOST"),(r"(?m)^\\s*AUTOMATIC_REGISTER:\\s*false\\s*(?:#.*)?$","automatic registration"),(r"(?m)^\\s*USE_SUPPLY_RATE_COUPONS:\\s*false\\s*(?:#.*)?$","rate coupons")):\n    if not re.search(pattern,config): raise SystemExit(f"production contract mismatch: {label}")\nif "7575-7594:7575-7594" not in Path("docker-compose.yml").read_text(): raise SystemExit("production contract mismatch: Docker channel exposure")\ncontract=Path("docs/PRODUCTION_CONTRACT.md").read_text()\nfor marker in ("20 channels","5x","3x","2x","1x","132.145.141.79"):\n    if marker not in contract: raise SystemExit(f"production contract document missing {marker}")\nprint("EverLeaf production contract: PASS")\n''')
          PY
      - name: Verify contract and normalizer idempotency
        run: |
          python3 tools/audit_production_contract.py
          before="$(sha256sum config.yaml | cut -d' ' -f1)"
          python3 tools/apply_everleaf_config.py
          after="$(sha256sum config.yaml | cut -d' ' -f1)"
          test "$before" = "$after"
      - name: Commit canonical non-workflow contract files
        run: |
          git config user.name everleaf-release-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add config.yaml docker-compose.yml docs/DEPLOYMENT_CHECKLIST.md docs/EVERLEAF_MASTER_CHECKLIST.md docs/PRODUCTION_CONTRACT.md tools/audit_production_contract.py
          git commit -m 'config: make production channel and rate contract authoritative' || exit 0
          git push origin HEAD:fix/production-contract-v2-20260904
