name: Build EverLeaf launcher

on:
  push:
    branches: [client-dev]
    paths:
      - "launcher/**"
      - ".github/workflows/build-everleaf-launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/build-everleaf-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore launcher/EverLeaf.Launcher/EverLeaf.Launcher.csproj

      - name: Build
        run: dotnet build launcher/EverLeaf.Launcher/EverLeaf.Launcher.csproj --configuration Release --no-restore

      - name: Publish self-contained launcher
        run: dotnet publish launcher/EverLeaf.Launcher/EverLeaf.Launcher.csproj --configuration Release --runtime win-x64 --self-contained true --output launcher-publish

      - name: Verify launcher security invariants
        shell: pwsh
        run: |
          $source = Get-Content "launcher/EverLeaf.Launcher/LauncherServices.cs" -Raw
          $required = @(
            "RSASignaturePadding.Pss",
            "CryptographicOperations.FixedTimeEquals",
            "Path.IsPathRooted",
            "UseShellExecute = false",
            "ManifestPublicKeyPem",
            "File.Move(temporary, destination, true)"
          )
          foreach ($value in $required) {
            if (-not $source.Contains($value)) { throw "Missing launcher security invariant: $value" }
          }
          if ($source.Contains("EverLeafProductionKeyPending")) { throw "Placeholder manifest public key still present" }
          if ($source -match "Server=.*;Password=") { throw "Database credential pattern found in launcher source" }
          if ($source.Contains("EVERLEAF_LAUNCH_TOKEN")) { throw "Deprecated fake launcher SSO token still present" }
          if (-not (Test-Path "launcher-publish/EverLeafLauncher.exe")) { throw "Launcher executable missing" }

      - name: Package portable launcher
        shell: pwsh
        run: |
          Copy-Item "launcher/README.md" "launcher-publish/README-LAUNCHER.md"
          Compress-Archive -Path "launcher-publish/*" -DestinationPath "EverLeafLauncher-portable.zip"
          Get-FileHash "EverLeafLauncher-portable.zip" -Algorithm SHA256

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "launcher\installer\EverLeafLauncher.iss"
          if (-not (Test-Path "launcher-installer\EverLeafLauncherSetup.exe")) { throw "Installer executable missing" }
          Get-FileHash "launcher-installer\EverLeafLauncherSetup.exe" -Algorithm SHA256

      - name: Upload launcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EverLeafLauncher
          path: |
            EverLeafLauncher-portable.zip
            launcher-installer/EverLeafLauncherSetup.exe
          retention-days: 30
          if-no-files-found: error
