# Approved production release trigger: 2026-09-02T06:06Z
name: Trigger EverLeaf Production Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-current-production.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-game-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded game production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-game-production.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "Dispatched guarded EverLeaf game production deployment for master."
