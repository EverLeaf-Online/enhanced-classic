name: Cleanup canonical v95 regional workspaces once

on:
  push:
    branches: [cleanup/canonical-v95-line-20260904]
    paths:
      - '.github/workflows/cleanup-canonical-v95-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cleanup/canonical-v95-line-20260904
          fetch-depth: 0
      - name: Remove obsolete regional and one-time tooling
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          obsolete=(
            .github/workflows/profile-gms-v95-ninja-castle.yml
            .github/workflows/verify-gms-v95-ninja-staging-contract.yml
            .github/workflows/stage-gms-v95-ninja-server.yml
            .github/workflows/smoke-gms-v95-ninja-server.yml
            .github/workflows/build-gms-v95-ninja-client-candidate.yml
            .github/workflows/smoke-gms-v95-ninja-client-boot.yml
            .github/workflows/deploy-empress-community-safe.yml
            .github/workflows/repair-live-v95-region-parity.yml
            .github/workflows/audit-live-ninja-9400410.yml
            .github/workflows/audit-live-ninja-quests.yml
            .github/workflows/normalize-live-v95-ninja-quests.yml
            tools/wz-donor/quest-baseline-patcher/Program.cs
            tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json
            tools/wz-donor/regional-client-patcher/Program.cs
          )
          for f in "${obsolete[@]}"; do
            if [ -e "$f" ]; then git rm -r -- "$f"; fi
          done
          git rm .github/workflows/cleanup-canonical-v95-once.yml
          git add --all
          git diff --cached --stat
          git commit -m 'cleanup: retire obsolete Empress and Ninja regional workspaces'
          git push origin HEAD:cleanup/canonical-v95-line-20260904
