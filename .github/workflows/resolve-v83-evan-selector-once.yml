name: Resolve exact v83 Evan selector routing once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths: ['.github/workflows/resolve-v83-evan-selector-once.yml']

permissions:
  contents: write

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
      - name: Resolve live selector assets and v83 routing evidence
        run: |
          set -euo pipefail
          mkdir -p docs
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' > docs/CLIENT_V83_EVAN_SELECTOR_RESOLUTION.md <<'REMOTE'
          set -euo pipefail
          CURRENT="$(readlink -f /opt/everleaf/current)"
          LOGIN="$CURRENT/wz/UI.wz/Login.img.xml"
          test -s "$LOGIN"
          python3 - "$LOGIN" <<'PY'
          import sys, xml.etree.ElementTree as ET
          p=sys.argv[1]; root=ET.parse(p).getroot()
          print('# v83 Evan selector resolution')
          print('\n## Live RaceSelect tree')
          race=root.find("./imgdir[@name='RaceSelect']")
          if race is None: raise SystemExit('RaceSelect missing')
          def walk(n,path,depth=0):
              name=n.attrib.get('name',''); here=f'{path}/{name}' if name else path
              if depth <= 4:
                  kids=[c.attrib.get('name','') for c in n if c.tag=='imgdir']
                  if n.tag=='imgdir': print(f'- `{here}` -> `{", ".join(kids)}`')
                  for c in n:
                      if c.tag in ('imgdir','canvas','int','string','vector'): walk(c,here,depth+1)
          walk(race,'/Login.img',0)
          print('\n## Creation image families')
          for name in ['NewChar','NewCharKnight','NewCharAran','NewCharEvan','NewCharRes']:
              n=root.find(f"./imgdir[@name='{name}']")
              print(f'- {name}: {"present" if n is not None else "missing"}')
          PY
          echo
          echo '## Runtime routing anchors'
          echo '- v83 CLogin::Update: 0x005F4C16'
          echo '- race read: 0x005F4F26 (CLogin+0x214)'
          echo '- case 0 Cygnus arm: 0x005F505E'
          echo '- case 1 Explorer arm: 0x005F4FD0'
          echo '- case 2 Aran arm: 0x005F4F42'
          echo '- default for race >=3: 0x005F50E7'
          echo '- SendNewCharPacket: 0x005F7E7A; v83 wire keeps one Encode4 race and no sub-job field.'
          REMOTE
          cat docs/CLIENT_V83_EVAN_SELECTOR_RESOLUTION.md
      - name: Commit focused report
        run: |
          set -euo pipefail
          git config user.name everleaf-client-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add docs/CLIENT_V83_EVAN_SELECTOR_RESOLUTION.md
          git commit -m 'docs: resolve v83 Evan selector surface'
          git pull --rebase origin feature/client-job-selector-modernization-20260904
          git push origin HEAD:feature/client-job-selector-modernization-20260904
