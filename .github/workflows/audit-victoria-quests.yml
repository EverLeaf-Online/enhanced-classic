name: Audit Victoria Island quests

on:
  push:
    branches:
      - master
      - release-dev
    paths:
      - 'wz/Quest.wz/**'
      - 'wz/Npc.wz/**'
      - 'wz/Map.wz/Map/**'
      - 'tools/audit_victoria_quests.py'
      - '.github/workflows/audit-victoria-quests.yml'
  pull_request:
    branches:
      - master
      - release-dev
    paths:
      - 'wz/Quest.wz/**'
      - 'wz/Npc.wz/**'
      - 'wz/Map.wz/Map/**'
      - 'tools/audit_victoria_quests.py'
      - '.github/workflows/audit-victoria-quests.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit Victoria Island quest ownership and sections
        run: python3 tools/audit_victoria_quests.py
