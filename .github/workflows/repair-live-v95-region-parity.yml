name: Repair live v95 region parity

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/repair-live-v95-region-parity.yml'
  workflow_dispatch:

concurrency:
  group: everleaf-game-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout canonical release
        uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Set up .NET 10 and Java 21
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure verified Oracle SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'; New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'),($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}
          else { & 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known }
          if(-not (Test-Path $known) -or (Get-Item $known).Length -eq 0){throw 'known_hosts unavailable'}

      - name: Build MapleLib regional patcher and XML exporter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $patchDir=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafRegionalClientWzPatcher'; New-Item -ItemType Directory -Force -Path $patchDir | Out-Null
          Copy-Item tools/wz-donor/regional-client-patcher/Program.cs (Join-Path $patchDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableWindowsTargeting>true</EnableWindowsTargeting></PropertyGroup><ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup></Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $patchDir 'EverLeafRegionalClientWzPatcher.csproj')
          $exportDir=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'; New-Item -ItemType Directory -Force -Path $exportDir | Out-Null
          Copy-Item tools/wz-donor/exporter/Program.cs (Join-Path $exportDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><EnableWindowsTargeting>true</EnableWindowsTargeting></PropertyGroup><ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup></Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $exportDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $patchDir 'EverLeafRegionalClientWzPatcher.csproj') -c Release
          dotnet build (Join-Path $exportDir 'EverLeafWzExporter.csproj') -c Release

      - name: Fetch exact live client WZ and pinned raw v95 donor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $families=@('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $live=Join-Path $env:RUNNER_TEMP 'live-wz'; $donor=Join-Path $env:RUNNER_TEMP 'donor-wz'; New-Item -ItemType Directory -Force -Path $live,$donor | Out-Null
          $checks=($families|ForEach-Object{"test -s '/opt/everleaf/patches/files/$_'; test -s '/opt/everleaf/private/wz-donors/gms-v95-raw/$_'"}) -join '; '
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -e; $checks"
          if($LASTEXITCODE){throw 'live/donor WZ preflight failed'}
          foreach($f in $families){
            & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/patches/files/$f" (Join-Path $live $f); if($LASTEXITCODE){throw "live $f transfer failed"}
            & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/private/wz-donors/gms-v95-raw/$f" (Join-Path $donor $f); if($LASTEXITCODE){throw "donor $f transfer failed"}
          }
          foreach($f in $families){Get-FileHash (Join-Path $live $f) -Algorithm SHA256; Get-FileHash (Join-Path $donor $f) -Algorithm SHA256}

      - name: Build exact Ninja Castle v95 client repair candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafRegionalClientWzPatcher/EverLeafRegionalClientWzPatcher.csproj'
          $live=Join-Path $env:RUNNER_TEMP 'live-wz'; $donor=Join-Path $env:RUNNER_TEMP 'donor-wz'; $out=Join-Path $env:RUNNER_TEMP 'candidate'
          dotnet run --project $project -c Release --no-build -- tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json $live $donor $out
          $manifest=Get-Content (Join-Path $out 'REGIONAL_CLIENT_PATCH_MANIFEST.json') -Raw | ConvertFrom-Json
          if($manifest.approved -ne $false -or $manifest.productionApplyAllowed -ne $false){throw 'candidate safety contract drifted'}
          foreach($f in @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')){
            if(-not (Test-Path (Join-Path $out $f) -PathType Leaf)){throw "candidate missing $f"}
            $node=$manifest.output.PSObject.Properties[$f].Value
            $hash=(Get-FileHash (Join-Path $out $f) -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash -ne ([string]$node.sha256).ToLowerInvariant()){throw "candidate hash mismatch $f"}
          }
          Get-Content (Join-Path $out 'REGIONAL_CLIENT_PATCH_MANIFEST.json') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Fresh-export repaired client WZ families to server XML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $input=Join-Path $env:RUNNER_TEMP 'candidate'; $xml=Join-Path $env:RUNNER_TEMP 'candidate-xml'; New-Item -ItemType Directory -Force -Path $xml | Out-Null
          $project=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          foreach($f in @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')){
            dotnet run --project $project -c Release --no-build -- $input $xml --patch-version=83 --probe-patch-range=1:250 $f
            if($LASTEXITCODE){throw "XML export failed: $f"}
          }
          foreach($f in @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')){if(-not (Test-Path (Join-Path $xml $f) -PathType Container)){throw "XML family missing: $f"}}

      - name: Validate repaired regional XML closure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $xml=Join-Path $env:RUNNER_TEMP 'candidate-xml'
          python -c @'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          root=pathlib.Path(sys.argv[1])
          maps={int(m.group(1)) for p in (root/'Map.wz').rglob('*.img.xml') if (m:=re.match(r'^(\d+)\.img\.xml$',p.name))}
          ninja=[800040000,800040100,*range(800040200,800040212),*range(800040300,800040316),800040400,800040401,800040410]
          assert not [i for i in ninja if i not in maps], [i for i in ninja if i not in maps]
          future=sorted(i for i in maps if 271000000<=i<=271040300); assert len(future)==42,len(future)
          def missing(fam,ids): return [i for i in ids if not list((root/fam).rglob(f'{i}.img.xml'))]
          assert not missing('Mob.wz',range(8850000,8850012)),missing('Mob.wz',range(8850000,8850012))
          assert not missing('Mob.wz',range(9400400,9400411)),missing('Mob.wz',range(9400400,9400411))
          assert not missing('Npc.wz',range(9110100,9110115)),missing('Npc.wz',range(9110100,9110115))
          item='\n'.join(p.read_text(errors='ignore') for p in (root/'Item.wz').rglob('*.xml'))
          quest='\n'.join(p.read_text(errors='ignore') for p in (root/'Quest.wz').rglob('*.xml'))
          for i in range(4000337,4000347): assert f'name="{i}"' in item or f'value="{i}"' in item,i
          for i in range(8163,8172): assert f'name="{i}"' in quest or f'value="{i}"' in quest,i
          bad=[]
          for mid in ninja+future:
            p=next((p for p in (root/'Map.wz').rglob(f'{mid}.img.xml')),None)
            if not p: continue
            t=ET.parse(p).getroot()
            for sec in t.iter():
              if sec.attrib.get('name')!='portal': continue
              for x in list(sec):
                d={c.attrib.get('name',''):c.attrib.get('value','') for c in list(x)}; tm=d.get('tm','')
                if tm.isdigit() and int(tm) not in (0,999999999) and int(tm) not in maps: bad.append((mid,d.get('pn',''),int(tm)))
          assert not bad,bad
          print(f'REGION_XML_OK ninja_maps={len(ninja)} future_henesys={len(future)}')
          '@ $xml

      - name: Build isolated exact client and run blocked-network boot smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $baseline=Get-Content client/managed-client-baseline.json -Raw | ConvertFrom-Json
          $names=@($baseline.managedFiles|ForEach-Object{[string]$_.path})
          $remote='/tmp/everleaf-v95-parity-client-'+$env:GITHUB_RUN_ID+'.tgz'; $quoted=($names|ForEach-Object{"'$_'"}) -join ' '
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -e; cd /opt/everleaf/patches/files; tar -czf '$remote' $quoted"
          if($LASTEXITCODE){throw 'client archive preparation failed'}
          $archive=Join-Path $env:RUNNER_TEMP 'client.tgz'; & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remote" $archive; if($LASTEXITCODE){throw 'client archive fetch failed'}
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "rm -f '$remote'"
          $client=Join-Path $env:RUNNER_TEMP 'client'; New-Item -ItemType Directory -Force -Path $client | Out-Null; tar -xzf $archive -C $client
          foreach($f in @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')){Copy-Item (Join-Path $env:RUNNER_TEMP "candidate/$f") (Join-Path $client $f) -Force}
          $exe=Join-Path $client 'EverLeaf.exe'; if(-not (Test-Path $exe)){throw 'EverLeaf.exe missing'}
          $rule="EverLeaf-v95-parity-$env:GITHUB_RUN_ID"; $p=$null
          try{
            New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $p=Start-Process -FilePath $exe -WorkingDirectory $client -PassThru
            Start-Sleep -Seconds 15
            $alive=@(Get-CimInstance Win32_Process -Filter "Name='EverLeaf.exe'" -ErrorAction SilentlyContinue|Where-Object{try{[IO.Path]::GetFullPath([string]$_.ExecutablePath)-eq [IO.Path]::GetFullPath($exe)}catch{$false}})
            if($alive.Count -eq 0){$p.Refresh(); throw "repaired client did not survive boot smoke; exited=$($p.HasExited) code=$(if($p.HasExited){$p.ExitCode}else{'n/a'})"}
            Write-Host "CLIENT_BOOT_SMOKE_OK processes=$($alive.Count)"
          } finally {
            Get-CimInstance Win32_Process -Filter "Name='EverLeaf.exe'" -ErrorAction SilentlyContinue|Where-Object{try{[IO.Path]::GetFullPath([string]$_.ExecutablePath)-eq [IO.Path]::GetFullPath($exe)}catch{$false}}|ForEach-Object{Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue}
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }

      - name: Package and upload validated client/XML repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:RUNNER_TEMP 'candidate'; $xml=Join-Path $env:RUNNER_TEMP 'candidate-xml'
          $clientZip=Join-Path $env:RUNNER_TEMP 'v95-region-client.zip'; $xmlZip=Join-Path $env:RUNNER_TEMP 'v95-region-xml.zip'
          Compress-Archive -Path @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz','REGIONAL_CLIENT_PATCH_MANIFEST.json'|ForEach-Object{Join-Path $candidate $_}) -DestinationPath $clientZip -CompressionLevel Optimal
          Compress-Archive -Path @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz'|ForEach-Object{Join-Path $xml $_}) -DestinationPath $xmlZip -CompressionLevel Optimal
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $scp='C:\Program Files\Git\usr\bin\scp.exe'; $stage="/home/ubuntu/everleaf-staging/v95-region-parity-$env:GITHUB_RUN_ID"
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -e; rm -rf '$stage'; mkdir -p '$stage'"; if($LASTEXITCODE){throw 'remote stage create failed'}
          & $scp -i $key $clientZip "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$stage/client.zip"; if($LASTEXITCODE){throw 'client upload failed'}
          & $scp -i $key $xmlZip "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$stage/xml.zip"; if($LASTEXITCODE){throw 'XML upload failed'}
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -e; unzip -t '$stage/client.zip' >/dev/null; unzip -t '$stage/xml.zip' >/dev/null; sha256sum '$stage/client.zip' '$stage/xml.zip'"; if($LASTEXITCODE){throw 'remote stage verification failed'}
          "REMOTE_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Atomically promote matched v95 client/server content with rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $stage=$env:REMOTE_STAGE; $sha=$env:GITHUB_SHA
          $script=@'
          set -euo pipefail
          STAGE='__STAGE__'; SHA='__SHA__'
          CURRENT="$(readlink -f /opt/everleaf/current)"; PATCH=/opt/everleaf/patches; FILES="$PATCH/files"
          systemctl is-active --quiet everleaf.service
          SOURCE=''
          while read -r _ d; do [ -d "$d" ] || continue; c="$(find "$d" -type f -name '*.xml' | wc -l)"; if [ "$c" -eq 44236 ]; then SOURCE="$d"; break; fi; done < <(find /opt/everleaf/releases -mindepth 2 -maxdepth 2 -type d -name wz -printf '%T@ %p\n' | sort -nr)
          test -n "$SOURCE" || { echo 'No preserved full Community/v95 XML baseline.' >&2; exit 1; }
          TS="$(date -u +%Y%m%dT%H%M%SZ)"; BACKUP="/opt/everleaf/backups/v95-region-parity/$TS"; sudo install -d -o ubuntu -g ubuntu /opt/everleaf/shared "$BACKUP"
          mkdir -p "$BACKUP/client"; for f in Map.wz Mob.wz Npc.wz Item.wz Quest.wz String.wz; do cp -a "$FILES/$f" "$BACKUP/client/$f"; done
          cp -a "$PATCH/manifest.json" "$BACKUP/manifest.json"; cp -a "$CURRENT/wz" "$BACKUP/server-wz"
          NEW="/opt/everleaf/shared/wz-v95.new-$TS"; rm -rf "$NEW"; cp -a "$SOURCE" "$NEW"
          TMPXML="$STAGE/xml"; rm -rf "$TMPXML"; mkdir -p "$TMPXML"; unzip -q "$STAGE/xml.zip" -d "$TMPXML"
          for f in Map.wz Mob.wz Npc.wz Item.wz Quest.wz String.wz; do test -d "$TMPXML/$f"; rm -rf "$NEW/$f"; cp -a "$TMPXML/$f" "$NEW/$f"; done
          WZROOT="$NEW" python3 - <<'PY'
          from pathlib import Path
          import os,re,xml.etree.ElementTree as ET
          root=Path(os.environ['WZROOT']); maps={int(m.group(1)) for p in (root/'Map.wz').rglob('*.img.xml') if (m:=re.match(r'^(\d+)\.img\.xml$',p.name))}
          future=sorted(i for i in maps if 271000000<=i<=271040300); assert len(future)==42,len(future)
          ninja=[800040000,800040100,*range(800040200,800040212),*range(800040300,800040316),800040400,800040401,800040410]; assert not [i for i in ninja if i not in maps]
          def missing(fam,ids): return [i for i in ids if not list((root/fam).rglob(f'{i}.img.xml'))]
          assert not missing('Mob.wz',range(8850000,8850012)); assert not missing('Mob.wz',range(9400400,9400411)); assert not missing('Npc.wz',range(9110100,9110115))
          item='\n'.join(p.read_text(errors='ignore') for p in (root/'Item.wz').rglob('*.xml')); quest='\n'.join(p.read_text(errors='ignore') for p in (root/'Quest.wz').rglob('*.xml'))
          for i in range(4000337,4000347): assert f'name="{i}"' in item or f'value="{i}"' in item,i
          for i in range(8163,8172): assert f'name="{i}"' in quest or f'value="{i}"' in quest,i
          allmaps=maps; bad=[]
          for mid in ninja+future:
            p=next((x for x in (root/'Map.wz').rglob(f'{mid}.img.xml')),None); t=ET.parse(p).getroot()
            for sec in t.iter():
              if sec.attrib.get('name')!='portal': continue
              for x in list(sec):
                d={c.attrib.get('name',''):c.attrib.get('value','') for c in list(x)}; tm=d.get('tm','')
                if tm.isdigit() and int(tm) not in (0,999999999) and int(tm) not in allmaps: bad.append((mid,d.get('pn',''),int(tm)))
          assert not bad,bad
          print('CANONICAL_V95_REGIONS_OK',sum(1 for _ in root.rglob('*.xml')))
          PY
          test -f "$CURRENT/scripts/event/CygnusBattle.js"; test -f "$CURRENT/scripts/portal/ninja_Boss.js"

          TMPCLIENT="$STAGE/client"; rm -rf "$TMPCLIENT"; mkdir -p "$TMPCLIENT"; unzip -q "$STAGE/client.zip" -d "$TMPCLIENT"
          rollback(){
            echo 'V95_REGION_PARITY_ROLLBACK' >&2
            for f in Map.wz Mob.wz Npc.wz Item.wz Quest.wz String.wz; do sudo cp -a "$BACKUP/client/$f" "$FILES/$f"; done
            sudo cp -a "$BACKUP/manifest.json" "$PATCH/manifest.json"
            sudo rm -rf "$CURRENT/wz"; sudo cp -a "$BACKUP/server-wz" "$CURRENT/wz"; sudo systemctl restart everleaf.service || true
          }
          trap rollback ERR
          for f in Map.wz Mob.wz Npc.wz Item.wz Quest.wz String.wz; do test -s "$TMPCLIENT/$f"; sudo install -m 644 "$TMPCLIENT/$f" "$FILES/$f"; done
          GENERATED="$STAGE/manifest.json"; LAUNCHER_PATCH_ROOT="$PATCH" LAUNCHER_BASELINE_PATH="$PATCH/managed-client-baseline.json" LAUNCHER_MANIFEST_PATH="$GENERATED" LAUNCHER_PORTABLE_PATH="$PATCH/downloads/EverLeafLauncher-portable.zip" LAUNCHER_VERSION_PATH="$PATCH/downloads/EverLeafLauncher-version.txt" node /opt/everleaf/web/scripts/build-patch-manifest.js "$SHA"
          sudo install -m 644 "$GENERATED" "$PATCH/manifest.json"
          sudo rm -rf /opt/everleaf/shared/wz-v95.previous; if [ -d /opt/everleaf/shared/wz-v95 ]; then sudo mv /opt/everleaf/shared/wz-v95 /opt/everleaf/shared/wz-v95.previous; fi; sudo mv "$NEW" /opt/everleaf/shared/wz-v95
          sudo rm -rf "$CURRENT/wz"; sudo cp -a /opt/everleaf/shared/wz-v95 "$CURRENT/wz"
          sudo systemctl restart everleaf.service
          for i in $(seq 1 45); do if systemctl is-active --quiet everleaf.service && python3 "$CURRENT/tools/verify_channel_runtime.py" --config "$CURRENT/config.yaml" --host 127.0.0.1 >/tmp/v95-parity-health 2>&1; then break; fi; sleep 2; done
          systemctl is-active --quiet everleaf.service; python3 "$CURRENT/tools/verify_channel_runtime.py" --config "$CURRENT/config.yaml" --host 127.0.0.1
          test -n "$(find "$CURRENT/wz/Map.wz" -name '800040410.img.xml' -print -quit)"; test -n "$(find "$CURRENT/wz/Mob.wz" -name '9400410.img.xml' -print -quit)"; test -n "$(find "$CURRENT/wz/Mob.wz" -name '8850011.img.xml' -print -quit)"
          printf 'source=%s\nrepair_sha=%s\nrepaired=%s\n' "$SOURCE" "$SHA" "$(date -u +%FT%TZ)" | sudo tee /opt/everleaf/.server-wz-baseline >/dev/null
          trap - ERR
          echo "LIVE_V95_REGION_PARITY_OK backup=$BACKUP"
          '@
          $script=$script.Replace('__STAGE__',$stage).Replace('__SHA__',$sha); $tmp=Join-Path $env:RUNNER_TEMP 'promote-v95.sh'; [IO.File]::WriteAllText($tmp,($script -replace "`r",''))
          & $scp -i $key $tmp "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/tmp/promote-v95.sh"; if($LASTEXITCODE){throw 'promotion script upload failed'}
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "bash /tmp/promote-v95.sh"; if($LASTEXITCODE){throw 'v95 parity promotion failed'}

      - name: Verify public runtime and patch endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($port in @(8484)+(7575..7594)){
            $ok=$false; for($i=0;$i -lt 5 -and -not $ok;$i++){try{$c=New-Object Net.Sockets.TcpClient; $a=$c.BeginConnect($env:EVERLEAF_DEPLOY_HOST,$port,$null,$null); $ok=$a.AsyncWaitHandle.WaitOne(5000); if($ok){$c.EndConnect($a)}; $c.Close()}catch{}; if(-not $ok){Start-Sleep -Seconds 2}}
            if(-not $ok){throw "public port failed: $port"}; Write-Host "PORT_OK $port"
          }
          $manifest=Invoke-WebRequest -UseBasicParsing -Uri 'https://everleafms.online/patches/manifest.json' -TimeoutSec 30
          if($manifest.StatusCode -ne 200){throw 'patch manifest unavailable'}
          Write-Host 'PUBLIC_V95_PARITY_OK'
