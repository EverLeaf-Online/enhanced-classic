# Trigger revision: evan-warp-before-job-20260901
name: Trigger Evan NPC production deploy

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/trigger-evan-npc-deploy.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected game production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-game-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-dev
          echo "EverLeaf game production deployment dispatched."
