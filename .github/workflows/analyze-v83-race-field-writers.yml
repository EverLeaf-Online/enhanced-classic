name: Analyze v83 race-field writers

on:
  push:
    branches: [client-dev]
    paths:
      - ".github/workflows/analyze-v83-race-field-writers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 335d4fbb74e713a01f63163c39c941865401d24a
          sparse-checkout: Localhosts.zip
          sparse-checkout-cone-mode: false
      - run: python3 -m pip install --user pefile capstone
      - name: Trace native race setter callers by raw rel32 resolution
        shell: bash
        run: |
          set -euo pipefail
          echo "096e21e155ca1a06a3132a6ad6f7feda5cd986928f415bab15a3b67fee412527  Localhosts.zip" | sha256sum --check
          mkdir source
          unzip -q Localhosts.zip -d source
          cp source/Localhost.exe v83.exe
          python3 - <<'PY'
          from pathlib import Path
          import json, struct, pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          data=Path('v83.exe').read_bytes(); pe=pefile.PE('v83.exe'); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          target=0x00617348
          callers=[]
          for sec in pe.sections:
              if not (sec.Characteristics & 0x20000000): continue
              sec_off=sec.PointerToRawData; sec_va=base+sec.VirtualAddress; raw=sec.get_data()
              for i in range(0,len(raw)-5):
                  if raw[i] != 0xE8: continue
                  rel=struct.unpack_from('<i',raw,i+1)[0]
                  va=sec_va+i
                  if va+5+rel != target: continue
                  callers.append(va)
                  print(f'CALLER 0x{va:08X}')
                  start=max(0,i-128); end=min(len(raw),i+160)
                  for ins in md.disasm(raw[start:end],sec_va+start):
                      mark=' <<< CALL' if ins.address==va else ''
                      print(f'{ins.address:08X}: {bytes(ins.bytes).hex(" "):<24} {ins.mnemonic:<7} {ins.op_str}{mark}')
          print('SETTER_CALLERS', [hex(x) for x in callers])
          Path('v83-race-field-writers.json').write_text(json.dumps({'setter_callers':[hex(x) for x in callers]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v83-race-field-writers
          path: v83-race-field-writers.json
          retention-days: 7
