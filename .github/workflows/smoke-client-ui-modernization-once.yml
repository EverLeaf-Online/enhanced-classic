name: Smoke EverLeaf client UI modernization once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths: ['.github/workflows/smoke-client-ui-modernization-once.yml']

permissions:
  contents: read

env:
  EVERLEAF_PUBLIC_BASE: https://everleafms.online

jobs:
  visual-smoke:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904

      - name: Apply client transforms
        shell: pwsh
        run: |
          python client/scripts/apply-ui-modernization.py
          python client/scripts/apply-community-ui-preference.py

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build modernization DLL
        shell: pwsh
        run: msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Reconstruct exact managed live client over HTTPS
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $client=Join-Path $env:RUNNER_TEMP 'everleaf-ui-client'
          New-Item -ItemType Directory -Force -Path $client | Out-Null
          $baseline=Get-Content client/managed-client-baseline.json -Raw | ConvertFrom-Json
          $names=@($baseline.managedFiles | ForEach-Object { [string]$_.path })
          foreach($name in $names){
            if($name -notmatch '^[A-Za-z0-9_.-]+$'){ throw "Unsafe client filename: $name" }
            $url="$env:EVERLEAF_PUBLIC_BASE/patches/$name"
            $dest=Join-Path $client $name
            $ok=$false
            for($attempt=1;$attempt -le 4 -and -not $ok;$attempt++){
              try {
                Invoke-WebRequest -Uri $url -OutFile $dest -MaximumRedirection 5 -TimeoutSec 180 -UseBasicParsing
                if((Test-Path $dest) -and (Get-Item $dest).Length -gt 0){$ok=$true}
              } catch {
                if($attempt -eq 4){throw}
                Start-Sleep -Seconds (3*$attempt)
              }
            }
            if(-not $ok){throw "Unable to download $name"}
          }
          foreach($required in @('EverLeaf.exe','UI.wz','dinput8.dll','config.ini')){
            $p=Join-Path $client $required
            if(-not(Test-Path $p) -or (Get-Item $p).Length -eq 0){throw "Downloaded client missing $required"}
          }
          Copy-Item client/ezorsia/out/Release/dinput8.dll (Join-Path $client 'dinput8.dll') -Force
          Copy-Item client/ezorsia/ezorsia/config.ini (Join-Path $client 'config.ini') -Force
          $inventory=@()
          foreach($name in $names){
            $p=Join-Path $client $name
            $inventory += [ordered]@{path=$name;size=(Get-Item $p).Length;sha256=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          [ordered]@{schemaVersion=1;source='production-https-patches';files=$inventory} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'EVERLEAF_UI_CLIENT_INVENTORY.json')
          "CLIENT_DIR=$client" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch and capture real EverLeaf window
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public class EverLeafWin32 {
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd,out RECT rect);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd,out uint processId);
          }
          '@
          function Get-EverLeafWindows {
            $processIds=@(Get-Process -Name EverLeaf -ErrorAction SilentlyContinue | ForEach-Object {[uint32]$_.Id})
            $found=New-Object System.Collections.Generic.List[object]
            if($processIds.Count -eq 0){ return @() }
            $callback=[EverLeafWin32+EnumWindowsProc]{
              param([IntPtr]$hWnd,[IntPtr]$lParam)
              if(-not [EverLeafWin32]::IsWindowVisible($hWnd)){ return $true }
              [uint32]$windowProcessId=0
              [void][EverLeafWin32]::GetWindowThreadProcessId($hWnd,[ref]$windowProcessId)
              if($processIds -notcontains $windowProcessId){ return $true }
              $rect=New-Object EverLeafWin32+RECT
              if([EverLeafWin32]::GetWindowRect($hWnd,[ref]$rect)){
                $w=$rect.Right-$rect.Left; $h=$rect.Bottom-$rect.Top
                if($w -gt 0 -and $h -gt 0){
                  $found.Add([pscustomobject]@{Handle=$hWnd;ProcessId=$windowProcessId;Rect=$rect;Width=$w;Height=$h;Area=([int64]$w*$h)})
                }
              }
              return $true
            }
            [void][EverLeafWin32]::EnumWindows($callback,[IntPtr]::Zero)
            return @($found)
          }

          $exe=[IO.Path]::GetFullPath((Join-Path $env:CLIENT_DIR 'EverLeaf.exe'))
          $launched=Start-Process -FilePath $exe -WorkingDirectory $env:CLIENT_DIR -PassThru
          $target=$null
          $windowLog=@()
          for($i=0;$i -lt 75 -and -not $target;$i++){
            Start-Sleep -Seconds 1
            $windows=@(Get-EverLeafWindows | Sort-Object Area -Descending)
            if($windows.Count){
              $best=$windows[0]
              $windowLog += "t=$i pid=$($best.ProcessId) size=$($best.Width)x$($best.Height) area=$($best.Area)"
              if($best.Width -ge 640 -and $best.Height -ge 480){ $target=$best }
            }
          }
          $windowLog | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'everleaf-window-discovery.txt')
          if(-not $target){
            $launched.Refresh()
            $state=if($launched.HasExited){"exit=$($launched.ExitCode)"}else{'running-no-game-window'}
            $seen=(Get-EverLeafWindows | Sort-Object Area -Descending | ForEach-Object {"$($_.Width)x$($_.Height) pid=$($_.ProcessId)"}) -join ', '
            throw "EverLeaf game window did not appear ($state). Visible EverLeaf windows: $seen"
          }
          Start-Sleep -Seconds 5
          $runtime=Join-Path $env:CLIENT_DIR 'everleaf-selector-runtime.txt'
          if(-not(Test-Path $runtime)){ throw 'Unpacked selector runtime dump was not emitted' }
          Copy-Item $runtime (Join-Path $env:RUNNER_TEMP 'everleaf-selector-runtime.txt') -Force
          $rect=$target.Rect; $w=$target.Width; $h=$target.Height
          $bmp=New-Object Drawing.Bitmap $w,$h
          $gfx=[Drawing.Graphics]::FromImage($bmp)
          try{$gfx.CopyFromScreen($rect.Left,$rect.Top,0,0,$bmp.Size)}finally{$gfx.Dispose()}
          $shot=Join-Path $env:RUNNER_TEMP 'everleaf-modern-ui-login.png'
          $bmp.Save($shot,[Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          [ordered]@{schemaVersion=5;kind='everleaf-modern-ui-visual-smoke';commit=$env:GITHUB_SHA;width=$w;height=$h;runtimeDumpCaptured=$true;productionFilesModified=$false} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'EVERLEAF_UI_SMOKE_REPORT.json')
          Get-Content $runtime | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Process -Name EverLeaf -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-modern-ui-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/everleaf-modern-ui-login.png
            ${{ runner.temp }}/EVERLEAF_UI_SMOKE_REPORT.json
            ${{ runner.temp }}/EVERLEAF_UI_CLIENT_INVENTORY.json
            ${{ runner.temp }}/everleaf-selector-runtime.txt
            ${{ runner.temp }}/everleaf-window-discovery.txt
          retention-days: 14
          if-no-files-found: warn
