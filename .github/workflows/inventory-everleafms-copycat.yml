name: Inventory EverLeafMS Copycat on VM

on:
  push:
    branches: [ops/import-everleafms-copycat]
    paths:
      - '.github/workflows/inventory-everleafms-copycat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-self-hosted:
    runs-on: self-hosted
    steps:
      - name: Inventory copycat folder
        shell: bash
        run: |
          set -euo pipefail
          echo '=== HOST ==='
          hostname
          date -Is
          df -h / /opt /home 2>/dev/null || true
          mapfile -d '' matches < <(find /opt /home -xdev -type d \( -iname '*everleafms*copycat*' -o -iname '*everleaf*copycat*' \) -print0 2>/dev/null)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo 'COPYCAT_FOLDER_NOT_FOUND'
            find /opt /home -xdev -maxdepth 6 -type d \( -iname '*everleaf*' -o -iname '*copycat*' \) -print 2>/dev/null | head -200
            exit 2
          fi
          for target in "${matches[@]}"; do
            echo '=== TARGET ==='
            printf 'path=%q\n' "$target"
            du -sh "$target"
            printf 'files='
            find "$target" -xdev -type f -printf '.' | wc -c
            printf 'directories='
            find "$target" -xdev -type d -printf '.' | wc -c
            echo '=== TOP LEVEL ==='
            find "$target" -mindepth 1 -maxdepth 1 -printf '%y\t%s\t%f\n' | sort
            echo '=== LARGEST FILES ==='
            find "$target" -xdev -type f -printf '%s\t%P\n' | sort -nr | head -100
            echo '=== NESTED GIT REPOSITORIES ==='
            find "$target" -xdev -type d -name .git -print 2>/dev/null || true
          done