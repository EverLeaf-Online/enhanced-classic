name: Publish EverLeafMS Copycat archive

on:
  push:
    branches: [ops/import-everleafms-copycat]
    paths:
      - '.github/workflows/inventory-everleafms-copycat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: everleafms-copycat-2026-09-05
      REPOSITORY: EverLeaf-Online/enhanced-classic
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
          HOST: 132.145.141.79
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify source and runner capacity
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          ssh -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_everleaf ubuntu@132.145.141.79 'test -d "/home/ubuntu/everleafms copycat" && du -sh "/home/ubuntu/everleafms copycat" && find "/home/ubuntu/everleafms copycat" -type f | wc -l'

      - name: Stream and split exact folder archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ssh -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_everleaf ubuntu@132.145.141.79 'tar -C /home/ubuntu -cf - "everleafms copycat"' | split -b 1900M -d -a 3 - release-assets/EverleafMS-copycat.tar.part-
          ssh -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_everleaf ubuntu@132.145.141.79 'cd "/home/ubuntu/everleafms copycat" && find . -type f -printf "%s\t%P\n" | LC_ALL=C sort' > release-assets/CONTENTS.tsv
          (cd release-assets && sha256sum EverleafMS-copycat.tar.part-* > SHA256SUMS.txt)
          printf '%s\n' 'Restore on Linux/macOS:' '  cat EverleafMS-copycat.tar.part-* > EverleafMS-copycat.tar' '  sha256sum -c SHA256SUMS.txt' '  tar -xf EverleafMS-copycat.tar' '' 'Restore on Windows PowerShell:' '  Get-Content EverleafMS-copycat.tar.part-* -AsByteStream | Set-Content EverleafMS-copycat.tar -AsByteStream' '  tar -xf EverleafMS-copycat.tar' > release-assets/RESTORE.txt
          ls -lh release-assets
          test "$(find release-assets -name 'EverleafMS-copycat.tar.part-*' -size +0c | wc -l)" -ge 2

      - name: Create release and upload archive parts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --target "$GITHUB_SHA" --title 'EverLeafMS Copycat client archive' --notes 'Exact archive of /home/ubuntu/everleafms copycat from the EverLeaf VM. Download every .part file plus SHA256SUMS.txt and RESTORE.txt.'
          fi
          for asset in release-assets/*; do
            gh release upload "$RELEASE_TAG" "$asset" --repo "$REPOSITORY" --clobber
          done

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json url,assets --jq '{url: .url, assets: [.assets[] | {name: .name, size: .size}]}'