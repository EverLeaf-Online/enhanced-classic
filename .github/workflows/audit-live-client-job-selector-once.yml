name: Audit live EverLeaf character type selector once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths:
      - '.github/workflows/audit-live-client-job-selector-once.yml'

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
      - name: Inspect live selector XML structure
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CURRENT="$(readlink -f /opt/everleaf/current)"
          LOGIN="$CURRENT/wz/UI.wz/Login.img.xml"
          echo "CURRENT=$CURRENT"
          test -s "$LOGIN"
          echo '--- literal class-family matches ---'
          grep -nEi 'Evan|Aran|Cygnus|Noblesse|Legend|character|newchar|create|select' "$LOGIN" | head -n 240 || true
          echo '--- login imgdir paths (depth <= 5) ---'
          python3 - "$LOGIN" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          rows=[]
          numeric=[]
          def walk(node,path):
              kids=[c for c in node if c.tag=='imgdir']
              names=[c.attrib.get('name','') for c in kids]
              if path.count('/')<=5:
                  rows.append((path,names))
              nums=[n for n in names if n.isdigit()]
              if len(nums)>=3:
                  numeric.append((path,names))
              for c in kids:
                  walk(c,path+'/'+c.attrib.get('name',''))
          walk(root,root.attrib.get('name','Login.img'))
          for p,n in rows:
              print(f'PATH|{p}|CHILDREN={",".join(n)}')
          print('--- candidate indexed selector nodes ---')
          for p,n in numeric:
              print(f'INDEXED|{p}|CHILDREN={",".join(n)}')
          PY
          echo '--- relevant leaf/resource names ---'
          python3 - "$LOGIN" <<'PY'
          import sys, xml.etree.ElementTree as ET, re
          root=ET.parse(sys.argv[1]).getroot()
          rx=re.compile(r'(char|create|select|job|aran|cygn|legend|evan|knight|advent|explor)',re.I)
          def walk(node,path):
              name=node.attrib.get('name','')
              p=path+'/'+name if name else path
              if rx.search(p) or any(rx.search(str(v)) for v in node.attrib.values()):
                  print(f'{node.tag}|{p}|{node.attrib}')
              for c in node: walk(c,p)
          walk(root,'')
          PY
          REMOTE
