name: Audit live EverLeaf character type selector once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths:
      - '.github/workflows/audit-live-client-job-selector-once.yml'

permissions:
  contents: write

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
      - name: Record concise live selector structure
        run: |
          set -euo pipefail
          mkdir -p docs
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' > docs/CLIENT_SELECTOR_LIVE_STRUCTURE.md <<'REMOTE'
          set -euo pipefail
          CURRENT="$(readlink -f /opt/everleaf/current)"
          LOGIN="$CURRENT/wz/UI.wz/Login.img.xml"
          test -s "$LOGIN"
          python3 - "$LOGIN" "$CURRENT" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          login, current = sys.argv[1:]
          root = ET.parse(login).getroot()
          family_rx = re.compile(r'(evan|aran|cygn|noblesse|legend|dual|resistance|citizen|battle.?mage|wild.?hunter|mechanic|explor|advent|knight)', re.I)
          selector_rx = re.compile(r'(char|create|select|job|type|new|race)', re.I)
          indexed=[]; family=[]; selector=[]
          def walk(node, path):
              name=node.attrib.get('name','')
              here=f'{path}/{name}' if name else path
              imgkids=[c for c in node if c.tag=='imgdir']
              names=[c.attrib.get('name','') for c in imgkids]
              nums=[n for n in names if n.isdigit()]
              if len(nums) >= 3:
                  score=(2 if selector_rx.search(here) else 0)+(1 if family_rx.search(here) else 0)
                  indexed.append((score, here, names))
              attrs=' '.join(f'{k}={v}' for k,v in node.attrib.items())
              if family_rx.search(here) or family_rx.search(attrs): family.append((node.tag,here,dict(node.attrib)))
              if node.tag=='imgdir' and selector_rx.search(here): selector.append((here,names))
              for c in node: walk(c, here)
          walk(root, '')
          print('# EverLeaf live character-selector structure\n')
          print(f'- Active release: `{current}`')
          print(f'- Source: `{login}`\n')
          print('## Indexed node candidates')
          for _,p,n in sorted(indexed,key=lambda r:(-r[0],r[1]))[:40]: print(f'- `{p}` -> `{", ".join(n)}`')
          print('\n## RaceSelect direct structure')
          race=root.find("./imgdir[@name='RaceSelect']")
          if race is None: print('- MISSING')
          else:
              for c in race:
                  if c.tag=='imgdir': print(f'- `{c.attrib.get("name","")}` -> `{", ".join(x.attrib.get("name","") for x in c if x.tag=="imgdir")}`')
          print('\n## Class-family marker summary')
          xml=open(login,encoding='utf-8',errors='ignore').read()
          for label,rx in [('Explorer',r'explor|advent'),('Cygnus',r'cygn|noblesse|knight'),('Aran',r'aran|legend'),('Evan',r'evan'),('Dual Blade',r'dual'),('Resistance',r'resistance|citizen'),('Battle Mage',r'battle.?mage'),('Wild Hunter',r'wild.?hunter'),('Mechanic',r'mechanic')]:
              print(f'- {label}: {len(re.findall(rx,xml,re.I))} matches')
          print('\n## Relevant class-family paths')
          seen=set()
          for tag,p,a in family:
              if p in seen: continue
              seen.add(p)
              if len(seen)>120: break
              print(f'- `{tag}` `{p}` `{a}`')
          PY
          REMOTE
          cat docs/CLIENT_SELECTOR_LIVE_STRUCTURE.md
      - name: Record private GMS v95 selector structure
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' > docs/CLIENT_SELECTOR_GMS_V95_STRUCTURE.md <<'REMOTE'
          set -euo pipefail
          ZIP=/opt/everleaf/private/wz-donors/gms-v95.zip
          test -s "$ZIP"
          ENTRY="$(unzip -Z1 "$ZIP" | grep -E '(^|/)UI\.wz/Login\.img\.xml$' | head -n1 || true)"
          echo '# GMS v95 donor character-selector structure'
          echo
          echo "- Donor: \`$ZIP\`"
          if [ -z "$ENTRY" ]; then
            echo '- `UI.wz/Login.img.xml` is not present in this donor export.'
            echo '- Available UI/Login-like entries:'
            unzip -Z1 "$ZIP" | grep -Ei 'UI\.wz|Login\.img' | head -n80 | sed 's/^/- `&`/' || true
            exit 0
          fi
          echo "- Entry: \`$ENTRY\`"
          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT
          unzip -p "$ZIP" "$ENTRY" > "$TMP"
          python3 - "$TMP" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          p=sys.argv[1]; root=ET.parse(p).getroot()
          race=root.find("./imgdir[@name='RaceSelect']")
          print('\n## RaceSelect direct structure')
          if race is None: print('- MISSING')
          else:
              for c in race:
                  if c.tag=='imgdir': print(f'- `{c.attrib.get("name","")}` -> `{", ".join(x.attrib.get("name","") for x in c if x.tag=="imgdir")}`')
          print('\n## Class-family marker summary')
          xml=open(p,encoding='utf-8',errors='ignore').read()
          tests=[('Explorer',r'explor|advent'),('Cygnus',r'cygn|noblesse|knight'),('Aran',r'aran|legend'),('Evan',r'evan'),('Dual Blade',r'dual'),('Resistance',r'resistance|citizen'),('Battle Mage',r'battle.?mage'),('Wild Hunter',r'wild.?hunter'),('Mechanic',r'mechanic')]
          for label,rx in tests: print(f'- {label}: {len(re.findall(rx,xml,re.I))} matches')
          print('\n## Relevant selector paths')
          rx=re.compile(r'(race|char|create|select|job|evan|aran|dual|resistance|citizen|mechanic|wild|battle|knight|advent)',re.I)
          rows=[]
          def walk(n,path):
              name=n.attrib.get('name',''); here=f'{path}/{name}' if name else path
              if n.tag=='imgdir' and rx.search(here):
                  rows.append((here,[c.attrib.get('name','') for c in n if c.tag=='imgdir']))
              for c in n: walk(c,here)
          walk(root,'')
          for path,kids in rows[:180]: print(f'- `{path}` -> `{", ".join(kids)}`')
          PY
          REMOTE
          cat docs/CLIENT_SELECTOR_GMS_V95_STRUCTURE.md
      - name: Commit reports
        run: |
          set -euo pipefail
          git config user.name everleaf-client-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add docs/CLIENT_SELECTOR_LIVE_STRUCTURE.md docs/CLIENT_SELECTOR_GMS_V95_STRUCTURE.md
          if git diff --cached --quiet; then
            echo 'selector reports unchanged'
            exit 0
          fi
          git commit -m 'docs: compare live and v95 client selectors'
          git push origin HEAD:feature/client-job-selector-modernization-20260904
