name: Audit quest content references

on:
  push:
    branches:
      - master
      - release-dev
    paths:
      - 'wz/Quest.wz/**'
      - 'wz/Item.wz/**'
      - 'wz/Character.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Map.wz/Map/**'
      - 'tools/audit_quest_content_refs.py'
      - '.github/workflows/audit-quest-content-refs.yml'
  pull_request:
    branches:
      - master
      - release-dev
    paths:
      - 'wz/Quest.wz/**'
      - 'wz/Item.wz/**'
      - 'wz/Character.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Map.wz/Map/**'
      - 'tools/audit_quest_content_refs.py'
      - '.github/workflows/audit-quest-content-refs.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit active quest item mob and map references
        run: python3 tools/audit_quest_content_refs.py
