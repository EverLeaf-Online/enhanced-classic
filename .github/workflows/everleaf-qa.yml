name: EverLeaf QA Agents

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'database/**'
      - 'src/main/java/**'
      - 'src/test/**'
      - 'wz/Map.wz/**'
      - 'wz/Npc.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Reactor.wz/**'
      - 'tools/qa/**'
      - 'tools/audit_world_integrity.py'
      - 'tools/audit_world_links.py'
      - 'deploy/qa/**'
      - '.github/workflows/everleaf-qa.yml'
  push:
    branches:
      - master
      - enhanced-dev
      - content-dev
      - progression-dev
      - qa-agent-hub
      - release-dev
    paths:
      - 'scripts/**'
      - 'database/**'
      - 'src/main/java/**'
      - 'src/test/**'
      - 'wz/Map.wz/**'
      - 'wz/Npc.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Reactor.wz/**'
      - 'tools/qa/**'
      - 'tools/audit_world_integrity.py'
      - 'tools/audit_world_links.py'
      - 'deploy/qa/**'
      - '.github/workflows/everleaf-qa.yml'

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test runtime QA safety gates
        run: python3 -m unittest tools/qa/test_runtime_qa.py -v

      - name: Validate staging QA tooling
        run: |
          python3 -m py_compile tools/qa/staging_probe.py tools/qa/everleaf_runtime_qa.py tools/qa/audit_trade_fm_integration.py tools/audit_world_integrity.py tools/audit_world_links.py
          cp deploy/qa/.env.qa.example deploy/qa/.env.qa
          sed -i 's/replace-with-a-long-random-value/ci-only-not-a-production-secret/' deploy/qa/.env.qa
          docker compose --env-file deploy/qa/.env.qa -f deploy/qa/docker-compose.qa.yml -p everleaf-qa config >/dev/null
          rm -f deploy/qa/.env.qa

      - name: Run baseline QA agent hub
        run: |
          mkdir -p build
          python3 tools/qa/everleaf_qa.py \
            --json build/qa-report.json \
            --markdown build/qa-report.md

      - name: Run established NPC spawn auditor
        run: python3 scripts/audit_npc_spawns.py --json > build/npc-spawn-audit.json

      - name: Run world integrity audit
        run: python3 tools/audit_world_integrity.py --json > build/world-integrity-audit.json

      - name: Run static world link audit
        run: python3 tools/audit_world_links.py --json > build/world-link-audit.json

      - name: Verify Trade to Free Market integration
        run: python3 tools/qa/audit_trade_fm_integration.py

      - name: Run deep QA correlations
        run: python3 tools/qa/everleaf_deep_qa.py --json build/deep-qa-report.json

      - name: Print deep QA summary
        if: always()
        run: |
          if [ -f build/deep-qa-report.json ]; then
            python3 -c 'import json; d=json.load(open("build/deep-qa-report.json")); print("Deep QA:", d["summary"])'
          fi

      - name: Upload QA reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-qa-report
          path: |
            build/qa-report.json
            build/qa-report.md
            build/npc-spawn-audit.json
            build/world-integrity-audit.json
            build/world-link-audit.json
            build/deep-qa-report.json
          if-no-files-found: warn
