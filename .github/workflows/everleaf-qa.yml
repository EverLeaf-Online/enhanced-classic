name: EverLeaf QA Agents

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'database/**'
      - 'src/main/java/**'
      - 'src/test/**'
      - 'wz/Map.wz/**'
      - 'wz/Npc.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Reactor.wz/**'
      - 'tools/**'
      - 'deploy/qa/**'
      - '.github/workflows/everleaf-qa.yml'
  push:
    branches:
      - master
      - enhanced-dev
      - content-dev
      - progression-dev
      - qa-agent-hub
      - release-dev
    paths:
      - 'scripts/**'
      - 'database/**'
      - 'src/main/java/**'
      - 'src/test/**'
      - 'wz/Map.wz/**'
      - 'wz/Npc.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Reactor.wz/**'
      - 'tools/**'
      - 'deploy/qa/**'
      - '.github/workflows/everleaf-qa.yml'

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test runtime QA safety gates
        run: python3 -m unittest tools/qa/test_runtime_qa.py -v

      - name: Validate staging QA tooling
        run: |
          python3 -m py_compile tools/qa/staging_probe.py tools/qa/everleaf_runtime_qa.py
          cp deploy/qa/.env.qa.example deploy/qa/.env.qa
          sed -i 's/replace-with-a-long-random-value/ci-only-not-a-production-secret/' deploy/qa/.env.qa
          docker compose --env-file deploy/qa/.env.qa -f deploy/qa/docker-compose.qa.yml -p everleaf-qa config >/dev/null
          rm -f deploy/qa/.env.qa

      - name: Run baseline QA agent hub
        run: |
          mkdir -p build
          python3 tools/qa/everleaf_qa.py \
            --json build/qa-report.json \
            --markdown build/qa-report.md

      - name: Run established NPC spawn auditor
        run: python3 scripts/audit_npc_spawns.py --json > build/npc-spawn-audit.json

      - name: Run world integrity audit
        run: python3 tools/audit_world_integrity.py --json > build/world-integrity-audit.json

      - name: Run static world-link audit
        run: |
          set +e
          python3 tools/audit_world_links.py --json > build/world-links-audit.json
          rc=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/world-links-audit.json')
          if path.exists():
              data = json.loads(path.read_text())
              print('World-link hard failures:', data.get('hardFailureCount', 0))
              for finding in data.get('hardFindings', [])[:60]:
                  print('[WORLD-LINK FAIL]', finding.get('map_id'), finding.get('object_id'), finding.get('detail'))
              errors = data.get('parseErrors', [])
              for error in errors[:20]:
                  print('[WORLD-LINK XML FAIL]', error)
          PY
          exit $rc

      - name: Run deep QA correlations
        if: always()
        run: python3 tools/qa/everleaf_deep_qa.py --json build/deep-qa-report.json

      - name: Print deep QA summary
        if: always()
        run: |
          if [ -f build/deep-qa-report.json ]; then
            python3 -c 'import json; d=json.load(open("build/deep-qa-report.json")); print("Deep QA:", d["summary"])'
          fi
          if [ -f build/world-integrity-audit.json ]; then
            python3 -c 'import json; d=json.load(open("build/world-integrity-audit.json")); print("World integrity: hard failures=", d.get("hardFailureCount"), "review=", d.get("reviewFindingCount"))'
          fi
          if [ -f build/world-links-audit.json ]; then
            python3 -c 'import json; d=json.load(open("build/world-links-audit.json")); print("World links: hard failures=", d.get("hardFailureCount"), "review=", d.get("reviewFindingCount"))'
          fi

      - name: Upload QA reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-qa-report
          path: |
            build/qa-report.json
            build/qa-report.md
            build/npc-spawn-audit.json
            build/world-integrity-audit.json
            build/world-links-audit.json
            build/deep-qa-report.json
          if-no-files-found: warn
