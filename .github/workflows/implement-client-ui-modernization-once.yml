name: Implement EverLeaf client UI modernization once

# validation rerun 2026-09-04T12:49Z
on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths:
      - '.github/workflows/implement-client-ui-modernization-once.yml'
      - 'client/scripts/apply-ui-modernization.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904
          fetch-depth: 0

      - name: Apply modern UI source changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python client/scripts/apply-ui-modernization.py
          git diff --check
          git status --short

      - name: Commit source implementation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name everleaf-client-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add client/ezorsia/ezorsia/Client.h client/ezorsia/ezorsia/Client.cpp client/ezorsia/ezorsia/MainMain.cpp client/ezorsia/ezorsia/dllmain.cpp client/ezorsia/ezorsia/config.ini docs/CLIENT_UI_MODERNIZATION.md
          if (git diff --cached --quiet) {
            Write-Host 'UI source implementation already applied.'
          } else {
            git commit -m 'client: activate modern classic UI foundation'
            git pull --rebase origin feature/client-job-selector-modernization-20260904
            git push origin HEAD:feature/client-job-selector-modernization-20260904
          }

      - name: Apply production Community UI transform
        shell: pwsh
        run: python client/scripts/apply-community-ui-preference.py

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Win32 Release
        shell: pwsh
        run: msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify UI modernization markers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $all=(Get-Content client/ezorsia/ezorsia/Client.cpp -Raw)+(Get-Content client/ezorsia/ezorsia/dllmain.cpp -Raw)+(Get-Content client/ezorsia/ezorsia/MainMain.cpp -Raw)+(Get-Content client/ezorsia/ezorsia/config.ini -Raw)
          foreach($marker in @('ModernLoginUI','ShowFutureClassCards','PositionLoginDlg','0x0075C783','0x00761714')) {
            if(-not $all.Contains($marker)){ throw "Missing UI modernization marker: $marker" }
          }
          if(-not (Test-Path client/ezorsia/out/Release/dinput8.dll)){ throw 'Missing dinput8.dll build output' }
