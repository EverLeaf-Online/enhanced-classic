name: Test Discord safe overwrite reconciliation

on:
  push:
    branches:
      - fix-discord-safe-overwrites
    paths:
      - tools/everleaf-ops/reconcile-discord-community-unlocked.js
      - tools/everleaf-ops/audit-discord-community.js
      - .github/workflows/test-discord-safe-overwrites.yml

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate Discord tools
        run: |
          node --check tools/everleaf-ops/reconcile-discord-community-unlocked.js
          node --check tools/everleaf-ops/audit-discord-community.js
          node --test tools/everleaf-ops/discord-community-config.test.js
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Reconcile and audit Discord
        shell: bash
        run: |
          set -euo pipefail
          discord_dir="/tmp/everleaf-discord-test-$GITHUB_RUN_ID"
          trap 'ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "rm -rf \"$discord_dir\"" >/dev/null 2>&1 || true' EXIT
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "install -d -m 700 '$discord_dir'"
          scp -i ~/.ssh/id_everleaf tools/everleaf-ops/reconcile-discord-community-unlocked.js tools/everleaf-ops/audit-discord-community.js "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$discord_dir/"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            "sudo node '$discord_dir/reconcile-discord-community-unlocked.js' /etc/everleaf/discord-bot.env && sudo node '$discord_dir/audit-discord-community.js' /etc/everleaf/discord-bot.env"
