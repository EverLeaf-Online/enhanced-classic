name: Reanalyze GMS v95 core7 donor

on:
  push:
    branches:
      - release-dev
    paths:
      - 'tools/wz-donor/wz_diff.py'
      - 'tools/wz-donor/build_import_manifest.py'
      - 'tools/wz-donor/render_review_report.py'
      - '.github/workflows/reanalyze-gms-v95-core7.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  reanalyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Fetch validated core7 XML archive from Oracle
        run: |
          set -euo pipefail
          remote=/opt/everleaf/private/wz-donors/gms-v95-core7.zip
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            "set -e; test -f '$remote'; unzip -t '$remote' >/dev/null; sha256sum '$remote'"
          scp -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote" \
            "$RUNNER_TEMP/gms-v95-core7.zip"
          actual="$(sha256sum "$RUNNER_TEMP/gms-v95-core7.zip" | awk '{print $1}')"
          expected='62e106f8437ce04443c797c0514e14d430fcc0a10ae4131f16567f540a8d5d3c'
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/gms-v95-core7"
          unzip -q "$RUNNER_TEMP/gms-v95-core7.zip" -d "$RUNNER_TEMP/gms-v95-core7"
          count="$(find "$RUNNER_TEMP/gms-v95-core7" -type f -name '*.xml' | wc -l)"
          echo "Validated core7 XML files: $count"
          test "$count" -eq 14527

      - name: Recompute v83 to v95 core7 analysis
        run: |
          set -euo pipefail
          donor="$RUNNER_TEMP/gms-v95-core7"
          diff="$RUNNER_TEMP/wz-gms-v95-core7-diff.json"
          manifest="$RUNNER_TEMP/wz-gms-v95-core7-import-manifest.json"
          review="$RUNNER_TEMP/wz-gms-v95-core7-review.md"
          python tools/wz-donor/wz_diff.py --baseline wz --donor "$donor" --donor-id gms-v95-core7 --output "$diff"
          python tools/wz-donor/build_import_manifest.py "$diff" --output "$manifest"
          python tools/wz-donor/render_review_report.py "$diff" "$manifest" --output "$review"
          printf '\n> **Deferred family:** Character.wz remains excluded pending a compatible v95 extraction source.\n' >> "$review"
          cat "$review" >> "$GITHUB_STEP_SUMMARY"
          python - "$diff" "$manifest" <<'PY'
          import collections, json, sys
          diff=json.load(open(sys.argv[1], encoding='utf-8'))
          manifest=json.load(open(sys.argv[2], encoding='utf-8'))
          print('delta totals:', json.dumps(diff['totals'], sort_keys=True))
          print('missing dependencies:', diff.get('dependencies', {}).get('missingReferenceCount'))
          print('risk counts:', json.dumps(manifest['riskCounts'], sort_keys=True))
          by_category=collections.defaultdict(collections.Counter)
          for candidate in manifest['candidates']:
              by_category[candidate['category']][candidate['risk']] += 1
          print('risk by category:', json.dumps({k: dict(v) for k,v in sorted(by_category.items())}, sort_keys=True))
          low=[c for c in manifest['candidates'] if c['risk']=='low']
          print('low-risk candidate IDs:', ','.join(f"{c['category']}:{c['contentId']}" for c in low[:250]))
          PY

      - name: Upload corrected v95 core7 analysis
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-core7-reanalysis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wz-gms-v95-core7-diff.json
            ${{ runner.temp }}/wz-gms-v95-core7-import-manifest.json
            ${{ runner.temp }}/wz-gms-v95-core7-review.md
          retention-days: 14
          if-no-files-found: error
