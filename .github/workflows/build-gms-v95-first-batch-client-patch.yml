name: Build GMS v95 first batch client WZ candidate

on:
  pull_request:
    branches:
      - release-dev
    paths:
      - '.github/workflows/build-gms-v95-first-batch-client-patch.yml'
      - 'tools/wz-donor/client-patcher/Program.cs'
      - 'tools/wz-donor/verify_client_server_parity.py'
      - 'tools/wz-donor/batches/gms-v95-consume-batch-001-parity.json'
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/build-gms-v95-first-batch-client-patch.yml'
      - 'tools/wz-donor/client-patcher/Program.cs'
      - 'tools/wz-donor/verify_client_server_parity.py'
      - 'tools/wz-donor/batches/gms-v95-consume-batch-001-parity.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  client-patch:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($keyPath, ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          $knownHosts = Join-Path $sshDir 'known_hosts'
          $gitKeyscan = 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe'
          if (-not (Test-Path $gitKeyscan)) { throw "Git OpenSSH keyscan not found: $gitKeyscan" }
          if ($env:SSH_KNOWN_HOSTS) {
            [IO.File]::WriteAllText($knownHosts, ($env:SSH_KNOWN_HOSTS -replace "`r", "") + "`n")
          } else {
            & $gitKeyscan -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $knownHosts
            if ($LASTEXITCODE -ne 0) { throw "Git ssh-keyscan failed with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path $knownHosts) -or (Get-Item $knownHosts).Length -eq 0) { throw 'known_hosts is empty' }

      - name: Fetch exact live EverLeaf client WZ and private v95 donor copies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          $sshExe = 'C:\Program Files\Git\usr\bin\ssh.exe'
          $scpExe = 'C:\Program Files\Git\usr\bin\scp.exe'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'everleaf-client-source'
          $donorDir = Join-Path $env:RUNNER_TEMP 'gms-v95-raw'
          New-Item -ItemType Directory -Force -Path $sourceDir,$donorDir | Out-Null

          $remoteLiveItem = '/opt/everleaf/patches/files/Item.wz'
          $remoteLiveString = '/opt/everleaf/patches/files/String.wz'
          $remoteDonorItem = '/opt/everleaf/private/wz-donors/gms-v95-raw/Item.wz'
          $remoteDonorString = '/opt/everleaf/private/wz-donors/gms-v95-raw/String.wz'

          $before = & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" `
            "set -e; test -f '$remoteLiveItem'; test -f '$remoteLiveString'; test -f '$remoteDonorItem'; test -f '$remoteDonorString'; sha256sum '$remoteLiveItem' '$remoteLiveString' '$remoteDonorItem' '$remoteDonorString'"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to hash Oracle source WZ files' }
          $before | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'REMOTE_SOURCE_HASHES_BEFORE.txt')

          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteLiveItem" (Join-Path $sourceDir 'Item.wz')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to copy live Item.wz' }
          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteLiveString" (Join-Path $sourceDir 'String.wz')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to copy live String.wz' }
          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteDonorItem" (Join-Path $donorDir 'Item.wz')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to copy donor Item.wz' }
          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteDonorString" (Join-Path $donorDir 'String.wz')
          if ($LASTEXITCODE -ne 0) { throw 'Failed to copy donor String.wz' }

          Get-FileHash (Join-Path $sourceDir 'Item.wz') -Algorithm SHA256
          Get-FileHash (Join-Path $sourceDir 'String.wz') -Algorithm SHA256
          Get-FileHash (Join-Path $donorDir 'Item.wz') -Algorithm SHA256
          Get-FileHash (Join-Path $donorDir 'String.wz') -Algorithm SHA256

      - name: Build MapleLib raw client patcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafClientWzPatcher'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item 'tools/wz-donor/client-patcher/Program.cs' (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\MapleLib\MapleLib.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafClientWzPatcher.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafClientWzPatcher.csproj') -c Release

      - name: Build and reparse isolated client WZ candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceDir = Join-Path $env:RUNNER_TEMP 'everleaf-client-source'
          $donorDir = Join-Path $env:RUNNER_TEMP 'gms-v95-raw'
          $outputDir = Join-Path $env:RUNNER_TEMP 'gms-v95-consume-batch-001-client-candidate'
          $project = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafClientWzPatcher/EverLeafClientWzPatcher.csproj'
          dotnet run --project $project -c Release --no-build -- `
            (Join-Path $sourceDir 'Item.wz') `
            (Join-Path $sourceDir 'String.wz') `
            (Join-Path $donorDir 'Item.wz') `
            (Join-Path $donorDir 'String.wz') `
            $outputDir
          Get-Content (Join-Path $outputDir 'CLIENT_PATCH_MANIFEST.json') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Verify pinned server-client semantic parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Join-Path $env:RUNNER_TEMP 'gms-v95-consume-batch-001-client-candidate'
          python tools/wz-donor/verify_client_server_parity.py `
            tools/wz-donor/batches/gms-v95-consume-batch-001-parity.json `
            (Join-Path $outputDir 'CLIENT_PATCH_MANIFEST.json') `
            --output (Join-Path $outputDir 'CLIENT_SERVER_PARITY_REPORT.json')
          Get-Content (Join-Path $outputDir 'CLIENT_SERVER_PARITY_REPORT.json') | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Prove live Oracle client sources stayed byte-identical
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          $sshExe = 'C:\Program Files\Git\usr\bin\ssh.exe'
          $remoteLiveItem = '/opt/everleaf/patches/files/Item.wz'
          $remoteLiveString = '/opt/everleaf/patches/files/String.wz'
          $remoteDonorItem = '/opt/everleaf/private/wz-donors/gms-v95-raw/Item.wz'
          $remoteDonorString = '/opt/everleaf/private/wz-donors/gms-v95-raw/String.wz'
          $after = & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" `
            "set -e; sha256sum '$remoteLiveItem' '$remoteLiveString' '$remoteDonorItem' '$remoteDonorString'"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to re-hash Oracle source WZ files' }
          $beforeLines = Get-Content (Join-Path $env:RUNNER_TEMP 'REMOTE_SOURCE_HASHES_BEFORE.txt') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $afterLines = $after | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          if ($beforeLines.Count -ne $afterLines.Count) { throw 'Oracle source WZ hash record count changed during candidate build' }
          for ($i = 0; $i -lt $beforeLines.Count; $i++) {
            if ($beforeLines[$i] -ne $afterLines[$i]) {
              throw "Oracle source WZ hash changed at record $i`nBEFORE: $($beforeLines[$i])`nAFTER: $($afterLines[$i])"
            }
          }
          Write-Host 'Oracle source WZ hashes are byte-identical before and after candidate build.'

      - name: Store candidate privately on Oracle after release merge only
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          $sshExe = 'C:\Program Files\Git\usr\bin\ssh.exe'
          $scpExe = 'C:\Program Files\Git\usr\bin\scp.exe'
          $outputDir = Join-Path $env:RUNNER_TEMP 'gms-v95-consume-batch-001-client-candidate'
          $zip = Join-Path $env:RUNNER_TEMP 'gms-v95-consume-batch-001-client-candidate.zip'
          Compress-Archive -Path (Join-Path $outputDir '*') -DestinationPath $zip -CompressionLevel Optimal
          $remoteDir = "/opt/everleaf/private/wz-client-candidates/gms-v95-consume-batch-001/${{ github.sha }}"
          & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -e; mkdir -p '$remoteDir'; test ! -e '$remoteDir/client-candidate.zip'"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare private Oracle candidate directory' }
          & $scpExe -i $keyPath $zip "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteDir/client-candidate.zip.part"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload private client candidate' }
          & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" `
            "set -e; cd '$remoteDir'; unzip -t client-candidate.zip.part >/dev/null; mv client-candidate.zip.part client-candidate.zip; sha256sum client-candidate.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to validate private client candidate' }

      - name: Upload manifest and parity report only
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-consume-batch-001-client-manifest-${{ github.sha }}
          path: |
            ${{ runner.temp }}/gms-v95-consume-batch-001-client-candidate/CLIENT_PATCH_MANIFEST.json
            ${{ runner.temp }}/gms-v95-consume-batch-001-client-candidate/CLIENT_SERVER_PARITY_REPORT.json
          retention-days: 14
          if-no-files-found: error
