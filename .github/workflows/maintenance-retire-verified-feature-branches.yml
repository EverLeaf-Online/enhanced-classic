name: Maintenance retire verified feature branches

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/maintenance-retire-verified-feature-branches.yml'

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch canonical branches
        run: |
          git fetch origin \
            '+refs/heads/release-dev:refs/remotes/origin/release-dev' \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/heads/client-dev:refs/remotes/origin/client-dev'
      - name: Verify maintained behavior before retiring old branches
        shell: bash
        run: |
          set -euo pipefail
          require() {
            local ref="$1" path="$2" marker="$3"
            git show "$ref:$path" | grep -Fq -- "$marker" || {
              echo "Missing required marker '$marker' in $ref:$path" >&2
              exit 1
            }
          }

          require origin/release-dev src/main/java/server/events/gm/Ola.java 'generateCorrectPortals'
          require origin/release-dev src/main/java/net/server/channel/handlers/EnterMTSHandler.java 'getHiredMerchant()'
          require origin/release-dev src/main/java/server/Storage.java 'isStorageOpen'
          require origin/release-dev src/main/java/net/server/channel/handlers/NPCShopHandler.java 'tryacquireClient'
          require origin/release-dev src/main/java/net/server/channel/handlers/ItemMoveHandler.java 'EquipmentRequirements.canEquipForJob'
          require origin/release-dev launcher/EverLeaf.Launcher/BoundedDownload.cs 'expectedBytes'
          require origin/release-dev launcher/EverLeaf.Launcher/LaunchTicket.cs '.everleaf-launch'
          require origin/master web/src/routes/vote.js 'queueVerifiedVoteNx'
          require origin/master web/scripts/backup-mysql.js 'Intentionally do not use --databases'
          require origin/master web/src/views/wiki-entry.ejs 'PROVENANCE'
          require origin/client-dev client/tools/evan-xml-donor-builder/main.cpp 'EverLeaf Evan XML donor build: PASS'
      - name: Delete only the explicitly verified superseded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'fix/ola-ola-event-flow'
            'fix/fm-shortcut-guards'
            'fix/storage-session-auth'
            'fix/npc-shop-client-lock'
            'items-equipment-validation'
            'fix/launcher-bounded-download'
            'fix/launcher-update-fail-closed'
            'fix/restore-gtop-voting'
            'fix-schema-neutral-backups'
            'build-evan-donor-from-xml'
            'web/wiki-deploy-fix'
            'web/wiki-library-v1'
            'web/wiki-library-v1-release'
            'web/wiki-library-v2'
          )
          deleted=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "RETIRE $branch"
              git push origin --delete "$branch"
              deleted=$((deleted + 1))
            else
              echo "Already absent: $branch"
            fi
          done
          echo "Retired verified superseded branches: $deleted"
