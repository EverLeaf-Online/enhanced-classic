name: Audit live Ninja mob 9400410

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/audit-live-ninja-9400410.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Classify 9400410 on Oracle
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== 9400410 preserved full-v95 XML references ==='
          trees=0; refs=0; mobfiles=0
          while IFS= read -r d; do
            [ -d "$d/Map.wz" ] || continue
            count=$(find "$d" -type f -name '*.xml' 2>/dev/null | wc -l)
            [ "$count" -ge 44000 ] || continue
            find "$d/Map.wz" -type f -name '800040000.img.xml' -print -quit | grep -q . || continue
            trees=$((trees+1))
            echo "TREE $d xml=$count"
            m=$(grep -R -l --include='*.xml' -w '9400410' "$d/Map.wz" 2>/dev/null | wc -l)
            q=$(grep -R -l --include='*.xml' -w '9400410' "$d/Quest.wz" 2>/dev/null | wc -l)
            r=$(grep -R -l --include='*.xml' -w '9400410' "$d/Mob.wz" 2>/dev/null | wc -l)
            f=$(find "$d/Mob.wz" -type f -name '9400410.img.xml' | wc -l)
            echo "  map_reference_files=$m quest_reference_files=$q mob_reference_files=$r exact_mob_files=$f"
            if [ "$m" -gt 0 ]; then grep -R -l --include='*.xml' -w '9400410' "$d/Map.wz" | head -20; fi
            if [ "$q" -gt 0 ]; then grep -R -l --include='*.xml' -w '9400410' "$d/Quest.wz" | head -20; fi
            refs=$((refs+m+q)); mobfiles=$((mobfiles+f))
          done < <(find /opt/everleaf /home/ubuntu/everleaf-staging -maxdepth 6 -type d \( -name wz -o -name server-wz-xml \) 2>/dev/null | sort -u)
          echo "PRESERVED_SUMMARY trees=$trees gameplay_reference_files=$refs exact_mob_files=$mobfiles"

          echo '=== production DB references ==='
          spawn=$(sudo mysql -NBe "SELECT COUNT(*) FROM cosmic.monsters WHERE monsterid=9400410;" 2>/dev/null || echo 0)
          drops=$(sudo mysql -NBe "SELECT COUNT(*) FROM cosmic.drop_data WHERE dropperid=9400410;" 2>/dev/null || echo 0)
          qdrops=$(sudo mysql -NBe "SELECT COUNT(*) FROM cosmic.drop_data WHERE itemid IN (4000337,4000338,4000339,4000340,4000341,4000342,4000343,4000344,4000345,4000346) AND dropperid=9400410;" 2>/dev/null || echo 0)
          echo "db_monster_spawn_rows=$spawn db_drop_rows=$drops db_ninja_material_rows=$qdrops"

          echo '=== raw pinned donor exact asset ==='
          test -s /opt/everleaf/private/wz-donors/gms-v95-raw/Mob.wz && echo raw_donor_mob_wz_present=yes
          echo "NINJA_9400410_AUDIT_COMPLETE preserved_trees=$trees gameplay_refs=$refs exact_preserved_assets=$mobfiles db_spawns=$spawn db_drops=$drops"
          REMOTE
