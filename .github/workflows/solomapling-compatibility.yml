name: SoloMapling compatibility probe

on:
  push:
    branches:
      - feature/solomapling-qa-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Overlay missing pinned GCMove sources
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          mkdir -p "$target"
          for src in "$upstream"/*.java; do
            dst="$target/$(basename "$src")"
            if [ ! -e "$dst" ]; then
              cp "$src" "$dst"
            fi
          done

      - name: Compile full GCMove system against EverLeaf
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B -DskipTests compile --file pom.xml
