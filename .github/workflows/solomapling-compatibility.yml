name: SoloMapling compatibility probe

on:
  push:
    branches:
      - feature/solomapling-qa-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Apply EverLeaf configuration and SoloMapling host hooks
        run: python3 tools/apply_everleaf_config.py

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Overlay pinned GCMove core sources
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          mkdir -p "$target"
          cp "$upstream"/*.java "$target"/

          # Keep the compatibility checkpoint focused on GCMove's physics/navigation
          # core. These files are higher-level social/travel adapters whose external
          # SoloMapling dependencies are intentionally integrated in the next batch.
          rm -f \
            "$target/BotPlayerReaction.java" \
            "$target/GCMovement.java" \
            "$target/GCTaxi.java" \
            "$target/GCTravel.java" \
            "$target/GCWorldGraph.java"

      - name: Compile GCMove physics/navigation core against EverLeaf
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B -DskipTests compile --file pom.xml
