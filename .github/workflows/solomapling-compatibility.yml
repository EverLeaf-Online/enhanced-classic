name: SoloMapling compatibility probe

on:
  push:
    branches:
      - feature/solomapling-qa-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/solomapling-qa-integration
          fetch-depth: 0

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Vendor only missing GCMove sources
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          mkdir -p "$target"

          for source in "$upstream"/*.java; do
            name=$(basename "$source")
            destination="$target/$name"
            if [[ -e "$destination" ]]; then
              echo "KEEP EverLeaf/adapted: $name"
              continue
            fi
            cp "$source" "$destination"
            echo "ADD pinned upstream: $name"
          done

      - name: Verify adapted files were not overwritten
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Deliberately disabled for deterministic QA bots' src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/BotPlayerReaction.java
          grep -q 'map.getFootholds().findBelow' src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/BotNavigationGraph.java
          grep -q 'map.addRope(new Rope' src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/BotNavigationMapLoader.java

      - name: Commit vendored runtime when needed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .solomapling-upstream
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          if git diff --cached --quiet; then
            echo 'GCMove runtime already fully vendored.'
            exit 0
          fi
          git commit -m 'feat(qa): vendor pinned GCMove runtime'
          git push origin HEAD:feature/solomapling-qa-integration

  compile-probe:
    needs: vendor-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v5
        with:
          ref: feature/solomapling-qa-integration

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Apply EverLeaf configuration and SoloMapling host hooks
        run: python3 tools/apply_everleaf_config.py

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Overlay pinned GCMove sources with EverLeaf QA policy
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          mkdir -p "$target"
          cp "$upstream"/*.java "$target"/

          # EverLeaf QA keeps ambient player chat/emote reactions disabled so
          # automated movement/combat/travel tests remain deterministic.
          git checkout HEAD -- "$target/BotPlayerReaction.java"

      - name: Compile full GCMove system against EverLeaf
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B -DskipTests compile --file pom.xml
