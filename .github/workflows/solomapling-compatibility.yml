name: SoloMapling compatibility probe

on:
  push:
    branches:
      - feature/solomapling-qa-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Apply EverLeaf configuration and SoloMapling host hooks
        run: python3 tools/apply_everleaf_config.py

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Validate committed GCMove runtime against pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem

          upstream_count=$(find "$upstream" -maxdepth 1 -type f -name '*.java' | wc -l)
          test "$upstream_count" -eq 29

          # These seven upstream files are deliberately EverLeaf-reconciled and are
          # validated separately by tools/audit_solomapling_qa.py.
          reconciled='^(BotMovementProfile|BotMovementState|BotNavigationGraph|BotNavigationMapLoader|BotPlayerReaction|GCPortals|MovementPlan)\.java$'

          for file in "$upstream"/*.java; do
            name=$(basename "$file")
            test -f "$target/$name"
            if [[ "$name" =~ $reconciled ]]; then
              echo "EverLeaf-reconciled: $name"
              continue
            fi
            cmp -s "$file" "$target/$name" || {
              echo "Unexpected drift from pinned SoloMapling v0.3: $name"
              diff -u "$file" "$target/$name" || true
              exit 1
            }
          done

          # EverLeaf may add narrowly-scoped QA helpers in this package, but the
          # allowlist is explicit so an accidental extra GCMove runtime file fails closed.
          for file in "$target"/*.java; do
            name=$(basename "$file")
            if [ -f "$upstream/$name" ]; then
              continue
            fi
            case "$name" in
              GCMovementDiagnostics.java)
                echo "EverLeaf extension: $name"
                ;;
              *)
                echo "Unexpected EverLeaf-only GCMove file: $name"
                exit 1
                ;;
            esac
          done

      - name: Compile committed GCMove runtime against EverLeaf
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B -DskipTests compile --file pom.xml
