name: Apply EverLeaf Evan client runtime gates once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths:
      - '.github/workflows/patch-client-evan-runtime-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904
          fetch-depth: 0
      - name: Add verified Evan v83 runtime patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('client/ezorsia/ezorsia/Client.cpp')
          s=p.read_text()
          needle='\tMemory::WriteDouble(0x00AFE8A0, setDamageCap);\t//ty rain\n'
          if needle not in s:
              raise SystemExit('startup anchor missing')
          block='''\t// Evan client compatibility: v83 contains most Evan client logic, but two\n\t// SkillInfo gates reject Evan skills. These exact v83 addresses are the\n\t// established Evan compatibility edits; keep them post-unpack with the\n\t// rest of EverLeaf's runtime client patches.\n\tMemory::FillBytes(0x0075C783, 0x90, 4);\n\tMemory::FillBytes(0x00761714, 0x90, 21);\n\n'''
          if '0x0075C783' not in s:
              s=s.replace(needle,block+needle,1)
              p.write_text(s)
          PY
          git diff --check
          grep -n -A8 -B2 'Evan client compatibility' client/ezorsia/ezorsia/Client.cpp
          git config user.name everleaf-client-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add client/ezorsia/ezorsia/Client.cpp
          git commit -m 'client: enable Evan runtime skill gates'
          git push origin HEAD:feature/client-job-selector-modernization-20260904
