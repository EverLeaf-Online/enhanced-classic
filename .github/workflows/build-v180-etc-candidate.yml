name: Stage GMS v180 donor-only Etc candidate

on:
  push:
    branches: [donor/v180-low-friction-stage-20260911]
    paths:
      - '.github/workflows/build-v180-etc-candidate.yml'
      - 'tools/wz-donor/v180-static-client-patcher/Program.cs'
  workflow_dispatch:

concurrency:
  group: everleaf-v180-etc-stage
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  TARGET_ROOT: /opt/everleaf/patches/files
  DONOR_ROOT: /opt/everleaf/donors/GMS-v180/GMS-v180/MapleStory
  MANIFEST_ROOT: /opt/everleaf/donors/v180-backport
  STAGE_ROOT: /opt/everleaf/donors/v180-backport/etc-client-candidate

jobs:
  stage-etc:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'; New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'),($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}
          else { & 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known }
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 30
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')

      - name: Validate Etc inputs and prepare isolated stage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $checks=@(
            "$env:DONOR_ROOT/ZLZ.dll",
            "$env:DONOR_ROOT/Etc.wz",
            "$env:TARGET_ROOT/Etc.wz",
            "$env:MANIFEST_ROOT/etc_all.txt"
          )
          foreach($p in $checks){ ssh everleaf-oracle "test -s '$p'"; if($LASTEXITCODE){throw "Missing Oracle input: $p"} }
          ssh everleaf-oracle "sudo rm -rf '$env:STAGE_ROOT' && sudo mkdir -p '$env:STAGE_ROOT' && sudo chown -R ubuntu:ubuntu '$env:STAGE_ROOT'"
          if($LASTEXITCODE){throw 'Oracle Etc staging preparation failed'}

      - name: Build MapleLib static patcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $tool=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafV180StaticPatcher'; New-Item -ItemType Directory -Force -Path $tool | Out-Null
          Copy-Item tools/wz-donor/v180-static-client-patcher/Program.cs (Join-Path $tool 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $tool 'EverLeafV180StaticPatcher.csproj')
          dotnet build (Join-Path $tool 'EverLeafV180StaticPatcher.csproj') -c Release

      - name: Fetch Etc target donor and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $work=Join-Path $env:RUNNER_TEMP 'v180-etc'; New-Item -ItemType Directory -Force -Path $work | Out-Null
          $target=Join-Path $work 'target'; $donor=Join-Path $work 'donor'; New-Item -ItemType Directory -Force -Path $target,$donor | Out-Null
          scp "everleaf-oracle`:$env:TARGET_ROOT/Etc.wz" (Join-Path $target 'Etc.wz'); if($LASTEXITCODE){throw 'Target Etc fetch failed'}
          scp "everleaf-oracle`:$env:DONOR_ROOT/Etc.wz" (Join-Path $donor 'Etc.wz'); if($LASTEXITCODE){throw 'Donor Etc fetch failed'}
          scp "everleaf-oracle`:$env:DONOR_ROOT/ZLZ.dll" (Join-Path $donor 'ZLZ.dll'); if($LASTEXITCODE){throw 'ZLZ fetch failed'}
          scp "everleaf-oracle`:$env:MANIFEST_ROOT/etc_all.txt" (Join-Path $work 'etc_all.txt'); if($LASTEXITCODE){throw 'Etc manifest fetch failed'}

      - name: Build verify and upload Etc candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafV180StaticPatcher/EverLeafV180StaticPatcher.csproj'
          $work=Join-Path $env:RUNNER_TEMP 'v180-etc'; $out=Join-Path $work 'out'; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $outputWz=Join-Path $out 'Etc.wz'; $manifest=Join-Path $out 'Etc.manifest.json'
          dotnet run --project $project -c Release --no-build -- (Join-Path $work 'target/Etc.wz') (Join-Path $work 'donor/Etc.wz') (Join-Path $work 'etc_all.txt') $outputWz $manifest
          if($LASTEXITCODE){throw 'Etc candidate build failed'}
          $m=Get-Content -Raw $manifest | ConvertFrom-Json
          if($m.productionApplyAllowed -ne $false){throw 'Etc manifest unexpectedly allows production apply'}
          if($m.validation.donorImageDigestsMatch -ne $true){throw 'Etc manifest digest verification failed'}
          if($m.requestedCount -ne 278 -or $m.stagedCount -ne 278 -or $m.verifiedCount -ne 278){throw 'Etc coverage is not 278/278'}
          scp $outputWz "everleaf-oracle`:$env:STAGE_ROOT/Etc.wz"; if($LASTEXITCODE){throw 'Etc candidate upload failed'}
          scp $manifest "everleaf-oracle`:$env:STAGE_ROOT/Etc.manifest.json"; if($LASTEXITCODE){throw 'Etc manifest upload failed'}
          ssh everleaf-oracle "sha256sum '$env:STAGE_ROOT/Etc.wz' > '$env:STAGE_ROOT/SHA256SUMS' && printf 'GMS v180 donor-only Etc.wz staging candidate. No production apply.\n' > '$env:STAGE_ROOT/README.txt'"
          if($LASTEXITCODE){throw 'Etc remote checksum write failed'}
