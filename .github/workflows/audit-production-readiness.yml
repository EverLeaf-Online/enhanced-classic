name: Audit EverLeaf production readiness

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/audit-production-readiness.yml'
  schedule:
    - cron: '23 9 * * *'
  workflow_run:
    workflows: ['Deploy EverLeaf Game Production']
    types: [completed]

concurrency:
  group: everleaf-production-audit
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_PUBLIC_BASE: https://everleafms.online
  EVERLEAF_TLS_HOST: everleafms.online

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Audit production, persistence, restore, and host security
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            "AUDIT_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
            set -euo pipefail
            case "$AUDIT_RUN_ID" in (*[!0-9]*|'') exit 2;; esac

            echo '### Runtime services'
            systemctl is-active --quiet everleaf.service
            systemctl is-active --quiet everleaf-web
            systemctl is-active --quiet nginx
            systemctl is-enabled --quiet everleaf-backup.timer
            systemctl is-active --quiet everleaf-backup.timer
            echo 'runtime_services=ready'

            echo '### Production secrets and file permissions'
            test -s /opt/everleaf/web/.env
            test "$(stat -c '%a' /opt/everleaf/web/.env)" = '600'
            read_env() { sed -n "s/^$1=//p" /opt/everleaf/web/.env | tail -1; }
            session_secret="$(read_env SESSION_SECRET)"
            game_db_password="$(read_env GAME_DB_PASSWORD)"
            test -n "$session_secret"
            test "$session_secret" != 'dev-only-change-me'
            test "${#session_secret}" -ge 32
            test -n "$game_db_password"
            test "$(read_env GAME_PASSWORD_MODE)" = 'bcrypt'
            echo 'production_secrets=ready'

            echo '### Host exposure and SSH hardening'
            mysql_listeners="$(ss -ltn | awk '$4 ~ /:3306$/ {print $4}')"
            test -n "$mysql_listeners"
            if printf '%s\n' "$mysql_listeners" | grep -Eq '(^|\[::\]|0\.0\.0\.0):3306$'; then
              echo 'MySQL must not listen publicly.' >&2
              exit 1
            fi
            sshd_effective="$(sudo sshd -T 2>/dev/null || true)"
            if [ -n "$sshd_effective" ]; then
              printf '%s\n' "$sshd_effective" | grep -qx 'passwordauthentication no'
              printf '%s\n' "$sshd_effective" | grep -Eq '^permitrootlogin (no|prohibit-password|without-password)$'
            fi
            echo 'host_security=ready'

            echo '### 20-channel topology'
            ss -ltn | awk '{print $4}' | grep -Eq '(^|:)8484$'
            for port in $(seq 7575 7594); do
              ss -ltn | awk '{print $4}' | grep -Eq "(^|:)$port$"
            done
            echo 'game_channels=20'

            echo '### Capacity guardrails'
            disk_percent="$(df -P /opt/everleaf | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
            test "$disk_percent" -lt 85
            avail_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
            test "${avail_kb:-0}" -gt 524288
            echo "oracle_disk_used_percent=$disk_percent"
            echo "memory_available_kb=$avail_kb"

            echo '### TLS'
            certificate_path="$(sudo find /etc/letsencrypt/live -name fullchain.pem -print -quit)"
            test -n "$certificate_path"
            sudo openssl x509 -checkend 604800 -noout -in "$certificate_path"
            sudo openssl x509 -checkhost everleafms.online -noout -in "$certificate_path"
            echo 'tls_certificate_next_7_days=ready'

            echo '### Backup integrity'
            latest_backup="$(sudo find /opt/everleaf/backups/web -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$latest_backup"
            sudo test -s "$latest_backup/.env"
            sudo test -s "$latest_backup/cms.sqlite"
            sudo test -s "$latest_backup/game-mysql.sql.gz"
            sudo test -s "$latest_backup/SHA256SUMS"
            sudo gzip -t "$latest_backup/game-mysql.sql.gz"
            sudo sh -c "cd '$latest_backup' && sha256sum -c SHA256SUMS >/dev/null"
            backup_age="$(( $(date +%s) - $(sudo stat -c %Y "$latest_backup") ))"
            test "$backup_age" -lt 90000
            echo "backup_age_seconds=$backup_age"

            echo '### Live database structural integrity'
            sudo mysqlcheck --check --silent cosmic
            sudo mysql --batch --skip-column-names cosmic <<'SQL'
          SELECT IF(COUNT(*)=0,'orphan_characters=0',CONCAT('FAIL orphan_characters=',COUNT(*)))
          FROM characters c LEFT JOIN accounts a ON a.id=c.accountid WHERE a.id IS NULL;
          SELECT IF(COUNT(*)=0,'orphan_character_inventory=0',CONCAT('FAIL orphan_character_inventory=',COUNT(*)))
          FROM inventoryitems i LEFT JOIN characters c ON c.id=i.characterid
          WHERE i.characterid IS NOT NULL AND c.id IS NULL;
          SELECT IF(COUNT(*)=0,'orphan_account_inventory=0',CONCAT('FAIL orphan_account_inventory=',COUNT(*)))
          FROM inventoryitems i LEFT JOIN accounts a ON a.id=i.accountid
          WHERE i.accountid IS NOT NULL AND a.id IS NULL;
          SELECT IF(COUNT(*)=0,'orphan_inventoryequipment=0',CONCAT('FAIL orphan_inventoryequipment=',COUNT(*)))
          FROM inventoryequipment e LEFT JOIN inventoryitems i USING(inventoryitemid)
          WHERE i.inventoryitemid IS NULL;
          SELECT IF(COUNT(*)=0,'negative_character_mesos=0',CONCAT('FAIL negative_character_mesos=',COUNT(*)))
          FROM characters WHERE meso < 0;
          SELECT IF(COUNT(*)=0,'negative_inventory_quantities=0',CONCAT('FAIL negative_inventory_quantities=',COUNT(*)))
          FROM inventoryitems WHERE quantity < 0;
          SQL

            integrity_failures="$(sudo mysql --batch --skip-column-names cosmic <<'SQL'
          SELECT COUNT(*) FROM (
            SELECT c.id FROM characters c LEFT JOIN accounts a ON a.id=c.accountid WHERE a.id IS NULL
            UNION ALL
            SELECT i.inventoryitemid FROM inventoryitems i LEFT JOIN characters c ON c.id=i.characterid WHERE i.characterid IS NOT NULL AND c.id IS NULL
            UNION ALL
            SELECT i.inventoryitemid FROM inventoryitems i LEFT JOIN accounts a ON a.id=i.accountid WHERE i.accountid IS NOT NULL AND a.id IS NULL
            UNION ALL
            SELECT e.inventoryitemid FROM inventoryequipment e LEFT JOIN inventoryitems i USING(inventoryitemid) WHERE i.inventoryitemid IS NULL
          ) bad;
          SQL
            )"
            test "$integrity_failures" = '0'
            echo 'database_relationship_integrity=ready'

            echo '### Non-destructive full restore drill'
            restore_db="everleaf_restore_${AUDIT_RUN_ID}"
            cleanup_restore() { sudo mysql -e "DROP DATABASE IF EXISTS \`$restore_db\`;" >/dev/null 2>&1 || true; }
            trap cleanup_restore EXIT
            sudo mysql -e "CREATE DATABASE \`$restore_db\`;"
            sudo sh -c "gzip -dc '$latest_backup/game-mysql.sql.gz' | mysql '$restore_db'"
            core_tables="$(sudo mysql --batch --skip-column-names "$restore_db" -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$restore_db' AND TABLE_NAME IN ('accounts','characters','inventoryitems','inventoryequipment','skills','queststatus','storages')")"
            test "$core_tables" = '7'
            sudo mysqlcheck --check --silent "$restore_db"
            live_tables="$(sudo mysql --batch --skip-column-names cosmic -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='cosmic'")"
            restored_tables="$(sudo mysql --batch --skip-column-names "$restore_db" -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='$restore_db'")"
            test "$restored_tables" = "$live_tables"
            cleanup_restore
            trap - EXIT
            echo "restore_table_count=$restored_tables"
            echo 'full_restore_drill=ready'
          REMOTE

      - name: Audit public endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$EVERLEAF_PUBLIC_BASE/" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "$EVERLEAF_PUBLIC_BASE/downloads" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 "$EVERLEAF_PUBLIC_BASE/v1/launcher/status" >/tmp/launcher-status.json
          python3 - <<'PY'
          import json
          status = json.load(open('/tmp/launcher-status.json'))
          assert status.get('online') is True
          assert status.get('version') == 'v83'
          print('public_https=ready')
          print('public_launcher_status=online')
          PY
