name: Audit EverLeaf production readiness

on:
  workflow_dispatch:

concurrency:
  group: everleaf-production-audit
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_PUBLIC_BASE: https://everleafms.online
  EVERLEAF_TLS_HOST: everleafms.online

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Stage read-only audit helpers
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="/tmp/everleaf-readiness-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            "install -d -m 700 '$audit_dir'"
          scp -i ~/.ssh/id_everleaf \
            tools/everleaf-ops/verify-live-payment-readiness.js \
            tools/everleaf-ops/audit-discord-community.js \
            tools/everleaf-ops/audit-everleaf-production.sql \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$audit_dir/"

      - name: Audit Oracle production state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            "AUDIT_RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
            set -euo pipefail
            case "$AUDIT_RUN_ID" in (*[!0-9]*|'') exit 2;; esac
            audit_dir="/tmp/everleaf-readiness-$AUDIT_RUN_ID"
            test "$audit_dir" = "/tmp/everleaf-readiness-$AUDIT_RUN_ID"
            cleanup() {
              find "$audit_dir" -mindepth 1 -maxdepth 1 -type f -delete 2>/dev/null || true
              rmdir "$audit_dir" 2>/dev/null || true
            }
            trap cleanup EXIT

            systemctl is-active --quiet everleaf-web
            systemctl is-active --quiet nginx
            systemctl is-enabled --quiet everleaf-backup.timer
            systemctl is-active --quiet everleaf-backup.timer
            echo 'service_everleaf_web=ready'
            echo 'service_nginx=ready'
            echo 'service_backup_timer=ready'

            test -s /opt/everleaf/web/.env
            test "$(stat -c '%a' /opt/everleaf/web/.env)" = '600'
            echo 'production_env_permissions=ready'

            read_env() {
              local key="$1"
              sed -n "s/^${key}=//p" /opt/everleaf/web/.env | tail -1
            }

            session_secret="$(read_env SESSION_SECRET)"
            test -n "$session_secret"
            test "$session_secret" != 'dev-only-change-me'
            test "${#session_secret}" -ge 32
            echo 'session_secret=ready'

            game_db_password="$(read_env GAME_DB_PASSWORD)"
            test -n "$game_db_password"
            echo 'game_db_password=ready'

            test "$(read_env GAME_PASSWORD_MODE)" = 'bcrypt'
            echo 'website_password_mode=bcrypt'

            case "$(printf '%s' "$(read_env GAME_REGISTRATION_ENABLED)" | tr '[:upper:]' '[:lower:]')" in
              1|true|yes|on) ;;
              *) echo 'Website registration must be enabled before public launch.' >&2; exit 1;;
            esac
            echo 'website_registration=enabled'

            # EverLeaf uses eight game channels. Keep the website's configured
            # port list in lock-step with the actual server so status pages do
            # not silently report only a subset of channels.
            grep -qx 'CHANNEL_PORTS=7575,7576,7577,7578,7579,7580,7581,7582' /opt/everleaf/web/.env
            echo 'website_channel_ports=8'

            test -s /opt/everleaf/patches/manifest.json
            test -s /opt/everleaf/patches/downloads/EverLeafLauncher-portable.zip
            python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          manifest = json.load(open('/opt/everleaf/patches/manifest.json'))
          paths = [str(item.get('path', '')).lower() for item in manifest.get('files', [])]
          assert len(paths) == 36 and len(set(paths)) == 36
          with zipfile.ZipFile('/opt/everleaf/patches/downloads/EverLeafLauncher-portable.zip') as archive:
              files = [name for name in archive.namelist() if not name.endswith('/')]
          assert files == ['EverLeafLauncher.exe'], files
          launcher = manifest.get('launcher')
          assert launcher and launcher.get('url') == '/launcher/download'
          archive = pathlib.Path('/opt/everleaf/patches/downloads/EverLeafLauncher-portable.zip')
          version = pathlib.Path('/opt/everleaf/patches/downloads/EverLeafLauncher-version.txt').read_text().strip()
          with archive.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          assert launcher.get('version') == version
          assert launcher.get('sha256') == digest
          assert launcher.get('size') == archive.stat().st_size
          print('launcher_manifest_files=36')
          print('launcher_archive=single_executable')
          print('launcher_self_update_metadata=verified')
          PY

            latest_backup="$(sudo find /opt/everleaf/backups/web -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
            test -n "$latest_backup"
            sudo test -s "$latest_backup/.env"
            sudo test -s "$latest_backup/cms.sqlite"
            sudo test -s "$latest_backup/game-mysql.sql.gz"
            sudo test -s "$latest_backup/SHA256SUMS"
            sudo gzip -t "$latest_backup/game-mysql.sql.gz"
            sudo sh -c "cd '$latest_backup' && sha256sum -c SHA256SUMS >/dev/null"
            backup_age="$(( $(date +%s) - $(sudo stat -c %Y "$latest_backup") ))"
            test "$backup_age" -lt 172800
            echo "web_backup_age_seconds=$backup_age"

            disk_percent="$(df -P /opt/everleaf | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
            test "$disk_percent" -lt 90
            echo "oracle_disk_used_percent=$disk_percent"

            certificate_path="$(sudo find /etc/letsencrypt/live -name fullchain.pem -print -quit)"
            test -n "$certificate_path"
            sudo openssl x509 -checkend 604800 -noout -in "$certificate_path"
            sudo openssl x509 -checkhost everleafms.online -noout -in "$certificate_path"
            echo 'tls_certificate_next_7_days=ready'

            ss -ltn | awk '{print $4}' | grep -Eq '(^|:)8484$'
            echo 'game_login_port=ready'
            for port in 7575 7576 7577 7578 7579 7580 7581 7582; do
              ss -ltn | awk '{print $4}' | grep -Eq "(^|:)$port$"
              echo "game_channel_port_${port}=ready"
            done
            echo 'game_channels=8'

            sudo mysql --batch --skip-column-names cosmic < \
              "$audit_dir/audit-everleaf-production.sql"

            # NX coupons are global drops and bypass the normal Drop/Boss Drop
            # multiplier. Require exactly one global row for each balanced card
            # before a production-readiness audit can pass.
            nx100_rows="$(sudo mysql --batch --skip-column-names cosmic -e \
              "SELECT COUNT(*) FROM drop_data_global WHERE continent=-1 AND itemid=4031865 AND chance=400")"
            nx250_rows="$(sudo mysql --batch --skip-column-names cosmic -e \
              "SELECT COUNT(*) FROM drop_data_global WHERE continent=-1 AND itemid=4031866 AND chance=100")"
            nx_total_rows="$(sudo mysql --batch --skip-column-names cosmic -e \
              "SELECT COUNT(*) FROM drop_data_global WHERE continent=-1 AND itemid IN (4031865,4031866)")"
            test "$nx100_rows" = '1'
            test "$nx250_rows" = '1'
            test "$nx_total_rows" = '2'
            echo 'nx_coupon_global_rates=balanced'

            sudo node "$audit_dir/verify-live-payment-readiness.js" \
              /opt/everleaf/web /opt/everleaf/web/.env
            sudo node "$audit_dir/audit-discord-community.js" \
              /opt/everleaf/web/.env
          REMOTE

      - name: Audit public HTTPS endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            "$EVERLEAF_PUBLIC_BASE/" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 \
            "$EVERLEAF_PUBLIC_BASE/downloads" >/dev/null
          curl --fail --silent --show-error --location --max-time 20 \
            "$EVERLEAF_PUBLIC_BASE/v1/launcher/status" >/tmp/launcher-status.json
          python3 - <<'PY'
          import json
          status = json.load(open('/tmp/launcher-status.json'))
          assert status.get('online') is True
          assert status.get('version') == 'v83'
          print('public_https=ready')
          print('public_launcher_status=online')
          PY
