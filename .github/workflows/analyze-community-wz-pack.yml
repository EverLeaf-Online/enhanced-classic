name: Analyze community WZ pack

on:
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/analyze-community-wz-pack.yml'
      - 'tools/wz-donor/inventory_community_wz.sh'
      - 'tools/wz-donor/compare_community_wz_inventory.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inventory community and current EverLeaf WZ files
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_everleaf tools/wz-donor/inventory_community_wz.sh "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/tmp/everleaf-inventory-community-wz.sh"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "chmod +x /tmp/everleaf-inventory-community-wz.sh && /tmp/everleaf-inventory-community-wz.sh" > "$RUNNER_TEMP/community-wz-inventory.txt"
          cat "$RUNNER_TEMP/community-wz-inventory.txt"

      - name: Build WZ comparison report
        run: |
          set -euo pipefail
          python3 tools/wz-donor/compare_community_wz_inventory.py \
            "$RUNNER_TEMP/community-wz-inventory.txt" \
            --json-output "$RUNNER_TEMP/community-wz-comparison.json" \
            --markdown-output "$RUNNER_TEMP/community-wz-review.md"
          cat "$RUNNER_TEMP/community-wz-review.md"
          cat "$RUNNER_TEMP/community-wz-review.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: community-wz-staging-analysis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/community-wz-inventory.txt
            ${{ runner.temp }}/community-wz-comparison.json
            ${{ runner.temp }}/community-wz-review.md
          retention-days: 14
          if-no-files-found: error
