name: Build closed-alpha client

on:
  push:
    paths:
      - ".github/workflows/client-analysis-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified legacy client
        uses: actions/checkout@v5
        with:
          ref: 335d4fbb74e713a01f63163c39c941865401d24a
          sparse-checkout: Localhosts.zip
          sparse-checkout-cone-mode: false
      - name: Verify source archive
        shell: bash
        run: |
          echo "096e21e155ca1a06a3132a6ad6f7feda5cd986928f415bab15a3b67fee412527  Localhosts.zip" | sha256sum --check
      - name: Patch server address and Everleaf branding
        shell: bash
        run: |
          mkdir -p source EverleafClient
          unzip -q Localhosts.zip -d source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          old_ip = b"127.0.0.1" + bytes(7)
          new_ip = b"132.145.141.79" + bytes(2)
          old_brand_wide = "MapleRoyals".encode("utf-16le")
          new_brand_wide = "Everleaf".encode("utf-16le") + bytes(6)
          old_brand_ascii = b"MapleRoyals"
          new_brand_ascii = b"EverleafApp"
          expected = {
              "Localhost.exe": "ce9775375b724d211634327922416d55e580dfaba00fd9a61280a9daa5ce6698",
              "LocalHostNoWindowedMode.exe": "3e6fa786590c7dbe7f19b3730c817587cfb4b8464ddc0f1839a2f342d4e64f6d",
          }

          for name, digest in expected.items():
              source = Path("source") / name
              data = source.read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest
              assert data.count(old_ip) == 3
              assert data.count(old_brand_wide) == 7
              assert data.count(old_brand_ascii) == 2

              patched = data.replace(old_ip, new_ip)
              patched = patched.replace(old_brand_wide, new_brand_wide)
              patched = patched.replace(old_brand_ascii, new_brand_ascii)

              assert patched.count(old_ip) == 0
              assert patched.count(new_ip) == 3
              assert patched.count(old_brand_wide) == 0
              assert patched.count(new_brand_wide) == 7
              assert patched.count(old_brand_ascii) == 0
              assert patched.count(new_brand_ascii) == 2
              assert len(patched) == len(data)
              (Path("EverleafClient") / name).write_bytes(patched)
          PY
          cp source/README.txt EverleafClient/ORIGINAL-README.txt
          cat > EverleafClient/EVERLEAF-README.txt <<'EOF'
          Everleaf closed-alpha client
          Server: 132.145.141.79
          Version: MapleStory v83 (legacy modified client)
          Branding: Everleaf

          The executables were statically patched for the Everleaf staging server
          and branding. They were not executed during packaging. Keep this package
          private and scan it with Windows Security before use.
          EOF
          sha256sum EverleafClient/*.exe > EverleafClient/SHA256SUMS.txt
          (cd EverleafClient && zip -q ../EverleafClient-closed-alpha.zip ./*)
          unzip -l EverleafClient-closed-alpha.zip
      - name: Upload private closed-alpha client
        uses: actions/upload-artifact@v4
        with:
          name: EverleafClient-closed-alpha
          path: EverleafClient-closed-alpha.zip
          retention-days: 7
          if-no-files-found: error
