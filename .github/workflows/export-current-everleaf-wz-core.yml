name: Export current EverLeaf client WZ core baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  CURRENT_WZ_ROOT: /opt/everleaf/patches/files

jobs:
  prepare-ssh:
    runs-on: ubuntu-24.04
    outputs:
      known_hosts_b64: ${{ steps.hostkeys.outputs.known_hosts_b64 }}
    steps:
      - name: Capture Oracle SSH host keys
        id: hostkeys
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          echo "known_hosts_b64=$(base64 -w0 "$RUNNER_TEMP/known_hosts")" >> "$GITHUB_OUTPUT"

  export-and-compare:
    needs: prepare-ssh
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ needs.prepare-ssh.outputs.known_hosts_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'), ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          [IO.File]::WriteAllBytes((Join-Path $sshDir 'known_hosts'), [Convert]::FromBase64String($env:KNOWN_HOSTS_B64))
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 15
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')

      - name: Fetch current client WZ families independently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $families = @('Map.wz','Mob.wz','Npc.wz','Reactor.wz','String.wz')
          $outputDir = Join-Path $env:RUNNER_TEMP 'current-everleaf-core'
          $chunksRoot = Join-Path $env:RUNNER_TEMP 'current-everleaf-chunks'
          New-Item -ItemType Directory -Force -Path $outputDir,$chunksRoot | Out-Null

          foreach ($family in $families) {
            $safe = $family.Replace('.','_')
            $remoteFile = "$env:CURRENT_WZ_ROOT/$family"
            $remoteBase = "/tmp/everleaf-current-$safe"
            $prep = "set -euo pipefail; test -s '$remoteFile'; rm -f '$remoteBase'.part.* '$remoteBase'.parts.sha256 '$remoteBase'.file.sha256; sha256sum '$remoteFile' > '$remoteBase.file.sha256'; split -b 32M -d -a 4 '$remoteFile' '$remoteBase.part.'; sha256sum '$remoteBase'.part.* > '$remoteBase.parts.sha256'"
            ssh everleaf-oracle $prep
            if ($LASTEXITCODE -ne 0) { throw "Unable to prepare $family" }

            $familyChunks = Join-Path $chunksRoot $safe
            New-Item -ItemType Directory -Force -Path $familyChunks | Out-Null
            $partsManifest = Join-Path $familyChunks 'parts.sha256'
            $fileManifest = Join-Path $familyChunks 'file.sha256'
            scp "everleaf-oracle`:$remoteBase.parts.sha256" $partsManifest
            if ($LASTEXITCODE -ne 0) { throw "$family parts manifest transfer failed" }
            scp "everleaf-oracle`:$remoteBase.file.sha256" $fileManifest
            if ($LASTEXITCODE -ne 0) { throw "$family file manifest transfer failed" }

            foreach ($row in (Get-Content $partsManifest | Where-Object { $_.Trim() })) {
              if ($row -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Malformed chunk manifest: $row" }
              $expected = $matches[1]; $remotePath = $matches[2]
              $name = Split-Path $remotePath -Leaf; $local = Join-Path $familyChunks $name
              $ok = $false
              for ($attempt=1; $attempt -le 6 -and -not $ok; $attempt++) {
                Remove-Item -Force -ErrorAction SilentlyContinue $local
                scp "everleaf-oracle`:$remotePath" $local
                if ($LASTEXITCODE -eq 0 -and (Test-Path $local)) {
                  $actual=(Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actual -eq $expected) { $ok=$true }
                }
                if (-not $ok) { Start-Sleep -Seconds (2*$attempt) }
              }
              if (-not $ok) { throw "Failed verified transfer: $family / $name" }
            }

            $destination = Join-Path $outputDir $family
            $out=[IO.File]::Open($destination,[IO.FileMode]::Create,[IO.FileAccess]::Write)
            try {
              Get-ChildItem $familyChunks -Filter "everleaf-current-$safe.part.*" -File | Sort-Object Name | ForEach-Object {
                $input=[IO.File]::OpenRead($_.FullName)
                try { $input.CopyTo($out) } finally { $input.Dispose() }
              }
            } finally { $out.Dispose() }
            $fileRow=Get-Content $fileManifest | Select-Object -First 1
            if ($fileRow -notmatch '^([0-9a-f]{64})\s+') { throw "Malformed $family file manifest" }
            $expectedFile=$matches[1]
            $actualFile=(Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualFile -ne $expectedFile) { throw "$family reassembled hash mismatch" }
            Write-Host "$family verified: $actualFile"
            ssh everleaf-oracle "rm -f '$remoteBase'.part.* '$remoteBase'.parts.sha256 '$remoteBase'.file.sha256" | Out-Null
          }

      - name: Build MapleLib exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item 'tools/wz-donor/exporter/Program.cs' (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafWzExporter.csproj') -c Release

      - name: Export current client WZ to XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'current-everleaf-core'
          $outputDir = Join-Path $env:RUNNER_TEMP 'current-everleaf-core-xml'
          $project = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & dotnet run --project $project -c Release --no-build -- $inputDir $outputDir --patch-version=83 --probe-patch-range=1:250 Map.wz Mob.wz Npc.wz Reactor.wz String.wz
          if ($LASTEXITCODE -ne 0) { throw "Current client WZ export failed: $LASTEXITCODE" }
          $count=(Get-ChildItem $outputDir -Filter '*.xml' -File -Recurse | Measure-Object).Count
          if ($count -lt 1000) { throw "Unexpectedly small current-client XML export: $count" }

      - name: Compare current client binary-derived XML against repository baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/wz-donor/wz_diff.py --baseline wz --donor "$env:RUNNER_TEMP/current-everleaf-core-xml" --donor-id current-everleaf-client-core --output "$env:RUNNER_TEMP/current-everleaf-vs-repo.json"
          python tools/wz-donor/build_import_manifest.py "$env:RUNNER_TEMP/current-everleaf-vs-repo.json" --output "$env:RUNNER_TEMP/current-everleaf-vs-repo-manifest.json"
          python tools/wz-donor/render_review_report.py "$env:RUNNER_TEMP/current-everleaf-vs-repo.json" "$env:RUNNER_TEMP/current-everleaf-vs-repo-manifest.json" --output "$env:RUNNER_TEMP/current-everleaf-vs-repo.md"
          Get-Content "$env:RUNNER_TEMP/current-everleaf-vs-repo.md" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload comparison evidence only
        uses: actions/upload-artifact@v4
        with:
          name: current-everleaf-client-core-comparison-${{ github.sha }}
          path: |
            ${{ runner.temp }}/current-everleaf-vs-repo.json
            ${{ runner.temp }}/current-everleaf-vs-repo-manifest.json
            ${{ runner.temp }}/current-everleaf-vs-repo.md
          retention-days: 14
          if-no-files-found: error
