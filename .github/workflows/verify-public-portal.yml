name: Verify EverLeaf Public Portal

on:
  workflow_run:
    workflows: ["Deploy EverLeaf Web"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify redesigned public routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://everleafms.online'

          check_page() {
            local path="$1"
            local marker="$2"
            local html
            html="$(curl --fail --silent --show-error --location --max-time 30 "$BASE$path")"
            grep -Fqi "$marker" <<<"$html"
            grep -Fq '/js/site.js?v=2' <<<"$html"
            grep -Fq '/css/unified-terminal-2026.css?v=1' <<<"$html"
            grep -Fq 'class="siteRoute route-' <<<"$html"
            if grep -Fq 'full-site-portal-2026.css' <<<"$html"; then
              echo "Legacy full-site portal stylesheet still loaded on $path" >&2
              exit 1
            fi
            if grep -Fq 'game-portal-2026.css' <<<"$html"; then
              echo "Legacy game portal stylesheet still loaded on $path" >&2
              exit 1
            fi
            printf 'verified %s (%s)\n' "$path" "$marker"
          }

          check_page '/' 'Classic Maple'
          check_page '/news' 'EverLeaf News'
          check_page '/downloads' 'Launcher & Downloads'
          check_page '/rankings' 'EverLeaf Rankings'
          check_page '/wiki' 'EVERLEAF DATA WIKI'
          check_page '/help' 'Player Help'
          check_page '/login' 'Sign in to EverLeaf'
          check_page '/register' 'EverLeaf'
          check_page '/recover' 'Account Recovery'
          check_page '/terms' 'Terms of Service'
          check_page '/rules' 'Rules'

          UNIFIED_CSS="$(curl --fail --silent --show-error --location --max-time 30 "$BASE/css/unified-terminal-2026.css?v=1")"
          grep -Fq 'EverLeaf unified public shell' <<<"$UNIFIED_CSS"
          grep -Fq 'legacy scallop/ribbon/cloud decoration' <<<"$UNIFIED_CSS"

          HOME_HTML="$(curl --fail --silent --show-error --location --max-time 30 "$BASE/")"
          if grep -Fqi 'CHOOSE YOUR SIGNAL' <<<"$HOME_HTML"; then
            echo 'Removed class signal block is still present on homepage.' >&2
            exit 1
          fi
          if grep -Fqi 'KNOW THE WORLD BEFORE IT KNOWS YOU' <<<"$HOME_HTML"; then
            echo 'Removed handbook promo block is still present on homepage.' >&2
            exit 1
          fi

          ACCOUNT_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$BASE/account")"
          case "$ACCOUNT_CODE" in
            200|301|302|303|307|308) ;;
            *) echo "Unexpected /account response: $ACCOUNT_CODE" >&2; exit 1 ;;
          esac

          NOT_FOUND="$(curl --silent --show-error --max-time 30 "$BASE/this-route-should-not-exist-everleaf-portal" || true)"
          grep -Fq 'Map not found.' <<<"$NOT_FOUND"

          echo 'EverLeaf unified public portal route verification passed.'
