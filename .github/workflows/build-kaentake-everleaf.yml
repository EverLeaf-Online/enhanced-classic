name: Build EverLeaf Kaentake Client

on:
  push:
    branches:
      - client/kaentake-integration
    paths:
      - 'client/kaentake-port/**'
      - 'client/branding/login/generate_art.py'
      - '.github/workflows/build-kaentake-everleaf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned client source
        shell: pwsh
        run: |
          git clone --recurse-submodules https://github.com/iw2d/kaentake.git "$env:RUNNER_TEMP\kaentake"
          git -C "$env:RUNNER_TEMP\kaentake" checkout 2a43a01e7f4cdd75cda08ab533049230760d7cfa
          git -C "$env:RUNNER_TEMP\kaentake" submodule update --init --recursive

      - name: Apply EverLeaf integration
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\client\kaentake-port\apply-everleaf.ps1" -SourceRoot "$env:RUNNER_TEMP\kaentake"

      - name: Configure Win32 release
        shell: pwsh
        run: cmake -S "$env:RUNNER_TEMP\kaentake" -B "$env:RUNNER_TEMP\kaentake\build" -A Win32

      - name: Build Win32 release
        shell: pwsh
        run: cmake --build "$env:RUNNER_TEMP\kaentake\build" --config Release --parallel

      - name: Verify branded outputs
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\kaentake\build\Release"
          if (!(Test-Path "$out\EverLeaf.exe")) { throw 'EverLeaf.exe missing' }
          if (!(Test-Path "$out\EverLeaf.dll")) { throw 'EverLeaf.dll missing' }
          if (!(Test-Path "$out\Custom.wz")) { throw 'Custom.wz missing' }
          Get-FileHash "$out\EverLeaf.exe" -Algorithm SHA256
          Get-FileHash "$out\EverLeaf.dll" -Algorithm SHA256
          Get-FileHash "$out\Custom.wz" -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: everleaf-kaentake-client
          path: |
            ${{ runner.temp }}\kaentake\build\Release\EverLeaf.exe
            ${{ runner.temp }}\kaentake\build\Release\EverLeaf.dll
            ${{ runner.temp }}\kaentake\build\Release\Custom.wz
          if-no-files-found: error
          retention-days: 7
