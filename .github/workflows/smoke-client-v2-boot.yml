name: Smoke Client v2 boot

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  isolated-boot-smoke:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout EverLeaf candidate
        uses: actions/checkout@v5

      - name: Configure SSH for read-only client reconstruction
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SSH_PRIVATE_KEY) { throw 'EVERLEAF_SSH_PRIVATE_KEY is unavailable' }
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($keyPath, ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          $knownHosts = Join-Path $sshDir 'known_hosts'
          $gitKeyscan = 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe'
          if (-not (Test-Path $gitKeyscan)) { throw "Git OpenSSH keyscan not found: $gitKeyscan" }
          if ($env:SSH_KNOWN_HOSTS) {
            [IO.File]::WriteAllText($knownHosts, ($env:SSH_KNOWN_HOSTS -replace "`r", "") + "`n")
          } else {
            & $gitKeyscan -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $knownHosts
            if ($LASTEXITCODE -ne 0) { throw "Git ssh-keyscan failed with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path $knownHosts) -or (Get-Item $knownHosts).Length -eq 0) { throw 'known_hosts is empty' }

      - name: Fetch exact managed v83 client baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          $sshExe = 'C:\Program Files\Git\usr\bin\ssh.exe'
          $scpExe = 'C:\Program Files\Git\usr\bin\scp.exe'
          $baseline = Get-Content 'client/managed-client-baseline.json' -Raw | ConvertFrom-Json
          if ($baseline.schemaVersion -ne 1) { throw 'Unsupported managed client baseline schema' }

          $names = @($baseline.managedFiles | ForEach-Object { [string]$_.path })
          foreach ($required in @('EverLeaf.exe','Base.wz','UI.wz','Character.wz','Map.wz','Mob.wz','Npc.wz','Item.wz','Skill.wz','String.wz')) {
            if ($names -notcontains $required) { throw "Managed baseline is missing required client file: $required" }
          }
          foreach ($name in $names) {
            if ($name -notmatch '^[A-Za-z0-9_.-]+$') { throw "Unsafe managed client filename: $name" }
          }

          $remoteRoot = '/opt/everleaf/patches/files'
          $quoted = ($names | ForEach-Object { "'$_'" }) -join ' '
          $sshOptions = @(
            '-o', 'ServerAliveInterval=15',
            '-o', 'ServerAliveCountMax=4',
            '-o', 'ConnectTimeout=20',
            '-o', 'Compression=no',
            '-i', $keyPath
          )

          # Fail before transfer if the current managed set is incomplete. This
          # command only stats known baseline filenames and does not create or
          # modify anything on Oracle.
          $remoteCheck = "set -euo pipefail; cd '$remoteRoot'; for f in $quoted; do test -f `"`$f`"; done"
          & $sshExe @sshOptions "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" $remoteCheck
          if ($LASTEXITCODE -ne 0) { throw 'Managed client baseline is incomplete on Oracle' }

          $clientDir = Join-Path $env:RUNNER_TEMP 'everleaf-client-v2'
          New-Item -ItemType Directory -Force -Path $clientDir | Out-Null

          # Copy files individually instead of making Oracle hash + gzip a multi-GB
          # temporary archive. Each transfer gets keepalives and bounded retries;
          # a reset therefore retries only the current file rather than rebuilding
          # the entire client archive.
          foreach ($name in $names) {
            $destination = Join-Path $clientDir $name
            $remoteSource = "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteRoot/$name"
            $copied = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Remove-Item $destination -Force -ErrorAction SilentlyContinue
              & $scpExe @sshOptions $remoteSource $destination
              if ($LASTEXITCODE -eq 0 -and (Test-Path $destination -PathType Leaf) -and (Get-Item $destination).Length -gt 0) {
                $copied = $true
                break
              }
              if ($attempt -lt 3) { Start-Sleep -Seconds (2 * $attempt) }
            }
            if (-not $copied) { throw "Failed to fetch managed client file after 3 attempts: $name" }
          }

          foreach ($name in $names) {
            if (-not (Test-Path (Join-Path $clientDir $name) -PathType Leaf)) { throw "Reconstructed client missing $name" }
          }

          # Record the exact bytes used by the smoke. The aggregate digest is the
          # SHA-256 of a stable sorted '<file-sha>  <filename>' inventory.
          $hashes = Join-Path $env:RUNNER_TEMP 'CLIENT_V2_BASELINE_HASHES.txt'
          $hashLines = @()
          foreach ($name in ($names | Sort-Object)) {
            $digest = (Get-FileHash (Join-Path $clientDir $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashLines += "$digest  $name"
          }
          $hashLines | Set-Content -Encoding ascii $hashes
          $baselineSetHash = (Get-FileHash $hashes -Algorithm SHA256).Hash.ToLowerInvariant()

          "CLIENT_DIR=$clientDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BASELINE_SET_SHA256=$baselineSetHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build exact Client v2 candidate overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python client/scripts/apply-community-ui-preference.py
          python client/scripts/apply-client-v2-rebrand.py

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere not found' }
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86
          if ($LASTEXITCODE -ne 0) { throw "Client v2 MSBuild failed with exit code $LASTEXITCODE" }

          $candidateDll = [IO.Path]::GetFullPath('client/ezorsia/out/Release/dinput8.dll')
          if (-not (Test-Path $candidateDll -PathType Leaf)) { throw 'Built Client v2 dinput8.dll missing' }
          python client/scripts/verify-client-v2-branding.py $candidateDll

          Copy-Item $candidateDll (Join-Path $env:CLIENT_DIR 'dinput8.dll') -Force
          Copy-Item 'client/ezorsia/ezorsia/config.ini' (Join-Path $env:CLIENT_DIR 'config.ini') -Force
          Copy-Item 'client/ezorsia/ezorsia/EzorsiaV2_UI.wz' (Join-Path $env:CLIENT_DIR 'EverLeaf_UI.wz') -Force

          $dllHash = (Get-FileHash (Join-Path $env:CLIENT_DIR 'dinput8.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $configHash = (Get-FileHash (Join-Path $env:CLIENT_DIR 'config.ini') -Algorithm SHA256).Hash.ToLowerInvariant()
          $uiHash = (Get-FileHash (Join-Path $env:CLIENT_DIR 'EverLeaf_UI.wz') -Algorithm SHA256).Hash.ToLowerInvariant()
          "CANDIDATE_DLL_SHA256=$dllHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CANDIDATE_CONFIG_SHA256=$configHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CANDIDATE_UI_SHA256=$uiHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Block game network and boot Client v2 in isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = [IO.Path]::GetFullPath((Join-Path $env:CLIENT_DIR 'EverLeaf.exe'))
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'EverLeaf.exe missing from reconstructed client' }
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $startedAt = Get-Date
          $ruleName = "EverLeaf-client-v2-boot-smoke-$env:GITHUB_RUN_ID"
          $launched = $null
          $matching = @()
          $logPath = Join-Path $env:CLIENT_DIR 'EverLeafClient.log'
          $savedLogPath = Join-Path $env:RUNNER_TEMP 'EverLeafClient.log'
          $eventPath = Join-Path $env:RUNNER_TEMP 'CLIENT_V2_WINDOWS_ERRORS.txt'
          $reportPath = Join-Path $env:RUNNER_TEMP 'CLIENT_V2_BOOT_SMOKE_REPORT.json'

          try {
            # Reproduce the launcher's existing single-use 120-second handoff
            # ticket without starting the patch/update UI. The dinput proxy deletes
            # it on consumption.
            $ticket = Join-Path $env:CLIENT_DIR '.everleaf-launch'
            [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString() | Set-Content -NoNewline -Encoding ascii $ticket

            # Runtime smoke is deliberately offline: no login/auth packets and no
            # network writes can leave this process.
            New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $launched = Start-Process -FilePath $exe -WorkingDirectory $env:CLIENT_DIR -PassThru
            Start-Sleep -Seconds 15

            $matching = @(Get-CimInstance Win32_Process -Filter "Name='EverLeaf.exe'" -ErrorAction SilentlyContinue | Where-Object {
              try { [IO.Path]::GetFullPath([string]$_.ExecutablePath) -eq $exe } catch { $false }
            })

            $recentErrors = @(Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startedAt} -ErrorAction SilentlyContinue |
              Where-Object { $_.LevelDisplayName -eq 'Error' -and $_.Message -match 'EverLeaf|MapleStory|dinput8' } |
              Select-Object -First 20 TimeCreated, Id, ProviderName, Message)
            $recentErrors | Format-List | Out-String | Set-Content -Encoding utf8 $eventPath

            if ($matching.Count -eq 0) {
              $launched.Refresh()
              $exit = if ($launched.HasExited) { $launched.ExitCode } else { '<still-running-unresolved>' }
              $diag = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { '<no EverLeafClient.log>' }
              $errorText = Get-Content $eventPath -Raw
              throw "No isolated EverLeaf.exe process survived the 15-second Client v2 boot smoke. Initial process exit=$exit.`nDiagnostics:`n$diag`nWindows errors:`n$errorText"
            }

            if (-not (Test-Path $logPath -PathType Leaf)) {
              throw 'Client v2 process survived but EverLeafClient.log was not created; candidate diagnostics layer did not initialize'
            }

            $diagText = Get-Content $logPath -Raw
            foreach ($requiredPhase in @('installing-early-hooks','waiting-for-v83-unpack')) {
              if (-not $diagText.Contains($requiredPhase)) { throw "Client v2 diagnostics missing expected startup phase: $requiredPhase" }
            }

            $ticketConsumed = -not (Test-Path (Join-Path $env:CLIENT_DIR '.everleaf-launch'))
            if (-not $ticketConsumed) { throw 'Client v2 launcher handoff ticket was not consumed by the dinput proxy' }

            $processIds = @($matching | ForEach-Object { [int]$_.ProcessId })
            $report = [ordered]@{
              schemaVersion = 1
              kind = 'isolated-everleaf-client-v2-boot-smoke'
              candidateCommit = $env:GITHUB_SHA
              baselineSetSha256 = $env:BASELINE_SET_SHA256
              executableSha256 = $exeHash
              candidateDinput8Sha256 = $env:CANDIDATE_DLL_SHA256
              candidateConfigSha256 = $env:CANDIDATE_CONFIG_SHA256
              candidateEverLeafUiSha256 = $env:CANDIDATE_UI_SHA256
              outboundNetworkBlocked = $true
              authenticationAttempted = $false
              survivedSeconds = 15
              survivingProcessCount = $matching.Count
              survivingProcessIds = $processIds
              launcherTicketConsumed = $ticketConsumed
              diagnosticsLogCreated = $true
              windowsApplicationErrorCount = $recentErrors.Count
              productionFilesModified = $false
              approved = $false
              productionApplyAllowed = $false
            }
            $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $reportPath
            Get-Content $reportPath | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          finally {
            if (Test-Path $logPath -PathType Leaf) {
              Copy-Item $logPath $savedLogPath -Force -ErrorAction SilentlyContinue
            }
            foreach ($proc in $matching) { Stop-Process -Id ([int]$proc.ProcessId) -Force -ErrorAction SilentlyContinue }
            if ($launched) {
              try { $launched.Refresh() } catch {}
              if (-not $launched.HasExited) { Stop-Process -Id $launched.Id -Force -ErrorAction SilentlyContinue }
            }
            Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:CLIENT_DIR '.everleaf-launch') -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Client v2 boot-smoke evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-v2-boot-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/CLIENT_V2_BOOT_SMOKE_REPORT.json
            ${{ runner.temp }}/CLIENT_V2_WINDOWS_ERRORS.txt
            ${{ runner.temp }}/CLIENT_V2_BASELINE_HASHES.txt
            ${{ runner.temp }}/EverLeafClient.log
          retention-days: 14
          if-no-files-found: warn
