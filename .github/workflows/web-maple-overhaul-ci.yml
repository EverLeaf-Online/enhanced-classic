name: Web Maple Overhaul CI

on:
  push:
    branches: [web/maple-overhaul]
    paths:
      - 'web/**'
      - '.github/workflows/web-maple-overhaul-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install
      - name: Run existing web tests
        run: npm test
      - name: Verify remaster assets
        run: |
          test -f public/css/maple-remaster.css
          test -f public/css/maple-remaster-pages.css
          test -f public/css/maple-remaster-admin.css
          test -f public/css/maple-jobs.css
          test -f public/assets/everleaf-remaster.svg
          test -f public/assets/jobs/warrior.svg
          test -f public/assets/jobs/magician.svg
          test -f public/assets/jobs/bowman.svg
          test -f public/assets/jobs/thief.svg
          test -f public/assets/jobs/pirate.svg
          grep -q 'maple-remaster.css' src/views/partials/header.ejs
          grep -q 'maple-jobs.css' src/views/partials/header.ejs
          grep -q 'mapleHero' src/views/home.ejs
          grep -q 'mapleJobsGrid' src/views/home.ejs
