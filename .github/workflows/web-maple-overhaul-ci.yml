name: Web Maple Overhaul CI

on:
  push:
    branches: [web/maple-overhaul]
    paths:
      - 'web/**'
      - '.github/workflows/web-maple-overhaul-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        run: npm install
      - name: Run existing web tests
        run: npm test
      - name: Verify unified terminal assets
        run: |
          test -f public/css/maple-remaster.css
          test -f public/css/maple-remaster-pages.css
          test -f public/css/maple-remaster-admin.css
          test -f public/css/maple-jobs.css
          test -f public/css/maple-final.css
          test -f public/css/refero-everleaf-2026.css
          test -f public/css/unified-terminal-2026.css
          test -f public/assets/everleaf-remaster.svg
          test -f public/assets/hero-forest.webp
          test -f public/assets/hero-left.webp
          test -f public/assets/hero-right.webp
          for asset in warrior magician bowman thief pirate cygnus aran evan; do
            test -f "public/assets/jobs/${asset}.svg"
          done
          for asset in launcher patch tool trophy journal community account recovery; do
            test -f "public/assets/ui/${asset}.svg"
          done
          grep -q 'maple-remaster.css' src/views/partials/header.ejs
          grep -q 'maple-jobs.css' src/views/partials/header.ejs
          grep -q 'maple-final.css' src/views/partials/header.ejs
          grep -q 'refero-everleaf-2026.css?v=3' src/views/partials/header.ejs
          grep -q 'unified-terminal-2026.css?v=1' src/views/partials/header.ejs
          grep -q 'body class="siteRoute route-' src/views/partials/header.ejs
          ! grep -q 'game-portal-2026.css' src/views/partials/header.ejs
          ! grep -q 'full-site-portal-2026.css' src/views/partials/header.ejs
          ! grep -q 'visuals-2026.css' src/views/partials/header.ejs
          ! grep -q 'full-site-portal-2026.css' public/js/site.js
          ! grep -q 'terminalNav' src/views/partials/header.ejs
          ! grep -q 'worldRibbon' src/views/partials/header.ejs
          grep -q 'terminalHero' src/views/home.ejs
          grep -q 'everleafArtifact' src/views/home.ejs
          grep -q 'heroTelemetry' src/views/home.ejs
          grep -q 'signalStrip' src/views/home.ejs
          ! grep -q 'terminalHome' src/views/home.ejs
          ! grep -q 'dossierSection' src/views/home.ejs
          ! grep -q 'entrySection' src/views/home.ejs
          ! grep -q 'dataSection' src/views/home.ejs
          ! grep -q 'finalTransmission' src/views/home.ejs
          ! grep -qi 'CHOOSE YOUR SIGNAL' src/views/home.ejs
          ! grep -qi 'KNOW THE WORLD' src/views/home.ejs
          grep -q '/assets/ui/recovery.svg' src/views/help.ejs
          grep -q 'rankingTable' src/views/rankings.ejs
          grep -q 'characterCards' src/views/account.ejs
          grep -q '/assets/ui/launcher.svg' src/views/downloads.ejs
