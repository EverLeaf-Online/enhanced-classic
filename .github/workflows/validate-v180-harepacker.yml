name: Validate v180 tooling with HaRepacker

on:
  push:
    branches: [donor/v180-low-friction-stage-20260911]
    paths:
      - '.github/workflows/validate-v180-harepacker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-harepacker:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout EverLeaf staging branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clone HaRepacker-resurrected and required MapleLib submodule
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root="$env:RUNNER_TEMP/Harepacker-resurrected"
          git clone --depth 1 https://github.com/lastbattle/Harepacker-resurrected.git $root
          if($LASTEXITCODE){throw 'HaRepacker clone failed'}
          git -C $root submodule update --init --depth 1 MapleLib
          if($LASTEXITCODE){throw 'HaRepacker MapleLib submodule checkout failed'}
          git -C $root rev-parse HEAD
          git -C (Join-Path $root 'MapleLib') rev-parse HEAD

      - name: Build HaRepacker and HaCreator
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'Harepacker-resurrected'
          dotnet build (Join-Path $root 'HaRepacker/Harepacker-resurrected.csproj') -c Release -r win-x64 --no-self-contained
          if($LASTEXITCODE){throw 'HaRepacker build failed'}
          dotnet build (Join-Path $root 'HaCreator/HaCreator.csproj') -c Release -r win-x64 --no-self-contained
          if($LASTEXITCODE){throw 'HaCreator build failed'}

      - name: Verify Private Server XML and map-import paths exist
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'Harepacker-resurrected'
          $main=Get-Content -Raw (Join-Path $root 'HaRepacker/GUI/MainForm.cs')
          foreach($token in @('privateServerToolStripMenuItem_Click','WzClassicXmlSerializer')){
            if($main -notmatch [regex]::Escape($token)){throw "Private Server XML hook missing: $token"}
          }
          $map=Get-Content -Raw (Join-Path $root 'HaCreator/Wz/MapImportService.cs')
          foreach($token in @('MapImportPlan','Analyze(','Import(','MapImportAssetKind.Map','MapImportAssetKind.Tile','MapImportAssetKind.Object','MapImportAssetKind.Background','MapImportAssetKind.Reactor','MapImportAssetKind.Mob','MapImportAssetKind.Npc','MapImportAssetKind.String','MapImportAssetKind.Sound')){
            if($map -notmatch [regex]::Escape($token)){throw "Map import dependency hook missing: $token"}
          }
          Write-Host 'HaRepacker builds and actual v180-relevant XML/map-import hooks are verified.'
