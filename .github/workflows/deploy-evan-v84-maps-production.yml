name: Deploy Evan v84 Maps Production

on:
  push:
    branches: [release-dev]
    paths: ['.github/workflows/deploy-evan-v84-maps-production.yml']
  workflow_dispatch:

concurrency:
  group: everleaf-evan-v84-map-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PACKAGE_RUN_ID: '33561070740'
  MAPLELIB_COMMIT: 4970d339b2ab2bc00ffc33edfbf570e87053b822
  LIBWZ_COMMIT: 41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_PUBLIC_HOST: everleafms.online

jobs:
  build-donor-and-commit-server-data:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      server_sha: ${{ steps.commit.outputs.server_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: evan-v84-map-package
          path: package
          repository: iampolicy/enhanced-classic
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Fetch compatibility-patched MapleLib
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/lastbattle/MapleLib "$env:RUNNER_TEMP\MapleLib"
          git -C "$env:RUNNER_TEMP\MapleLib" checkout $env:MAPLELIB_COMMIT
          $f="$env:RUNNER_TEMP\MapleLib\MapleLib\WzLib\WzImageProperty.cs"
          $s=Get-Content $f -Raw
          $patched=[regex]::Replace($s,'else if\s*\(type == 0\)','else if (type == 0 || type == 1)',1)
          if($patched -eq $s) { throw 'Legacy float patch target not found' }
          Set-Content $f $patched -NoNewline
      - name: Build validated v84 donor WZ without decoding PNGs
        shell: pwsh
        run: |
          $p="$env:RUNNER_TEMP\EvanDonor"; New-Item -ItemType Directory -Force $p | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><EnableWindowsTargeting>true</EnableWindowsTargeting><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><ProjectReference Include="..\MapleLib\MapleLib\MapleLib.csproj" /></ItemGroup></Project>
          '@ | Set-Content "$p\EvanDonor.csproj"
          @'
          using MapleLib.WzLib; using MapleLib.WzLib.Serializer;
          static class Program {
            static WzDirectory Dir(WzDirectory p,string n,WzFile f){var d=p.GetDirectoryByName(n);if(d!=null)return d;d=new WzDirectory(n,f);p.AddDirectory(d);return d;}
            static WzImage Load(string path,string name){var d=new WzImgDeserializer(false);var i=d.WzImageFromIMGBytes(File.ReadAllBytes(path),WzMapleVersion.BMS,name,false);i.ParseEverything=false;if(!i.ParseImage(true)||i.WzProperties.Count==0)throw new Exception("Could not parse "+path);i.Changed=true;return i;}
            static void Add(WzDirectory d,WzImage i){var old=d.GetImageByName(i.Name);if(old!=null)d.RemoveImage(old);d.AddImage(i);}
            static void Main(string[] a){var root=Path.GetFullPath(a[0]);var output=Path.GetFullPath(a[1]);using var f=new WzFile(84,WzMapleVersion.GMS){Name="Map.wz"};f.WzDirectory.Name="Map.wz";var map1=Dir(Dir(f.WzDirectory,"Map",f),"Map1",f);foreach(var path in Directory.GetFiles(Path.Combine(root,"maps"),"*.img")){Add(map1,Load(path,Path.GetFileName(path)));}foreach(var t in new[]{"Obj","Tile","Back"}){var d=Dir(f.WzDirectory,t,f);var source=Path.Combine(root,"dependencies",t);if(Directory.Exists(source))foreach(var path in Directory.GetFiles(source,"*.img")){Add(d,Load(path,Path.GetFileName(path)));}}f.SaveToDisk(output,false,WzMapleVersion.GMS);if(new FileInfo(output).Length<100000)throw new Exception("Donor WZ unexpectedly small");using var verify=new WzFile(output,84,WzMapleVersion.GMS);if(verify.ParseWzFile()!=WzFileParseStatus.Success)throw new Exception("Donor reparse failed");var m=(WzDirectory)((WzDirectory)verify.WzDirectory["Map"])["Map1"];foreach(var id in new[]{"100030100","100030101","100030102","100030103","100030200","100030300","100030310","100030400"})if(m.GetImageByName(id+".img")==null)throw new Exception("Donor missing map "+id);Console.WriteLine("DONOR_OK bytes="+new FileInfo(output).Length);}
          }
          '@ | Set-Content "$p\Program.cs"
          dotnet run --project "$p\EvanDonor.csproj" -c Release -- "${{ github.workspace }}\package" "${{ github.workspace }}\EvanMap-v84-donor.wz"
          Get-FileHash EvanMap-v84-donor.wz -Algorithm SHA256
      - name: Commit eight Evan server map XML files
        id: commit
        shell: pwsh
        run: |
          $dest='wz/Map.wz/Map/Map1'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $ids=100030100,100030101,100030102,100030103,100030200,100030300,100030310,100030400
          foreach($id in $ids){ Copy-Item "package/server-xml/$id.img.xml" "$dest/$id.img.xml" -Force }
          git config user.name 'EverLeaf Production Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $dest
          if(git diff --cached --quiet){ Write-Host 'Server XML already committed.' } else { git commit -m 'content: add Evan v84 starter maps'; git push origin HEAD:release-dev }
          "server_sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - uses: actions/upload-artifact@v4
        with:
          name: evan-v84-donor-production
          path: EvanMap-v84-donor.wz
          if-no-files-found: error

  patch-client-and-deploy-server:
    needs: build-donor-and-commit-server-data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVER_SHA: ${{ needs.build-donor-and-commit-server-data.outputs.server_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: evan-v84-map-package
          path: package
          repository: iampolicy/enhanced-classic
          run-id: ${{ env.PACKAGE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: evan-v84-donor-production
          path: donor
      - name: Build validated WZ path patcher
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/toyobayashi/libwz "$RUNNER_TEMP/libwz"
          git -C "$RUNNER_TEMP/libwz" checkout "$LIBWZ_COMMIT"
          git -C "$RUNNER_TEMP/libwz" submodule update --init --recursive
          cmake -S client/tools/wz-path-patcher -B "$RUNNER_TEMP/wz-path-build" -DLIBWZ_SOURCE="$RUNNER_TEMP/libwz" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/wz-path-build" --config Release --parallel 2
          test -x "$RUNNER_TEMP/wz-path-build/everleaf-wz-path-patcher"
      - name: Generate exact patch spec
        shell: bash
        run: |
          set -euo pipefail
          for id in 100030100 100030101 100030102 100030103 100030200 100030300 100030310 100030400; do echo "image:Map/Map1/$id.img"; done > evan-map.spec
          python3 - <<'PY' >> evan-map.spec
          import json
          d=json.load(open('package/dependencies.json'))
          for kind in ('Obj','Tile','Back'):
              for name in d.get(kind,[]): print(f'missing-image:{kind}/{name}.img')
          PY
          cat evan-map.spec
      - name: Configure production SSH and fetch live Map.wz
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'test -s /opt/everleaf/patches/files/Map.wz && systemctl is-active --quiet everleaf.service'
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/Map.wz" Map-live.wz
          test -s Map-live.wz
          sha256sum Map-live.wz
      - name: Patch v83 Map.wz and verify every inserted path
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wz-path-build/everleaf-wz-path-patcher" Map-live.wz 83 donor/EvanMap-v84-donor.wz 84 evan-map.spec Map-patched.wz
          test -s Map-patched.wz
          test "$(stat -c%s Map-patched.wz)" -gt "$(stat -c%s Map-live.wz)"
          sha256sum Map-patched.wz | tee Map-patched.sha256
      - name: Atomically publish Map.wz and signed launcher manifest
        shell: bash
        run: |
          set -euo pipefail
          STAGE="/tmp/everleaf-evan-map-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          scp -i ~/.ssh/id_everleaf Map-patched.wz "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$STAGE/Map.wz"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "STAGE='$STAGE' RELEASE_SHA='$SERVER_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          PATCH_ROOT=/opt/everleaf/patches
          FILES="$PATCH_ROOT/files"
          test -s "$STAGE/Map.wz"
          cp "$FILES/Map.wz" "$STAGE/Map.wz.backup"
          cp "$PATCH_ROOT/manifest.json" "$STAGE/manifest.json.backup"
          rollback(){ echo 'Rolling back Evan Map.wz publish' >&2; sudo install -m 644 "$STAGE/Map.wz.backup" "$FILES/Map.wz"; sudo install -m 644 "$STAGE/manifest.json.backup" "$PATCH_ROOT/manifest.json"; }
          trap rollback ERR
          sudo install -m 644 "$STAGE/Map.wz" "$FILES/Map.wz.new"
          sudo mv -f "$FILES/Map.wz.new" "$FILES/Map.wz"
          LAUNCHER_PATCH_ROOT="$PATCH_ROOT" LAUNCHER_BASELINE_PATH="$PATCH_ROOT/managed-client-baseline.json" LAUNCHER_MANIFEST_PATH="$STAGE/manifest.json" node /opt/everleaf/web/scripts/build-patch-manifest.js "$RELEASE_SHA"
          node - "$STAGE/manifest.json" <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));if(m.files.length!==36)throw new Error(`Expected 36 managed files, got ${m.files.length}`);if(!m.files.some(x=>x.path==='Map.wz'))throw new Error('Map.wz absent from manifest');
          NODE
          sudo install -m 644 "$STAGE/manifest.json" "$PATCH_ROOT/manifest.json.new"
          sudo mv -f "$PATCH_ROOT/manifest.json.new" "$PATCH_ROOT/manifest.json"
          expected=$(sha256sum "$FILES/Map.wz"|awk '{print $1}')
          curl -fsS http://127.0.0.1:3000/patches/Map.wz -o "$STAGE/live-Map.wz"
          actual=$(sha256sum "$STAGE/live-Map.wz"|awk '{print $1}')
          test "$expected" = "$actual"
          curl -fsS http://127.0.0.1:3000/v1/launcher/manifest > "$STAGE/live-manifest.json"
          cmp -s "$STAGE/live-manifest.json" "$PATCH_ROOT/manifest.json"
          trap - ERR
          echo "LIVE_MAP_SHA256=$expected"
          REMOTE
      - name: Verify public manifest advertises patched Map.wz
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk '{print $1}' Map-patched.sha256)
          curl -fsS --max-time 30 "https://$EVERLEAF_PUBLIC_HOST/v1/launcher/manifest" -o public-manifest.json
          EXPECTED="$expected" python3 - <<'PY'
          import json,os
          m=json.load(open('public-manifest.json'))
          e=os.environ['EXPECTED']
          row=next((x for x in m['files'] if x['path']=='Map.wz'),None)
          assert row, 'Map.wz missing from public manifest'
          assert row['sha256'].lower()==e.lower(), (row['sha256'],e)
          print('PUBLIC_MAP_MANIFEST_OK',e)
          PY
          test "$(curl -fsSL --range 0-3 --max-time 20 "https://$EVERLEAF_PUBLIC_HOST/patches/Map.wz" | head -c4)" = 'PKG1'
      - name: Dispatch production game deploy at server-data commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-game-production.yml --repo "$GITHUB_REPOSITORY" --ref release-dev
          for i in $(seq 1 30); do
            rid=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-game-production.yml --branch release-dev --event workflow_dispatch --limit 10 --json databaseId,headSha,createdAt --jq '.[] | select(.headSha==env.SERVER_SHA) | .databaseId' | head -1)
            if [ -n "$rid" ]; then echo "deploy_run_id=$rid" >> "$GITHUB_OUTPUT"; echo "Deploy run $rid"; exit 0; fi
            sleep 5
          done
          echo 'Could not resolve production deploy run id' >&2; exit 1
      - name: Wait for production game deploy
        shell: bash
        run: gh run watch "${{ steps.deploy.outputs.deploy_run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Verify Evan map XML is on active production release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet everleaf.service
          ROOT=/opt/everleaf/current/wz/Map.wz/Map/Map1
          for id in 100030100 100030101 100030102 100030103 100030200 100030300 100030310 100030400; do test -s "$ROOT/$id.img.xml"; done
          ss -lnt | grep -q ':8484 '
          ss -lnt | grep -q ':7575 '
          echo 'EVAN_V84_MAPS_PRODUCTION_OK'
          REMOTE
