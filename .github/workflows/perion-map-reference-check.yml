name: Perion Map Reference Check

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/compare_map_reference.py'
      - '.github/workflows/perion-map-reference-check.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4
        with:
          path: everleaf
      - name: Checkout v83 reference
        uses: actions/checkout@v4
        with:
          repository: jonnylin13/Maple83
          path: maple83-reference
          fetch-depth: 1
      - name: Compare Perion map 102000000
        run: |
          cd everleaf
          python3 tools/compare_map_reference.py 102000000 ../maple83-reference/wz/Map.wz/Map
          python3 tools/compare_map_reference.py 102000000 ../maple83-reference/wz/Map.wz/Map --json > perion-map-reference.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: perion-map-reference
          path: everleaf/perion-map-reference.json
          if-no-files-found: error
