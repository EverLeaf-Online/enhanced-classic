name: Perion Map Reference Check

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/compare_map_reference.py'
      - '.github/workflows/perion-map-reference-check.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v5
        with:
          path: everleaf
      - name: Checkout v83 reference
        uses: actions/checkout@v5
        with:
          repository: jonnylin13/Maple83
          path: maple83-reference
          fetch-depth: 1
      - name: Compare Perion map 102000000
        run: |
          cd everleaf
          python3 tools/compare_map_reference.py 102000000 ../maple83-reference/wz/Map.wz/Map
          python3 tools/compare_map_reference.py 102000000 ../maple83-reference/wz/Map.wz/Map --json > perion-map-reference.json
      - name: Summarize report
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('everleaf/perion-map-reference.json'))
          print('### Perion map reference check')
          for key, value in report.items():
              if isinstance(value, list):
                  print(f'- {key}: {len(value)}')
              elif not isinstance(value, dict):
                  print(f'- {key}: {value}')
          PY
