name: Normalize Ninja quests into canonical live v95 client

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/normalize-live-v95-ninja-quests.yml'
      - 'tools/wz-donor/quest-baseline-patcher/Program.cs'
  workflow_dispatch:

concurrency:
  group: everleaf-live-content-fix
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  normalize:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout release-dev
        uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure verified Oracle SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'; New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $key=Join-Path $sshDir 'id_everleaf'; [IO.File]::WriteAllText($key,($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")} else {& 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known}
          if(-not (Test-Path $known) -or (Get-Item $known).Length -eq 0){throw 'known_hosts unavailable'}
          & 'C:\Program Files\Git\usr\bin\ssh.exe' -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" 'echo Oracle SSH OK'
          if($LASTEXITCODE){throw 'Oracle SSH failed'}

      - name: Build canonical quest patcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafQuestBaselinePatcher'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item tools/wz-donor/quest-baseline-patcher/Program.cs (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafQuestBaselinePatcher.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafQuestBaselinePatcher.csproj') -c Release

      - name: Fetch exact live and pinned donor Quest/String WZ
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $target=Join-Path $env:RUNNER_TEMP 'target'; $donor=Join-Path $env:RUNNER_TEMP 'donor'; New-Item -ItemType Directory -Force -Path $target,$donor | Out-Null
          foreach($f in @('Quest.wz','String.wz')){
            & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "test -s '/opt/everleaf/patches/files/$f'; test -s '/opt/everleaf/private/wz-donors/gms-v95-raw/$f'"
            if($LASTEXITCODE){throw "Oracle source missing $f"}
            & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/patches/files/$f" (Join-Path $target $f)
            if($LASTEXITCODE){throw "live fetch failed $f"}
            & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/private/wz-donors/gms-v95-raw/$f" (Join-Path $donor $f)
            if($LASTEXITCODE){throw "donor fetch failed $f"}
          }
          Get-FileHash (Join-Path $target 'Quest.wz') -Algorithm SHA256
          Get-FileHash (Join-Path $target 'String.wz') -Algorithm SHA256

      - name: Build and reparse canonical Ninja quest candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'target'; $donor=Join-Path $env:RUNNER_TEMP 'donor'; $out=Join-Path $env:RUNNER_TEMP 'ninja-quest-baseline'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafQuestBaselinePatcher/EverLeafQuestBaselinePatcher.csproj'
          dotnet run --project $project -c Release --no-build -- (Join-Path $target 'Quest.wz') (Join-Path $target 'String.wz') (Join-Path $donor 'Quest.wz') (Join-Path $donor 'String.wz') $out
          if($LASTEXITCODE){throw 'Ninja quest baseline patch failed'}
          Get-Content (Join-Path $out 'QUEST_BASELINE_MANIFEST.json') | Add-Content $env:GITHUB_STEP_SUMMARY
          "QUEST_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reconstruct exact managed client and boot normalized candidate offline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $baseline=Get-Content client/managed-client-baseline.json -Raw | ConvertFrom-Json
          $names=@($baseline.managedFiles | ForEach-Object {[string]$_.path})
          foreach($required in @('EverLeaf.exe','Quest.wz','String.wz')){if($names -notcontains $required){throw "managed client missing $required"}}
          foreach($name in $names){if($name -notmatch '^[A-Za-z0-9_.-]+$'){throw "unsafe managed filename $name"}}
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $remote="/tmp/everleaf-ninja-quest-client-$env:GITHUB_RUN_ID.tgz"; $joined=$names -join ' '
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -euo pipefail; cd /opt/everleaf/patches/files; tar -czf '$remote' $joined"
          if($LASTEXITCODE){throw 'managed client archive prep failed'}
          $archive=Join-Path $env:RUNNER_TEMP 'client.tgz'; & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remote" $archive
          if($LASTEXITCODE){throw 'managed client archive fetch failed'}
          & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "rm -f '$remote'"
          $client=Join-Path $env:RUNNER_TEMP 'client'; New-Item -ItemType Directory -Force -Path $client | Out-Null; tar -xzf $archive -C $client
          if($LASTEXITCODE){throw 'managed client extraction failed'}
          Copy-Item (Join-Path $env:QUEST_OUT 'Quest.wz') (Join-Path $client 'Quest.wz') -Force
          Copy-Item (Join-Path $env:QUEST_OUT 'String.wz') (Join-Path $client 'String.wz') -Force
          $exe=[IO.Path]::GetFullPath((Join-Path $client 'EverLeaf.exe')); $rule="EverLeaf-ninja-quest-$env:GITHUB_RUN_ID"; $p=$null; $matches=@()
          try{
            New-NetFirewallRule -DisplayName $rule -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $p=Start-Process -FilePath $exe -WorkingDirectory $client -PassThru
            Start-Sleep -Seconds 15
            $matches=@(Get-CimInstance Win32_Process -Filter "Name='EverLeaf.exe'" -ErrorAction SilentlyContinue | Where-Object {try{[IO.Path]::GetFullPath([string]$_.ExecutablePath) -eq $exe}catch{$false}})
            if($matches.Count -eq 0){$p.Refresh(); $exit=if($p.HasExited){$p.ExitCode}else{'unresolved'}; throw "normalized client did not survive offline boot; exit=$exit"}
            Write-Host "NINJA_QUEST_CLIENT_BOOT_OK processes=$($matches.Count)"
          } finally {
            foreach($x in $matches){Stop-Process -Id ([int]$x.ProcessId) -Force -ErrorAction SilentlyContinue}
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }

      - name: Publish normalized Quest/String WZ with rollback and manifest rebuild
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $HOME '.ssh/id_everleaf'; $ssh='C:\Program Files\Git\usr\bin\ssh.exe'; $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $qRemote="/tmp/everleaf-ninja-quest-$env:GITHUB_RUN_ID.wz"; $sRemote="/tmp/everleaf-ninja-string-$env:GITHUB_RUN_ID.wz"
          & $scp -i $key (Join-Path $env:QUEST_OUT 'Quest.wz') "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$qRemote"; if($LASTEXITCODE){throw 'Quest upload failed'}
          & $scp -i $key (Join-Path $env:QUEST_OUT 'String.wz') "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$sRemote"; if($LASTEXITCODE){throw 'String upload failed'}
          $remote=@'
          set -euo pipefail
          q="$1"; s="$2"; sha="$3"
          PATCH=/opt/everleaf/patches; FILES="$PATCH/files"; WORK="/opt/everleaf/backups/ninja-quest-normalize-$sha"
          mkdir -p "$WORK"
          test -s "$q"; test -s "$s"; test -s "$FILES/Quest.wz"; test -s "$FILES/String.wz"; test -s "$PATCH/manifest.json"
          cp -a "$FILES/Quest.wz" "$WORK/Quest.wz.before"
          cp -a "$FILES/String.wz" "$WORK/String.wz.before"
          cp -a "$PATCH/manifest.json" "$WORK/manifest.before.json"
          rollback(){
            echo NINJA_QUEST_NORMALIZE_ROLLBACK >&2
            sudo install -m 644 "$WORK/Quest.wz.before" "$FILES/Quest.wz" || true
            sudo install -m 644 "$WORK/String.wz.before" "$FILES/String.wz" || true
            sudo install -m 644 "$WORK/manifest.before.json" "$PATCH/manifest.json" || true
          }
          trap rollback ERR
          sudo install -m 644 "$q" "$FILES/Quest.wz"
          sudo install -m 644 "$s" "$FILES/String.wz"
          GENERATED="$WORK/manifest.normalized.json"
          LAUNCHER_PATCH_ROOT="$PATCH" \
          LAUNCHER_BASELINE_PATH="$PATCH/managed-client-baseline.json" \
          LAUNCHER_MANIFEST_PATH="$GENERATED" \
          LAUNCHER_PORTABLE_PATH="$PATCH/downloads/EverLeafLauncher-portable.zip" \
          LAUNCHER_VERSION_PATH="$PATCH/downloads/EverLeafLauncher-version.txt" \
          node /opt/everleaf/web/scripts/build-patch-manifest.js "$sha"
          test -s "$GENERATED"
          sudo install -m 644 "$GENERATED" "$PATCH/manifest.json"
          cmp -s "$GENERATED" "$PATCH/manifest.json"
          test -s "$FILES/Quest.wz"; test -s "$FILES/String.wz"
          trap - ERR
          rm -f "$q" "$s"
          echo "NINJA_QUEST_CANONICAL_CLIENT_PUBLISHED backup=$WORK"
          '@
          $remote | & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "bash -s -- '$qRemote' '$sRemote' '$env:GITHUB_SHA'"
          if($LASTEXITCODE){throw 'canonical Ninja quest publish failed'}

      - name: Verify public patch manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-WebRequest -UseBasicParsing -Uri 'https://everleafms.online/patches/manifest.json' -TimeoutSec 20
          if($r.StatusCode -ne 200 -or $r.Content.Length -lt 100){throw 'public patch manifest unavailable'}
          Write-Host "PUBLIC_PATCH_MANIFEST_OK bytes=$($r.Content.Length)"
