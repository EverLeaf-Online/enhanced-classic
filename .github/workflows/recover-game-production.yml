name: Recover EverLeaf Game Production

on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/recover-game-production.yml'

concurrency:
  group: everleaf-game-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Restart current production release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -L /opt/everleaf/current
          test -f /opt/everleaf/current/config.yaml
          echo "Recovering current release: $(readlink -f /opt/everleaf/current)"
          sudo systemctl restart everleaf.service
          for _ in $(seq 1 30); do
            if systemctl is-active --quiet everleaf.service; then
              break
            fi
            sleep 1
          done
          if ! systemctl is-active --quiet everleaf.service; then
            echo 'everleaf.service did not become active.' >&2
            sudo journalctl -u everleaf.service -n 120 --no-pager >&2 || true
            exit 1
          fi
          systemctl --no-pager --full status everleaf.service | head -40
          REMOTE

      - name: Verify login and all channel ports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket
          import time

          host = '132.145.141.79'
          ports = [8484, *range(7575, 7595)]
          deadline = time.time() + 45
          remaining = set(ports)
          while remaining and time.time() < deadline:
              for port in list(remaining):
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          remaining.remove(port)
                  except OSError:
                      pass
              if remaining:
                  time.sleep(2)
          if remaining:
              raise SystemExit(f'Production ports did not recover: {sorted(remaining)}')
          print(f'EverLeaf production recovery PASS: {len(ports)} game ports reachable')
          PY
