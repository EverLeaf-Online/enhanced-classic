name: Import special job artwork

on:
  push:
    branches:
      - web/authentic-special-job-art
    paths:
      - .github/workflows/import-special-job-art.yml

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: web/authentic-special-job-art
      - name: Download local class artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/assets/jobs/special

          CYGNUS_PAGE='https://www.nicepng.com/ourpic/u2e6q8q8y3q8y3u2_cygnus-knights-maplestory-knights-of-cygnus/'
          CYGNUS_URL="$(curl -fsSL -A 'Mozilla/5.0' "$CYGNUS_PAGE" | grep -oE 'https://www\.nicepng\.com/png/detail/[^" ]+\.png' | head -n1)"
          test -n "$CYGNUS_URL"
          echo "Resolved Cygnus asset: $CYGNUS_URL"

          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$CYGNUS_URL" -o /tmp/cygnus-source
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'https://www.nicepng.com/png/detail/905-9051338_photo-aran-male-zps353cda7f-aran-maplestory.png' \
            -o /tmp/aran-source
          curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'https://www.clipartmax.com/png/middle/205-2055764_cartoons-anime-evan-maplestory-heroes-of-maple.png' \
            -o /tmp/evan-source

          file /tmp/cygnus-source /tmp/aran-source /tmp/evan-source
          command -v convert >/dev/null || { sudo apt-get update -y && sudo apt-get install -y imagemagick; }
          convert /tmp/cygnus-source web/public/assets/jobs/special/cygnus.png
          convert /tmp/aran-source web/public/assets/jobs/special/aran.png
          convert /tmp/evan-source web/public/assets/jobs/special/evan.png

          python - <<'PY'
          from pathlib import Path
          sig = b'\x89PNG\r\n\x1a\n'
          for name in ('cygnus','aran','evan'):
              p = Path(f'web/public/assets/jobs/special/{name}.png')
              data = p.read_bytes()
              if not data.startswith(sig) or len(data) < 5000:
                  raise SystemExit(f'{p} is not a valid normalized PNG ({len(data)} bytes)')
              print(name, len(data))
          PY
      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/assets/jobs/special/*.png
          if git diff --cached --quiet; then
            echo 'Artwork already present.'
            exit 0
          fi
          git commit -m 'assets(web): add Cygnus Aran Evan artwork'
          git push origin HEAD:web/authentic-special-job-art
