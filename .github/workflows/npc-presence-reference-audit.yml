name: NPC Presence Reference Audit

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'tools/audit_npc_presence_reference.py'
      - '.github/workflows/npc-presence-reference-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v5
        with:
          path: everleaf
      - name: Checkout v83 reference
        uses: actions/checkout@v5
        with:
          repository: jonnylin13/Maple83
          path: maple83-reference
          fetch-depth: 1
      - name: Compare NPC presence
        run: |
          cd everleaf
          python3 tools/audit_npc_presence_reference.py ../maple83-reference/wz/Map.wz/Map
          python3 tools/audit_npc_presence_reference.py ../maple83-reference/wz/Map.wz/Map --json > npc-presence-reference-audit.json
      - name: Summarize report
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open('everleaf/npc-presence-reference-audit.json'))
          print('### NPC presence reference audit')
          for key, value in report.items():
              if isinstance(value, list):
                  print(f'- {key}: {len(value)}')
              elif not isinstance(value, dict):
                  print(f'- {key}: {value}')
          PY
