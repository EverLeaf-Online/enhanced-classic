name: Import Cygnus ranking artwork

on:
  push:
    branches:
      - web/cygnus-rank-art
    paths:
      - .github/workflows/import-cygnus-rank-art.yml

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: web/cygnus-rank-art
      - name: Fetch individual Cygnus class artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/assets/jobs/cygnus
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          api = 'https://maplestorywiki.net/api.php'
          targets = {
              'dawn-warrior': [
                  'ClassArtwork Dawn Warrior (Ignition, Female).png',
                  'ClassArtwork Dawn Warrior (Cygnus Returns, Female).png',
              ],
              'blaze-wizard': [
                  'ClassArtwork Blaze Wizard (Ignition, Male).png',
                  'ClassArtwork Blaze Wizard (Cygnus Returns, Male).png',
                  'ClassArtwork Blaze Wizard (Ignition, Female).png',
              ],
              'wind-archer': [
                  'ClassArtwork Wind Archer (Ignition, Male).png',
                  'ClassArtwork Wind Archer (Cygnus Returns, Male).png',
              ],
              'night-walker': [
                  'ClassArtwork Night Walker (Ignition, Female).png',
                  'ClassArtwork Night Walker (Cygnus Returns, Female).png',
              ],
              'thunder-breaker': [
                  'ClassArtwork Thunder Breaker (Ignition, Female).png',
                  'ClassArtwork Thunder Breaker (Cygnus Returns, Female).png',
              ],
          }

          def image_url(title):
              qs = urllib.parse.urlencode({
                  'action':'query','format':'json','prop':'imageinfo','iiprop':'url',
                  'titles':'File:' + title,
              })
              req = urllib.request.Request(api + '?' + qs, headers={'User-Agent':'EverLeaf asset importer/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              for page in data.get('query',{}).get('pages',{}).values():
                  info = page.get('imageinfo')
                  if info and info[0].get('url'):
                      return info[0]['url']
              return None

          for slug, candidates in targets.items():
              url = None
              used = None
              for title in candidates:
                  try:
                      url = image_url(title)
                  except Exception as exc:
                      print(f'{slug}: query failed for {title}: {exc}')
                  if url:
                      used = title
                      break
              if not url:
                  raise SystemExit(f'Could not resolve individual artwork for {slug}')
              out = pathlib.Path(f'web/public/assets/jobs/cygnus/{slug}.png')
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 EverLeaf/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  blob = r.read()
              if not blob.startswith(b'\x89PNG\r\n\x1a\n') or len(blob) < 10000:
                  raise SystemExit(f'{slug}: downloaded asset is not a valid PNG ({len(blob)} bytes) from {url}')
              out.write_bytes(blob)
              print(f'{slug}: {used} -> {url} ({len(blob)} bytes)')
          PY
      - name: Commit imported artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/assets/jobs/cygnus/*.png
          if git diff --cached --quiet; then
            echo 'Cygnus artwork already present.'
            exit 0
          fi
          git commit -m 'assets(web): add individual Cygnus class artwork'
          git push origin HEAD:web/cygnus-rank-art
