name: Publish EverLeaf login and UI WZ

on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths:
      - "client/branding/login/**"
      - "client/tools/login-wz-patcher/**"
      - ".github/workflows/publish-everleaf-login-wz.yml"

concurrency:
  group: everleaf-client-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_PUBLIC_HOST: everleafms.duckdns.org
  LIBWZ_COMMIT: 41cd5d62ecd229f0eb425c2654ecf0bf8b435d7f

jobs:
  build-patch-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Generate borderless EverLeaf login artwork
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pillow
          python3 client/branding/login/generate_art.py --output "$RUNNER_TEMP/everleaf-login-art"
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'everleaf-login-art'
          bg=Image.open(root/'background.png')
          logo=Image.open(root/'logo.png')
          frame=Image.open(root/'frame.png')
          signboard=Image.open(root/'signboard.png')
          assert bg.size == (800,600) and bg.mode == 'RGB'
          assert logo.size == (397,219) and logo.mode == 'RGBA'
          assert frame.size == (800,600) and frame.mode == 'RGBA'
          assert frame.getbbox() is None, 'UI login frame must be fully transparent'
          assert signboard.size == (368,236)
          map_frame=Image.new('RGBA',(799,599),(0,0,0,0))
          map_frame.save(root/'map-frame.png')
          assert Image.open(root/'map-frame.png').getbbox() is None
          neo=root/'neocity-transparent'
          neo.mkdir(exist_ok=True)
          sizes={(625,479),(347,340),(347,339),(346,339),(439,339),
                 (49,30),(48,23),(48,22),(45,22),(44,21),(248,61),(291,120)}
          for width,height in sizes:
              path=neo/f'{width}x{height}.png'
              Image.new('RGBA',(width,height),(0,0,0,0)).save(path,'PNG',optimize=True)
              assert Image.open(path).getbbox() is None
          print(f'Borderless EverLeaf login art validated; {len(sizes)} Neo City transparent sizes generated')
          PY

      - name: Build source-pinned WZ patcher
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/toyobayashi/libwz.git "$RUNNER_TEMP/libwz"
          git -C "$RUNNER_TEMP/libwz" checkout "$LIBWZ_COMMIT"
          git -C "$RUNNER_TEMP/libwz" submodule update --init --recursive
          cmake -S client/tools/login-wz-patcher -B "$RUNNER_TEMP/wz-build" \
            -DLIBWZ_SOURCE="$RUNNER_TEMP/libwz" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static -static-libstdc++ -static-libgcc"
          cmake --build "$RUNNER_TEMP/wz-build" --config Release -j2
          test -x "$RUNNER_TEMP/wz-build/everleaf-login-wz-patcher"
          test -x "$RUNNER_TEMP/wz-build/everleaf-remove-map-login-frame"
          test -x "$RUNNER_TEMP/wz-build/everleaf-remove-map-neocity"

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          mkdir -p "$SSH_DIR" && chmod 700 "$SSH_DIR"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/id_everleaf"
          chmod 600 "$SSH_DIR/id_everleaf"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$SSH_DIR/known_hosts"
          fi
          chmod 600 "$SSH_DIR/known_hosts"
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf" \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'test -s /opt/everleaf/patches/files/Map.wz && test -s /opt/everleaf/patches/files/UI.wz && test -s /opt/everleaf/patches/manifest.json'

      - name: Build validated Map.wz and UI.wz candidates
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf")
          scp "${SSH_OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/Map.wz" "$RUNNER_TEMP/Map.wz.live"
          scp "${SSH_OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/opt/everleaf/patches/files/UI.wz" "$RUNNER_TEMP/UI.wz.live"
          PATCHER="$RUNNER_TEMP/wz-build/everleaf-login-wz-patcher"
          FRAME_REMOVER="$RUNNER_TEMP/wz-build/everleaf-remove-map-login-frame"
          NEOCITY_REMOVER="$RUNNER_TEMP/wz-build/everleaf-remove-map-neocity"
          "$PATCHER" "$RUNNER_TEMP/Map.wz.live" "$RUNNER_TEMP/UI.wz.live" \
            "$RUNNER_TEMP/everleaf-login-art" "$RUNNER_TEMP/Map.wz.branded" "$RUNNER_TEMP/UI.wz.new"
          "$FRAME_REMOVER" "$RUNNER_TEMP/Map.wz.branded" \
            "$RUNNER_TEMP/everleaf-login-art/map-frame.png" "$RUNNER_TEMP/Map.wz.borderless"
          "$NEOCITY_REMOVER" "$RUNNER_TEMP/Map.wz.borderless" \
            "$RUNNER_TEMP/everleaf-login-art/neocity-transparent" "$RUNNER_TEMP/Map.wz.new"
          test -s "$RUNNER_TEMP/Map.wz.new"
          test -s "$RUNNER_TEMP/UI.wz.new"
          sha256sum "$RUNNER_TEMP/Map.wz.live" | awk '{print $1}' > "$RUNNER_TEMP/map.old.sha"
          sha256sum "$RUNNER_TEMP/Map.wz.new" | awk '{print $1}' > "$RUNNER_TEMP/map.new.sha"
          sha256sum "$RUNNER_TEMP/UI.wz.live" | awk '{print $1}' > "$RUNNER_TEMP/ui.old.sha"
          sha256sum "$RUNNER_TEMP/UI.wz.new" | awk '{print $1}' > "$RUNNER_TEMP/ui.new.sha"
          stat -c '%s' "$RUNNER_TEMP/Map.wz.new" > "$RUNNER_TEMP/map.new.size"
          stat -c '%s' "$RUNNER_TEMP/UI.wz.new" > "$RUNNER_TEMP/ui.new.size"
          test "$(cat "$RUNNER_TEMP/map.old.sha")" != "$(cat "$RUNNER_TEMP/map.new.sha")"
          test "$(cat "$RUNNER_TEMP/ui.old.sha")" != "$(cat "$RUNNER_TEMP/ui.new.sha")"
          echo "Validated changed Map.wz and UI.wz candidates"

      - name: Stage changed Map.wz and UI.wz
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          SSH_OPTS=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf")
          REMOTE_STAGE="/tmp/everleaf-login-ui-$GITHUB_SHA"
          ssh "${SSH_OPTS[@]}" "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/Map.wz.new" "$RUNNER_TEMP/UI.wz.new" \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$REMOTE_STAGE/"

      - name: Atomically publish Map.wz and UI.wz and update manifest
        run: |
          set -euo pipefail
          SSH_DIR="$RUNNER_TEMP/everleaf-ssh"
          map_old="$(cat "$RUNNER_TEMP/map.old.sha")"
          map_new="$(cat "$RUNNER_TEMP/map.new.sha")"
          map_size="$(cat "$RUNNER_TEMP/map.new.size")"
          ui_old="$(cat "$RUNNER_TEMP/ui.old.sha")"
          ui_new="$(cat "$RUNNER_TEMP/ui.new.sha")"
          ui_size="$(cat "$RUNNER_TEMP/ui.new.size")"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile="$SSH_DIR/known_hosts" -i "$SSH_DIR/id_everleaf" \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            "RELEASE_SHA='$GITHUB_SHA' MAP_OLD='$map_old' MAP_NEW='$map_new' MAP_SIZE='$map_size' UI_OLD='$ui_old' UI_NEW='$ui_new' UI_SIZE='$ui_size' bash -s" <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/everleaf/patches
          FILES="$ROOT/files"
          STAGE="/tmp/everleaf-login-ui-$RELEASE_SHA"
          BACKUP="/opt/everleaf/backups/client-ui-$RELEASE_SHA"
          test "$(sha256sum "$FILES/Map.wz" | awk '{print $1}')" = "$MAP_OLD"
          test "$(sha256sum "$FILES/UI.wz" | awk '{print $1}')" = "$UI_OLD"
          test "$(sha256sum "$STAGE/Map.wz.new" | awk '{print $1}')" = "$MAP_NEW"
          test "$(sha256sum "$STAGE/UI.wz.new" | awk '{print $1}')" = "$UI_NEW"

          sudo mkdir -p "$BACKUP"
          sudo cp -a "$FILES/Map.wz" "$BACKUP/Map.wz"
          sudo cp -a "$FILES/UI.wz" "$BACKUP/UI.wz"
          sudo cp -a "$ROOT/manifest.json" "$BACKUP/manifest.json"

          node - "$ROOT/manifest.json" "$STAGE/manifest.json" <<'NODE'
          const fs=require('fs');
          const [src,dst]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(src,'utf8'));
          if(!Array.isArray(m.files) || m.files.length!==36) throw new Error(`expected 36 managed files, got ${m.files?.length}`);
          m.version=process.env.RELEASE_SHA;
          const map=m.files.find(x=>x.path==='Map.wz');
          const ui=m.files.find(x=>x.path==='UI.wz');
          if(!map || !ui) throw new Error('Map.wz or UI.wz missing from manifest');
          map.sha256=process.env.MAP_NEW; map.size=Number(process.env.MAP_SIZE);
          ui.sha256=process.env.UI_NEW; ui.size=Number(process.env.UI_SIZE);
          fs.writeFileSync(dst,JSON.stringify(m,null,2)+'\n');
          NODE

          rollback() {
            echo 'UI publish validation failed; restoring previous client files' >&2
            sudo cp -a "$BACKUP/Map.wz" "$FILES/Map.wz"
            sudo cp -a "$BACKUP/UI.wz" "$FILES/UI.wz"
            sudo cp -a "$BACKUP/manifest.json" "$ROOT/manifest.json"
          }
          trap rollback ERR

          sudo install -m 644 "$STAGE/Map.wz.new" "$FILES/Map.wz.new"
          sudo install -m 644 "$STAGE/UI.wz.new" "$FILES/UI.wz.new"
          sudo install -m 644 "$STAGE/manifest.json" "$ROOT/manifest.json.new"
          sudo mv -f "$FILES/Map.wz.new" "$FILES/Map.wz"
          sudo mv -f "$FILES/UI.wz.new" "$FILES/UI.wz"
          sudo mv -f "$ROOT/manifest.json.new" "$ROOT/manifest.json"

          test "$(sha256sum "$FILES/Map.wz" | awk '{print $1}')" = "$MAP_NEW"
          test "$(sha256sum "$FILES/UI.wz" | awk '{print $1}')" = "$UI_NEW"
          node - "$ROOT/manifest.json" "$MAP_NEW" "$UI_NEW" <<'NODE'
          const fs=require('fs');
          const [path,mapHash,uiHash]=process.argv.slice(2);
          const m=JSON.parse(fs.readFileSync(path,'utf8'));
          if(m.version!==process.env.RELEASE_SHA) throw new Error('manifest version mismatch');
          if(!Array.isArray(m.files) || m.files.length!==36) throw new Error('managed file count mismatch');
          const map=m.files.find(x=>x.path==='Map.wz');
          const ui=m.files.find(x=>x.path==='UI.wz');
          if(!map || map.sha256!==mapHash) throw new Error('Map.wz manifest hash mismatch');
          if(!ui || ui.sha256!==uiHash) throw new Error('UI.wz manifest hash mismatch');
          NODE
          curl -fsS http://127.0.0.1:3000/v1/launcher/manifest >/dev/null
          trap - ERR
          rm -rf "$STAGE"
          echo "EVERLEAF_UI_PUBLISHED MAP=$MAP_NEW UI=$UI_NEW BACKUP=$BACKUP"
          REMOTE

      - name: Verify public login/UI endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "https://$EVERLEAF_PUBLIC_HOST/v1/launcher/manifest" >/dev/null
          curl --fail --silent --show-error --max-time 30 "https://$EVERLEAF_PUBLIC_HOST/patches/UI.wz" -o /dev/null
          echo "EverLeaf Map.wz + UI.wz modernization publish verified for $GITHUB_SHA"
