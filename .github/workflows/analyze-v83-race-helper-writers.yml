name: Analyze v83 race helper writers

on:
  push:
    branches: [client-dev]
    paths:
      - ".github/workflows/analyze-v83-race-helper-writers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 335d4fbb74e713a01f63163c39c941865401d24a
          sparse-checkout: Localhosts.zip
          sparse-checkout-cone-mode: false
      - run: python3 -m pip install --user pefile capstone
      - name: Identify race selector method boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "096e21e155ca1a06a3132a6ad6f7feda5cd986928f415bab15a3b67fee412527  Localhosts.zip" | sha256sum --check
          mkdir source
          unzip -q Localhosts.zip -d source
          cp source/Localhost.exe v83.exe
          python3 - <<'PY'
          from pathlib import Path
          import pefile
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32

          data=Path('v83.exe').read_bytes(); pe=pefile.PE('v83.exe'); base=pe.OPTIONAL_HEADER.ImageBase
          md=Cs(CS_ARCH_X86,CS_MODE_32)
          target=0x00617348
          off=pe.get_offset_from_rva(target-base)
          print('TARGET_FILE_OFF',hex(off))
          # Search backwards for compiler prologues / previous returns.
          start=max(0,off-0x1000)
          blob=data[start:off+0x80]
          for pat,name in [(b'\x55\x8b\xec','push-ebp'),(b'\xc2\x04\x00','ret4'),(b'\xc3','ret')]:
              positions=[]; p=0
              while True:
                  q=blob.find(pat,p)
                  if q<0: break
                  positions.append(start+q); p=q+1
              print(name,[hex(base+pe.get_rva_from_offset(x)) for x in positions[-20:]])

          # Disassemble candidate windows at 0x617000 boundaries to expose method starts.
          for sva,eva in [(0x00616F00,0x00617390),(0x00617000,0x00617390),(0x00617100,0x00617390)]:
              print(f'\n===== {sva:08X}-{eva:08X} =====')
              so=pe.get_offset_from_rva(sva-base); eo=pe.get_offset_from_rva(eva-base)
              for i in md.disasm(data[so:eo],sva):
                  mark=''
                  if i.address==target: mark=' <<< RACE WRITE'
                  if i.mnemonic in ('ret','leave'): mark += ' <<< END?'
                  print(f'{i.address:08X}: {bytes(i.bytes).hex(" "):<28} {i.mnemonic:<7} {i.op_str}{mark}')
          PY
