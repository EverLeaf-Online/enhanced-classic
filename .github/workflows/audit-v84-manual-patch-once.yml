name: Audit original v84 manual patch once

on:
  push:
    branches: [feature/client-job-selector-modernization-20260904]
    paths: ['.github/workflows/audit-v84-manual-patch-once.yml']

permissions:
  contents: write

jobs:
  audit:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/client-job-selector-modernization-20260904
      - name: Download v83-to-v84 manual patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://www.ausgamers.com/files/download/51820/maple-story-patch-v84'
          $out=Join-Path $env:RUNNER_TEMP 'ManualPatcherv84.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -MaximumRedirection 10 -Headers @{'User-Agent'='Mozilla/5.0'}
          $f=Get-Item $out
          if($f.Length -lt 50000000){ throw "Downloaded file unexpectedly small: $($f.Length)" }
          Get-FileHash $out -Algorithm SHA256
          "PATCH_EXE=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Inspect patch container
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $seven='C:\Program Files\7-Zip\7z.exe'
          if(-not (Test-Path $seven)){ throw '7-Zip missing' }
          $list=& $seven l -slt $env:PATCH_EXE 2>&1
          $list | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/patch-list.txt"
          $extract=Join-Path $env:RUNNER_TEMP 'patch-extracted'; New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $seven x -y "-o$extract" $env:PATCH_EXE | Out-Host
          $files=Get-ChildItem $extract -Recurse -File -ErrorAction SilentlyContinue
          $lines=@('# Original GMS v84 patch donor inventory','',"- archive bytes: $((Get-Item $env:PATCH_EXE).Length)","- extracted files: $($files.Count)",'','## Relevant payload')
          $relevant=$files | Where-Object { $_.Name -match '(?i)(UI|MapleStory|patch|wz|login|data)' } | Sort-Object FullName
          foreach($f in $relevant){ $rel=$f.FullName.Substring($extract.Length+1).Replace('\','/'); $lines += "- ``$rel`` — $($f.Length) bytes" }
          if(-not $relevant){ $lines += '- No directly named UI/client payload exposed by 7-Zip.' }
          $lines += ''; $lines += '## 7-Zip container listing excerpt'; $lines += '```'; $lines += ($list | Select-Object -First 200); $lines += '```'
          $lines | Set-Content -Encoding utf8 docs/CLIENT_V84_PATCH_DONOR.md
          Get-Content docs/CLIENT_V84_PATCH_DONOR.md | Select-Object -First 260
      - name: Commit donor report
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name everleaf-client-bot
          git config user.email 173628847+iampolicy@users.noreply.github.com
          git add docs/CLIENT_V84_PATCH_DONOR.md
          git commit -m 'docs: inventory original GMS v84 patch donor'
          git pull --rebase origin feature/client-job-selector-modernization-20260904
          git push origin HEAD:feature/client-job-selector-modernization-20260904
