name: EverLeaf native frame limiter guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frame-timing-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify presentation-only FPS limiter invariants
        shell: pwsh
        run: |
          $frame = Get-Content "client/native/core/FrameLimiter.cpp" -Raw
          $bootstrap = Get-Content "client/native/core/dllmain.cpp" -Raw
          $config = Get-Content "client/native/core/config.ini" -Raw
          $project = Get-Content "client/native/core/EverLeafMS.vcxproj" -Raw
          $replacement = Get-Content "client/native/core/ReplacementFuncs.h" -Raw

          foreach ($required in @(
            'constexpr DWORD kRenderFrameAddress = 0x00777326',
            'RenderFrame_t gRenderFrameOriginal = reinterpret_cast<RenderFrame_t>(kRenderFrameAddress)',
            'RenderFrameHook',
            'QueryPerformanceCounter',
            'ForegroundFPSCap',
            'BackgroundFPSCap',
            'LimitBackgroundFPS',
            'GetForegroundWindow',
            'frame limiter installed'
          )) {
            if (-not $frame.Contains($required)) { throw "Missing frame limiter invariant: $required" }
          }

          if ($frame.Contains('#include "AutoTypes.h"')) {
            throw "Frame limiter must not include AutoTypes.h because it defines legacy globals in headers"
          }

          foreach ($required in @(
            'ForegroundFPSCap=60',
            'LimitBackgroundFPS=true',
            'BackgroundFPSCap=15'
          )) {
            if (-not $config.Contains($required)) { throw "Missing safe packaged frame setting: $required" }
          }

          if (-not $bootstrap.Contains('FrameLimiter::Install()')) {
            throw "EverLeaf bootstrap does not install the frame limiter"
          }
          if (-not $project.Contains('<ClCompile Include="FrameLimiter.cpp" />')) {
            throw "FrameLimiter.cpp is not compiled into EverLeafMS.dll"
          }

          if ($frame.Contains('m_tUpdateTime') -or $frame.Contains('+= 30')) {
            throw "Frame limiter must not modify the game logic update step"
          }
          if (-not $replacement.Contains('m_tUpdateTime += 30')) {
            throw "Expected 30 ms game logic step is missing from the inherited CallUpdate path"
          }
