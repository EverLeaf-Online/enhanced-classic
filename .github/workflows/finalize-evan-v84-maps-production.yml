name: Finalize Evan v84 Maps Production

on:
  push:
    branches: [release-dev]
    paths: ['.github/workflows/finalize-evan-v84-maps-production.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: everleaf-evan-v84-map-production
  cancel-in-progress: false

env:
  HOST: 132.145.141.79
  USER: ubuntu
  PUBLIC_HOST: everleafms.online
  MAP_SHA: 79a2908e9a09288ac79091f145fc33be07b619215ed9d1aab9181240ad909cdc

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: release-dev, fetch-depth: 1 }
      - name: Resolve deploy SHA
        shell: bash
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Configure production SSH
        shell: bash
        env:
          KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_everleaf; chmod 600 ~/.ssh/id_everleaf
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_everleaf "$USER@$HOST" 'systemctl is-active --quiet everleaf.service'
      - name: Verify published client map before server deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$USER@$HOST" "EXPECTED='$MAP_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          actual=$(sha256sum /opt/everleaf/patches/files/Map.wz | cut -d' ' -f1)
          test "$actual" = "$EXPECTED"
          test -s /opt/everleaf/patches/manifest.json
          echo "CLIENT_MAP_LIVE $actual"
          REMOTE
          curl -fsS --max-time 30 "https://$PUBLIC_HOST/v1/launcher/manifest" >/dev/null
          curl -fsSI --max-time 30 "https://$PUBLIC_HOST/patches/Map.wz" >/dev/null
          echo "PUBLIC_CLIENT_DELIVERY_OK $MAP_SHA"
      - name: Confirm all eight map XML files are committed
        shell: bash
        run: |
          set -euo pipefail
          D=wz/Map.wz/Map/Map1
          for id in 100030100 100030101 100030102 100030103 100030200 100030300 100030310 100030400; do test -s "$D/$id.img.xml"; done
      - name: Dispatch full production game deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-game-production.yml --repo "$GITHUB_REPOSITORY" --ref release-dev
          for i in $(seq 1 30); do
            sleep 5
            rid=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-game-production.yml --branch release-dev --event workflow_dispatch --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha==env.DEPLOY_SHA) | .databaseId' | head -1)
            if [ -n "$rid" ]; then
              echo "run_id=$rid" >> "$GITHUB_OUTPUT"
              echo "PRODUCTION_DEPLOY_RUN=$rid"
              exit 0
            fi
          done
          echo 'Could not locate dispatched production deploy run' >&2
          exit 1
      - name: Wait for full production deployment
        shell: bash
        run: gh run watch "${{ steps.deploy.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status
      - name: Final production verification
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$USER@$HOST" "EXPECTED='$MAP_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet everleaf.service
          D=/opt/everleaf/current/wz/Map.wz/Map/Map1
          for id in 100030100 100030101 100030102 100030103 100030200 100030300 100030310 100030400; do
            test -s "$D/$id.img.xml"
            echo "LIVE_MAP_XML $id"
          done
          actual=$(sha256sum /opt/everleaf/patches/files/Map.wz | cut -d' ' -f1)
          test "$actual" = "$EXPECTED"
          ss -lnt | grep -q ':8484 '
          ss -lnt | grep -q ':7575 '
          curl -fsS --max-time 20 http://127.0.0.1:3000/v1/launcher/manifest >/dev/null
          echo "EVAN_V84_MAPS_PRODUCTION_OK $actual"
          REMOTE
          curl -fsS --max-time 30 "https://$PUBLIC_HOST/v1/launcher/manifest" >/dev/null
          curl -fsSI --max-time 30 "https://$PUBLIC_HOST/patches/Map.wz" >/dev/null
