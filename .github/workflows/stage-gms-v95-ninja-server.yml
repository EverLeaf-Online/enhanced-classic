name: Stage GMS v95 Ninja Castle server XML

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/stage-gms-v95-ninja-server.yml'
      - 'tools/wz-donor/stage_region_batch.py'
      - 'tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Fetch pinned private donor archives
        run: |
          set -euo pipefail
          remote=/opt/everleaf/private/wz-donors
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/gms-v95-core7.zip" "$RUNNER_TEMP/core7.zip"
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/gms-v95-string.zip" "$RUNNER_TEMP/string.zip"
          test "$(sha256sum "$RUNNER_TEMP/core7.zip"|awk '{print $1}')" = '62e106f8437ce04443c797c0514e14d430fcc0a10ae4131f16567f540a8d5d3c'
          test "$(sha256sum "$RUNNER_TEMP/string.zip"|awk '{print $1}')" = 'f00b94fcfad3f95d438b4474b74d550ea68d8aee0a8c3e4c2d9fae548a6fe7ed'
          mkdir "$RUNNER_TEMP/core7" "$RUNNER_TEMP/string"
          unzip -q "$RUNNER_TEMP/core7.zip" -d "$RUNNER_TEMP/core7"
          unzip -q "$RUNNER_TEMP/string.zip" -d "$RUNNER_TEMP/string"
      - name: Build disposable regional server WZ staging copy
        run: |
          set -euo pipefail
          python tools/wz-donor/stage_region_batch.py \
            --contract tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json \
            --donor "$RUNNER_TEMP/core7" \
            --string-donor "$RUNNER_TEMP/string" \
            --canonical wz \
            --staging "$RUNNER_TEMP/ninja-staged-wz"
          python - "$RUNNER_TEMP/ninja-staged-wz/REGIONAL_STAGING_REPORT.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          r=json.load(open(sys.argv[1]))
          print('## Ninja Castle disposable server XML staging')
          print(f"- full map/mob/NPC files: {len(r['fullFileChanges'])}")
          print(f"- Item nodes: {len(r['itemNodes'])}")
          print(f"- Quest nodes: {len(r['questNodes'])}")
          print(f"- String nodes: {len(r['stringNodes'])}")
          print(f"- canonical tree unchanged: {r['canonicalTreeSha256Before']==r['canonicalTreeSha256After']}")
          print('- approved=false / productionApplyAllowed=false')
          PY
      - name: Upload staging evidence only
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-ninja-server-staging-${{ github.sha }}
          path: ${{ runner.temp }}/ninja-staged-wz/REGIONAL_STAGING_REPORT.json
          retention-days: 14
          if-no-files-found: error
