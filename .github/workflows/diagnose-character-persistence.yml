name: Diagnose EverLeaf character persistence

on:
  workflow_dispatch:

concurrency:
  group: everleaf-character-persistence-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect live save errors and schema
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            echo '### Game process'
            pgrep -af 'everleaf-server.*\.jar' | sed -E 's/(password|passwd|secret|token)=[^ ]+/\1=[redacted]/Ig' || true
            game_pid="$(pgrep -o -f 'everleaf-server.*\.jar' || true)"
            if [ -n "$game_pid" ]; then
              printf 'game_working_directory='
              sudo readlink -f "/proc/$game_pid/cwd"
              ps -o pid=,ppid=,lstart=,cmd= -p "$game_pid"
              parent_pid="$(ps -o ppid= -p "$game_pid" | tr -d ' ')"
              if [ -n "$parent_pid" ]; then
                ps -o pid=,ppid=,lstart=,cmd= -p "$parent_pid" || true
              fi
              echo 'game_environment_keys:'
              sudo tr '\0' '\n' < "/proc/$game_pid/environ" \
                | cut -d= -f1 \
                | grep -E '^(EVERLEAF_|DB_|JAVA_|PATH$)' \
                | sort || true
            fi
            echo '### Deployment files'
            find /opt/everleaf/current -maxdepth 1 -mindepth 1 -printf '%f:%y\n' | sort
            if [ -d /opt/everleaf/current/.git ]; then
              printf 'deployed_revision='
              git -C /opt/everleaf/current rev-parse HEAD
            fi
            if [ -f /opt/everleaf/current/src/main/java/client/Character.java ]; then
              echo '### Deployed save source around failing line'
              sed -n '8470,8490p' /opt/everleaf/current/src/main/java/client/Character.java
            fi
            echo '### Server JAR manifest'
            unzip -p /opt/everleaf/current/target/everleaf-server-1.0-SNAPSHOT.jar META-INF/MANIFEST.MF 2>/dev/null \
              | grep -Ei 'Implementation|Build|Revision|Commit|Version' || true

            echo '### Recent character-save errors'
            log_file='/opt/everleaf/current/logs/cosmic-log.log'
            if [ -f "$log_file" ]; then
              last_save_line="$(sudo grep -n 'Error saving chr' "$log_file" | tail -n 1 | cut -d: -f1 || true)"
              if [ -n "$last_save_line" ]; then
                end_line=$((last_save_line + 70))
                sudo sed -n "${last_save_line},${end_line}p" "$log_file" \
                  | sed -E 's/(Error saving chr) [^,]+/\1 [redacted]/'
              else
                echo 'character_save_errors=none'
              fi
            else
              echo 'game_log_present=false'
            fi

            echo '### Required characters columns'
            sudo mysql --batch --skip-column-names cosmic <<'SQL'
          SELECT CONCAT(COLUMN_NAME, ':', COLUMN_TYPE, ':', IS_NULLABLE)
          FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA='cosmic'
            AND TABLE_NAME='characters'
            AND COLUMN_NAME IN (
              'id','level','fame','str','dex','luk','int','exp','gachaexp','hp','mp','maxhp','maxmp',
              'sp','ap','gm','skincolor','gender','job','hair','face','map','meso','hpMpUsed','spawnpoint',
              'party','buddyCapacity','messengerid','messengerposition','mountlevel','mountexp','mounttiredness',
              'equipslots','useslots','setupslots','etcslots','monsterbookcover','vanquisherStage','dojoPoints',
              'lastDojoStage','finishedDojoTutorial','vanquisherKills','matchcardwins','matchcardlosses',
              'matchcardties','omokwins','omoklosses','omokties','dataString','fquest','jailexpire','partnerId',
              'marriageItemId','lastExpGainTime','ariantPoints','partySearch'
            )
          ORDER BY ORDINAL_POSITION;

          SELECT CONCAT('required_character_columns_present=', COUNT(*))
          FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA='cosmic'
            AND TABLE_NAME='characters'
            AND COLUMN_NAME IN (
              'id','level','fame','str','dex','luk','int','exp','gachaexp','hp','mp','maxhp','maxmp',
              'sp','ap','gm','skincolor','gender','job','hair','face','map','meso','hpMpUsed','spawnpoint',
              'party','buddyCapacity','messengerid','messengerposition','mountlevel','mountexp','mounttiredness',
              'equipslots','useslots','setupslots','etcslots','monsterbookcover','vanquisherStage','dojoPoints',
              'lastDojoStage','finishedDojoTutorial','vanquisherKills','matchcardwins','matchcardlosses',
              'matchcardties','omokwins','omoklosses','omokties','dataString','fquest','jailexpire','partnerId',
              'marriageItemId','lastExpGainTime','ariantPoints','partySearch'
            );

          SELECT CONCAT(TABLE_NAME, ':', ENGINE)
          FROM information_schema.TABLES
          WHERE TABLE_SCHEMA='cosmic'
            AND TABLE_NAME IN (
              'characters','monsterbook','petignores','keymap','quickslotkeymapped','skillmacros','inventoryitems',
              'inventoryequipment','skills','savedlocations','trocklocations','buddies','area_info','eventstats',
              'queststatus','questprogress','medalmaps','family_character','storages'
            )
          ORDER BY TABLE_NAME;

          SELECT CONCAT('skills_column=', COLUMN_NAME, ':', COLUMN_TYPE, ':', IS_NULLABLE, ':default=', COALESCE(COLUMN_DEFAULT, 'NULL'), ':extra=', EXTRA)
          FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA='cosmic' AND TABLE_NAME='skills'
          ORDER BY ORDINAL_POSITION;

          SELECT CONCAT('skills_trigger=', TRIGGER_NAME, ':', ACTION_TIMING, ':', EVENT_MANIPULATION, ':', ACTION_STATEMENT)
          FROM information_schema.TRIGGERS
          WHERE TRIGGER_SCHEMA='cosmic' AND EVENT_OBJECT_TABLE='skills'
          ORDER BY TRIGGER_NAME;

          SELECT CONCAT(TABLE_NAME, '_column=', COLUMN_NAME, ':', COLUMN_TYPE, ':', IS_NULLABLE, ':default=', COALESCE(COLUMN_DEFAULT, 'NULL'), ':extra=', EXTRA)
          FROM information_schema.COLUMNS
          WHERE TABLE_SCHEMA='cosmic' AND TABLE_NAME IN ('inventoryitems', 'inventoryequipment')
          ORDER BY TABLE_NAME, ORDINAL_POSITION;

          SELECT CONCAT(TABLE_NAME, '_trigger=', TRIGGER_NAME, ':', ACTION_TIMING, ':', EVENT_MANIPULATION, ':', ACTION_STATEMENT)
          FROM information_schema.TRIGGERS
          WHERE TRIGGER_SCHEMA='cosmic' AND EVENT_OBJECT_TABLE IN ('inventoryitems', 'inventoryequipment')
          ORDER BY EVENT_OBJECT_TABLE, TRIGGER_NAME;
          SQL
          REMOTE
