name: Prune superseded Empress and Ninja region branches once

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/cleanup-superseded-v95-region-branches-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Delete only pre-collapsed superseded region refs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 5558afc9a5b78610d95c41bda19c0f93ac4792b3
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            empress-dev
            content/empress-2026
            integrate/empress-runtime-20260904
            wz/v95-ninja-boss-portal
            wz/v95-ninja-client-boot-smoke
            wz/v95-ninja-client-candidate
            wz/v95-ninja-collision-revive-review
            wz/v95-ninja-drop-contract
            wz/v95-ninja-drop-contract-v2
            wz/v95-ninja-drop-preview
            wz/v95-ninja-npc-script-review
            wz/v95-ninja-npc-script-severity
            wz/v95-ninja-quest-evidence
            wz/v95-ninja-quest-id-fix
            wz/v95-ninja-quest-prereq-closure
            wz/v95-ninja-quest-profile
            wz/v95-ninja-quest-runtime-smoke
            wz/v95-ninja-regional-staging-contract
            wz/v95-ninja-review-contract
            wz/v95-ninja-server-runtime-smoke
            wz/v95-ninja-server-staging
            wz/v95-ninja-stage-leading-zero-fix
            wz/v95-ninja-stage-optional-string-fix
            wz/v95-ninja-staging-contract
            wz/v95-ninja-staging-contract-temp
            wz/v95-ninja-staging-policy
            wz/v95-ninja-staging-policy-active
            wz/v95-ninja-staging-policy-active2
            wz/v95-ninja-staging-policy-current
            wz/v95-ninja-staging-policy-final
            wz/v95-ninja-staging-policy-final2
            wz/v95-ninja-staging-policy-v2
            wz/v95-ninja-staging-policy-v3
            wz/v95-ninja-staging-policy-v4
            wz/v95-ninja-staging-policy-v5
            wz/v95-ninja-staging-policy-work
            wz/v95-ninja-staging-policy-working
          )
          deleted=0
          for branch in "${branches[@]}"; do
            remote_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$remote_sha" ]; then
              echo "already absent: $branch"
              continue
            fi
            if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
              echo "ref moved after canonical collapse: $branch $remote_sha" >&2
              exit 1
            fi
            open_prs="$(gh pr list -R "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
            if [ "$open_prs" != 0 ]; then
              echo "open PR still uses $branch" >&2
              exit 1
            fi
            git push origin --delete "$branch"
            deleted=$((deleted+1))
          done
          test "$deleted" -eq 37
          echo "SUPERSEDED_REGION_BRANCHES_PRUNED=$deleted"
