name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to deploy (defaults to content-dev HEAD)
        required: false
        type: string
  workflow_run:
    workflows:
      - Run build
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: everleaf-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'content-dev')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployment commit
        id: target
        env:
          MANUAL_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "${MANUAL_SHA}" ]]; then
            echo "sha=${MANUAL_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${WORKFLOW_SHA}" ]]; then
            echo "sha=${WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"
          else
            git ls-remote https://github.com/iampolicy/enhanced-classic.git refs/heads/content-dev \
              | awk '{print "sha=" $1}' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure pinned SSH host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
        run: |
          test -n "${SSH_PRIVATE_KEY}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/everleaf_staging
          chmod 600 ~/.ssh/everleaf_staging
          ssh-keyscan -T 10 -t ed25519 132.145.141.79 > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')" = \
            "SHA256:0bqGKikVD6I01xdtL/06xK1XL/NBs1B0se72Siwt9AE"

      - name: Deploy immutable release
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -i ~/.ssh/everleaf_staging ubuntu@132.145.141.79 \
            "set -euo pipefail; tmp_script=\$(mktemp); curl -fsSL https://raw.githubusercontent.com/iampolicy/enhanced-classic/${DEPLOY_SHA}/tools/deploy_staging.sh -o \"\${tmp_script}\"; chmod +x \"\${tmp_script}\"; \"\${tmp_script}\" '${DEPLOY_SHA}'; rm -f \"\${tmp_script}\""
