name: Inspect quest blockers
on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths: ['.github/workflows/inspect-quest-blockers.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inspect quest nodes
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          qs = {'1028','20015','2233','2234'}
          base = Path('wz/Quest.wz')
          for fn in ['Check.img.xml','Act.img.xml','Say.img.xml']:
              root = ET.parse(base/fn).getroot()
              print('\n###', fn)
              for q in qs:
                  node = next((x for x in root if x.attrib.get('name') == q), None)
                  print('\n--- QUEST', q, '---')
                  if node is None:
                      print('MISSING')
                  else:
                      print(ET.tostring(node, encoding='unicode'))
          print('\n### QuestInfo matches')
          for p in base.glob('QuestInfo*.xml'):
              try:
                  root=ET.parse(p).getroot()
              except Exception:
                  continue
              for q in qs:
                  node=next((x for x in root if x.attrib.get('name')==q),None)
                  if node is not None:
                      print(p, q, ET.tostring(node, encoding='unicode'))
          PY
