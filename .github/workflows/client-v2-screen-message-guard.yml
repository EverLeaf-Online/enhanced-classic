name: Client v2 screen-message guard

on:
  pull_request:
    branches: [release-dev, master]
    paths:
      - "client/ezorsia/ezorsia/Memory.cpp"
      - "client/ezorsia/ezorsia/Client.cpp"
      - ".github/workflows/client-v2-screen-message-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-message-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify CUIScreenMsg repair invariants
        shell: pwsh
        run: |
          $memory = Get-Content "client/ezorsia/ezorsia/Memory.cpp" -Raw
          $client = Get-Content "client/ezorsia/ezorsia/Client.cpp" -Raw

          foreach ($required in @(
            'kScreenMsgLayoutXOperand = 0x0089B6F8',
            'kMalformedScreenMsgResetYWrite = 0x0089B797',
            'kScreenMsgResetYOperand = 0x0089B798',
            'kScreenMsgResetXOperand = 0x0089BA04',
            'kStockScreenMsgResetY = 600 - 166',
            'kStockScreenMsgResetX = 800 - 300',
            'const int inferredScreenHeight = inheritedValue + 18',
            'const int correctedValue = inferredScreenHeight - 166',
            'WritePatchedValue(kScreenMsgResetXOperand, value)',
            'HandleScreenMessageWrite(dwOriginAddress, dwValue)'
          )) {
            if (-not $memory.Contains($required)) { throw "Missing screen-message repair invariant: $required" }
          }

          # The source still contains the inherited malformed call; Memory::WriteInt
          # must intercept it before any write lands at 0x89B797.
          if (-not $client.Contains('Memory::WriteInt(0x0089B796 + 1, m_nGameHeight - 18)')) {
            throw "Inherited reset-Y call changed; re-audit the redirect"
          }
          if (-not $client.Contains('Memory::WriteInt(0x0089B6F7 + 1, m_nGameWidth - 405)')) {
            throw "Active layout-X formula changed; re-audit reset-X synchronization"
          }
          if (-not $client.Contains('//Memory::WriteInt(0x0089BA03 + 1, m_nGameHeight - 96)')) {
            throw "Legacy reset-X source state changed; re-audit before continuing"
          }

          # Never allow the known malformed destination to fall through to the
          # generic WritePatchedValue path.
          $writeInt = [regex]::Match($memory, 'void Memory::WriteInt[\s\S]*?^\}', 'Multiline').Value
          if (-not $writeInt.Contains('if (HandleScreenMessageWrite(dwOriginAddress, dwValue))')) {
            throw "WriteInt no longer intercepts malformed CUIScreenMsg writes"
          }

          # The repair must be preflighted against untouched stock operands; do
          # not turn it into an unconditional write to a guessed client layout.
          foreach ($required in @(
            'currentResetY != kStockScreenMsgResetY',
            'currentResetX != kStockScreenMsgResetX',
            'skipped CUIScreenMsg reset-Y redirect; stock operand mismatch',
            'skipped reset-X; stock operand mismatch'
          )) {
            if (-not $memory.Contains($required)) { throw "Missing screen-message safety preflight: $required" }
          }
