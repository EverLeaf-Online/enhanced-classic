name: Build Everleaf v83 client

on:
  push:
    branches: [client-dev]
    paths:
      - "client/**"
      - "web/scripts/build-patch-manifest.js"
      - ".github/workflows/build-everleaf-client.yml"
  pull_request:
    paths:
      - "client/**"
      - "web/scripts/build-patch-manifest.js"
      - ".github/workflows/build-everleaf-client.yml"
  workflow_dispatch:
    inputs:
      publish_full_baseline:
        description: Rebuild production from the authorized complete client archive
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  EVERLEAF_BOOTSTRAP_FILE_ID: 1TW-COG0-lfu998QjYvqvh6OemzZeSWXa

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build source-pinned Win32 release
        shell: pwsh
        run: |
          msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify EverLeaf client hardening
        shell: pwsh
        run: |
          $sourcePath = "client/ezorsia/ezorsia/ReplacementFuncs.h"
          $source = Get-Content $sourcePath -Raw
          $required = @(
            "EverLeafPinStringPoolEntry(pThis, nIdx)",
            "EVERLEAF_STRING_POOL_PIN",
            'lpClassName, "EverLeaf", dwStyle',
            'case 888:',
            'Welcome to EverLeaf!'
          )
          foreach ($pattern in $required) {
            if (-not $source.Contains($pattern)) {
              throw "Missing required client hardening marker: $pattern"
            }
          }
          if ($source -match 'if\s*\(\(HRESULT\)v\d+\s*<\s*0\)') {
            throw "Function-pointer address is still being tested as an HRESULT"
          }

      - name: Verify and package
        shell: pwsh
        run: |
          $dll = "client/ezorsia/out/Release/dinput8.dll"
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }

          $package = "EverleafClient"
          & "client/scripts/build-managed-package.ps1" -RepositoryRoot $PWD -OutputDirectory $package

          $config = Get-Content "$package/config.ini" -Raw
          $forbidden = @(
            "ServerIP_Address", "MsgAmount", "setDamageCap", "useTubi",
            "speedMovementCap", "CustomLoginFrame", "ownCashShopFrame",
            "useV62_ExpTable", "sleepTime", "use_custom_dll"
          )
          foreach ($name in $forbidden) {
            if ($config -match [regex]::Escape($name)) {
              throw "Player config exposes forbidden setting: $name"
            }
          }
          if (-not (Test-Path "$package/EverLeaf_UI.wz")) {
            throw "Missing branded EverLeaf UI file"
          }
          if (Test-Path "$package/EzorsiaV2_UI.wz") {
            throw "Legacy UI filename leaked into package"
          }

          Compress-Archive -Path "$package/*" -DestinationPath "EverleafClient-source-built.zip"
          Get-FileHash "EverleafClient-source-built.zip" -Algorithm SHA256
          Get-ChildItem $package | Select-Object Name,Length

      - name: Configure SSH for production staging
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          ssh_dir="$(cygpath -u "$RUNNER_TEMP")/everleaf-ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_everleaf"
          chmod 600 "$ssh_dir/id_everleaf"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$ssh_dir/known_hosts"
          fi
          chmod 600 "$ssh_dir/known_hosts"

      - name: Stage repository overlays on Oracle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$(cygpath -u "$RUNNER_TEMP")/everleaf-ssh"
          scp -i "$ssh_dir/id_everleaf" -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes EverleafClient-source-built.zip \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/tmp/everleaf-client-overlays-$GITHUB_RUN_ID.zip"

  publish-patch:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Retrieve staged repository overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          scp -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/tmp/everleaf-client-overlays-$GITHUB_RUN_ID.zip" \
            release/EverleafClient-source-built.zip

      - name: Extract and validate patch payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package runtime-payload
          unzip -q release/EverleafClient-source-built.zip -d package
          cp package/managed-client-baseline.json managed-client-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('managed-client-baseline.json').read_text())
          managed=baseline.get('managedFiles')
          assert isinstance(managed,list) and managed, 'Managed baseline is empty'
          seen=set()
          for entry in managed:
              path=entry['path']
              assert entry.get('redistributable') is True, f'Not approved for distribution: {path}'
              assert path.lower() not in seen, f'Duplicate managed path: {path}'
              seen.add(path.lower())
              if entry.get('source'):
                  assert (Path('package') / path).is_file(), f'Missing repository overlay: {path}'
          packaged={str(p.relative_to('package')).replace('\\','/') for p in Path('package').rglob('*') if p.is_file()}
          overlays={e['path'] for e in managed if e.get('source')}
          assert packaged == overlays | {'managed-client-baseline.json'}, f'Unexpected repository overlay contents: {packaged}'
          assert len(managed) == 36, f'Expected 36 managed game files, found {len(managed)}'
          PY
          test ! -f package/EzorsiaV2_UI.wz
          cp -a package/. runtime-payload/
          rm runtime-payload/managed-client-baseline.json
          echo "EverLeaf managed patch payload:"
          find runtime-payload -type f -printf '%P %s bytes\n' | sort

      - name: Test managed manifest invariants and streaming repair fixture
        shell: bash
        run: |
          set -euo pipefail
          export LAUNCHER_PATCH_ROOT="$PWD/manifest-fixture"
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('managed-client-baseline.json').read_text())
          baseline['managedFiles']=[entry for entry in baseline['managedFiles'] if entry.get('source')]
          Path('overlay-baseline.json').write_text(json.dumps(baseline, indent=2)+'\n')
          PY
          export LAUNCHER_BASELINE_PATH="$PWD/overlay-baseline.json"
          export LAUNCHER_MANIFEST_PATH="$PWD/manifest-fixture/manifest.json"
          mkdir -p "$LAUNCHER_PATCH_ROOT/files"
          cp -a runtime-payload/. "$LAUNCHER_PATCH_ROOT/files/"
          node web/scripts/test-patch-manifest.js
          node web/scripts/build-patch-manifest.js ci-test
          python3 client/scripts/test-managed-repair.py "$LAUNCHER_PATCH_ROOT" overlay-baseline.json

      - name: Assemble authorized complete baseline
        if: github.event_name == 'workflow_dispatch' && inputs.publish_full_baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://drive.usercontent.google.com/download?id=$EVERLEAF_BOOTSTRAP_FILE_ID&export=download&confirm=t" \
            --output everleaf-bootstrap.rar
          7z x -y everleaf-bootstrap.rar -obootstrap-extract >/dev/null
          game_executable="$(find bootstrap-extract -type f -iname MapleStory.exe -print -quit)"
          test -n "$game_executable"
          game_root="$(dirname "$game_executable")"
          mkdir full-client
          cp -a "$game_root"/. full-client/
          cp -a runtime-payload/. full-client/
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('managed-client-baseline.json').read_text())
          expected={entry['path'].lower() for entry in baseline['managedFiles']}
          actual={str(path.relative_to('full-client')).replace('\\','/').lower()
                  for path in Path('full-client').rglob('*') if path.is_file()}
          assert len(expected)==36, f'Expected 36 managed files, got {len(expected)}'
          assert actual==expected, f'Authorized bootstrap/baseline mismatch: missing={expected-actual}, extra={actual-expected}'
          PY
          tar -czf full-client-payload.tar.gz -C full-client .

      - name: Publish patch files and rebuild signed manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.publish_full_baseline }}" = "true" ]; then
            cp full-client-payload.tar.gz managed-payload.tar.gz
            publish_mode=full
          else
            tar -czf managed-payload.tar.gz -C runtime-payload .
            publish_mode=overlay
          fi
          scp -i ~/.ssh/id_everleaf managed-payload.tar.gz managed-client-baseline.json web/scripts/build-patch-manifest.js \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/tmp/"
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" bash -s -- "$publish_mode" "$GITHUB_RUN_ID" <<'REMOTE'
            set -euo pipefail
            mode="$1"
            run_id="$2"
            sudo install -d -o ubuntu -g ubuntu -m 755 /opt/everleaf/patches
            stage=/opt/everleaf/patches-staging
            sudo rm -rf "$stage"
            sudo install -d -o ubuntu -g ubuntu -m 755 "$stage" "$stage/files"
            if [ "$mode" = overlay ]; then
              test -d /opt/everleaf/patches/files
              cp -a /opt/everleaf/patches/files/. "$stage/files/"
            fi
            tar -xzf /tmp/managed-payload.tar.gz -C "$stage/files"
            LAUNCHER_PATCH_ROOT="$stage" \
              LAUNCHER_BASELINE_PATH=/tmp/managed-client-baseline.json \
              LAUNCHER_MANIFEST_PATH="$stage/manifest.json" \
              node /tmp/build-patch-manifest.js
            python3 - <<'PY'
          import json
          manifest=json.load(open('/opt/everleaf/patches-staging/manifest.json'))
          baseline=json.load(open('/tmp/managed-client-baseline.json'))
          assert len(manifest['files']) == len(baseline['managedFiles']) == 36
          print('Managed patch manifest files:', len(manifest['files']))
          PY
            rm -rf /opt/everleaf/patches/files.old
            if test -d /opt/everleaf/patches/files; then
              mv /opt/everleaf/patches/files /opt/everleaf/patches/files.old
            fi
            mv "$stage/files" /opt/everleaf/patches/files
            mv /tmp/managed-client-baseline.json /opt/everleaf/patches/managed-client-baseline.json
            mv "$stage/manifest.json" /opt/everleaf/patches/manifest.json
            rmdir "$stage"
            install -m 755 /tmp/build-patch-manifest.js /opt/everleaf/web/scripts/build-patch-manifest.js
            sudo systemctl restart everleaf-web
            sleep 2
            curl -fsS http://127.0.0.1:3000/v1/launcher/manifest >/dev/null
            rm -f "/tmp/everleaf-client-overlays-$run_id.zip"
            echo 'EverLeaf complete managed client patch payload published.'
          REMOTE
