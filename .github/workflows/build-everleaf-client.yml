name: Build EverLeaf v83 client

on:
  push:
    branches: [master]
    paths:
      - "client/native/**"
      - "client/scripts/**"
      - "client/managed-client-baseline.json"
      - ".github/workflows/build-everleaf-client.yml"
  pull_request:
    branches: [master]
    paths:
      - "client/native/**"
      - "client/scripts/**"
      - "client/managed-client-baseline.json"
      - ".github/workflows/build-everleaf-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Apply Community UI preference
        shell: pwsh
        run: python client/scripts/apply-community-ui-preference.py

      - name: Apply EverLeaf native rebrand
        shell: pwsh
        run: python client/scripts/apply-client-v2-rebrand.py

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify modular client source wiring
        shell: pwsh
        run: |
          $bootstrap = Get-Content 'client/native/core/dllmain.cpp' -Raw
          foreach ($needle in @('WaitForClientImage()','BootstrapWatchdog','InstallEarlyHooks()','DisplayMode::StartWorker()','DiscordPresence::Start();','DiscordPresence::Stop();')) {
            if (-not $bootstrap.Contains($needle)) { throw "Missing core bootstrap marker: $needle" }
          }
          $bridge = Get-Content 'client/native/core/DiscordPresence.cpp' -Raw
          if (-not $bridge.Contains('LoadLibraryW(L"Discord.dll")')) { throw 'Core does not load Discord.dll independently' }
          $proxy = Get-Content 'client/native/proxy/Proxy.cpp' -Raw
          foreach ($needle in @('EverLeafMS.dll','DirectInput8Create','GetdfDIJoystick')) {
            if (-not $proxy.Contains($needle)) { throw "Missing dinput8 proxy marker: $needle" }
          }
          $discord = Get-Content 'client/native/discord/DiscordEntry.cpp' -Raw
          foreach ($needle in @('EverLeafDiscord_Start','EverLeafDiscord_Stop','EverLeafDiscord_SetActivity')) {
            if (-not $discord.Contains($needle)) { throw "Missing Discord export: $needle" }
          }
          $config = Get-Content 'client/native/core/config.ini' -Raw
          if (-not ($config -match '(?m)^DiscordRichPresence=true\r?$')) { throw 'DiscordRichPresence=true is missing from config.ini' }

      - name: Test Discord IPC frames and acknowledgements
        shell: pwsh
        run: |
          $source = Get-Content 'client/native/discord/DiscordPresence.cpp' -Raw
          $source.Replace('#include "stdafx.h"','#include <windows.h>') | Set-Content 'client/scripts/discord-presence-test-source.inc'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $batch = "@echo off`r`ncall `"$vcvars`" x86 >nul`r`ncl /nologo /EHsc /std:c++17 client\scripts\test-discord-presence.cpp /Fe:presence-test.exe`r`nif errorlevel 1 exit /b 1`r`npresence-test.exe > presence-payload.json`r`n"
          $batch | Set-Content "$env:RUNNER_TEMP\presence-test.cmd"
          & cmd /c "$env:RUNNER_TEMP\presence-test.cmd"
          if ($LASTEXITCODE -ne 0) { throw 'Discord IPC tests failed' }
          $payload = Get-Content presence-payload.json -Raw | ConvertFrom-Json
          if ($payload.cmd -ne 'SET_ACTIVITY' -or $payload.nonce -ne 'test-nonce') { throw 'Malformed Discord activity envelope' }
          if ($payload.args.activity.buttons.Count -ne 2) { throw 'Missing Discord presence buttons' }

      - name: Build source-pinned Win32 release
        shell: pwsh
        run: msbuild "client/native/EverLeaf Client.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify build outputs
        shell: pwsh
        run: |
          foreach ($dll in @('dinput8.dll','EverLeafMS.dll','Discord.dll')) {
            $path = "client/native/out/Release/$dll"
            if (-not (Test-Path $path)) { throw "Missing build output: $path" }
            Get-FileHash $path -Algorithm SHA256
          }
          python client/scripts/verify-client-v2-branding.py client/native/out/Release/EverLeafMS.dll

      - name: Build managed client package
        shell: pwsh
        run: |
          $package = 'EverleafClient'
          & 'client/scripts/build-managed-package.ps1' -RepositoryRoot $PWD -OutputDirectory $package
          foreach ($file in @('config.ini','managed-client-baseline.json')) {
            if (-not (Test-Path "$package/$file")) { throw "Missing managed overlay: $file" }
          }
          $config = Get-Content "$package/config.ini" -Raw
          if (-not ($config -match '(?m)^\[config\]\r?$')) { throw 'Kaentake config section is missing' }
          if (-not ($config -match '(?m)^host=132\.145\.141\.79\r?$')) { throw 'Production host is missing from config.ini' }
          if (-not ($config -match '(?m)^port=8484\r?$')) { throw 'Production login port is missing from config.ini' }
          Compress-Archive -Path "$package/*" -DestinationPath 'EverleafClient-source-built.zip'
          Get-FileHash 'EverleafClient-source-built.zip' -Algorithm SHA256

      - name: Test managed client and manifest invariants
        shell: pwsh
        run: |
          python client/scripts/test-cosmic-wz-baseline.py
          python -m py_compile client/scripts/test-managed-repair.py
          node web/scripts/test-patch-manifest.js

      - name: Upload client candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-client-${{ github.sha }}
          path: EverleafClient-source-built.zip
          if-no-files-found: error
          retention-days: 7
