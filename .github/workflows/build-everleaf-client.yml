name: Build Everleaf v83 client

on:
  push:
    branches: [client-dev]
    paths:
      - "client/**"
      - "web/scripts/build-patch-manifest.js"
      - ".github/workflows/build-everleaf-client.yml"
  pull_request:
    paths:
      - "client/**"
      - "web/scripts/build-patch-manifest.js"
      - ".github/workflows/build-everleaf-client.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build source-pinned Win32 release
        shell: pwsh
        run: |
          msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify EverLeaf client hardening
        shell: pwsh
        run: |
          $sourcePath = "client/ezorsia/ezorsia/ReplacementFuncs.h"
          $source = Get-Content $sourcePath -Raw
          $required = @(
            "EverLeafPinStringPoolEntry(pThis, nIdx)",
            "EVERLEAF_STRING_POOL_PIN",
            'lpClassName, "EverLeaf", dwStyle',
            'case 888:',
            'Welcome to EverLeaf!'
          )
          foreach ($pattern in $required) {
            if (-not $source.Contains($pattern)) {
              throw "Missing required client hardening marker: $pattern"
            }
          }
          if ($source -match 'if\s*\(\(HRESULT\)v\d+\s*<\s*0\)') {
            throw "Function-pointer address is still being tested as an HRESULT"
          }

      - name: Verify and package
        shell: pwsh
        run: |
          $dll = "client/ezorsia/out/Release/dinput8.dll"
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }

          $package = "EverleafClient"
          & "client/scripts/build-managed-package.ps1" -RepositoryRoot $PWD -OutputDirectory $package

          $config = Get-Content "$package/config.ini" -Raw
          $forbidden = @(
            "ServerIP_Address", "MsgAmount", "setDamageCap", "useTubi",
            "speedMovementCap", "CustomLoginFrame", "ownCashShopFrame",
            "useV62_ExpTable", "sleepTime", "use_custom_dll"
          )
          foreach ($name in $forbidden) {
            if ($config -match [regex]::Escape($name)) {
              throw "Player config exposes forbidden setting: $name"
            }
          }
          if (-not (Test-Path "$package/EverLeaf_UI.wz")) {
            throw "Missing branded EverLeaf UI file"
          }
          if (Test-Path "$package/EzorsiaV2_UI.wz") {
            throw "Legacy UI filename leaked into package"
          }

          Compress-Archive -Path "$package/*" -DestinationPath "EverleafClient-source-built.zip"
          Get-FileHash "EverleafClient-source-built.zip" -Algorithm SHA256
          Get-ChildItem $package | Select-Object Name,Length

      - name: Upload private client artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverleafClient-source-built
          path: EverleafClient-source-built.zip
          retention-days: 14
          if-no-files-found: error

  publish-patch:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: EverleafClient-source-built
          path: release

      - name: Extract and validate patch payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package runtime-payload
          unzip -q release/EverleafClient-source-built.zip -d package
          cp package/managed-client-baseline.json managed-client-baseline.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('managed-client-baseline.json').read_text())
          managed=baseline.get('managedFiles')
          assert isinstance(managed,list) and managed, 'Managed baseline is empty'
          seen=set()
          for entry in managed:
              path=entry['path']
              assert entry.get('redistributable') is True, f'Not approved for distribution: {path}'
              assert path.lower() not in seen, f'Duplicate managed path: {path}'
              seen.add(path.lower())
              assert (Path('package') / path).is_file(), f'Missing managed file: {path}'
          packaged={str(p.relative_to('package')).replace('\\','/') for p in Path('package').rglob('*') if p.is_file()}
          assert packaged == {e['path'] for e in managed} | {'managed-client-baseline.json'}, f'Unexpected canonical package contents: {packaged}'
          PY
          test ! -f package/EzorsiaV2_UI.wz
          cp -a package/. runtime-payload/
          rm runtime-payload/managed-client-baseline.json
          echo "EverLeaf managed patch payload:"
          find runtime-payload -type f -printf '%P %s bytes\n' | sort

      - name: Test managed manifest invariants and streaming repair fixture
        shell: bash
        run: |
          set -euo pipefail
          export LAUNCHER_PATCH_ROOT="$PWD/manifest-fixture"
          export LAUNCHER_BASELINE_PATH="$PWD/managed-client-baseline.json"
          export LAUNCHER_MANIFEST_PATH="$PWD/manifest-fixture/manifest.json"
          mkdir -p "$LAUNCHER_PATCH_ROOT/files"
          cp -a runtime-payload/. "$LAUNCHER_PATCH_ROOT/files/"
          node web/scripts/test-patch-manifest.js
          node web/scripts/build-patch-manifest.js ci-test
          python3 client/scripts/test-managed-repair.py "$LAUNCHER_PATCH_ROOT" managed-client-baseline.json

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Publish patch files and rebuild signed manifest
        shell: bash
        run: |
          set -euo pipefail
          tar -czf managed-payload.tar.gz -C runtime-payload .
          scp -i ~/.ssh/id_everleaf managed-payload.tar.gz managed-client-baseline.json web/scripts/build-patch-manifest.js \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:/tmp/"
          ssh -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'set -euo pipefail; rm -rf /tmp/everleaf-managed-files; mkdir /tmp/everleaf-managed-files; tar -xzf /tmp/managed-payload.tar.gz -C /tmp/everleaf-managed-files; sudo install -d -o ubuntu -g ubuntu -m 755 /opt/everleaf/patches; rm -rf /opt/everleaf/patches/files.new; mv /tmp/everleaf-managed-files /opt/everleaf/patches/files.new; mv /tmp/managed-client-baseline.json /opt/everleaf/patches/managed-client-baseline.json; install -m 755 /tmp/build-patch-manifest.js /opt/everleaf/web/scripts/build-patch-manifest.js; rm -rf /opt/everleaf/patches/files.old; if test -d /opt/everleaf/patches/files; then mv /opt/everleaf/patches/files /opt/everleaf/patches/files.old; fi; mv /opt/everleaf/patches/files.new /opt/everleaf/patches/files; cd /opt/everleaf/web; npm run build-patch-manifest; python3 -c '\''import json; m=json.load(open("/opt/everleaf/patches/manifest.json")); b=json.load(open("/opt/everleaf/patches/managed-client-baseline.json")); assert len(m["files"])==len(b["managedFiles"]); print("Managed patch manifest files:", len(m["files"]))'\''; sudo systemctl restart everleaf-web; sleep 2; curl -fsS http://127.0.0.1:3000/v1/launcher/manifest >/dev/null; echo EverLeaf managed client patch payload published.'
