name: Build EverLeaf v83 client

on:
  push:
    branches: [release-dev]
    paths:
      - "client/**"
      - "web/scripts/build-patch-manifest.js"
      - "web/scripts/test-patch-manifest.js"
      - ".github/workflows/build-everleaf-client.yml"
  pull_request:
    branches: [release-dev, master]
    paths:
      - "client/**"
      - "web/scripts/build-patch-manifest.js"
      - "web/scripts/test-patch-manifest.js"
      - ".github/workflows/build-everleaf-client.yml"
      - ".github/workflows/smoke-client-v2-boot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Apply Community UI preference
        shell: pwsh
        run: python client/scripts/apply-community-ui-preference.py

      - name: Apply EverLeaf Client v2 rebrand
        shell: pwsh
        run: python client/scripts/apply-client-v2-rebrand.py

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build source-pinned Win32 release
        shell: pwsh
        run: msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify compiled EverLeaf branding
        shell: pwsh
        run: python client/scripts/verify-client-v2-branding.py client/ezorsia/out/Release/dinput8.dll

      - name: Verify EverLeaf client hardening
        shell: pwsh
        run: |
          $sourcePath = "client/ezorsia/ezorsia/ReplacementFuncs.h"
          $source = Get-Content $sourcePath -Raw
          $required = @(
            "EverLeafPinStringPoolEntry(pThis, nIdx)",
            "EVERLEAF_STRING_POOL_PIN",
            'lpClassName, "EverLeaf", dwStyle',
            'case 888:',
            'Welcome to EverLeaf!'
          )
          foreach ($pattern in $required) {
            if (-not $source.Contains($pattern)) { throw "Missing required client hardening marker: $pattern" }
          }
          if ($source -match 'if\s*\(\(HRESULT\)v\d+\s*<\s*0\)') {
            throw "Function-pointer address is still being tested as an HRESULT"
          }

          $main = Get-Content "client/ezorsia/ezorsia/MainMain.cpp" -Raw
          foreach ($pattern in @('PreferCommunityUI', 'CustomLoginFrame = !preferCommunityUi', 'ownCashShopFrame = preferCommunityUi')) {
            if (-not $main.Contains($pattern)) { throw "Missing Community UI preference marker: $pattern" }
          }
          foreach ($forbidden in @('444Ro666', 'MapleEzorsiaV2wzfiles.img', 'Ezorsia v2 releases', 'Ezorsia V2 has detected')) {
            if ($main.Contains($forbidden)) { throw "Donor troubleshooting/runtime branding survived rebrand transform: $forbidden" }
          }
          if (-not $main.Contains('EverLeaf_UI.img')) { throw "EverLeaf IMG runtime fallback name missing after rebrand transform" }
          if ($source.Contains('MapleEzorsiaV2wzfiles.img/')) { throw "Donor IMG namespace survived rebrand transform" }
          if (-not $source.Contains('EverLeaf_UI.img/')) { throw "EverLeaf IMG namespace missing after rebrand transform" }

          $bootstrap = Get-Content "client/ezorsia/ezorsia/dllmain.cpp" -Raw
          foreach ($pattern in @(
            'WaitForClientImage()',
            'BootstrapWatchdog',
            'InstallEarlyHooks()',
            'EverLeaf Client v2 startup error',
            'kClientUnpackTimeoutMs',
            'kClientBootstrapTimeoutMs',
            'ExitProcess(ERROR_DLL_INIT_FAILED)',
            '#include "DisplayMode.h"',
            'DisplayMode::EnableSystemDpiAwareness()',
            'DisplayMode::StartWorker()',
            'Memory::WriteInt(dwToolTipLimitVPos + 1, Client::m_nGameHeight - 1)'
          )) {
            if (-not $bootstrap.Contains($pattern)) { throw "Missing Client v2 bootstrap/display wiring marker: $pattern" }
          }
          if ($bootstrap.Contains('MainMain::GetInstance()->~MainMain()')) {
            throw "Client v2 must not manually destroy MainMain under DllMain loader lock"
          }
          if ($bootstrap.Contains('Hook_sub_44E88E(true)')) {
            throw "Obsolete MyGetProcAddress pass-through hook was re-enabled"
          }
          if (-not $bootstrap.Contains('Hook_sub_9F5C50(true)')) {
            throw "Client v2 must keep the proven EverLeaf v83 Run compatibility loop"
          }
          $attachBlock = [regex]::Match($bootstrap, 'case DLL_PROCESS_ATTACH:[\s\S]*?break;').Value
          foreach ($pattern in @('Hook_CreateMutexA(', 'Hook_WSPStartup(', 'Hook_CreateWindowExA(', 'Hook_FindFirstFileA(', 'Hook_GetACP(', 'Hook_GetModuleFileNameW(')) {
            if ($attachBlock.Contains($pattern)) {
              throw "Detours hook installation leaked back into DllMain: $pattern"
            }
          }

          $display = Get-Content "client/ezorsia/ezorsia/DisplayMode.h" -Raw
          foreach ($pattern in @(
            'FindEverLeafGameWindow',
            'ApplyBorderlessWindow',
            'CenterWindowedClient',
            'CaptureWindowedState',
            'RestoreWindowedState',
            'ToggleBorderlessWindow',
            'EverLeafWindowProc',
            'EnableAltEnterToggle',
            'WM_SYSKEYDOWN',
            'WM_SYSCHAR',
            'CallWindowProcA',
            'GetWindowThreadProcessId'
          )) {
            if (-not $display.Contains($pattern)) { throw "Missing Client v2 display invariant: $pattern" }
          }

          $dinput = Get-Content "client/ezorsia/ezorsia/dinput8.cpp" -Raw
          foreach ($pattern in @(
            'INIT_ONCE g_dinputInitOnce',
            'ResolveSystemDinput8',
            'EnsureSystemDinput8',
            'InitOnceExecuteOnce',
            'DirectInput8Create_Proc = nullptr',
            'GetdfDIJoystick_Proc = nullptr',
            'EverLeaf Client v2 input error'
          )) {
            if (-not $dinput.Contains($pattern)) { throw "Missing race-safe dinput8 proxy marker: $pattern" }
          }
          $directInputExport = [regex]::Match($dinput, 'void DirectInput8Create\(\)[\s\S]*?^\}', 'Multiline').Value
          $joystickExport = [regex]::Match($dinput, 'void GetdfDIJoystick\(\)[\s\S]*?^\}', 'Multiline').Value
          if (-not $directInputExport.Contains('call EnsureSystemDinput8')) {
            throw "DirectInput8Create can still forward before the system export is resolved"
          }
          if (-not $joystickExport.Contains('call EnsureSystemDinput8')) {
            throw "GetdfDIJoystick can still forward before the system export is resolved"
          }

      - name: Build managed client package
        shell: pwsh
        run: |
          $dll = "client/ezorsia/out/Release/dinput8.dll"
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }
          $package = "EverleafClient"
          & "client/scripts/build-managed-package.ps1" -RepositoryRoot $PWD -OutputDirectory $package
          $config = Get-Content "$package/config.ini" -Raw
          $forbidden = @(
            "ServerIP_Address", "MsgAmount", "setDamageCap", "useTubi",
            "speedMovementCap", "CustomLoginFrame", "ownCashShopFrame",
            "useV62_ExpTable", "sleepTime", "use_custom_dll"
          )
          foreach ($name in $forbidden) {
            if ($config -match [regex]::Escape($name)) { throw "Player config exposes forbidden setting: $name" }
          }
          if (-not ($config -match 'PreferCommunityUI=true')) { throw "Managed client does not default to Community UI" }
          if (-not ($config -match '(?m)^width=800$') -or -not ($config -match '(?m)^height=600$')) { throw "Managed client must default to the native v83 login viewport until HD login assets pass visual QA" }
          if (-not ($config -match '(?m)^ModernLoginUI=false$')) { throw "Unverified login coordinate restyling must remain disabled" }
          if (-not ($config -match 'WindowedMode=true')) { throw "Managed client must keep the safe windowed renderer by default" }
          if (-not ($config -match 'BorderlessWindow=false')) { throw "Managed client must expose borderless mode as opt-in until runtime validation is green" }
          if (-not ($config -match 'EnableAltEnterToggle=true')) { throw "Managed client must expose the reversible Alt+Enter borderless toggle" }
          if (-not ($config -match 'CenterWindow=true')) { throw "Managed client must center framed windowed mode by default" }
          if (-not ($config -match 'ForegroundFPSCap=60')) { throw "Managed client must default foreground presentation to 60 FPS" }
          if (-not ($config -match 'LimitBackgroundFPS=true')) { throw "Managed client must enable background throttling by default" }
          if (-not ($config -match 'BackgroundFPSCap=15')) { throw "Managed client must default background presentation to 15 FPS" }
          if (-not (Test-Path "$package/EverLeaf_UI.wz")) { throw "Missing branded EverLeaf UI file" }
          if (Test-Path "$package/EzorsiaV2_UI.wz") { throw "Legacy UI filename leaked into package" }
          Compress-Archive -Path "$package/*" -DestinationPath "EverleafClient-source-built.zip"
          Get-FileHash "EverleafClient-source-built.zip" -Algorithm SHA256

      - name: Test managed client and manifest invariants
        shell: pwsh
        run: |
          python client/scripts/test-cosmic-wz-baseline.py
          python -m py_compile client/scripts/test-managed-repair.py
          node web/scripts/test-patch-manifest.js

      - name: Upload client candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-client-${{ github.sha }}
          path: EverleafClient-source-built.zip
          if-no-files-found: error
          retention-days: 7

  client-v2-isolated-boot:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/client-v2-candidate-')
    uses: ./.github/workflows/smoke-client-v2-boot.yml
    secrets: inherit
