name: Build EverLeaf v83 client

on:
  push:
    branches: [master]
    paths:
      - "client/ezorsia/**"
      - "client/scripts/**"
      - ".github/workflows/build-everleaf-client.yml"
  pull_request:
    branches: [master]
    paths:
      - "client/ezorsia/**"
      - "client/scripts/**"
      - ".github/workflows/build-everleaf-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Apply Community UI preference
        shell: pwsh
        run: python client/scripts/apply-community-ui-preference.py

      - name: Apply EverLeaf Client v2 rebrand
        shell: pwsh
        run: python client/scripts/apply-client-v2-rebrand.py

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify client source wiring
        shell: pwsh
        run: |
          $bootstrap = Get-Content 'client/ezorsia/ezorsia/dllmain.cpp' -Raw
          foreach ($needle in @(
            'WaitForClientImage()',
            'BootstrapWatchdog',
            'InstallEarlyHooks()',
            '#include "DisplayMode.h"',
            'DisplayMode::EnableSystemDpiAwareness()',
            'DisplayMode::StartWorker()',
            '#include "DiscordPresence.h"',
            'DiscordPresence::Start();',
            'DiscordPresence::Stop();'
          )) {
            if (-not $bootstrap.Contains($needle)) { throw "Missing client bootstrap marker: $needle" }
          }

          $project = Get-Content 'client/ezorsia/ezorsia/ezorsia.vcxproj' -Raw
          foreach ($needle in @('DiscordPresence.h','DiscordPresence.cpp')) {
            if (-not $project.Contains($needle)) { throw "Visual Studio project missing $needle" }
          }

          $config = Get-Content 'client/ezorsia/ezorsia/config.ini' -Raw
          if (-not ($config -match '(?m)^DiscordRichPresence=true\r?$')) {
            throw 'DiscordRichPresence=true is missing from config.ini'
          }

      - name: Test Discord IPC frames and acknowledgements
        shell: pwsh
        run: |
          $source = Get-Content 'client/ezorsia/ezorsia/DiscordPresence.cpp' -Raw
          $source.Replace('#include "stdafx.h"','#include <windows.h>') | Set-Content 'client/scripts/discord-presence-test-source.inc'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'Visual Studio installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $batch = "@echo off`r`ncall `"$vcvars`" x86 >nul`r`ncl /nologo /EHsc /std:c++17 client\scripts\test-discord-presence.cpp /Fe:presence-test.exe`r`nif errorlevel 1 exit /b 1`r`npresence-test.exe > presence-payload.json`r`n"
          $batch | Set-Content "$env:RUNNER_TEMP\presence-test.cmd"
          & cmd /c "$env:RUNNER_TEMP\presence-test.cmd"
          if ($LASTEXITCODE -ne 0) { throw 'Discord IPC tests failed' }
          $payload = Get-Content presence-payload.json -Raw | ConvertFrom-Json
          if ($payload.cmd -ne 'SET_ACTIVITY' -or $payload.nonce -ne 'test-nonce') { throw 'Malformed Discord activity envelope' }
          if ($payload.args.activity.buttons.Count -ne 2) { throw 'Missing Discord presence buttons' }

      - name: Build source-pinned Win32 release
        shell: pwsh
        run: msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify compiled EverLeaf branding
        shell: pwsh
        run: python client/scripts/verify-client-v2-branding.py client/ezorsia/out/Release/dinput8.dll

      - name: Build managed client package
        shell: pwsh
        run: |
          $dll = 'client/ezorsia/out/Release/dinput8.dll'
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }
          $package = 'EverleafClient'
          & 'client/scripts/build-managed-package.ps1' -RepositoryRoot $PWD -OutputDirectory $package
          $config = Get-Content "$package/config.ini" -Raw
          if (-not ($config -match 'PreferCommunityUI=true')) { throw 'Managed client does not default to Community UI' }
          if (-not ($config -match '(?m)^DiscordRichPresence=true\r?$')) { throw 'Managed client does not enable Discord Rich Presence' }
          if (-not (Test-Path "$package/EverLeaf_UI.wz")) { throw 'Missing branded EverLeaf UI file' }
          Compress-Archive -Path "$package/*" -DestinationPath 'EverleafClient-source-built.zip'
          Get-FileHash 'EverleafClient-source-built.zip' -Algorithm SHA256

      - name: Test managed client and manifest invariants
        shell: pwsh
        run: |
          python client/scripts/test-cosmic-wz-baseline.py
          python -m py_compile client/scripts/test-managed-repair.py
          node web/scripts/test-patch-manifest.js

      - name: Upload client candidate
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-client-${{ github.sha }}
          path: EverleafClient-source-built.zip
          if-no-files-found: error
          retention-days: 7
