name: Build Everleaf v83 client

on:
  push:
    branches: [client-dev]
    paths:
      - "client/**"
      - ".github/workflows/build-everleaf-client.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/build-everleaf-client.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build source-pinned Win32 release
        shell: pwsh
        run: |
          msbuild "client/ezorsia/Ezorsia V2.sln" /m /t:Build /p:Configuration=Release /p:Platform=x86

      - name: Verify EverLeaf client hardening
        shell: pwsh
        run: |
          $sourcePath = "client/ezorsia/ezorsia/ReplacementFuncs.h"
          $source = Get-Content $sourcePath -Raw
          $required = @(
            "EverLeafPinStringPoolEntry(pThis, nIdx)",
            "EVERLEAF_STRING_POOL_PIN",
            'lpClassName, "EverLeaf", dwStyle',
            'case 888:',
            'Welcome to EverLeaf!'
          )
          foreach ($pattern in $required) {
            if (-not $source.Contains($pattern)) {
              throw "Missing required client hardening marker: $pattern"
            }
          }
          if ($source -match 'if\s*\(\(HRESULT\)v\d+\s*<\s*0\)') {
            throw "Function-pointer address is still being tested as an HRESULT"
          }

      - name: Verify and package
        shell: pwsh
        run: |
          $dll = "client/ezorsia/out/Release/dinput8.dll"
          if (-not (Test-Path $dll)) { throw "Missing build output: $dll" }

          $package = "EverleafClient"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item $dll "$package/dinput8.dll"
          Copy-Item "client/ezorsia/ezorsia/config.ini" "$package/config.ini"
          Copy-Item "client/ezorsia/ezorsia/EzorsiaV2_UI.wz" "$package/EverLeaf_UI.wz"
          Copy-Item "client/ezorsia/LICENSE" "$package/LICENSE-AGPL-3.0.txt"
          Copy-Item "client/UPSTREAM.md" "$package/UPSTREAM.md"
          Copy-Item "client/README-EVERLEAF.md" "$package/README.md"

          $config = Get-Content "$package/config.ini" -Raw
          $forbidden = @(
            "ServerIP_Address", "MsgAmount", "setDamageCap", "useTubi",
            "speedMovementCap", "CustomLoginFrame", "ownCashShopFrame",
            "useV62_ExpTable", "sleepTime", "use_custom_dll"
          )
          foreach ($name in $forbidden) {
            if ($config -match [regex]::Escape($name)) {
              throw "Player config exposes forbidden setting: $name"
            }
          }
          if (-not (Test-Path "$package/EverLeaf_UI.wz")) {
            throw "Missing branded EverLeaf UI file"
          }
          if (Test-Path "$package/EzorsiaV2_UI.wz") {
            throw "Legacy UI filename leaked into package"
          }

          Get-FileHash "$package/dinput8.dll" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  dinput8.dll" } |
            Set-Content "$package/SHA256SUMS.txt" -Encoding ascii

          Compress-Archive -Path "$package/*" -DestinationPath "EverleafClient-source-built.zip"
          Get-FileHash "EverleafClient-source-built.zip" -Algorithm SHA256
          Get-ChildItem $package | Select-Object Name,Length

      - name: Upload private client artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverleafClient-source-built
          path: EverleafClient-source-built.zip
          retention-days: 14
          if-no-files-found: error

  publish-patch:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EverleafClient-source-built
          path: release

      - name: Extract and validate patch payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package runtime-payload
          unzip -q release/EverleafClient-source-built.zip -d package
          for f in dinput8.dll config.ini EverLeaf_UI.wz LICENSE-AGPL-3.0.txt UPSTREAM.md README.md SHA256SUMS.txt; do
            test -f "package/$f"
          done
          test ! -f package/EzorsiaV2_UI.wz
          cp package/dinput8.dll runtime-payload/dinput8.dll
          cp package/config.ini runtime-payload/config.ini
          cp package/EverLeaf_UI.wz runtime-payload/EverLeaf_UI.wz
          echo "EverLeaf runtime patch payload:"
          find runtime-payload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Publish patch files and rebuild signed manifest
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'sudo install -d -o ubuntu -g ubuntu -m 755 /opt/everleaf/patches/files; rm -f /opt/everleaf/patches/files/LICENSE-AGPL-3.0.txt /opt/everleaf/patches/files/UPSTREAM.md /opt/everleaf/patches/files/README.md /opt/everleaf/patches/files/SHA256SUMS.txt'
          tar -C runtime-payload -czf - . | ssh -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" \
            'set -euo pipefail; tar -xzf - -C /opt/everleaf/patches/files; cd /opt/everleaf/web; npm run build-patch-manifest; python3 -c '\''import json; m=json.load(open("/opt/everleaf/patches/manifest.json")); assert len(m.get("files",[])) >= 3, "Patch manifest unexpectedly empty"; print("Runtime patch manifest files:", len(m["files"]))'\''; sudo systemctl restart everleaf-web; sleep 2; curl -fsS http://127.0.0.1:3000/v1/launcher/manifest >/dev/null; echo EverLeaf client patch payload published.'
