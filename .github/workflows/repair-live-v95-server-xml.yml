name: Restore full v95 server XML

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/repair-live-v95-server-xml.yml'
  workflow_dispatch:

concurrency:
  group: everleaf-game-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Restore and validate canonical full-v95 XML tree
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CURRENT="$(readlink -f /opt/everleaf/current)"
          test -d "$CURRENT/wz"
          systemctl is-active --quiet everleaf.service

          SOURCE_KIND=''
          SOURCE=''

          # Prefer an immutable old release that still contains the complete wholesale XML tree.
          while read -r _ wzdir; do
            [ -d "$wzdir" ] || continue
            count="$(find "$wzdir" -type f -name '*.xml' | wc -l)"
            echo "RELEASE_WZ_CANDIDATE count=$count path=$wzdir"
            if [ "$count" -eq 44236 ]; then SOURCE_KIND='dir'; SOURCE="$wzdir"; break; fi
          done < <(find /opt/everleaf/releases -mindepth 2 -maxdepth 2 -type d -name wz -printf '%T@ %p\n' 2>/dev/null | sort -nr)

          # Otherwise use any preserved wholesale XML archive, regardless of whether its sidecar status file survived.
          if [ -z "$SOURCE" ]; then
            while read -r _ zip; do
              [ -s "$zip" ] || continue
              count="$(unzip -Z1 "$zip" | grep -cE '\.xml$' || true)"
              echo "WHOLESALE_ZIP_CANDIDATE count=$count path=$zip"
              if [ "$count" -eq 44236 ]; then SOURCE_KIND='zip'; SOURCE="$zip"; break; fi
            done < <(find /home/ubuntu/everleaf-staging -type f -name 'community-full-xml.zip' -printf '%T@ %p\n' 2>/dev/null | sort -nr)
          fi

          # Last recovery source: any explicit server-WZ backup containing the complete tree.
          if [ -z "$SOURCE" ]; then
            while read -r _ wzdir; do
              [ -d "$wzdir" ] || continue
              count="$(find "$wzdir" -type f -name '*.xml' | wc -l)"
              echo "BACKUP_WZ_CANDIDATE count=$count path=$wzdir"
              if [ "$count" -eq 44236 ]; then SOURCE_KIND='dir'; SOURCE="$wzdir"; break; fi
            done < <(find /opt/everleaf/backups -type d \( -name 'server-wz-xml' -o -name 'wz' \) -printf '%T@ %p\n' 2>/dev/null | sort -nr)
          fi

          test -n "$SOURCE" || { echo 'No preserved 44,236-XML full-v95 server tree found on Oracle.' >&2; exit 1; }
          echo "V95_RECOVERY_SOURCE kind=$SOURCE_KIND source=$SOURCE"

          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="/opt/everleaf/backups/v95-server-xml-repair/$TS"
          sudo install -d -o ubuntu -g ubuntu /opt/everleaf/shared "$BACKUP"
          sudo cp -a "$CURRENT/wz" "$BACKUP/pre-repair-wz"
          printf '%s\n' "$CURRENT" > "$BACKUP/current-release.txt"
          printf '%s %s\n' "$SOURCE_KIND" "$SOURCE" > "$BACKUP/source.txt"

          NEW="/opt/everleaf/shared/wz-v95.new-$TS"
          rm -rf "$NEW"
          mkdir -p "$NEW"
          if [ "$SOURCE_KIND" = dir ]; then
            cp -a "$SOURCE/." "$NEW/"
          else
            unzip -q "$SOURCE" -d "$NEW"
          fi

          WZROOT="$NEW" python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['WZROOT'])
          xml_count=sum(1 for _ in root.rglob('*.xml'))
          assert xml_count == 44236, xml_count
          for fam in ('Item.wz','Map.wz','Mob.wz','Npc.wz','Quest.wz','Reactor.wz','Skill.wz','String.wz'):
              assert (root/fam).is_dir(), fam
          maps={int(m.group(1)) for p in (root/'Map.wz').rglob('*.img.xml') if (m:=re.match(r'^(\d+)\.img\.xml$',p.name))}
          future=sorted(i for i in maps if 271000000 <= i <= 271040300)
          assert len(future)==42, len(future)
          ninja=[800040000,800040100,800040200,800040201,800040202,800040203,800040204,800040205,800040206,800040207,800040208,800040209,800040210,800040211,800040300,800040301,800040302,800040303,800040304,800040305,800040306,800040307,800040308,800040309,800040310,800040311,800040312,800040313,800040314,800040315,800040400,800040401,800040410]
          assert not [i for i in ninja if i not in maps], [i for i in ninja if i not in maps]
          def missing_files(fam, ids):
              d=root/fam
              return [i for i in ids if not list(d.rglob(f'{i}.img.xml'))]
          for fam,ids in [('Mob.wz',range(8850000,8850012)),('Mob.wz',range(9400400,9400411)),('Npc.wz',range(9110100,9110115))]:
              missing=missing_files(fam,ids); assert not missing,(fam,missing)
          def family_text(fam):
              return '\n'.join(p.read_text(errors='ignore') for p in (root/fam).rglob('*.xml'))
          item_text=family_text('Item.wz'); quest_text=family_text('Quest.wz')
          for i in range(4000337,4000347): assert f'name="{i}"' in item_text or f'value="{i}"' in item_text, i
          for q in range(8163,8172): assert f'name="{q}"' in quest_text or f'value="{q}"' in quest_text, q
          print(f'FULL_V95_XML_VALID xml={xml_count} future_henesys={len(future)} ninja_maps={len(ninja)}')
          PY

          sudo rm -rf /opt/everleaf/shared/wz-v95.previous
          if [ -d /opt/everleaf/shared/wz-v95 ]; then sudo mv /opt/everleaf/shared/wz-v95 /opt/everleaf/shared/wz-v95.previous; fi
          sudo mv "$NEW" /opt/everleaf/shared/wz-v95

          rollback(){
            echo 'V95_SERVER_XML_REPAIR_FAILED_ROLLING_BACK' >&2
            sudo rm -rf "$CURRENT/wz"
            sudo cp -a "$BACKUP/pre-repair-wz" "$CURRENT/wz"
            sudo systemctl restart everleaf.service || true
          }
          trap rollback ERR

          sudo rm -rf "$CURRENT/wz"
          sudo cp -a /opt/everleaf/shared/wz-v95 "$CURRENT/wz"
          test "$(find "$CURRENT/wz" -type f -name '*.xml' | wc -l)" -eq 44236
          sudo systemctl restart everleaf.service
          for i in $(seq 1 45); do
            if systemctl is-active --quiet everleaf.service && python3 "$CURRENT/tools/verify_channel_runtime.py" --config "$CURRENT/config.yaml" --host 127.0.0.1 >/tmp/v95-repair-health.json 2>&1; then break; fi
            sleep 2
          done
          systemctl is-active --quiet everleaf.service
          python3 "$CURRENT/tools/verify_channel_runtime.py" --config "$CURRENT/config.yaml" --host 127.0.0.1
          test "$(find "$CURRENT/wz/Map.wz" -type f -name '271*.img.xml' | wc -l)" -ge 42
          test -n "$(find "$CURRENT/wz/Map.wz" -type f -name '800040410.img.xml' -print -quit)"
          test -n "$(find "$CURRENT/wz/Mob.wz" -type f -name '8850011.img.xml' -print -quit)"
          test -n "$(find "$CURRENT/wz/Mob.wz" -type f -name '9400410.img.xml' -print -quit)"
          test -f "$CURRENT/scripts/event/CygnusBattle.js"
          test -f "$CURRENT/scripts/portal/ninja_Boss.js"

          printf 'source_kind=%s\nsource=%s\nxml_count=44236\nrepaired=%s\n' "$SOURCE_KIND" "$SOURCE" "$(date -u +%FT%TZ)" | sudo tee /opt/everleaf/.server-wz-baseline >/dev/null
          trap - ERR
          echo 'LIVE_FULL_V95_SERVER_XML_RESTORED'
          REMOTE

      - name: Verify public game ports
        run: |
          python3 - <<'PY'
          import socket
          host='132.145.141.79'; missing=[]
          for port in [8484,*range(7575,7595)]:
              try:
                  with socket.create_connection((host,port),timeout=5): print('OK',port)
              except OSError as exc: missing.append(port); print('FAIL',port,exc)
          if missing: raise SystemExit(missing)
          PY
