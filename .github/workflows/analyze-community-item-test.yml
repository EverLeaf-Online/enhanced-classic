name: Analyze community item donor test

on:
  push:
    branches:
      - release-dev
    paths:
      - '.github/workflows/analyze-community-item-test.yml'
      - 'tools/wz-donor/exporter/Program.cs'
      - 'tools/wz-donor/wz_diff.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  COMMUNITY_WZ_ROOT: /home/ubuntu/everleaf-staging/community-wz/extracted/Community Repack WZs
  CURRENT_WZ_ROOT: /opt/everleaf/patches/files

jobs:
  prepare-ssh:
    runs-on: ubuntu-24.04
    outputs:
      known_hosts_b64: ${{ steps.hostkeys.outputs.known_hosts_b64 }}
    steps:
      - name: Capture Oracle SSH host keys
        id: hostkeys
        run: |
          set -euo pipefail
          ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          echo "known_hosts_b64=$(base64 -w0 "$RUNNER_TEMP/known_hosts")" >> "$GITHUB_OUTPUT"

  analyze:
    needs: prepare-ssh
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS_B64: ${{ needs.prepare-ssh.outputs.known_hosts_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'), ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          [IO.File]::WriteAllBytes((Join-Path $sshDir 'known_hosts'), [Convert]::FromBase64String($env:KNOWN_HOSTS_B64))
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 15
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')

      - name: Fetch donor and current Item.wz safely
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pairs = @(
            @{ Label='donor'; Remote="$env:COMMUNITY_WZ_ROOT/Item.wz" },
            @{ Label='current'; Remote="$env:CURRENT_WZ_ROOT/Item.wz" }
          )
          $root = Join-Path $env:RUNNER_TEMP 'item-test'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          foreach ($pair in $pairs) {
            $label = $pair.Label
            $remote = $pair.Remote
            $remoteBase = "/tmp/everleaf-item-test-$label"
            $localParts = Join-Path $root "$label-parts"
            New-Item -ItemType Directory -Force -Path $localParts | Out-Null

            $prep = "set -euo pipefail; test -s '$remote'; rm -f '$remoteBase'.part.* '$remoteBase'.parts.sha256 '$remoteBase'.file.sha256; sha256sum '$remote' > '$remoteBase.file.sha256'; split -b 32M -d -a 4 '$remote' '$remoteBase.part.'; sha256sum '$remoteBase'.part.* > '$remoteBase.parts.sha256'"
            ssh everleaf-oracle $prep
            if ($LASTEXITCODE -ne 0) { throw "Failed preparing $label Item.wz" }

            $partsManifest = Join-Path $localParts 'parts.sha256'
            $fileManifest = Join-Path $localParts 'file.sha256'
            scp "everleaf-oracle`:$remoteBase.parts.sha256" $partsManifest
            scp "everleaf-oracle`:$remoteBase.file.sha256" $fileManifest
            if ($LASTEXITCODE -ne 0) { throw "Failed fetching $label manifests" }

            foreach ($row in (Get-Content $partsManifest | Where-Object { $_.Trim() })) {
              if ($row -notmatch '^([0-9a-f]{64})\s+(.+)$') { throw "Malformed part manifest: $row" }
              $expected = $matches[1]
              $remotePart = $matches[2]
              $name = Split-Path $remotePart -Leaf
              $local = Join-Path $localParts $name
              $ok = $false
              for ($attempt=1; $attempt -le 5 -and -not $ok; $attempt++) {
                Remove-Item -Force -ErrorAction SilentlyContinue $local
                scp "everleaf-oracle`:$remotePart" $local
                if ($LASTEXITCODE -eq 0 -and (Test-Path $local)) {
                  $actual = (Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant()
                  if ($actual -eq $expected) { $ok = $true }
                }
                if (-not $ok) { Start-Sleep -Seconds (2 * $attempt) }
              }
              if (-not $ok) { throw "Unable to fetch verified $label part $name" }
            }

            $destination = Join-Path $root "$label-Item.wz"
            $out = [IO.File]::Open($destination, [IO.FileMode]::Create, [IO.FileAccess]::Write)
            try {
              Get-ChildItem $localParts -Filter "everleaf-item-test-$label.part.*" -File | Sort-Object Name | ForEach-Object {
                $input = [IO.File]::OpenRead($_.FullName)
                try { $input.CopyTo($out) } finally { $input.Dispose() }
              }
            } finally { $out.Dispose() }

            $fileRow = Get-Content $fileManifest | Select-Object -First 1
            if ($fileRow -notmatch '^([0-9a-f]{64})\s+') { throw "Malformed file manifest for $label" }
            $expectedFile = $matches[1]
            $actualFile = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualFile -ne $expectedFile) { throw "$label Item.wz hash mismatch" }
            Write-Host "$label Item.wz verified: $actualFile"
            ssh everleaf-oracle "rm -f '$remoteBase'.part.* '$remoteBase'.parts.sha256 '$remoteBase'.file.sha256" | Out-Null
          }

      - name: Build MapleLib exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item 'tools/wz-donor/exporter/Program.cs' (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\MapleLib\MapleLib.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafWzExporter.csproj') -c Release

      - name: Export both Item.wz binaries to fresh XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          foreach ($label in @('donor','current')) {
            $inputDir = Join-Path $env:RUNNER_TEMP "item-test/$label-input"
            New-Item -ItemType Directory -Force -Path $inputDir | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP "item-test/$label-Item.wz") (Join-Path $inputDir 'Item.wz')
            $outputDir = Join-Path $env:RUNNER_TEMP "item-test/$label-xml"
            New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
            & dotnet run --project $project -c Release --no-build -- $inputDir $outputDir --patch-version=83 --probe-patch-range=1:250 Item.wz
            if ($LASTEXITCODE -ne 0) { throw "$label Item.wz export failed" }
          }

      - name: Verify tiny test batch against real community binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $donor = Join-Path $env:RUNNER_TEMP 'item-test/donor-xml'
          $current = Join-Path $env:RUNNER_TEMP 'item-test/current-xml'
          python tools/wz-donor/wz_diff.py --baseline $current --donor $donor --donor-id community-item-test --skip-dependencies --output "$env:RUNNER_TEMP/item-test/community-item-diff.json"
          python - "$env:RUNNER_TEMP/item-test/community-item-diff.json" <<'PY'
          import json, sys
          report=json.load(open(sys.argv[1], encoding='utf-8'))
          items=report['categories']['items']
          new={str(x) for x in items['newIds']}
          collisions={str(x) for x in items['collisionIds']}
          targets=['2022711','2022712']
          result={
              'targets': targets,
              'states': {x: ('donor-new' if x in new else 'collision' if x in collisions else 'missing-from-donor') for x in targets},
              'itemNewCount': len(new),
              'itemCollisionCount': len(collisions),
              'safeForMergePoC': all(x in new for x in targets),
              'note': 'Binary-derived XML only; no community XML pack used.'
          }
          out=sys.argv[1].replace('community-item-diff.json','community-item-test-result.json')
          json.dump(result, open(out,'w',encoding='utf-8'), indent=2)
          print(json.dumps(result, indent=2))
          PY

      - name: Upload test evidence only
        uses: actions/upload-artifact@v4
        with:
          name: community-item-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/item-test/community-item-diff.json
            ${{ runner.temp }}/item-test/community-item-test-result.json
          retention-days: 14
          if-no-files-found: error
