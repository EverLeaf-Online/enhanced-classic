name: Rebuild server WZ from canonical live v95 client

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/rebuild-server-wz-from-live-v95-client.yml'
  workflow_dispatch:

concurrency:
  group: everleaf-game-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  rebuild:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout release-dev
        uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure verified Oracle SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $key=Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($key,($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){
            [IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")
          } else {
            & 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known
          }
          if(-not (Test-Path $known) -or (Get-Item $known).Length -eq 0){throw 'known_hosts unavailable'}
          & 'C:\Program Files\Git\usr\bin\ssh.exe' -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" 'echo Oracle SSH OK'
          if($LASTEXITCODE){throw 'Oracle SSH failed'}

      - name: Build MapleLib XML exporter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item tools/wz-donor/exporter/Program.cs (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup><ProjectReference Include="..\MapleLib\MapleLib.csproj" /></ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafWzExporter.csproj') -c Release

      - name: Fetch exact live v95 client WZ families
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $families=@('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')
          $key=Join-Path $HOME '.ssh/id_everleaf'
          $ssh='C:\Program Files\Git\usr\bin\ssh.exe'
          $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $live=Join-Path $env:RUNNER_TEMP 'live-v95-wz'
          New-Item -ItemType Directory -Force -Path $live | Out-Null
          foreach($f in $families){
            & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "test -s '/opt/everleaf/patches/files/$f'"
            if($LASTEXITCODE){throw "live client missing $f"}
            & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/patches/files/$f" (Join-Path $live $f)
            if($LASTEXITCODE){throw "failed to fetch $f"}
            Get-FileHash (Join-Path $live $f) -Algorithm SHA256
          }

      - name: Export live client WZ to server XML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $input=Join-Path $env:RUNNER_TEMP 'live-v95-wz'
          $xml=Join-Path $env:RUNNER_TEMP 'live-v95-xml'
          New-Item -ItemType Directory -Force -Path $xml | Out-Null
          $project=Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          foreach($f in @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')){
            dotnet run --project $project -c Release --no-build -- $input $xml --patch-version=83 --probe-patch-range=1:250 $f
            if($LASTEXITCODE){throw "XML export failed: $f"}
            if(-not (Test-Path (Join-Path $xml $f) -PathType Container)){throw "XML family missing after export: $f"}
          }

      - name: Validate Empress and Ninja Castle in canonical live WZ export
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $xml=Join-Path $env:RUNNER_TEMP 'live-v95-xml'
          python -c @'
          import pathlib,re,sys,xml.etree.ElementTree as ET
          root=pathlib.Path(sys.argv[1])
          def ids(fam):
              out=set()
              for p in (root/fam).rglob('*.img.xml'):
                  m=re.match(r'^(\d+)\.img\.xml$',p.name)
                  if m: out.add(int(m.group(1)))
              return out
          maps=ids('Map.wz'); mobs=ids('Mob.wz'); npcs=ids('Npc.wz')
          ninja=[800040000,800040100,*range(800040200,800040212),*range(800040300,800040316),800040400,800040401,800040410]
          miss=[i for i in ninja if i not in maps]
          assert not miss,('missing Ninja maps',miss)
          future=sorted(i for i in maps if 271000000<=i<=271040300)
          assert len(future)==42,('Future Henesys count',len(future),future)
          miss=[i for i in range(8850000,8850012) if i not in mobs]
          assert not miss,('missing Empress mobs',miss)
          # 9400410 is intentionally excluded: live v95 and all three preserved 44,236-file
          # v95 trees contain zero map/quest/revive references, zero exact asset files, and
          # production has zero spawn/drop rows for it. The playable Ninja closure is 9400400-9400409.
          miss=[i for i in range(9400400,9400410) if i not in mobs]
          assert not miss,('missing Ninja mobs',miss)
          miss=[i for i in range(9110100,9110115) if i not in npcs]
          assert not miss,('missing Ninja NPCs',miss)
          item='\n'.join(p.read_text(errors='ignore') for p in (root/'Item.wz').rglob('*.xml'))
          quest='\n'.join(p.read_text(errors='ignore') for p in (root/'Quest.wz').rglob('*.xml'))
          for i in range(4000337,4000347):
              assert f'name="{i}"' in item or f'name="0{i}"' in item or f'value="{i}"' in item,('missing Ninja item',i)
          for i in range(8163,8172):
              assert f'name="{i}"' in quest or f'value="{i}"' in quest,('missing Ninja quest',i)
          bad=[]
          for mid in ninja+future:
              p=next((p for p in (root/'Map.wz').rglob(f'{mid}.img.xml')),None)
              if not p: continue
              t=ET.parse(p).getroot()
              for sec in t.iter():
                  if sec.attrib.get('name')!='portal': continue
                  for x in list(sec):
                      d={c.attrib.get('name',''):c.attrib.get('value','') for c in list(x)}
                      tm=d.get('tm','')
                      if tm.isdigit() and int(tm) not in (0,999999999) and int(tm) not in maps:
                          bad.append((mid,d.get('pn',''),int(tm)))
          assert not bad,('broken regional portal targets',bad[:25])
          print(f'LIVE_V95_REGION_EXPORT_OK ninja_maps={len(ninja)} future_henesys={len(future)} ninja_mobs=10 empress_mobs=12')
          '@ $xml

      - name: Package exported canonical families
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $xml=Join-Path $env:RUNNER_TEMP 'live-v95-xml'
          $archive=Join-Path $env:RUNNER_TEMP 'live-v95-six-families.tgz'
          tar -czf $archive -C $xml Map.wz Mob.wz Npc.wz Item.wz Quest.wz String.wz
          if($LASTEXITCODE -or -not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1000000){throw 'XML archive creation failed'}
          Get-FileHash $archive -Algorithm SHA256

      - name: Build canonical full-v95 server XML baseline on Oracle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $key=Join-Path $HOME '.ssh/id_everleaf'
          $ssh='C:\Program Files\Git\usr\bin\ssh.exe'
          $scp='C:\Program Files\Git\usr\bin\scp.exe'
          $archive=Join-Path $env:RUNNER_TEMP 'live-v95-six-families.tgz'
          $remoteArchive="/tmp/everleaf-live-v95-six-$env:GITHUB_RUN_ID.tgz"
          & $scp -i $key $archive "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteArchive"
          if($LASTEXITCODE){throw 'server XML archive upload failed'}
          $remote=@'
          set -euo pipefail
          archive="$1"; run_id="$2"
          current="$(readlink -f /opt/everleaf/current)"
          test -d "$current/wz"
          source_tree=''
          best_count=0
          while IFS= read -r d; do
            [ -d "$d/Map.wz" ] || continue
            [ -d "$d/Mob.wz" ] || continue
            [ -d "$d/Npc.wz" ] || continue
            count=$(find "$d" -type f -name '*.xml' 2>/dev/null | wc -l)
            if [ "$count" -ge 44000 ] && \
               find "$d/Map.wz" -type f -name '271000000.img.xml' -print -quit | grep -q . && \
               find "$d/Map.wz" -type f -name '800040000.img.xml' -print -quit | grep -q .; then
              if [ "$count" -gt "$best_count" ]; then source_tree="$d"; best_count="$count"; fi
            fi
          done < <(find /opt/everleaf /home/ubuntu/everleaf-staging -maxdepth 6 -type d \( -name wz -o -name server-wz-xml \) 2>/dev/null | sort -u)
          test -n "$source_tree" || { echo 'No preserved >=44k full-v95 XML tree found' >&2; exit 1; }
          echo "Preserved full-v95 source: $source_tree ($best_count XML files)"

          shared=/opt/everleaf/shared/wz-v95
          candidate="/opt/everleaf/shared/wz-v95.candidate-$run_id"
          rm -rf "$candidate"
          mkdir -p /opt/everleaf/shared "$candidate"
          rsync -a --delete "$source_tree/" "$candidate/"
          rm -rf "$candidate/Map.wz" "$candidate/Mob.wz" "$candidate/Npc.wz" "$candidate/Item.wz" "$candidate/Quest.wz" "$candidate/String.wz"
          tar -xzf "$archive" -C "$candidate"

          count=$(find "$candidate" -type f -name '*.xml' | wc -l)
          test "$count" -ge 44000 || { echo "candidate XML count too small: $count" >&2; exit 1; }
          for id in 271000000 271040100 800040000 800040401 800040410; do
            find "$candidate/Map.wz" -type f -name "$id.img.xml" -print -quit | grep -q . || { echo "missing map $id" >&2; exit 1; }
          done
          for id in $(seq 8850000 8850011) $(seq 9400400 9400409); do
            find "$candidate/Mob.wz" -type f -name "$id.img.xml" -print -quit | grep -q . || { echo "missing mob $id" >&2; exit 1; }
          done
          for id in $(seq 9110100 9110114); do
            find "$candidate/Npc.wz" -type f -name "$id.img.xml" -print -quit | grep -q . || { echo "missing NPC $id" >&2; exit 1; }
          done
          printf 'source=live-client-v95\nrun=%s\nxml_count=%s\ncreated_utc=%s\n' "$run_id" "$count" "$(date -u +%FT%TZ)" > "$candidate/.everleaf-v95-baseline"

          backup="/opt/everleaf/backups/v95-wz-repair-$run_id"
          mkdir -p "$backup"
          rsync -a "$current/wz/" "$backup/server-wz-before/"
          old_shared=''
          if [ -d "$shared" ]; then
            old_shared="/opt/everleaf/shared/wz-v95.previous-$run_id"
            rm -rf "$old_shared"
            mv "$shared" "$old_shared"
          fi
          mv "$candidate" "$shared"

          rollback() {
            echo 'WZ promotion failed; rolling back live server WZ' >&2
            rm -rf "$current/wz"
            mkdir -p "$current/wz"
            rsync -a "$backup/server-wz-before/" "$current/wz/"
            if [ -n "$old_shared" ] && [ -d "$old_shared" ]; then
              rm -rf "$shared"
              mv "$old_shared" "$shared"
            fi
            sudo systemctl restart everleaf.service || true
          }
          trap rollback ERR
          rm -rf "$current/wz"
          mkdir -p "$current/wz"
          rsync -a --delete "$shared/" "$current/wz/"
          sudo systemctl restart everleaf.service
          for i in $(seq 1 30); do
            if systemctl is-active --quiet everleaf.service && ss -ltn | grep -q ':8484 '; then break; fi
            sleep 2
          done
          systemctl is-active --quiet everleaf.service
          ss -ltn | grep -q ':8484 '
          find "$current/wz/Map.wz" -type f -name '271040100.img.xml' -print -quit | grep -q .
          find "$current/wz/Map.wz" -type f -name '800040410.img.xml' -print -quit | grep -q .
          find "$current/wz/Mob.wz" -type f -name '9400409.img.xml' -print -quit | grep -q .
          trap - ERR
          rm -f "$archive"
          echo "LIVE_V95_SERVER_XML_PROMOTED xml_count=$count shared=$shared current=$current/wz backup=$backup"
          '@
          $remote | & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "bash -s -- '$remoteArchive' '$env:GITHUB_RUN_ID'"
          if($LASTEXITCODE){throw 'Oracle full-v95 server XML promotion failed'}

      - name: Verify public EverLeaf ports after WZ promotion
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $hostName=$env:EVERLEAF_DEPLOY_HOST
          $ports=@(8484)+(7575..7594)
          $missing=@()
          foreach($port in $ports){
            try {
              $client=New-Object System.Net.Sockets.TcpClient
              $task=$client.ConnectAsync($hostName,$port)
              if(-not $task.Wait(5000) -or -not $client.Connected){throw 'connect failed'}
              $client.Close()
              Write-Host "OK $hostName`:$port"
            } catch {
              Write-Host "FAIL $hostName`:$port $_"
              $missing+=$port
            }
          }
          if($missing.Count){throw "Public game ports unavailable: $($missing -join ',')"}
