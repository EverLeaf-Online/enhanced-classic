name: Polish class artwork

on:
  push:
    branches:
      - web/class-section-polish
    paths:
      - .github/workflows/polish-class-assets.yml

permissions:
  contents: write

jobs:
  polish-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: web/class-section-polish
      - name: Prepare transparent Beginner and Cygnus artwork
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import io, json, pathlib, urllib.parse, urllib.request
          from collections import deque
          from PIL import Image

          ROOT=pathlib.Path('web/public/assets/jobs')
          API='https://maplestorywiki.net/api.php'
          UA={'User-Agent':'EverLeaf asset importer/1.0'}

          def api(params):
              url=API+'?'+urllib.parse.urlencode(params)
              with urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=30) as r:
                  return json.load(r)

          def image_url(title):
              data=api({'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':'File:'+title})
              for page in data.get('query',{}).get('pages',{}).values():
                  info=page.get('imageinfo')
                  if info and info[0].get('url'):
                      return info[0]['url']

          def list_images(prefix):
              data=api({'action':'query','format':'json','list':'allimages','ailimit':'50','aiprefix':prefix})
              return [x['name'] for x in data.get('query',{}).get('allimages',[])]

          def download(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 EverLeaf/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read()

          def alpha_ratio(img):
              rgba=img.convert('RGBA')
              a=rgba.getchannel('A')
              hist=a.histogram()
              transparent=sum(hist[:245])
              return transparent/(rgba.width*rgba.height)

          def normalize_transparent(img, out, canvas=(420,420), max_box=(330,330)):
              img=img.convert('RGBA')
              bbox=img.getbbox()
              if bbox: img=img.crop(bbox)
              img.thumbnail(max_box,Image.Resampling.LANCZOS)
              canvas_img=Image.new('RGBA',canvas,(255,255,255,0))
              x=(canvas[0]-img.width)//2
              y=(canvas[1]-img.height)//2
              canvas_img.alpha_composite(img,(x,y))
              out.parent.mkdir(parents=True,exist_ok=True)
              canvas_img.save(out,optimize=True)

          # Prefer a Beginner image that already has real transparency.
          candidate_names=[]
          for prefix in ['ClassArtwork Beginner','NPC Portrait of an Explorer Beginner','NPC Portrait Explorer Beginner']:
              try: candidate_names.extend(list_images(prefix))
              except Exception: pass
          candidate_names=list(dict.fromkeys(candidate_names))
          scored=[]
          for name in candidate_names:
              try:
                  url=image_url(name)
                  if not url: continue
                  blob=download(url)
                  img=Image.open(io.BytesIO(blob)).convert('RGBA')
                  if img.width<100 or img.height<100: continue
                  scored.append((alpha_ratio(img),img.width*img.height,name,url,img.copy()))
              except Exception as exc:
                  print('skip Beginner candidate',name,exc)
          if not scored:
              raise SystemExit('No Beginner artwork candidates found')
          scored.sort(reverse=True,key=lambda x:(x[0],x[1]))
          ratio,area,name,url,img=scored[0]
          print('Beginner selected:',name,'alpha',round(ratio,3),'source',url)
          normalize_transparent(img,ROOT/'beginner'/'beginner-clean.png')

          # Remove only near-white background regions connected to the canvas edge.
          src=Image.open(ROOT/'special'/'cygnus.png').convert('RGBA')
          px=src.load(); w,h=src.size
          mask=[[False]*w for _ in range(h)]
          q=deque()
          def whiteish(x,y):
              r,g,b,a=px[x,y]
              return a>0 and r>=242 and g>=242 and b>=238
          for x in range(w):
              if whiteish(x,0): q.append((x,0))
              if whiteish(x,h-1): q.append((x,h-1))
          for y in range(h):
              if whiteish(0,y): q.append((0,y))
              if whiteish(w-1,y): q.append((w-1,y))
          while q:
              x,y=q.popleft()
              if x<0 or y<0 or x>=w or y>=h or mask[y][x] or not whiteish(x,y): continue
              mask[y][x]=True
              px[x,y]=(255,255,255,0)
              q.extend(((x-1,y),(x+1,y),(x,y-1),(x,y+1)))
          normalize_transparent(src,ROOT/'special'/'cygnus-clean.png',canvas=(620,420),max_box=(500,360))
          PY
      - name: Commit polished assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/assets/jobs/beginner/beginner-clean.png web/public/assets/jobs/special/cygnus-clean.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(web): polish Beginner and Cygnus artwork'
          git push origin HEAD:web/class-section-polish
