name: Vendor pinned SoloMapling GCMove runtime

on:
  push:
    branches:
      - feature/solomapling-qa-integration

permissions:
  contents: write

jobs:
  vendor-gcmove:
    if: github.event.head_commit.message == 'ci(qa): stage GCMove permanent vendor import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/solomapling-qa-integration
          fetch-depth: 0

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Vendor only missing GCMove sources
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          mkdir -p "$target"

          copied=0
          for file in "$upstream"/*.java; do
            name=$(basename "$file")
            if [[ ! -e "$target/$name" ]]; then
              cp "$file" "$target/$name"
              echo "vendored $name"
              copied=$((copied + 1))
            else
              echo "preserved local $name"
            fi
          done

          upstream_count=$(find "$upstream" -maxdepth 1 -type f -name '*.java' | wc -l)
          target_count=$(find "$target" -maxdepth 1 -type f -name '*.java' | wc -l)
          test "$upstream_count" -eq 29
          test "$target_count" -eq 29
          test "$copied" -eq 22

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EverLeaf QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          git diff --cached --quiet && { echo "No GCMove files needed vendoring"; exit 0; }
          git commit -m "feat(qa): vendor pinned SoloMapling GCMove runtime"
          git push origin HEAD:feature/solomapling-qa-integration
