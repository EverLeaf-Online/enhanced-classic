name: Vendor pinned SoloMapling GCMove runtime

on:
  push:
    branches:
      - feature/solomapling-qa-integration
    paths:
      - .github/workflows/vendor-solomapling-gcmove.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.repository == 'iampolicy/enhanced-classic'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EverLeaf feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/solomapling-qa-integration
          fetch-depth: 0

      - name: Checkout pinned SoloMapling v0.3
        uses: actions/checkout@v5
        with:
          repository: MadaraGameDev/SoloMapling
          ref: 47b61b5381118ebdc1064ddbd0b1c32f75778871
          path: .solomapling-upstream

      - name: Vendor only missing GCMove sources
        shell: bash
        run: |
          set -euo pipefail
          upstream=.solomapling-upstream/src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          target=src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          mkdir -p "$target"

          added=0
          for source in "$upstream"/*.java; do
            name=$(basename "$source")
            destination="$target/$name"
            if [[ -e "$destination" ]]; then
              echo "KEEP EverLeaf/adapted: $name"
              continue
            fi
            cp "$source" "$destination"
            echo "ADD pinned upstream: $name"
            added=$((added + 1))
          done

          echo "Vendored $added missing GCMove source files."
          test "$added" -gt 0

      - name: Verify adapted files were not overwritten
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Deliberately disabled for deterministic QA bots' src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/BotPlayerReaction.java
          grep -q 'map.getFootholds().findBelow' src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/BotNavigationGraph.java
          grep -q 'map.addRope(new Rope' src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem/BotNavigationMapLoader.java

      - name: Commit vendored runtime to feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .solomapling-upstream
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/soloMapling/ArtificialPlayer/GCMoveSystem
          git diff --cached --quiet && { echo 'No vendored changes'; exit 1; }
          git commit -m 'feat(qa): vendor pinned GCMove runtime'
          git push origin HEAD:feature/solomapling-qa-integration
