name: Apply Boss PQ Hardening

on:
  push:
    branches:
      - release-dev
    paths:
      - 'tools/apply_boss_pq_hardening.py'
      - 'tools/apply_boss_pq_failed_setup_cleanup.py'
      - '.github/workflows/boss-pq-hardening-apply.yml'

permissions:
  contents: write

concurrency:
  group: boss-pq-hardening-release-dev
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'
      - name: Apply Boss/PQ hardening
        run: |
          python3 tools/apply_boss_pq_hardening.py
          python3 tools/apply_boss_pq_failed_setup_cleanup.py
      - name: Verify idempotency
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            src/main/java/scripting/event/EventManager.java
            src/main/java/scripting/event/EventInstanceManager.java
            src/main/java/server/expeditions/Expedition.java
            scripts/npc/2101014.js
          )
          before="$(sha256sum "${targets[@]}" | sha256sum | awk '{print $1}')"
          python3 tools/apply_boss_pq_hardening.py
          python3 tools/apply_boss_pq_failed_setup_cleanup.py
          after="$(sha256sum "${targets[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || {
            echo 'Boss/PQ hardening transforms are not idempotent.' >&2
            exit 1
          }
      - name: Compile transformed server
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Commit verified lifecycle changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/scripting/event/EventManager.java \
                  src/main/java/scripting/event/EventInstanceManager.java \
                  src/main/java/server/expeditions/Expedition.java \
                  scripts/npc/2101014.js
          if git diff --cached --quiet; then
            echo 'Boss/PQ lifecycle sources are already hardened.'
            exit 0
          fi
          git commit -m 'fix(events): harden boss and PQ lifecycle'
          git push origin HEAD:release-dev
