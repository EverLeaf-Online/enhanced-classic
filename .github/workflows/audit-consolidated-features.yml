name: Audit canonical non-Empress features

on:
  push:
    branches: [release-dev]
    paths:
      - 'tools/audit_consolidated_features.py'
      - '.github/workflows/audit-consolidated-features.yml'
      - 'src/**'
      - 'scripts/**'
      - 'launcher/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch canonical branches
        run: |
          git fetch origin \
            '+refs/heads/release-dev:refs/remotes/origin/release-dev' \
            '+refs/heads/master:refs/remotes/origin/master' \
            '+refs/heads/client-dev:refs/remotes/origin/client-dev'
      - name: Verify canonical feature ledger
        run: python3 tools/audit_consolidated_features.py
