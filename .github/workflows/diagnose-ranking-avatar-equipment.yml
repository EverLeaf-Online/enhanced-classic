name: Diagnose EverLeaf Ranking Avatar Equipment

on:
  push:
    branches: [diag/ranking-avatar-equipment-sep4]
    paths:
      - '.github/workflows/diagnose-ranking-avatar-equipment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Compare website extraction with saved rows
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            cd /opt/everleaf/web
            echo 'non-secret game DB configuration:'
            grep -E '^(GAME_DB_NAME|GAME_CHARACTERS_TABLE|GAME_INVENTORY_ITEMS_TABLE)=' .env || true
            echo 'gameService.characterAppearance results:'
            timeout 45s node - <<'NODE'
            const game = require('./src/services/gameService');
            (async () => {
              for (const id of [12,14,16,17]) {
                const appearance = await game.characterAppearance(id);
                console.log(JSON.stringify(appearance));
              }
              process.exit(0);
            })().catch(error => { console.error(error && error.stack || error); process.exit(1); });
            NODE
            echo 'live route headers:'
            for spec in '12:410' '14:420' '16:1310' '17:1110'; do
              id="${spec%%:*}"; job="${spec##*:}"
              curl -fsSI "http://127.0.0.1:3000/character-avatar/${id}.png?job=${job}" | grep -Ei '^(HTTP/|content-type:|x-everleaf-avatar-(source|mode|equipment-count):)'
            done
          REMOTE
