name: Diagnose EverLeaf Ranking Avatar Equipment

on:
  push:
    branches: [diag/ranking-avatar-equipment-sep4]
    paths:
      - '.github/workflows/diagnose-ranking-avatar-equipment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect top-ranked saved equipment rows
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'cd /opt/everleaf/web && node -' <<'NODE'
          const env = require('./src/config/env');
          const game = require('./src/services/gameService');
          const { getPool, safeIdent: I } = require('./src/db/game');

          (async () => {
            const db = getPool();
            const g = env.gameDb;
            const page = await game.rankingPage({limit:10,offset:0});
            console.log('top-ranked-characters');
            for (const row of page.rows) {
              const id = Number(row.id);
              const appearance = await game.characterAppearance(id);
              const [items] = await db.query(`
                SELECT inventoryitemid, itemid, inventorytype, position, type, characterid, accountid
                  FROM ${I(g.inventoryItemsTable)}
                 WHERE characterid=?
                 ORDER BY inventorytype, position, inventoryitemid
              `,[id]);
              const candidates = items.filter(item => Number(item.type)===1);
              console.log(JSON.stringify({
                id,
                name:String(row.name),
                job:Number(row.job),
                appearance,
                equipLikeRows:candidates
              }));
            }
            await db.end();
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exitCode = 1;
          });
          NODE
