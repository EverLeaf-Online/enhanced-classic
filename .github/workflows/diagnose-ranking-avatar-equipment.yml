name: Diagnose EverLeaf Ranking Avatar Equipment

on:
  push:
    branches: [diag/ranking-avatar-equipment-sep4]
    paths:
      - '.github/workflows/diagnose-ranking-avatar-equipment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect saved equipment rows
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            echo 'characters:'
            sudo mysql cosmic -NBe "SELECT id,name,level,job,skincolor,face,hair FROM characters WHERE name IN ('Kuro','Scar','Galletas','Kira') ORDER BY name;"
            echo 'inventory rows:'
            sudo mysql cosmic -NBe "SELECT c.id,c.name,i.inventoryitemid,i.itemid,i.inventorytype,i.position,i.type FROM characters c LEFT JOIN inventoryitems i ON i.characterid=c.id WHERE c.name IN ('Kuro','Scar','Galletas','Kira') ORDER BY c.name,i.inventorytype,i.position,i.inventoryitemid;"
            echo 'equipped rows only:'
            sudo mysql cosmic -NBe "SELECT c.id,c.name,i.inventoryitemid,i.itemid,i.inventorytype,i.position,i.type FROM characters c JOIN inventoryitems i ON i.characterid=c.id WHERE c.name IN ('Kuro','Scar','Galletas','Kira') AND i.inventorytype=-1 ORDER BY c.name,i.position,i.inventoryitemid;"
          REMOTE
