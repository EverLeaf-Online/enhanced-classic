name: Diagnose EverLeaf Ranking Avatar Equipment

on:
  push:
    branches: [diag/ranking-avatar-equipment-sep4]
    paths:
      - '.github/workflows/diagnose-ranking-avatar-equipment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect top-ranked saved equipment rows
        shell: bash
        run: |
          set -euo pipefail
          timeout 75s ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'cd /opt/everleaf/web && timeout 60s node -' <<'NODE'
          const env = require('./src/config/env');
          const { getPool, safeIdent: I } = require('./src/db/game');

          (async () => {
            const db = getPool();
            const g = env.gameDb;
            const [characters] = await db.query(`
              SELECT c.${I(g.characterId)} id,
                     c.${I(g.characterName)} name,
                     c.${I(g.characterJob)} job,
                     c.${I(g.characterSkin)} skincolor,
                     c.${I(g.characterFace)} face,
                     c.${I(g.characterHair)} hair
                FROM ${I(g.charactersTable)} c
                JOIN ${I(g.accountsTable)} a ON a.${I(g.accountId)}=c.${I(g.characterAccountId)}
               WHERE COALESCE(c.${I(g.characterGm)},0)=0
                 AND COALESCE(a.${I(g.accountBanned)},0)=0
               ORDER BY c.${I(g.characterLevel)} DESC,
                        c.${I(g.characterExp)} DESC,
                        c.${I(g.characterFame)} DESC,
                        c.${I(g.characterName)} ASC
               LIMIT 10
            `);
            for (const row of characters) {
              const [items] = await db.query(`
                SELECT inventoryitemid, itemid, inventorytype, position, type
                  FROM ${I(g.inventoryItemsTable)}
                 WHERE characterid=?
                 ORDER BY inventorytype, position, inventoryitemid
              `,[Number(row.id)]);
              console.log(JSON.stringify({
                character:{id:Number(row.id),name:String(row.name),job:Number(row.job),skincolor:Number(row.skincolor),face:Number(row.face),hair:Number(row.hair)},
                inventoryRows:items
              }));
            }
            process.exit(0);
          })().catch(error => {
            console.error(error && error.stack || error);
            process.exit(1);
          });
          NODE
