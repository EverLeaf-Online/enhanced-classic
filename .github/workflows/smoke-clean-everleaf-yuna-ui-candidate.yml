name: Smoke clean EverLeaf + Yuna UI candidate

on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/smoke-clean-everleaf-yuna-ui-candidate.yml'

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  smoke:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $d=Join-Path $HOME '.ssh';New-Item -ItemType Directory -Force -Path $d|Out-Null
          $k=Join-Path $d 'id_everleaf';[IO.File]::WriteAllText($k,($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $d 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}else{& 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known}
      - name: Wait for and fetch clean candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ssh='C:\Program Files\Git\usr\bin\ssh.exe';$scp='C:\Program Files\Git\usr\bin\scp.exe';$key=Join-Path $HOME '.ssh/id_everleaf'
          $remote='/opt/everleaf/patches/downloads/EverLeaf-YunaUI-CleanCandidate.zip'
          $ready=$false
          for($i=0;$i -lt 90;$i++){
            & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "test -s '$remote'"
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            Start-Sleep -Seconds 10
          }
          if(-not $ready){throw 'clean candidate not ready'}
          $zip=Join-Path $env:RUNNER_TEMP 'clean.zip'
          & $scp -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remote" $zip
          if($LASTEXITCODE){throw 'fetch failed'}
          Get-FileHash $zip -Algorithm SHA256 | Format-List
          $root=Join-Path $env:RUNNER_TEMP 'CleanEverLeafYunaUI';Expand-Archive $zip -DestinationPath $root -Force
          foreach($f in @('EverLeaf.exe','dinput8.dll','config.ini','UI.wz','Item.wz','Mob.wz','Map.wz')){if(!(Test-Path (Join-Path $root $f))){throw "missing $f"}}
          foreach($bad in @('YunaMS.exe','yunams.dll','yunamsw.dll','settings.ini','version.data')){if(Test-Path (Join-Path $root $bad)){throw "donor runtime leaked into clean package: $bad"}}
      - name: Smoke exact clean package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'CleanEverLeafYunaUI';Set-Location $root
          Write-Host "EXE $((Get-FileHash 'EverLeaf.exe' -Algorithm SHA256).Hash)"
          Write-Host "UI $((Get-FileHash 'UI.wz' -Algorithm SHA256).Hash)"
          $before=Get-Date
          $p=Start-Process -FilePath (Join-Path $root 'EverLeaf.exe') -WorkingDirectory $root -PassThru
          Write-Host "STARTED pid=$($p.Id)"
          Start-Sleep -Seconds 30
          $p.Refresh()
          if($p.HasExited){throw "EARLY_EXIT code=$($p.ExitCode)"}
          Write-Host 'CLEAN_EVERLEAF_YUNA_UI_SURVIVED_30S'
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$before} -ErrorAction SilentlyContinue |
            Where-Object {$_.Message -match 'EverLeaf|dinput8|ZLZ'} |
            Select-Object TimeCreated,Id,LevelDisplayName,ProviderName,Message | Format-List
