name: Test Evan XML donor builder

on:
  push:
    branches: [client-dev]
    paths:
      - "client/tools/evan-xml-donor-builder/**"
      - "client/scripts/test-evan-xml-donor-builder.sh"
      - ".github/workflows/test-evan-xml-donor.yml"
  pull_request:
    paths:
      - "client/tools/evan-xml-donor-builder/**"
      - "client/scripts/test-evan-xml-donor-builder.sh"
      - ".github/workflows/test-evan-xml-donor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ git libssl-dev zlib1g-dev

      - name: Build and round-trip synthetic Evan donor WZs
        shell: bash
        run: |
          chmod +x client/scripts/test-evan-xml-donor-builder.sh
          client/scripts/test-evan-xml-donor-builder.sh
