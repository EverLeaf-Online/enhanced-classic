name: Audit quest gameplay completeness

on:
  pull_request:
    paths:
      - 'tools/audit_quest_gameplay_completeness.py'
      - 'wz/Quest.wz/**'
      - 'wz/Map.wz/Map/**'
      - 'wz/Mob.wz/**'
      - 'wz/Item.wz/**'
      - 'wz/Character.wz/**'
      - '.github/workflows/audit-quest-gameplay-completeness.yml'
  push:
    paths:
      - 'tools/audit_quest_gameplay_completeness.py'
      - 'wz/Quest.wz/**'
      - 'wz/Map.wz/Map/**'
      - 'wz/Mob.wz/**'
      - 'wz/Item.wz/**'
      - 'wz/Character.wz/**'
      - '.github/workflows/audit-quest-gameplay-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run quest gameplay completeness audit
        run: |
          mkdir -p build
          python3 tools/audit_quest_gameplay_completeness.py --json > build/quest-gameplay-completeness.json
      - name: Upload quest gameplay audit
        uses: actions/upload-artifact@v4
        with:
          name: quest-gameplay-completeness
          path: build/quest-gameplay-completeness.json
