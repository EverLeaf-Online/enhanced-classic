name: Extract GMS v95 WZ XML

on:
  workflow_call:
    inputs:
      known_hosts:
        description: Verified SSH known_hosts content from the Linux staging job
        required: true
        type: string

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  extract:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ inputs.known_hosts }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SSH_KNOWN_HOSTS) { throw 'Linux staging did not provide verified SSH host keys' }
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($keyPath, ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          $knownHosts = Join-Path $sshDir 'known_hosts'
          [IO.File]::WriteAllText($knownHosts, ($env:SSH_KNOWN_HOSTS -replace "`r", "") + "`n")

      - name: Fetch staged raw v95 WZ from Oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          ssh -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" `
            "set -e; cd /opt/everleaf/private/wz-donors; test -f gms-v95-raw/PROVENANCE.txt; test -f gms-v95-raw/SHA256SUMS; (cd gms-v95-raw && sha256sum -c SHA256SUMS); tar -czf /tmp/gms-v95-raw.tgz gms-v95-raw; sha256sum /tmp/gms-v95-raw.tgz"
          scp -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/tmp/gms-v95-raw.tgz" "$env:RUNNER_TEMP/gms-v95-raw.tgz"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/gms-v95" | Out-Null
          tar -xzf "$env:RUNNER_TEMP/gms-v95-raw.tgz" -C "$env:RUNNER_TEMP/gms-v95"

      - name: Build MapleLib exporter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/lastbattle/MapleLib.git "$env:RUNNER_TEMP/MapleLib"
          $toolDir = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter'
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item 'tools/wz-donor/exporter/Program.cs' (Join-Path $toolDir 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="..\MapleLib\MapleLib.csproj" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -Encoding utf8 (Join-Path $toolDir 'EverLeafWzExporter.csproj')
          dotnet build (Join-Path $toolDir 'EverLeafWzExporter.csproj') -c Release

      - name: Extract every staged v95 WZ independently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputDir = Join-Path $env:RUNNER_TEMP 'gms-v95/gms-v95-raw'
          $outputDir = Join-Path $env:RUNNER_TEMP 'gms-v95-extracted'
          $project = Join-Path $env:RUNNER_TEMP 'MapleLib/EverLeafWzExporter/EverLeafWzExporter.csproj'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          $families = @(
            'Character.wz', 'Etc.wz', 'Item.wz', 'Map.wz', 'Mob.wz',
            'Npc.wz', 'Quest.wz', 'Reactor.wz', 'Skill.wz', 'String.wz'
          )
          $results = @()

          foreach ($family in $families) {
            $familyOutput = Join-Path $outputDir $family
            if (Test-Path $familyOutput) { Remove-Item -Recurse -Force $familyOutput }
            Write-Host "===== Extracting $family ====="

            if ($family -eq 'Character.wz') {
              & dotnet run --project $project -c Release --no-build -- `
                $inputDir $outputDir --patch-version=95 --probe-patch-range=1:250 --try-zlz $family
            } else {
              & dotnet run --project $project -c Release --no-build -- `
                $inputDir $outputDir --patch-version=95 $family
            }
            $exitCode = $LASTEXITCODE

            $xmlCount = 0
            if (Test-Path $familyOutput) {
              $xmlCount = (Get-ChildItem -Path $familyOutput -Filter '*.xml' -Recurse -File | Measure-Object).Count
            }
            $success = ($exitCode -eq 0 -and $xmlCount -gt 0)
            if (-not $success -and (Test-Path $familyOutput)) {
              Remove-Item -Recurse -Force $familyOutput
              $xmlCount = 0
            }
            $results += [pscustomobject]@{
              family = $family
              success = $success
              exitCode = $exitCode
              xmlFiles = $xmlCount
            }
            Write-Host "$family success=$success xmlFiles=$xmlCount exitCode=$exitCode"
          }

          $totalXml = (Get-ChildItem -Path $outputDir -Filter '*.xml' -Recurse -File | Measure-Object).Count
          $successful = @($results | Where-Object success).Count
          $failed = @($results | Where-Object { -not $_.success }).Count
          $status = [ordered]@{
            schemaVersion = 1
            donor = 'GMS v95.4 SourceForge archive'
            extractionOnly = $true
            comparisonPerformed = $false
            totalFamiliesAttempted = $results.Count
            successfulFamilies = $successful
            failedFamilies = $failed
            totalXmlFiles = $totalXml
            families = $results
          }
          $statusPath = Join-Path $outputDir 'EXTRACTION_STATUS.json'
          $status | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 $statusPath
          Get-Content $statusPath

          if ($totalXml -eq 0) { throw 'No v95 XML was extracted' }

      - name: Package extracted v95 XML and store privately on Oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'gms-v95-extracted'
          $zip = Join-Path $env:RUNNER_TEMP 'gms-v95-extracted.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          $localHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Extracted archive SHA256: $localHash"

          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          scp -i $keyPath $zip "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:/opt/everleaf/private/wz-donors/gms-v95-extracted.zip.part"
          ssh -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" `
            "set -e; cd /opt/everleaf/private/wz-donors; unzip -t gms-v95-extracted.zip.part >/dev/null; mv gms-v95-extracted.zip.part gms-v95-extracted.zip; sha256sum gms-v95-extracted.zip; rm -f /tmp/gms-v95-raw.tgz"

      - name: Publish extraction summary
        shell: pwsh
        run: |
          $status = Get-Content (Join-Path $env:RUNNER_TEMP 'gms-v95-extracted/EXTRACTION_STATUS.json') -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_STEP_SUMMARY '## GMS v95 WZ extraction'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Comparison performed: **no**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Families attempted: **$($status.totalFamiliesAttempted)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Families extracted: **$($status.successfulFamilies)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Families failed: **$($status.failedFamilies)**"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Total XML files: **$($status.totalXmlFiles)**"
          foreach ($row in $status.families) {
            Add-Content $env:GITHUB_STEP_SUMMARY "- $($row.family): success=$($row.success), XML=$($row.xmlFiles)"
          }

      - name: Upload extraction status only
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-extraction-status-${{ github.sha }}
          path: ${{ runner.temp }}/gms-v95-extracted/EXTRACTION_STATUS.json
          retention-days: 14
          if-no-files-found: error
