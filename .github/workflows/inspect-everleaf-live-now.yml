name: Inspect EverLeaf live now

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/inspect-everleaf-live-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
          HOST: 132.145.141.79
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Missing-map login stack capture
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_everleaf ubuntu@132.145.141.79 'bash -s' <<'REMOTE'
          set +e
          echo '=== RELEASE ==='
          date -Is
          readlink -f /opt/everleaf/current
          cat /opt/everleaf/current/.everleaf-source-sha 2>/dev/null || true
          echo '=== MAP NPE STACKS ==='
          journalctl -u everleaf.service --since '2026-09-04 03:28:30 UTC' --until '2026-09-04 03:31:15 UTC' --no-pager | grep -B 12 -A 45 -F 'because "mapData" is null' || true
          echo '=== CHARACTER MAP IDS WITH NO LIVE WZ XML ==='
          tmp=$(mktemp)
          sudo mysql -N -B cosmic -e 'SELECT map, COUNT(*) FROM characters GROUP BY map ORDER BY map' > "$tmp" 2>/dev/null || true
          while read -r map count; do
            [ -n "$map" ] || continue
            padded=$(printf '%09d' "$map" 2>/dev/null || echo "$map")
            if ! find /opt/everleaf/current/wz/Map.wz -type f -name "${padded}.img.xml" -print -quit 2>/dev/null | grep -q .; then
              echo "MISSING map=${map} characters=${count} expected=${padded}.img.xml"
            fi
          done < "$tmp"
          rm -f "$tmp"
          echo '=== SERVICE / CHANNELS ==='
          systemctl is-active everleaf.service
          python3 /opt/everleaf/current/tools/verify_channel_runtime.py --config /opt/everleaf/current/config.yaml --host 127.0.0.1 2>&1 | tail -60 || true
          REMOTE
