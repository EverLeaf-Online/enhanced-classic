name: Inspect EverLeaf live now

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/inspect-everleaf-live-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
          HOST: 132.145.141.79
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Apply live web OOM mitigation and verify
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_everleaf ubuntu@132.145.141.79 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== BEFORE ==='
          date -Is
          systemctl is-active everleaf.service
          systemctl is-active everleaf-web.service || true
          systemctl show everleaf-web.service --property=NRestarts --property=MainPID --property=ActiveState --property=SubState --no-pager || true

          sudo install -d -m 755 /etc/systemd/system/everleaf-web.service.d
          cat <<'EOF' | sudo tee /etc/systemd/system/everleaf-web.service.d/oom-hotfix.conf >/dev/null
          [Service]
          Environment=NODE_OPTIONS=--max-old-space-size=4096
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart everleaf-web.service

          for i in 1 2 3 4 5; do
            sleep 3
            pid="$(systemctl show everleaf-web.service --property=MainPID --value)"
            echo "sample=$i pid=$pid state=$(systemctl is-active everleaf-web.service || true)"
            if [ -n "$pid" ] && [ "$pid" != 0 ]; then
              ps -o pid,rss,vsz,%mem,%cpu,etime,cmd -p "$pid" || true
            fi
            curl -fsS --max-time 8 http://127.0.0.1:3000/api/status
            echo
          done

          echo '=== PUBLIC HTTPS ==='
          curl -k -fsS --resolve everleafms.online:443:127.0.0.1 --max-time 10 https://everleafms.online/ >/dev/null
          curl -k -fsS --resolve everleafms.online:443:127.0.0.1 --max-time 10 https://everleafms.online/api/status
          echo

          echo '=== GAME RUNTIME ==='
          python3 /opt/everleaf/current/tools/verify_channel_runtime.py --config /opt/everleaf/current/config.yaml --host 127.0.0.1

          echo '=== RECENT WEB ERRORS ==='
          journalctl -u everleaf-web.service --since '3 minutes ago' --no-pager | tail -80 || true
          REMOTE
