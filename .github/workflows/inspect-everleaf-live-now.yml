name: Inspect EverLeaf live now

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/inspect-everleaf-live-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
          HOST: 132.145.141.79
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$HOST" > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Live runtime and web outage capture
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts -i ~/.ssh/id_everleaf ubuntu@132.145.141.79 'bash -s' <<'REMOTE'
          set +e
          echo '=== TIME / RELEASE ==='
          date -Is
          readlink -f /opt/everleaf/current
          cat /opt/everleaf/current/.everleaf-source-sha 2>/dev/null || true

          echo '=== GAME SERVICE / CHANNELS ==='
          systemctl is-active everleaf.service
          python3 /opt/everleaf/current/tools/verify_channel_runtime.py --config /opt/everleaf/current/config.yaml --host 127.0.0.1 2>&1 | tail -60 || true

          echo '=== WEB / NGINX / AVATAR SERVICES ==='
          for unit in everleaf-web.service nginx.service everleaf-wz-avatar.service mysql.service mariadb.service; do
            echo "--- $unit ---"
            systemctl is-active "$unit" 2>&1 || true
            systemctl show "$unit" --property=ActiveState --property=SubState --property=Result --property=MainPID --no-pager 2>&1 || true
          done

          echo '=== LISTENERS ==='
          sudo ss -ltnp | grep -E ':(80|443|3000|3011|3306|8484|7575|7576|7577|7578|7579|7580|7581|7582|7583|7584|7585|7586|7587|7588|7589|7590|7591|7592|7593|7594)\b' || true

          echo '=== LOCAL HTTP PROBES ==='
          for url in http://127.0.0.1:3000/ http://127.0.0.1:3000/api/status http://127.0.0.1:3000/v1/launcher/status http://127.0.0.1:3011/; do
            echo "--- $url ---"
            curl -sS -o /tmp/probe-body -D - --max-time 8 "$url" 2>&1 | head -30 || true
            head -c 800 /tmp/probe-body 2>/dev/null || true
            echo
          done

          echo '=== PUBLIC HTTPS PROBE FROM HOST ==='
          curl -k -sS -o /tmp/public-body -D - --max-time 8 https://127.0.0.1/ -H 'Host: everleafms.online' 2>&1 | head -30 || true
          head -c 800 /tmp/public-body 2>/dev/null || true
          echo

          echo '=== EVERLEAF-WEB JOURNAL ==='
          journalctl -u everleaf-web.service -n 120 --no-pager 2>&1 || true

          echo '=== NGINX ERROR LOG ==='
          sudo tail -120 /var/log/nginx/error.log 2>&1 || true

          echo '=== SYSTEMD UNIT ==='
          systemctl cat everleaf-web.service 2>&1 || true

          echo '=== NODE / WEB DIR ==='
          node --version 2>&1 || true
          npm --version 2>&1 || true
          ls -la /opt/everleaf/web | head -80 || true
          [ -f /opt/everleaf/web/package.json ] && cat /opt/everleaf/web/package.json | head -120 || true
          REMOTE
