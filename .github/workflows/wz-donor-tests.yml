name: WZ donor pipeline tests

on:
  pull_request:
    branches:
      - release-dev
    paths:
      - 'tools/wz-donor/**'
      - '.github/workflows/wz-donor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile donor tooling
        run: >-
          python -m py_compile
          tools/wz-donor/wz_diff.py
          tools/wz-donor/build_import_manifest.py
          tools/wz-donor/test_wz_diff.py
          tools/wz-donor/test_import_manifest.py

      - name: Run donor regression tests
        run: |
          python tools/wz-donor/test_wz_diff.py
          python tools/wz-donor/test_import_manifest.py
