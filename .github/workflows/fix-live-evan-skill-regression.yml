name: Fix live Evan Skill.wz regression

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/fix-live-evan-skill-regression.yml'
  workflow_dispatch:

concurrency:
  group: everleaf-live-content-fix
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVAN_CANDIDATE_SHA256: 04ef42e239a9bc7ac47ab75b3bac5ce028b68506772977444871d63ed9d70192

jobs:
  fix-evan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<'EOF'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ConnectTimeout 20
            ServerAliveInterval 20
            ServerAliveCountMax 15
          EOF

      - name: Verify existing merged candidate and current live state
        run: |
          set -euo pipefail
          cat > /tmp/precheck-evan-fix.sh <<'SH'
          set -euo pipefail
          PATCH=/opt/everleaf/patches
          FILES="$PATCH/files"
          CURRENT="$(readlink -f /opt/everleaf/current)"
          BACKUP="$(cat /opt/everleaf/backups/community-wholesale-test/LATEST)"
          OLD_SERVER="$BACKUP/server-wz-xml/Skill.wz"
          CAND=/home/ubuntu/everleaf-tools/evan-skill-merge/Skill.wz.new
          IMAGES='2001 2200 2210 2211 2212 2213 2214 2215 2216 2217 2218'
          test -s "$CAND"
          test "$(sha256sum "$CAND" | awk '{print $1}')" = '__CAND_SHA__'
          test -s "$FILES/Skill.wz"
          test -s "$PATCH/manifest.json"
          test -d "$CURRENT/wz/Skill.wz"
          systemctl is-active --quiet everleaf.service
          ss -ltn | grep -q ':8484 '
          for g in $IMAGES; do
            test -s "$OLD_SERVER/$g.img.xml"
            test ! -e "$CURRENT/wz/Skill.wz/$g.img.xml"
          done
          # Clean only stale scratch left by prior failed targeted attempts; never touch donor or rollback backup.
          sudo rm -f "$FILES/Skill.wz.evan-old"
          sudo rm -rf "$CURRENT/wz.evan-skill-new" "$CURRENT/wz.evan-old"
          echo "EVAN_FIX_PRECHECK_OK CANDIDATE_SHA256=__CAND_SHA__"
          SH
          sed -i "s/__CAND_SHA__/${EVAN_CANDIDATE_SHA256}/g" /tmp/precheck-evan-fix.sh
          scp /tmp/precheck-evan-fix.sh everleaf-oracle:/tmp/precheck-evan-fix.sh
          ssh everleaf-oracle 'bash /tmp/precheck-evan-fix.sh'

      - name: Deploy only the verified Evan delta
        run: |
          set -euo pipefail
          cat > /tmp/deploy-evan-fix.sh <<'SH'
          set -euo pipefail
          PATCH=/opt/everleaf/patches
          FILES="$PATCH/files"
          CURRENT="$(readlink -f /opt/everleaf/current)"
          SERVER_SKILL="$CURRENT/wz/Skill.wz"
          BACKUP="$(cat /opt/everleaf/backups/community-wholesale-test/LATEST)"
          OLD_SERVER="$BACKUP/server-wz-xml/Skill.wz"
          WORK=/home/ubuntu/everleaf-tools/evan-skill-merge
          CAND="$WORK/Skill.wz.new"
          CLIENT_ROLLBACK="$WORK/Skill.wz.pre-fix"
          MANIFEST_ROLLBACK="$WORK/manifest.pre-fix.json"
          GENERATED="$WORK/manifest.json"
          IMAGES='2001 2200 2210 2211 2212 2213 2214 2215 2216 2217 2218'

          test -s "$CAND"
          test "$(sha256sum "$CAND" | awk '{print $1}')" = '__CAND_SHA__'
          test -s "$FILES/Skill.wz"
          test -s "$PATCH/manifest.json"
          for g in $IMAGES; do test -s "$OLD_SERVER/$g.img.xml"; test ! -e "$SERVER_SKILL/$g.img.xml"; done

          # Targeted rollback state only: one Skill.wz and one manifest, stored outside managed patch payload.
          rm -f "$CLIENT_ROLLBACK" "$MANIFEST_ROLLBACK"
          cp -a "$FILES/Skill.wz" "$CLIENT_ROLLBACK"
          cp -a "$PATCH/manifest.json" "$MANIFEST_ROLLBACK"

          ROLLBACK=1
          rollback(){
            if [ "$ROLLBACK" = 1 ]; then
              echo EVAN_FIX_FAILED_ROLLING_BACK >&2
              if [ -s "$CLIENT_ROLLBACK" ]; then sudo install -m 644 "$CLIENT_ROLLBACK" "$FILES/Skill.wz"; fi
              for g in $IMAGES; do sudo rm -f "$SERVER_SKILL/$g.img.xml"; done
              if [ -s "$MANIFEST_ROLLBACK" ]; then sudo install -m 644 "$MANIFEST_ROLLBACK" "$PATCH/manifest.json"; fi
              sudo systemctl restart everleaf.service || true
            fi
          }
          trap rollback ERR

          # Add only the 11 missing server Skill XML groups; do not duplicate the 44k-file XML tree.
          for g in $IMAGES; do sudo install -m 644 "$OLD_SERVER/$g.img.xml" "$SERVER_SKILL/$g.img.xml"; done
          sudo install -m 644 "$CAND" "$FILES/Skill.wz"

          python3 - "$SERVER_SKILL" <<'PY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          expected={20010012,20011000,20011001,20011002,20011003,20011004,20011005,20011006,20011007,20011009,20011010,20011011,22000000,22001001,22101000,22101001,22111000,22111001,22121000,22121001,22131000,22131001,22140000,22141001,22141002,22141003,22150000,22151001,22151002,22151003,22160000,22161001,22161002,22161003,22170001,22171000,22171002,22171003,22171004,22181000,22181001,22181002,22181003}
          seen=set()
          for p in Path(sys.argv[1]).glob('*.xml'):
              r=ET.parse(p).getroot()
              for e in r.iter():
                  n=e.attrib.get('name','')
                  if n.isdigit() and int(n) in expected: seen.add(int(n))
          missing=sorted(expected-seen)
          if missing: raise SystemExit(f'live server XML missing Evan skills: {missing}')
          print(f'EVAN_LIVE_SERVER_XML_OK COUNT={len(seen)}')
          PY

          test "$(sha256sum "$FILES/Skill.wz" | awk '{print $1}')" = '__CAND_SHA__'

          # Rebuild the CURRENT Community manifest after the targeted Skill.wz replacement.
          LAUNCHER_PATCH_ROOT="$PATCH" \
          LAUNCHER_BASELINE_PATH="$PATCH/managed-client-baseline.json" \
          LAUNCHER_MANIFEST_PATH="$GENERATED" \
          LAUNCHER_PORTABLE_PATH="$PATCH/downloads/EverLeafLauncher-portable.zip" \
          LAUNCHER_VERSION_PATH="$PATCH/downloads/EverLeafLauncher-version.txt" \
          node /opt/everleaf/web/scripts/build-patch-manifest.js '__SHA__'
          sudo install -m 644 "$GENERATED" "$PATCH/manifest.json"
          test -s "$PATCH/manifest.json"
          cmp -s "$GENERATED" "$PATCH/manifest.json"

          sudo systemctl restart everleaf.service
          for i in $(seq 1 45); do
            if systemctl is-active --quiet everleaf.service && ss -ltn | grep -q ':8484 '; then break; fi
            sleep 2
          done
          systemctl is-active --quiet everleaf.service
          ss -ltn | grep -q ':8484 '

          # Final exact live verification before disabling rollback.
          for g in $IMAGES; do test -s "$SERVER_SKILL/$g.img.xml"; done
          test "$(sha256sum "$FILES/Skill.wz" | awk '{print $1}')" = '__CAND_SHA__'
          test ! -e "$FILES/Skill.wz.evan-old"

          ROLLBACK=0
          trap - ERR
          rm -f "$CLIENT_ROLLBACK" "$MANIFEST_ROLLBACK"
          echo 'EVAN_SKILL_REGRESSION_FIXED_LIVE COUNT=43'
          SH
          sed -i "s/__CAND_SHA__/${EVAN_CANDIDATE_SHA256}/g; s/__SHA__/${GITHUB_SHA}/g" /tmp/deploy-evan-fix.sh
          scp /tmp/deploy-evan-fix.sh everleaf-oracle:/tmp/deploy-evan-fix.sh
          ssh everleaf-oracle 'bash /tmp/deploy-evan-fix.sh'

      - name: Final live verification
        run: |
          set -euo pipefail
          cat > /tmp/verify-evan-fix.sh <<'SH'
          set -euo pipefail
          CURRENT="$(readlink -f /opt/everleaf/current)"
          systemctl is-active --quiet everleaf.service
          ss -ltn | grep -q ':8484 '
          test -s /opt/everleaf/patches/manifest.json
          test "$(sha256sum /opt/everleaf/patches/files/Skill.wz | awk '{print $1}')" = '__CAND_SHA__'
          for g in 2001 2200 2210 2211 2212 2213 2214 2215 2216 2217 2218; do test -s "$CURRENT/wz/Skill.wz/$g.img.xml"; done
          test ! -e /opt/everleaf/patches/files/Skill.wz.evan-old
          test ! -e /home/ubuntu/everleaf-tools/evan-skill-merge/Skill.wz.pre-fix
          test ! -e /home/ubuntu/everleaf-tools/evan-skill-merge/manifest.pre-fix.json
          echo 'EVAN_FIX_FINAL_VERIFICATION_OK CLIENT_MERGE=11 SERVER_SKILLS=43 SERVICE=active PORT=8484'
          SH
          sed -i "s/__CAND_SHA__/${EVAN_CANDIDATE_SHA256}/g" /tmp/verify-evan-fix.sh
          scp /tmp/verify-evan-fix.sh everleaf-oracle:/tmp/verify-evan-fix.sh
          ssh everleaf-oracle 'bash /tmp/verify-evan-fix.sh'
