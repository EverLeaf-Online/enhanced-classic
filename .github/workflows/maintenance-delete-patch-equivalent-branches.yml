name: Maintenance delete patch-equivalent branches

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/maintenance-delete-patch-equivalent-branches.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Delete only branches whose unique commits are patch-equivalent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          canonical = ['master', 'release-dev', 'client-dev', 'content-dev']
          protected = {'master', 'release-dev', 'client-dev', 'content-dev', 'Community-files', 'empress-dev'}

          def sh(*args, check=True):
              p = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode:
                  raise RuntimeError(f"command failed: {' '.join(args)}\n{p.stderr}")
              return p

          branches=[]
          for line in sh('git','for-each-ref','--format=%(refname:short)','refs/remotes/origin').stdout.splitlines():
              if line.startswith('origin/') and line != 'origin/HEAD':
                  branches.append(line[len('origin/'):])

          canonical_refs=[f'origin/{b}' for b in canonical]
          deleted=[]
          preserved=[]
          for branch in sorted(set(branches)):
              if branch in protected or branch.startswith('wz/'):
                  continue
              revs=sh('git','rev-list',f'origin/{branch}','--not',*canonical_refs).stdout.splitlines()
              if not revs:
                  # Fully-contained branches are handled by the separate ancestry tier.
                  continue
              wanted=set(revs)
              equivalent=set()
              for target in canonical:
                  out=sh('git','cherry',f'origin/{target}',f'origin/{branch}',check=False).stdout
                  for line in out.splitlines():
                      parts=line.split()
                      if len(parts)==2 and parts[0]=='-' and parts[1] in wanted:
                          equivalent.add(parts[1])
              if equivalent == wanted:
                  print(f'DELETE {branch} ({len(revs)} unique SHA(s), all patch-equivalent)')
                  sh('git','push','origin','--delete',branch)
                  deleted.append(branch)
              else:
                  preserved.append(branch)
          print(f'Deleted patch-equivalent branches: {len(deleted)}')
          print(f'Preserved branches with at least one non-equivalent commit: {len(preserved)}')
          PY
