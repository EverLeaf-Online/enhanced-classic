name: Client v2 diagnostics guard

on:
  pull_request:
    branches: [release-dev, master]
    paths:
      - "client/ezorsia/ezorsia/CrashDiagnostics.*"
      - "client/ezorsia/ezorsia/dllmain.cpp"
      - "client/ezorsia/ezorsia/ezorsia.vcxproj"
      - "docs/client-v2/DIAGNOSTICS.md"
      - ".github/workflows/client-v2-diagnostics-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify diagnostics privacy and crash/freeze-handler invariants
        shell: pwsh
        run: |
          $diag = Get-Content "client/ezorsia/ezorsia/CrashDiagnostics.cpp" -Raw
          $header = Get-Content "client/ezorsia/ezorsia/CrashDiagnostics.h" -Raw
          $bootstrap = Get-Content "client/ezorsia/ezorsia/dllmain.cpp" -Raw
          $project = Get-Content "client/ezorsia/ezorsia/ezorsia.vcxproj" -Raw

          foreach ($required in @(
            'EverLeafClient.log',
            'EverLeafCrash.dmp',
            'EverLeafFreeze.txt',
            'ResolveDiagnosticsPaths',
            'GetSystemDirectoryW',
            'LoadLibraryW(systemDirectory)',
            'GetProcAddress(gDbgHelpModule, "MiniDumpWriteDump")',
            'MiniDumpNormal | MiniDumpWithThreadInfo',
            'CREATE_ALWAYS',
            'SetUnhandledExceptionFilter(EverLeafUnhandledExceptionFilter)',
            'gPreviousExceptionFilter(exceptionInfo)',
            'EXCEPTION_CONTINUE_SEARCH',
            'FindEverLeafGameWindow()',
            'SendMessageTimeoutW(',
            'SMTO_ABORTIFHUNG | SMTO_BLOCK',
            'kFreezeTimeoutThreshold = 3',
            'StartFreezeWatchdog()',
            'No account, character, chat, or telemetry data is intentionally recorded or uploaded.',
            'it is never transmitted automatically.'
          )) {
            if (-not $diag.Contains($required)) { throw "Missing diagnostics invariant: $required" }
          }

          foreach ($forbidden in @(
            'HttpSendRequest', 'WinHttpSendRequest', 'InternetOpenUrl', 'URLDownloadToFile',
            'socket(', 'send(', 'WSASend(', 'password=', 'pic=', 'launcherTicket=',
            'MiniDumpWithFullMemory', 'MiniDumpWithFullMemoryInfo',
            'CreateToolhelp32Snapshot', 'Process32First', 'Process32Next', 'EnumProcesses', 'OpenProcess('
          )) {
            if ($diag.Contains($forbidden)) { throw "Diagnostics unexpectedly contains network/sensitive/full-memory/process-scan marker: $forbidden" }
          }

          # The audited copycat folder contains a local x64 dbghelp.dll next to an x86
          # game. EverLeaf must never resolve dbghelp through the game directory/search path.
          if ($diag.Contains('LoadLibraryW(L"dbghelp.dll")') -or $diag.Contains('LoadLibraryA("dbghelp.dll")')) {
            throw "Diagnostics can load a game-directory/search-path dbghelp.dll"
          }

          foreach ($required in @('CrashDiagnostics::Install()', 'CrashDiagnostics::SetPhase(')) {
            if (-not $bootstrap.Contains($required)) { throw "Bootstrap does not use diagnostics: $required" }
          }

          if (-not $project.Contains('<ClCompile Include="CrashDiagnostics.cpp" />')) {
            throw "CrashDiagnostics.cpp is not compiled into the client DLL"
          }
          if (-not $project.Contains('<ClInclude Include="CrashDiagnostics.h" />')) {
            throw "CrashDiagnostics.h is not part of the client project"
          }
          if (-not $header.Contains('void Install();')) {
            throw "Diagnostics interface is incomplete"
          }
