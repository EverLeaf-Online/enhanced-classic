name: Diagnose client delete PIC gate

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/diagnose-client-delete-pic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
      - name: Configure SSH
        env:
          KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H 132.145.141.79 > ~/.ssh/known_hosts; fi
          chmod 600 ~/.ssh/known_hosts
      - name: Fetch current production executable read-only
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_everleaf ubuntu@132.145.141.79:/opt/everleaf/patches/files/EverLeaf.exe ./EverLeaf.exe
          sha256sum EverLeaf.exe
      - name: Install analysis libraries
        run: python3 -m pip install --disable-pip-version-check pefile capstone
      - name: Trace v83 delete-character function callers
        run: |
          python3 - <<'PY'
          import pefile, struct
          from capstone import Cs, CS_ARCH_X86, CS_MODE_32
          path='EverLeaf.exe'
          pe=pefile.PE(path)
          image_base=pe.OPTIONAL_HEADER.ImageBase
          target=0x005F7C4A
          print(f'IMAGE_BASE=0x{image_base:08X} TARGET=0x{target:08X}')
          sections=[]
          for s in pe.sections:
              name=s.Name.rstrip(b'\0').decode('latin1','replace')
              va=image_base+s.VirtualAddress
              size=max(s.Misc_VirtualSize,s.SizeOfRawData)
              end=va+size
              sections.append((s,name,va,end,size))
              print(f'SECTION name={name!r} va=0x{va:08X} end=0x{end:08X} raw=0x{s.SizeOfRawData:X} virt=0x{s.Misc_VirtualSize:X} chars=0x{s.Characteristics:08X}')
          target_sections=[x for x in sections if x[2] <= target < x[3]]
          if not target_sections:
              raise SystemExit('target VA is not backed by any PE section; executable may unpack code only at runtime')
          sec,name,va,end,size=target_sections[0]
          raw=sec.get_data()
          print(f'TARGET_SECTION={name!r} VA=0x{va:08X} RAW_LEN=0x{len(raw):X}')
          target_off=target-va
          if target_off >= len(raw):
              raise SystemExit(f'target is in virtual tail without file-backed bytes: off=0x{target_off:X} raw=0x{len(raw):X}')
          calls=[]
          # Search every file-backed executable section for direct relative CALLs to the known v83 send function.
          for s,name_s,va_s,end_s,size_s in sections:
              if not (s.Characteristics & 0x20000000):
                  continue
              blob=s.get_data()
              for i,b in enumerate(blob[:-5]):
                  if b!=0xE8: continue
                  rel=struct.unpack_from('<i',blob,i+1)[0]
                  src=va_s+i
                  dst=src+5+rel
                  if dst==target:
                      calls.append((src,name_s,blob,va_s))
          print('DIRECT_CALLERS', [f'0x{x[0]:08X}@{x[1]}' for x in calls])
          md=Cs(CS_ARCH_X86, CS_MODE_32)
          md.detail=False
          for src,name_s,blob,va_s in calls:
              start=max(va_s,src-224); finish=min(va_s+len(blob),src+128)
              off=start-va_s
              chunk=blob[off:off+(finish-start)]
              print(f'--- context around caller 0x{src:08X} section={name_s} ---')
              for ins in md.disasm(chunk,start):
                  mark='>>' if ins.address==src else '  '
                  print(f'{mark} {ins.address:08X}: {ins.mnemonic:8} {ins.op_str}')
          start=target
          finish=min(va+len(raw),target+0x280)
          off=start-va
          print('--- SendDeleteCharPacket ---')
          for ins in md.disasm(raw[off:off+(finish-start)],start):
              print(f'{ins.address:08X}: {ins.mnemonic:8} {ins.op_str}')
          PY
