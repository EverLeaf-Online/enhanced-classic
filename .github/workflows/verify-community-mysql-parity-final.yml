name: Verify final Community MySQL parity

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/verify-community-mysql-parity-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh parity-output
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H 132.145.141.79 > ~/.ssh/known_hosts; fi
          cat > ~/.ssh/config <<'EOF'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ConnectTimeout 20
          EOF

      - name: Record exact rollback for removed placeholder rows
        run: |
          cat > parity-output/rollback-zero-chance.sql <<'SQL'
          -- Exact rows recorded by the pre-cleanup anomaly audit before removal.
          INSERT INTO cosmic.drop_data (id,dropperid,itemid,minimum_quantity,maximum_quantity,questid,chance) VALUES
          (2021,3210200,2050099,1,1,0,0),
          (2055,3210201,2050099,1,1,0,0),
          (7438,6130100,2050099,1,1,0,0),
          (19014,9420511,2050099,1,1,0,0),
          (20480,9500125,2050099,1,1,0,0);
          SQL

      - name: Final live parity classification
        run: |
          set -euo pipefail
          cat > /tmp/final-community-parity-audit.py <<'PY'
          from pathlib import Path
          import json,re,subprocess,xml.etree.ElementTree as ET
          root=Path(subprocess.check_output(['readlink','-f','/opt/everleaf/current'],text=True).strip()); wz=root/'wz'
          backup=Path(Path('/opt/everleaf/backups/community-wholesale-test/LATEST').read_text().strip())/'server-wz-xml'
          def q(sql): return [x for x in subprocess.check_output(['sudo','mysql','-NBe',sql],text=True).splitlines() if x.strip()]
          def ids(base,fam):
              out=set()
              for p in (base/fam).rglob('*.xml'):
                  m=re.match(r'^(\d{4,10})(?:\.img)?\.xml$',p.name)
                  if m: out.add(int(m.group(1)))
              return out
          new_mobs=ids(wz,'Mob.wz')-ids(backup,'Mob.wz'); new_npcs=ids(wz,'Npc.wz')-ids(backup,'Npc.wz'); new_reactors=ids(wz,'Reactor.wz')-ids(backup,'Reactor.wz')
          pm=set(); pn=set(); pr=set(); maps_n={}; maps_r={}
          for p in (wz/'Map.wz').rglob('*.xml'):
              fm=re.match(r'^(\d{9})(?:\.img)?\.xml$',p.name); mid=int(fm.group(1)) if fm else None
              try: x=ET.parse(p).getroot()
              except Exception: continue
              for e in x.iter():
                  if e.attrib.get('name')!='id': continue
                  v=e.attrib.get('value','')
                  if not v.isdigit(): continue
                  z=int(v)
                  if z in new_mobs: pm.add(z)
                  if z in new_npcs:
                      pn.add(z)
                      if mid: maps_n.setdefault(z,set()).add(mid)
                  if z in new_reactors:
                      pr.add(z)
                      if mid: maps_r.setdefault(z,set()).add(mid)
          droppers=set(map(int,q('SELECT DISTINCT dropperid FROM cosmic.drop_data'))); shops=set(map(int,q('SELECT DISTINCT npcid FROM cosmic.shops'))); reactors=set(map(int,q('SELECT DISTINCT reactorid FROM cosmic.reactordrops')))
          shop_dups=q('SELECT CONCAT(si.shopid,"|",s.npcid,"|",si.itemid,"|",COUNT(*),"|",GROUP_CONCAT(si.position ORDER BY si.position),"|",GROUP_CONCAT(si.price ORDER BY si.position),"|",GROUP_CONCAT(si.pitch ORDER BY si.position)) FROM cosmic.shopitems si JOIN cosmic.shops s ON s.shopid=si.shopid GROUP BY si.shopid,s.npcid,si.itemid HAVING COUNT(*)>1 ORDER BY si.shopid,si.itemid')
          reactor_dups=q('SELECT CONCAT(reactorid,"|",itemid,"|",questid,"|",COUNT(*),"|",GROUP_CONCAT(chance ORDER BY chance)) FROM cosmic.reactordrops GROUP BY reactorid,itemid,questid HAVING COUNT(*)>1 ORDER BY reactorid,itemid,questid')
          exact_shop=[]; positioned_shop=[]
          for r in shop_dups:
              ps=r.split('|')[4].split(',')
              (exact_shop if len(set(ps))<len(ps) else positioned_shop).append(r)
          names={}; np=wz/'String.wz'/'Npc.img.xml'
          try:
              x=ET.parse(np).getroot()
              for n in x.iter():
                  k=n.attrib.get('name','')
                  if k.isdigit() and int(k) in pn:
                      for c in n:
                          if c.attrib.get('name')=='name': names[int(k)]=c.attrib.get('value','')
          except Exception: pass
          words=('shop','merchant','seller','weapon','armor','potion','general store','grocer','dealer','vendor')
          merchants=[{'npc':nid,'name':name,'maps':sorted(maps_n.get(nid,set())),'has_shop':nid in shops} for nid,name in sorted(names.items()) if any(w in name.lower() for w in words)]
          rc=[]
          for rid in sorted(pr):
              rp=next(iter((wz/'Reactor.wz').rglob(f'{rid}*.xml')),None); sig=[]
              if rp:
                  try:
                      x=ET.parse(rp).getroot()
                      for e in x.iter():
                          n=e.attrib.get('name'); v=e.attrib.get('value')
                          if n in ('type','event','action','link','reactorTime','hitCount','quest','item') and v is not None: sig.append([n,v])
                  except Exception: pass
              rc.append({'reactor':rid,'maps':sorted(maps_r.get(rid,set())),'has_reactordrops':rid in reactors,'xml_signals':sig[:40]})
          report={'placed_new_mobs':len(pm),'placed_new_mobs_without_any_drop_data':len(pm-droppers),'nonpositive_drop_rows':len(q('SELECT id FROM cosmic.drop_data WHERE chance<=0')),'placed_new_npcs':len(pn),'placed_new_npcs_with_shop_rows':len(pn&shops),'merchant_name_candidates':merchants,'duplicate_shop_groups':len(shop_dups),'duplicate_shop_groups_exact_same_position':exact_shop,'duplicate_shop_groups_different_positions':positioned_shop,'duplicate_reactor_groups':len(reactor_dups),'duplicate_reactor_details':reactor_dups,'new_placed_reactor_context':rc,'new_placed_reactors_without_reactordrops':sorted(pr-reactors),'classification':{'shops':'No new NPC shop is created without a trustworthy inventory source. Shop 1337/NPC 11000 is GM/fallback data; different-position repeats are preserved as layout/category data.','reactor_duplicates':'Existing repeated reactor entries are preserved because duplicate rows can intentionally weight rewards.','new_reactors':'No reactordrops are fabricated without explicit source-backed reward evidence.','mobs':'Every placed new mob has drop_data; source-backed item rows were added only where live item/quest validation passed.'}}
          print(json.dumps(report,indent=2))
          if report['placed_new_mobs_without_any_drop_data'] or report['nonpositive_drop_rows']: raise SystemExit('final parity invariant failed')
          PY
          scp /tmp/final-community-parity-audit.py everleaf-oracle:/tmp/final-community-parity-audit.py
          ssh everleaf-oracle 'python3 /tmp/final-community-parity-audit.py' | tee parity-output/final-parity.json

      - name: Verify service and table counts
        run: |
          ssh everleaf-oracle 'bash -s' <<'EOF' | tee parity-output/verification.txt
          set -euo pipefail
          sudo mysql -NBe "SELECT 'drop_data',COUNT(*) FROM cosmic.drop_data UNION ALL SELECT 'drop_data_global',COUNT(*) FROM cosmic.drop_data_global UNION ALL SELECT 'reactordrops',COUNT(*) FROM cosmic.reactordrops UNION ALL SELECT 'shops',COUNT(*) FROM cosmic.shops UNION ALL SELECT 'shopitems',COUNT(*) FROM cosmic.shopitems;"
          systemctl is-active everleaf.service
          ss -ltn | grep ':8484 '
          echo COMMUNITY_MYSQL_PARITY_FINAL_OK
          EOF

      - name: Upload final parity report
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-community-mysql-final-${{ github.run_id }}
          path: parity-output/
          retention-days: 90
