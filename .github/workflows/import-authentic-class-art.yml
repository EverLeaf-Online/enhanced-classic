name: Import authentic class art

on:
  push:
    branches: [web/authentic-class-art]
    paths:
      - '.github/workflows/import-authentic-class-art.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: web/authentic-class-art
      - name: Download classic MapleStory instructor sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/assets/jobs/instructors
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' 'https://cdn.wikimg.net/en/strategywiki/images/4/44/MS_NPC_Dances_with_Balrog.png' -o web/public/assets/jobs/instructors/warrior.png
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' 'https://cdn.wikimg.net/en/strategywiki/images/c/c2/MS_NPC_Grendel_the_Really_Old.png' -o web/public/assets/jobs/instructors/magician.png
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' 'https://cdn.wikimg.net/en/strategywiki/images/9/9a/MS_NPC_Athena_Pierce.png' -o web/public/assets/jobs/instructors/bowman.png
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' 'https://cdn.wikimg.net/en/strategywiki/images/7/70/MS_NPC_Dark_Lord.png' -o web/public/assets/jobs/instructors/thief.png
          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' 'https://www.spriters-resource.com/media/assets/21/23509.png?updated=1755472551' -o web/public/assets/jobs/instructors/pirate.png
          file web/public/assets/jobs/instructors/*.png
          test "$(find web/public/assets/jobs/instructors -type f -name '*.png' -size +500c | wc -l)" -eq 5
      - name: Commit imported sprites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/assets/jobs/instructors
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'assets(web): import classic class instructor sprites'
          git push origin HEAD:web/authentic-class-art
