name: Trigger canonical v95 server rebuild once

on:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/trigger-canonical-v95-server-rebuild-once.yml'

permissions:
  contents: write

jobs:
  patch-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release-dev
          fetch-depth: 0
      - name: Make Windows-to-bash promotion shell-safe and remove this trigger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/rebuild-server-wz-from-live-v95-client.yml')
          s=p.read_text()
          old='$remote | & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "bash -s -- \'$remoteArchive\' \'$env:GITHUB_RUN_ID\'"'
          new='($remote -replace "`r","") | & $ssh -i $key "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "bash -s -- \'$remoteArchive\' \'$env:GITHUB_RUN_ID\'"'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one promotion transport line, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          rm -f .github/workflows/trigger-canonical-v95-server-rebuild-once.yml
          git config user.name 'everleaf-automation'
          git config user.email 'actions@everleafms.online'
          git add .github/workflows/rebuild-server-wz-from-live-v95-client.yml .github/workflows/trigger-canonical-v95-server-rebuild-once.yml
          git commit -m 'ops: make canonical v95 server promotion shell-safe'
          git push origin HEAD:release-dev
