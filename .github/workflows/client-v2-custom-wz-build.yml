name: Build EverLeaf custom WZ

on:
  pull_request:
    branches: [master]
    paths:
      - "client/custom-wz/**"
      - "client/tools/everleaf-custom-wz/**"
      - "client/scripts/build-everleaf-custom-wz.ps1"
      - ".github/workflows/client-v2-custom-wz-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-custom-wz:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verify clean source boundary
        shell: pwsh
        run: |
          $manifest = Get-Content 'client/custom-wz/manifest.tsv' -Raw
          foreach ($forbidden in @('MapleEzorsia','Ezorsia','Community.wz','EverLeaf_UI.wz')) {
            if ($manifest.Contains($forbidden)) { throw "Forbidden donor/legacy reference in custom WZ manifest: $forbidden" }
          }
          $rows = Get-Content 'client/custom-wz/manifest.tsv' | Where-Object { $_ -and -not $_.StartsWith('#') }
          if ($rows.Count -lt 1) { throw 'EverLeaf custom WZ manifest is empty' }
          foreach ($row in $rows) {
            $fields = $row -split "`t", 4
            if ($fields.Count -ne 4) { throw "Invalid custom WZ manifest row: $row" }
            if ($fields[0] -notmatch '\.img$') { throw "Invalid custom WZ image path: $($fields[0])" }
            if ($fields[2] -notin @('string','int','canvas','vector')) { throw "Unsupported custom WZ property type: $($fields[2])" }
          }

      - name: Build and self-verify v83 WZ
        shell: pwsh
        run: |
          ./client/scripts/build-everleaf-custom-wz.ps1 `
            -RepositoryRoot $PWD `
            -OutputPath "$PWD/client/generated/EverLeaf_Custom.wz" `
            -WorkRoot "$env:RUNNER_TEMP/everleaf-custom-wz"

      - name: Smoke test directory canvas and vector support
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'everleaf-custom-wz-canvas-smoke'
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $pngPath = Join-Path $smokeRoot 'smoke.png'
          $pngBase64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScLQkwAAAABJRU5ErkJggg=='
          [System.IO.File]::WriteAllBytes($pngPath, [Convert]::FromBase64String($pngBase64))

          $manifestPath = Join-Path $smokeRoot 'manifest.tsv'
          @(
            "Smoke/Test.img`tui/canvas`tcanvas`tsmoke.png",
            "Smoke/Test.img`tui/canvas/origin`tvector`t12,-34",
            "Smoke/Test.img`tui/label`tstring`tEverLeaf"
          ) | Set-Content $manifestPath -Encoding utf8

          $builder = Join-Path $env:RUNNER_TEMP 'everleaf-custom-wz/build/Release/everleaf-custom-wz-builder.exe'
          if (-not (Test-Path $builder -PathType Leaf)) { throw "Custom WZ builder missing: $builder" }
          $smokeWz = Join-Path $smokeRoot 'CanvasSmoke.wz'
          & $builder $manifestPath $smokeWz
          if ($LASTEXITCODE -ne 0) { throw 'Directory/canvas/vector WZ smoke test failed' }
          $bytes = [System.IO.File]::ReadAllBytes($smokeWz)
          if ($bytes.Length -lt 32 -or [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'PKG1') {
            throw 'Canvas smoke WZ is not a valid PKG1 output'
          }
          Get-FileHash $smokeWz -Algorithm SHA256

      - name: Verify output identity
        shell: pwsh
        run: |
          $path = 'client/generated/EverLeaf_Custom.wz'
          if (-not (Test-Path $path -PathType Leaf)) { throw 'EverLeaf_Custom.wz is missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -lt 32) { throw 'EverLeaf_Custom.wz is implausibly small' }
          $signature = [System.Text.Encoding]::ASCII.GetString($bytes, 0, 4)
          if ($signature -ne 'PKG1') { throw "Unexpected WZ signature: $signature" }
          Get-Item $path | Select-Object Name, Length
          Get-FileHash $path -Algorithm SHA256

      - name: Upload clean custom WZ candidate
        uses: actions/upload-artifact@v4
        with:
          name: everleaf-custom-wz-${{ github.sha }}
          path: client/generated/EverLeaf_Custom.wz
          if-no-files-found: error
          retention-days: 7
