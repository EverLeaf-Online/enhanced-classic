name: Apply shop hardening once

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/apply-shop-hardening-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply hardening
        run: python3 tools/apply_shop_listing_source_integrity.py
      - name: Audit hardening
        run: python3 tools/audit_shop_listing_source_integrity.py
      - name: Compile
        run: bash ./mvnw -q -DskipTests package
      - name: Commit validated source changes
        run: |
          git config user.name 'EverLeaf Maintenance Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b automation/shop-hardening-once
          git add src/main/java/net/server/channel/handlers/PlayerInteractionHandler.java \
                  src/main/java/server/maps/PlayerShop.java \
                  src/main/java/server/maps/HiredMerchant.java
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Harden player shop listing source integrity'
          git push --force-with-lease origin automation/shop-hardening-once
