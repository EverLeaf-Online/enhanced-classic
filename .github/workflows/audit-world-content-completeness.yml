name: Audit world content completeness

on:
  pull_request:
    paths:
      - 'tools/audit_world_content_completeness.py'
      - 'wz/Map.wz/Map/**'
      - 'wz/Npc.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Reactor.wz/**'
      - 'scripts/reactor/**'
      - '.github/workflows/audit-world-content-completeness.yml'
  push:
    branches: [release-dev]
    paths:
      - 'tools/audit_world_content_completeness.py'
      - 'wz/Map.wz/Map/**'
      - 'wz/Npc.wz/**'
      - 'wz/Mob.wz/**'
      - 'wz/Reactor.wz/**'
      - 'scripts/reactor/**'
      - '.github/workflows/audit-world-content-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run world content completeness audit
        run: |
          mkdir -p build
          python3 tools/audit_world_content_completeness.py --json > build/world-content-completeness.json
      - name: Upload world content audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-content-completeness
          path: build/world-content-completeness.json
          if-no-files-found: warn
