name: Diagnose final quest scripts

on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths:
      - '.github/workflows/diagnose-final-quest-scripts.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dump final scripted quest records
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          QIDS={'1028','20015','2233','2234'}
          for filename in ['Check.img.xml','Act.img.xml']:
              path=Path('wz/Quest.wz')/filename
              root=ET.parse(path).getroot()
              print('===', filename, '===')
              for q in root:
                  if q.attrib.get('name') in QIDS:
                      print(ET.tostring(q, encoding='unicode'))
          print('=== NPC placements ===')
          wanted=set()
          root=ET.parse('wz/Quest.wz/Check.img.xml').getroot()
          for q in root:
              if q.attrib.get('name') not in QIDS: continue
              for phase in q:
                  for child in phase:
                      if child.attrib.get('name')=='npc':
                          wanted.add(child.attrib.get('value'))
          print('wanted npcs', sorted(wanted))
          for mapfile in Path('wz/Map.wz/Map').glob('Map*/*.img.xml'):
              try: r=ET.parse(mapfile).getroot()
              except: continue
              for node in r.iter('imgdir'):
                  vals={c.attrib.get('name'):c.attrib.get('value') for c in node if c.tag in ('int','string')}
                  if vals.get('type')=='n' and vals.get('id') in wanted:
                      print(vals.get('id'), mapfile.as_posix())
          PY
