name: Validate Account Milestones

on:
  push:
    branches: [feature/account-milestone-rings-20260911]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Apply canonical EverLeaf configuration
        run: python3 tools/apply_everleaf_config.py

      - name: Build and test server
        run: mvn -B clean test package --file pom.xml
