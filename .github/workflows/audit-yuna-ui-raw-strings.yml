name: Audit Yuna UI raw strings
on:
  workflow_dispatch:
  push:
    branches: [release-dev]
    paths: ['.github/workflows/audit-yuna-ui-raw-strings.yml']
permissions:
  contents: read
env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with: {ref: release-dev}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail; install -d -m 700 ~/.ssh; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf; chmod 600 ~/.ssh/id_everleaf
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts; fi
      - name: Inspect raw UI strings
        run: |
          ssh -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          d=/home/ubuntu/everleaf-staging/yuna-client-current/extracted/YunaMS
          for f in UI.wz Base.wz Map.wz; do
            echo "=== $f raw interesting strings ==="
            strings -a -n 4 "$d/$f" 2>/dev/null | grep -Eai 'Login|MapLogin|WorldSelect|ViewAllChar|frame800|frame1200|frame1600|frameBLANK|Modified_UI|StatusBar|CashShop|YunaMS|logo|Title' | head -1000 || true
          done
          echo 'YUNA_UI_RAW_STRING_AUDIT_OK'
          REMOTE
