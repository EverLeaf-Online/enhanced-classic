name: Recover EverLeaf live client executable

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-everleaf-app-icon-live.yml'
  workflow_dispatch:

concurrency:
  group: everleaf-client-exe-recovery
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  recover-client-exe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference='Stop'
          $sshDir=Join-Path $HOME '.ssh'; New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          [IO.File]::WriteAllText((Join-Path $sshDir 'id_everleaf'),($env:SSH_PRIVATE_KEY -replace "`r","")+"`n")
          $known=Join-Path $sshDir 'known_hosts'
          if($env:SSH_KNOWN_HOSTS){[IO.File]::WriteAllText($known,($env:SSH_KNOWN_HOSTS -replace "`r","")+"`n")}
          else { & 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe' -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $known }
          @'
          Host everleaf-oracle
            HostName 132.145.141.79
            User ubuntu
            IdentityFile ~/.ssh/id_everleaf
            ServerAliveInterval 20
            ServerAliveCountMax 15
            TCPKeepAlive yes
            ConnectTimeout 20
          '@ | Set-Content -Encoding ascii (Join-Path $sshDir 'config')
          ssh everleaf-oracle 'set -e; test -s /opt/everleaf/patches/files/EverLeaf.exe; test -s /opt/everleaf/patches/manifest.json; sudo test -d /opt/everleaf/backups/client-icon; echo EVERLEAF_CLIENT_RECOVERY_SSH_OK'
          if($LASTEXITCODE){throw 'Oracle/client recovery preflight failed'}

      - name: Stage earliest pre-icon executable backup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote="/tmp/everleaf-client-recovery-${{ github.run_id }}"
          $script=@'
          set -euo pipefail
          BACKUP_ROOT=/opt/everleaf/backups/client-icon
          STAGE=__REMOTE__
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          CANDIDATE="$(sudo find "$BACKUP_ROOT" -maxdepth 1 -type f -name '*-EverLeaf.exe' -printf '%T@ %p\n' | sort -n | head -n 1 | cut -d' ' -f2-)"
          test -n "$CANDIDATE"
          sudo test -s "$CANDIDATE"
          RESTORE_SHA="$(sudo sha256sum "$CANDIDATE" | awk '{print $1}')"
          EXPECTED_SHA="$(basename "$CANDIDATE" | sed 's/-EverLeaf\.exe$//')"
          test "$RESTORE_SHA" = "$EXPECTED_SHA"
          sudo cp "$CANDIDATE" "$STAGE/EverLeaf.exe"
          sudo chown "$(id -u):$(id -g)" "$STAGE/EverLeaf.exe"
          printf '%s\n' "$RESTORE_SHA" > "$STAGE/sha256.txt"
          printf '%s\n' "$CANDIDATE" > "$STAGE/source-backup.txt"
          echo "EVERLEAF_PRE_ICON_BACKUP_STAGED sha=$RESTORE_SHA source=$CANDIDATE"
          '@
          $script=$script.Replace('__REMOTE__',$remote)
          $local=Join-Path $env:RUNNER_TEMP 'stage-everleaf-client-recovery.sh'; [IO.File]::WriteAllText($local,($script -replace "`r",''))
          scp $local 'everleaf-oracle:/tmp/stage-everleaf-client-recovery.sh'
          ssh everleaf-oracle 'bash /tmp/stage-everleaf-client-recovery.sh'
          if($LASTEXITCODE){throw 'Could not stage the pre-icon EverLeaf.exe backup'}
          $root=Join-Path $env:RUNNER_TEMP 'everleaf-client-recovery'; New-Item -ItemType Directory -Force -Path $root | Out-Null
          scp "everleaf-oracle`:$remote/EverLeaf.exe" (Join-Path $root 'EverLeaf.exe')
          if($LASTEXITCODE){throw 'Could not fetch recovery EverLeaf.exe'}
          scp "everleaf-oracle`:$remote/sha256.txt" (Join-Path $root 'sha256.txt')
          if($LASTEXITCODE){throw 'Could not fetch recovery SHA'}

      - name: Validate recovered executable with Windows loader
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'everleaf-client-recovery'
          $candidate=Join-Path $root 'EverLeaf.exe'
          $expected=(Get-Content (Join-Path $root 'sha256.txt') -Raw).Trim().ToLowerInvariant()
          $actual=(Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "Recovery executable hash mismatch expected=$expected actual=$actual"}
          $bytes=[IO.File]::ReadAllBytes($candidate)
          if($bytes.Length -lt 1000000){throw 'Recovery executable is unexpectedly small'}
          if($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A){throw 'Recovery executable has no MZ header'}
          $peOffset=[BitConverter]::ToInt32($bytes,0x3C)
          if($peOffset -lt 64 -or ($peOffset + 26) -ge $bytes.Length){throw 'Recovery executable has an invalid PE offset'}
          if($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset+1] -ne 0x45 -or $bytes[$peOffset+2] -ne 0 -or $bytes[$peOffset+3] -ne 0){throw 'Recovery executable has no PE signature'}
          $machine=[BitConverter]::ToUInt16($bytes,$peOffset+4)
          $magic=[BitConverter]::ToUInt16($bytes,$peOffset+24)
          if($machine -ne 0x014c){throw ("Recovery executable machine is not x86: 0x{0:X4}" -f $machine)}
          if($magic -ne 0x010b){throw ("Recovery executable is not PE32: 0x{0:X4}" -f $magic)}
          try {
            $process=Start-Process -FilePath $candidate -PassThru -WindowStyle Hidden -ErrorAction Stop
          } catch {
            throw "Windows loader rejected recovery EverLeaf.exe: $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 2
          if(-not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          "Recovered EverLeaf.exe SHA-256: $actual" | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host "WINDOWS_LOADER_ACCEPTED_RECOVERY_EXE $actual"

      - name: Restore executable live and regenerate patch manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $remote="/tmp/everleaf-client-recovery-${{ github.run_id }}"
          $script=@'
          set -euo pipefail
          PATCH=/opt/everleaf/patches
          FILES="$PATCH/files"
          STAGE=__REMOTE__
          CANDIDATE="$STAGE/EverLeaf.exe"
          CURRENT="$FILES/EverLeaf.exe"
          test -s "$CANDIDATE"
          test -s "$CURRENT"
          BEFORE="$(sha256sum "$CURRENT" | awk '{print $1}')"
          AFTER="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          EXPECTED="$(cat "$STAGE/sha256.txt")"
          test "$AFTER" = "$EXPECTED"

          RECOVERY_BACKUP_ROOT=/opt/everleaf/backups/client-recovery
          RECOVERY_BACKUP="$RECOVERY_BACKUP_ROOT/${BEFORE}-EverLeaf.exe"
          sudo install -d -m 700 "$RECOVERY_BACKUP_ROOT"
          if [ ! -e "$RECOVERY_BACKUP" ]; then sudo install -m 600 "$CURRENT" "$RECOVERY_BACKUP"; fi
          cp "$PATCH/manifest.json" "$STAGE/manifest.before.json"

          rollback(){
            echo 'EverLeaf client recovery publish failed; rolling back current executable and manifest.' >&2
            sudo install -m 644 "$RECOVERY_BACKUP" "$CURRENT"
            sudo install -m 644 "$STAGE/manifest.before.json" "$PATCH/manifest.json"
          }
          trap rollback ERR

          if [ "$BEFORE" != "$AFTER" ]; then
            sudo install -m 644 "$CANDIDATE" "$CURRENT.new"
            sudo mv -f "$CURRENT.new" "$CURRENT"
          fi

          GENERATED="$STAGE/manifest.json"
          LAUNCHER_PATCH_ROOT="$PATCH" \
          LAUNCHER_BASELINE_PATH="$PATCH/managed-client-baseline.json" \
          LAUNCHER_MANIFEST_PATH="$GENERATED" \
          LAUNCHER_PORTABLE_PATH="$PATCH/downloads/EverLeafLauncher-portable.zip" \
          LAUNCHER_VERSION_PATH="$PATCH/downloads/EverLeafLauncher-version.txt" \
          node /opt/everleaf/web/scripts/build-patch-manifest.js '__SHA__'
          sudo install -m 644 "$GENERATED" "$PATCH/manifest.json"

          LIVE_SHA="$(sha256sum "$CURRENT" | awk '{print $1}')"
          test "$LIVE_SHA" = "$AFTER"
          curl -fsS 'http://127.0.0.1:3000/patches/EverLeaf.exe' -o "$STAGE/live-EverLeaf.exe"
          LOCAL_HTTP_SHA="$(sha256sum "$STAGE/live-EverLeaf.exe" | awk '{print $1}')"
          test "$LOCAL_HTTP_SHA" = "$AFTER"
          grep -q 'EverLeaf.exe' "$PATCH/manifest.json"
          trap - ERR
          echo "EVERLEAF_CLIENT_RECOVERY_LIVE before=$BEFORE restored=$AFTER"
          '@
          $script=$script.Replace('__REMOTE__',$remote).Replace('__SHA__','${{ github.sha }}')
          $local=Join-Path $env:RUNNER_TEMP 'publish-everleaf-client-recovery.sh'; [IO.File]::WriteAllText($local,($script -replace "`r",''))
          scp $local 'everleaf-oracle:/tmp/publish-everleaf-client-recovery.sh'
          ssh everleaf-oracle 'bash /tmp/publish-everleaf-client-recovery.sh'
          if($LASTEXITCODE){throw 'Live client recovery publish failed'}

      - name: Verify public recovered executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'everleaf-client-recovery'
          $expected=(Get-Content (Join-Path $root 'sha256.txt') -Raw).Trim().ToLowerInvariant()
          $public=Join-Path $root 'public-EverLeaf.exe'
          & curl.exe -L --fail --silent --show-error --connect-timeout 15 --max-time 120 'https://everleafms.online/patches/EverLeaf.exe' -o $public
          if($LASTEXITCODE){throw "Public EverLeaf.exe download failed with exit code $LASTEXITCODE"}
          $actual=(Get-FileHash $public -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "Public recovered EverLeaf.exe hash mismatch expected=$expected actual=$actual"}
          $bytes=[IO.File]::ReadAllBytes($public)
          $peOffset=[BitConverter]::ToInt32($bytes,0x3C)
          $machine=[BitConverter]::ToUInt16($bytes,$peOffset+4)
          $magic=[BitConverter]::ToUInt16($bytes,$peOffset+24)
          if($machine -ne 0x014c -or $magic -ne 0x010b){throw 'Public recovered EverLeaf.exe is not a valid x86 PE32 executable'}
          try {
            $process=Start-Process -FilePath $public -PassThru -WindowStyle Hidden -ErrorAction Stop
          } catch {
            throw "Windows loader rejected public recovered EverLeaf.exe: $($_.Exception.Message)"
          }
          Start-Sleep -Seconds 2
          if(-not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          Write-Host "PUBLIC_EVERLEAF_CLIENT_RECOVERY_OK $actual"
