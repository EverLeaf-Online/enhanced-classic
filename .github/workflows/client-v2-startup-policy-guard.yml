name: Client v2 startup policy guard

on:
  pull_request:
    branches: [release-dev, master]
    paths:
      - "client/ezorsia/ezorsia/Client.cpp"
      - "client/scripts/apply-client-v2-rebrand.py"
      - ".github/workflows/client-v2-startup-policy-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify pre-launch PE/UAC policy boundary
        shell: bash
        run: |
          set -euo pipefail
          python client/scripts/apply-client-v2-rebrand.py
          python - <<'PY'
          from pathlib import Path

          source = Path('client/ezorsia/ezorsia/Client.cpp').read_text(encoding='utf-8')
          transform = Path('client/scripts/apply-client-v2-rebrand.py').read_text(encoding='utf-8')

          required = [
              'Client v2: PE/UAC process-creation policy is handled before launch',
              'runtime_uac_block',
              'runtime_laa_write',
              'Dead process-creation runtime patch survived Client v2 transform',
          ]
          for marker in required:
              if marker not in (source + transform):
                  raise SystemExit(f'Missing startup-policy invariant: {marker}')

          forbidden = [
              'Memory::WriteString(0x00C08459 + 1, "asInvoker")',
              'Memory::WriteByte(0x0040013E, 0x2F)',
          ]
          for marker in forbidden:
              if marker in source:
                  raise SystemExit(f'Dead runtime process-creation patch survived transform: {marker}')

          print('Client v2 startup policy contract passed')
          PY
