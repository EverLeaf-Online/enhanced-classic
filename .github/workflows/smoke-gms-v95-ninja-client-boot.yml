name: Smoke GMS v95 Ninja Castle batch in client

on:
  pull_request:
    branches:
      - release-dev
    paths:
      - '.github/workflows/smoke-gms-v95-ninja-client-boot.yml'
      - 'client/managed-client-baseline.json'
      - 'tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu
  CANDIDATE_SHA: fb794b3660572a52df0f5b39639f70b9603912da
  CANDIDATE_ZIP_SHA256: 79a0b299fb0a60669e37214aa5df1e75727ed16b6ae78509799aa30ead640392

jobs:
  boot-smoke:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sshDir = Join-Path $HOME '.ssh'
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $keyPath = Join-Path $sshDir 'id_everleaf'
          [IO.File]::WriteAllText($keyPath, ($env:SSH_PRIVATE_KEY -replace "`r", "") + "`n")
          $knownHosts = Join-Path $sshDir 'known_hosts'
          $gitKeyscan = 'C:\Program Files\Git\usr\bin\ssh-keyscan.exe'
          if (-not (Test-Path $gitKeyscan)) { throw "Git OpenSSH keyscan not found: $gitKeyscan" }
          if ($env:SSH_KNOWN_HOSTS) {
            [IO.File]::WriteAllText($knownHosts, ($env:SSH_KNOWN_HOSTS -replace "`r", "") + "`n")
          } else {
            & $gitKeyscan -T 10 -H $env:EVERLEAF_DEPLOY_HOST | Set-Content -Encoding ascii $knownHosts
            if ($LASTEXITCODE -ne 0) { throw "Git ssh-keyscan failed with exit code $LASTEXITCODE" }
          }
          if (-not (Test-Path $knownHosts) -or (Get-Item $knownHosts).Length -eq 0) { throw 'known_hosts is empty' }

      - name: Fetch exact managed EverLeaf client and pinned Ninja candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keyPath = Join-Path $HOME '.ssh/id_everleaf'
          $sshExe = 'C:\Program Files\Git\usr\bin\ssh.exe'
          $scpExe = 'C:\Program Files\Git\usr\bin\scp.exe'
          $baseline = Get-Content 'client/managed-client-baseline.json' -Raw | ConvertFrom-Json
          if ($baseline.schemaVersion -ne 1) { throw 'Unsupported managed client baseline schema' }
          $names = @($baseline.managedFiles | ForEach-Object { [string]$_.path })
          $required = @('EverLeaf.exe','Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')
          foreach ($name in $required) {
            if ($names -notcontains $name) { throw "Managed baseline is missing required client file: $name" }
          }
          foreach ($name in $names) {
            if ($name -notmatch '^[A-Za-z0-9_.-]+$') { throw "Unsafe managed client filename: $name" }
          }

          $remoteRoot = '/opt/everleaf/patches/files'
          $remoteArchive = "/tmp/everleaf-ninja-client-boot-$env:GITHUB_RUN_ID.tgz"
          $remoteHashes = "/tmp/everleaf-ninja-client-boot-$env:GITHUB_RUN_ID.sha256"
          $quoted = ($names | ForEach-Object { "'$_'" }) -join ' '
          $remoteCommand = "set -euo pipefail; cd '$remoteRoot'; for f in $quoted; do test -f `"`$f`"; done; sha256sum $quoted > '$remoteHashes'; tar -czf '$remoteArchive' $quoted; sha256sum '$remoteArchive'"
          $archiveHashLine = & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" $remoteCommand
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare exact private client archive on Oracle' }
          $remoteArchiveHash = (($archiveHashLine | Select-Object -Last 1) -split '\s+')[0].ToLowerInvariant()
          if ($remoteArchiveHash.Length -ne 64) { throw 'Invalid remote client archive hash' }

          $archive = Join-Path $env:RUNNER_TEMP 'everleaf-client.tgz'
          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteArchive" $archive
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch private managed client archive' }
          $localArchiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($localArchiveHash -ne $remoteArchiveHash) { throw 'Managed client archive hash mismatch after transfer' }

          $hashes = Join-Path $env:RUNNER_TEMP 'LIVE_CLIENT_SOURCE_HASHES.txt'
          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$remoteHashes" $hashes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch live client hash inventory' }
          & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "rm -f '$remoteArchive' '$remoteHashes'"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to remove temporary Oracle client smoke archives' }

          $clientDir = Join-Path $env:RUNNER_TEMP 'everleaf-client'
          New-Item -ItemType Directory -Force -Path $clientDir | Out-Null
          tar -xzf $archive -C $clientDir
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract managed EverLeaf client' }
          foreach ($name in $names) {
            if (-not (Test-Path (Join-Path $clientDir $name) -PathType Leaf)) { throw "Extracted client missing $name" }
          }

          $candidateRemote = "/opt/everleaf/private/wz-client-candidates/gms-v95-ninja-castle-batch-002/$env:CANDIDATE_SHA/client-candidate.zip"
          $candidate = Join-Path $env:RUNNER_TEMP 'ninja-client-candidate.zip'
          $remoteCandidateHash = & $sshExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST" "set -e; test -f '$candidateRemote'; unzip -t '$candidateRemote' >/dev/null; sha256sum '$candidateRemote'"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned private Ninja client candidate is unavailable or corrupt' }
          $remoteCandidateDigest = (($remoteCandidateHash | Select-Object -Last 1) -split '\s+')[0].ToLowerInvariant()
          if ($remoteCandidateDigest -ne $env:CANDIDATE_ZIP_SHA256) { throw 'Pinned Ninja client candidate hash drifted' }
          & $scpExe -i $keyPath "$env:EVERLEAF_DEPLOY_USER@$env:EVERLEAF_DEPLOY_HOST`:$candidateRemote" $candidate
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch pinned private Ninja client candidate' }
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:CANDIDATE_ZIP_SHA256) { throw 'Ninja candidate hash mismatch after transfer' }

          $candidateDir = Join-Path $env:RUNNER_TEMP 'ninja-candidate'
          Expand-Archive -LiteralPath $candidate -DestinationPath $candidateDir
          $manifestPath = Join-Path $candidateDir 'REGIONAL_CLIENT_PATCH_MANIFEST.json'
          if (-not (Test-Path $manifestPath -PathType Leaf)) { throw 'Ninja candidate missing REGIONAL_CLIENT_PATCH_MANIFEST.json' }
          $candidateManifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($candidateManifest.approved -ne $false -or $candidateManifest.productionApplyAllowed -ne $false) {
            throw 'Ninja candidate approval state is not fail-closed'
          }

          $batch = Get-Content 'tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json' -Raw | ConvertFrom-Json
          if ($batch.approved -ne $false -or $batch.productionApplyAllowed -ne $false -or $batch.automaticImport -ne $false) {
            throw 'Frozen Ninja batch is not fail-closed'
          }
          if (@($batch.maps).Count -ne 33 -or @($batch.mobs).Count -ne 11 -or @($batch.castleNpcs).Count -ne 15 -or @($batch.items).Count -ne 10 -or @($batch.questIds).Count -ne 9) {
            throw 'Frozen Ninja batch closure counts drifted'
          }

          $families = @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')
          foreach ($family in $families) {
            $candidateFile = Join-Path $candidateDir $family
            if (-not (Test-Path $candidateFile -PathType Leaf)) { throw "Ninja candidate missing $family" }
            Copy-Item $candidateFile (Join-Path $clientDir $family) -Force
          }

          # Fail closed on every output hash recorded by the regional client patcher.
          # Manifest keys are the exact full WZ family names (for example "Map.wz").
          foreach ($family in $families) {
            $property = $candidateManifest.output.PSObject.Properties[$family]
            if ($null -eq $property -or $null -eq $property.Value -or -not $property.Value.sha256) {
              throw "Regional manifest missing output hash for $family"
            }
            $outputNode = $property.Value
            $actualHash = (Get-FileHash (Join-Path $clientDir $family) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne ([string]$outputNode.sha256).ToLowerInvariant()) { throw "Boot client $family does not match pinned Ninja candidate" }
          }

          "CLIENT_DIR=$clientDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIVE_CLIENT_ARCHIVE_SHA256=$localArchiveHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Block game network and boot exact Ninja client candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = [IO.Path]::GetFullPath((Join-Path $env:CLIENT_DIR 'EverLeaf.exe'))
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'EverLeaf.exe missing from reconstructed client' }
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $familyHashes = [ordered]@{}
          foreach ($family in @('Map.wz','Mob.wz','Npc.wz','Item.wz','Quest.wz','String.wz')) {
            $familyHashes[$family] = (Get-FileHash (Join-Path $env:CLIENT_DIR $family) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $startedAt = Get-Date
          $ruleName = "EverLeaf-v95-ninja-boot-smoke-$env:GITHUB_RUN_ID"
          $launched = $null
          $matching = @()
          try {
            New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Program $exe -Action Block -Profile Any | Out-Null
            $launched = Start-Process -FilePath $exe -WorkingDirectory $env:CLIENT_DIR -PassThru
            Start-Sleep -Seconds 15

            $matching = @(Get-CimInstance Win32_Process -Filter "Name='EverLeaf.exe'" -ErrorAction SilentlyContinue | Where-Object {
              try { [IO.Path]::GetFullPath([string]$_.ExecutablePath) -eq $exe } catch { $false }
            })

            if ($matching.Count -eq 0) {
              $launched.Refresh()
              $exit = if ($launched.HasExited) { $launched.ExitCode } else { '<still-running-unresolved>' }
              $recentErrors = Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startedAt} -ErrorAction SilentlyContinue |
                Where-Object { $_.LevelDisplayName -eq 'Error' -and $_.Message -match 'EverLeaf|MapleStory' } |
                Select-Object -First 10 TimeCreated, Id, ProviderName, Message
              $errorText = ($recentErrors | Format-List | Out-String)
              throw "No isolated EverLeaf.exe process survived the 15-second Ninja boot smoke. Initial process exit=$exit.`n$errorText"
            }

            $processIds = @($matching | ForEach-Object { [int]$_.ProcessId })
            $report = [ordered]@{
              schemaVersion = 1
              kind = 'isolated-ninja-castle-client-boot-smoke'
              batchId = 'gms-v95-ninja-castle-batch-002'
              candidateSha = $env:CANDIDATE_SHA
              candidateZipSha256 = $env:CANDIDATE_ZIP_SHA256
              liveClientArchiveSha256 = $env:LIVE_CLIENT_ARCHIVE_SHA256
              executableSha256 = $exeHash
              candidateFamilySha256 = $familyHashes
              outboundNetworkBlocked = $true
              survivedSeconds = 15
              survivingProcessCount = $matching.Count
              survivingProcessIds = $processIds
              launcherHandoffObserved = [bool]($launched.HasExited -and $launched.ExitCode -eq 0)
              processAliveAtEnd = $true
              productionFilesModified = $false
              approved = $false
              productionApplyAllowed = $false
            }
            $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'NINJA_CLIENT_BOOT_SMOKE_REPORT.json')
            Get-Content (Join-Path $env:RUNNER_TEMP 'NINJA_CLIENT_BOOT_SMOKE_REPORT.json') | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          finally {
            foreach ($proc in $matching) { Stop-Process -Id ([int]$proc.ProcessId) -Force -ErrorAction SilentlyContinue }
            if ($launched -and -not $launched.HasExited) { Stop-Process -Id $launched.Id -Force -ErrorAction SilentlyContinue }
            Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
          }

      - name: Upload Ninja boot-smoke evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-ninja-castle-client-boot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/NINJA_CLIENT_BOOT_SMOKE_REPORT.json
            ${{ runner.temp }}/LIVE_CLIENT_SOURCE_HASHES.txt
          retention-days: 14
          if-no-files-found: warn
