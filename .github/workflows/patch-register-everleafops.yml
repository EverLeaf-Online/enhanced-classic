name: Register preserved Everleaf ops command

on:
  push:
    branches:
      - ops/preserve-everleafops-release

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops/preserve-everleafops-release
      - name: Register GM3 command
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/java/client/command/CommandsExecutor.java')
          s = p.read_text()
          needle = '        addCommand("endevent", 3, EndEventCommand.class);\n'
          registration = '        addCommand("everleafops", 3, EverleafOpsCommand.class);\n'
          if registration in s:
              print('already_registered=1')
          else:
              if needle not in s:
                  raise SystemExit('Could not find stable GM3 registration anchor')
              s = s.replace(needle, needle + registration, 1)
              p.write_text(s)
              print('registered=1')
          PY
      - name: Commit registration if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'registration_already_committed=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/client/command/CommandsExecutor.java
          git commit -m 'ops: register Everleaf recovery command'
          git push origin HEAD:ops/preserve-everleafops-release
