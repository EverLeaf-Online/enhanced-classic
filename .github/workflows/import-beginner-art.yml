name: Import Beginner artwork

on:
  push:
    branches:
      - web/home-polish
    paths:
      - .github/workflows/import-beginner-art.yml

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: web/home-polish
      - name: Fetch Beginner artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/assets/jobs/beginner
          python - <<'PY'
          import json, pathlib, urllib.parse, urllib.request

          api='https://maplestorywiki.net/api.php'
          candidates=[
            'ClassArtwork Beginner.png',
            'ClassArtwork Beginner (Male).png',
            'ClassArtwork Beginner (Female).png',
          ]

          def image_url(title):
            qs=urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url','titles':'File:'+title})
            req=urllib.request.Request(api+'?'+qs,headers={'User-Agent':'EverLeaf asset importer/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
            for page in data.get('query',{}).get('pages',{}).values():
              info=page.get('imageinfo')
              if info and info[0].get('url'):
                return info[0]['url']
            return None

          url=None
          for title in candidates:
            try:
              url=image_url(title)
            except Exception:
              url=None
            if url:
              break

          if not url:
            qs=urllib.parse.urlencode({'action':'query','format':'json','list':'allimages','ailimit':'50','aiprefix':'ClassArtwork Beginner'})
            req=urllib.request.Request(api+'?'+qs,headers={'User-Agent':'EverLeaf asset importer/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
            images=data.get('query',{}).get('allimages',[])
            if images:
              url=image_url(images[0]['name'])

          if not url:
            raise SystemExit('Could not resolve Beginner artwork')

          out=pathlib.Path('web/public/assets/jobs/beginner/beginner.png')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 EverLeaf/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
            blob=r.read()
          if not blob.startswith(b'\x89PNG\r\n\x1a\n') or len(blob)<5000:
            raise SystemExit(f'Invalid Beginner PNG ({len(blob)} bytes)')
          out.write_bytes(blob)
          print(f'Beginner -> {url} ({len(blob)} bytes)')
          PY
      - name: Commit imported artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/assets/jobs/beginner/beginner.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets(web): add Beginner artwork'
          git push origin HEAD:web/home-polish
