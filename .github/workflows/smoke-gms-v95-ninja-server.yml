name: Smoke GMS v95 Ninja Castle server runtime

on:
  pull_request:
    branches: [release-dev]
    paths:
      - 'src/test/java/server/WzDonorNinjaCastleRuntimeSmokeTest.java'
      - '.github/workflows/smoke-gms-v95-ninja-server.yml'
      - 'tools/wz-donor/stage_region_batch.py'
      - 'tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json'
      - 'scripts/portal/ninja_Boss.js'
  push:
    branches: [release-dev]
    paths:
      - 'src/test/java/server/WzDonorNinjaCastleRuntimeSmokeTest.java'
      - '.github/workflows/smoke-gms-v95-ninja-server.yml'
      - 'tools/wz-donor/stage_region_batch.py'
      - 'tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json'
      - 'scripts/portal/ninja_Boss.js'
  workflow_dispatch:

permissions:
  contents: read

env:
  EVERLEAF_DEPLOY_HOST: 132.145.141.79
  EVERLEAF_DEPLOY_USER: ubuntu

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout EverLeaf
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure verified Oracle SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EVERLEAF_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EVERLEAF_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo 'EVERLEAF_SSH_PRIVATE_KEY is not configured.' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_everleaf
          chmod 600 ~/.ssh/id_everleaf
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 10 -H "$EVERLEAF_DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/id_everleaf \
            "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST" 'echo EverLeaf private donor SSH OK'

      - name: Fetch pinned private donor archives
        shell: bash
        run: |
          set -euo pipefail
          remote=/opt/everleaf/private/wz-donors
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/gms-v95-core7.zip" "$RUNNER_TEMP/core7.zip"
          scp -i ~/.ssh/id_everleaf "$EVERLEAF_DEPLOY_USER@$EVERLEAF_DEPLOY_HOST:$remote/gms-v95-string.zip" "$RUNNER_TEMP/string.zip"
          test "$(sha256sum "$RUNNER_TEMP/core7.zip" | awk '{print $1}')" = '62e106f8437ce04443c797c0514e14d430fcc0a10ae4131f16567f540a8d5d3c'
          test "$(sha256sum "$RUNNER_TEMP/string.zip" | awk '{print $1}')" = 'f00b94fcfad3f95d438b4474b74d550ea68d8aee0a8c3e4c2d9fae548a6fe7ed'
          mkdir "$RUNNER_TEMP/core7" "$RUNNER_TEMP/string"
          unzip -q "$RUNNER_TEMP/core7.zip" -d "$RUNNER_TEMP/core7"
          unzip -q "$RUNNER_TEMP/string.zip" -d "$RUNNER_TEMP/string"

      - name: Build disposable Ninja Castle server WZ tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/wz-donor/stage_region_batch.py \
            --contract tools/wz-donor/batches/gms-v95-ninja-castle-batch-002.json \
            --donor "$RUNNER_TEMP/core7" \
            --string-donor "$RUNNER_TEMP/string" \
            --canonical wz \
            --staging "$RUNNER_TEMP/ninja-staged-wz"
          python - "$RUNNER_TEMP/ninja-staged-wz/REGIONAL_STAGING_REPORT.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['canonicalTreeSha256Before'] == r['canonicalTreeSha256After']
          assert r['approved'] is False
          assert r['productionApplyAllowed'] is False
          print('Disposable regional staging verified; canonical WZ unchanged.')
          PY

      - name: Run real EverLeaf staged runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw
          ./mvnw -B \
            -Dwz-path="$RUNNER_TEMP/ninja-staged-wz" \
            -Dwz-donor-ninja-staging-smoke=true \
            -Dtest=WzDonorNinjaCastleRuntimeSmokeTest \
            test

      - name: Upload staging report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gms-v95-ninja-server-runtime-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/ninja-staged-wz/REGIONAL_STAGING_REPORT.json
          if-no-files-found: error
          retention-days: 14
