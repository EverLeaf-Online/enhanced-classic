[general]
;EverLeaf Client v2 defaults to 1280x720 widescreen.
;The production login panorama/signboard is paired with the source-pinned
;native login-control alignment hooks so the fields/buttons stay on the panel.
width=1280
height=720

;Apply supported System Options resolution changes immediately through the v83
;Gr2D screen-mode reset. If the runtime reset fails, EverLeaf keeps the previous
;saved resolution instead of persisting a mode the renderer did not accept.
LiveResolution=true

;Use the newer Community UI.wz as the primary UI. EverLeaf_UI.wz stays installed
;as a compatibility fallback but its legacy login/Cash Shop frame redirects are disabled.
PreferCommunityUI=true

;Keep the Maple renderer in windowed mode. BorderlessWindow requires this to stay true.
WindowedMode=true

;Remove the title/frame and fill the active monitor while keeping Maple's safer
;windowed renderer. This is borderless fullscreen, not exclusive D3D fullscreen.
BorderlessWindow=false

;Allow Alt+Enter to toggle between the current framed window and borderless fullscreen.
;The exact framed window style, size, position, and monitor are restored on the next toggle.
EnableAltEnterToggle=true

;Center normal framed windowed mode on the monitor work area.
CenterWindow=true

;Client v2 presentation-frame caps. These do not change Maple's 30 ms game-logic tick.
;ForegroundFPSCap accepts 30-240, or 0 to leave foreground presentation uncapped.
ForegroundFPSCap=60
;When another application has focus, reduce presentation work to lower CPU/GPU usage.
LimitBackgroundFPS=true
BackgroundFPSCap=15

;Skip the original startup logos.
RemoveLogos=true

;Optional WASD movement translation at Maple's DirectInput message layer.
;Disabled by default until gameplay runtime validation is green.
WASDRemapping=false

;Enable the tested 1280x720 native-control alignment hooks for the EverLeaf
;signboard. Disabling this while keeping the HD WZ panel causes the regression
;where edit fields and buttons drift away from the artwork.
ModernLoginUI=true

;Show future class-family cards as locked previews. The server independently
;rejects unsupported creation types, so this never enables unfinished classes.
ShowFutureClassCards=true

;Enable EverLeaf-native Discord Rich Presence through Discord's local IPC pipe.
;No Discord SDK DLL, bot token, OAuth secret, or remote credential is shipped.
DiscordRichPresence=true

[website]
;The login screen's Homepage/Register/account-help buttons are redirected here.
;Permanent EverLeaf website domain.
BaseURL=https://everleafms.online
