[general]
;The native v83 login package is 800x600. Keep that proven presentation as the
;default until the replacement HD login/world/character assets pass visual QA.
;Gameplay widescreen modes remain available after that UI package is completed.
width=800
height=600

;Use the newer Community UI.wz as the primary UI. EverLeaf_UI.wz stays installed
;as a compatibility fallback but its legacy login/Cash Shop frame redirects are disabled.
PreferCommunityUI=true

;Keep the Maple renderer in windowed mode. BorderlessWindow requires this to stay true.
WindowedMode=true

;Remove the title/frame while keeping the safer windowed renderer. When the configured
;resolution matches the current monitor this becomes borderless fullscreen; otherwise
;EverLeaf uses a centered borderless window at the configured game resolution.
BorderlessWindow=false

;Allow Alt+Enter to toggle between the current framed window and borderless mode.
;This changes only the Win32 window style/position; it never switches to exclusive D3D fullscreen.
EnableAltEnterToggle=true

;Center normal framed windowed mode on the monitor work area.
CenterWindow=true

;Client v2 presentation-frame caps. These do not change Maple's 30 ms game-logic tick.
;ForegroundFPSCap accepts 30-240, or 0 to leave foreground presentation uncapped.
ForegroundFPSCap=60
;When another application has focus, reduce presentation work to lower CPU/GPU usage.
LimitBackgroundFPS=true
BackgroundFPSCap=15

;Skip the original startup logos.
RemoveLogos=true

;Show EverLeaf Rich Presence in the locally running Discord desktop client.
;This uses Discord IPC and the public EverLeaf application ID. No bot token,
;OAuth secret, or donor Discord SDK DLL is stored in the game directory.
DiscordRichPresence=true

;Optional WASD movement translation at Maple's DirectInput message layer.
;Disabled by default until gameplay runtime validation is green.
WASDRemapping=false

;Experimental coordinate-only login restyling is disabled because it separates
;the native edit controls from their WZ-drawn fields at HD resolutions.
ModernLoginUI=false

;Show future class-family cards as locked previews. The server independently
;rejects unsupported creation types, so this never enables unfinished classes.
ShowFutureClassCards=true

[website]
;The login screen's Homepage/Register/account-help buttons are redirected here.
;Permanent EverLeaf website domain.
BaseURL=https://everleafms.online
